name: SBE1V1K QSDK Stage7 NSS Debug Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git findutils grep sed

      - name: Create results directory
        run: |
          mkdir -p results
          mkdir -p qsdk-probe

      - name: Clone official QSDK nss-host feed
        shell: bash
        run: |
          set +e

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-host.git \
            qsdk-probe/nss-host \
            2>&1 | tee results/nss-host-clone.txt

          RC=${PIPESTATUS[0]}

          echo "$RC" > results/nss-host-clone-exit.txt

          if [ -d qsdk-probe/nss-host/.git ]; then
            git -C qsdk-probe/nss-host rev-parse HEAD \
              > results/nss-host-head.txt

            git -C qsdk-probe/nss-host branch -a \
              > results/nss-host-branches.txt

            git -C qsdk-probe/nss-host tag -l \
              > results/nss-host-tags.txt
          fi

          exit 0

      - name: Search nss-host for NSS debug
        shell: bash
        run: |
          set +e

          {
            echo "===== FILES MATCHING NSS DEBUG ====="

            if [ -d qsdk-probe/nss-host ]; then
              find qsdk-probe/nss-host \
                -type f \
                \( \
                  -iname '*nss*debug*' \
                  -o -iname 'nss_debug.h' \
                  -o -iname '*debug*.h' \
                \) \
                -print | sort
            fi

          } > results/nss-debug-files.txt

          {
            echo "===== TEXT REFERENCES ====="

            if [ -d qsdk-probe/nss-host ]; then
              grep -RniE \
                'qca-nss-debug|nss_debug\.h|nss-debug|NSS_COMMON' \
                qsdk-probe/nss-host \
                --exclude-dir=.git \
                2>/dev/null \
                | head -2000
            fi

          } > results/nss-debug-references.txt

          cat results/nss-debug-files.txt
          cat results/nss-debug-references.txt

          exit 0

      - name: Inspect nss-host package structure
        shell: bash
        run: |
          set +e

          {
            echo "===== TOP LEVEL ====="

            find qsdk-probe/nss-host \
              -maxdepth 2 \
              -type d \
              -print \
              2>/dev/null \
              | sort

            echo ""
            echo "===== MAKEFILES ====="

            find qsdk-probe/nss-host \
              -type f \
              -name Makefile \
              -print \
              2>/dev/null \
              | sort

          } > results/nss-host-structure.txt

          exit 0

      - name: Clone QSDK nss-profiles
        shell: bash
        run: |
          set +e

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-profiles.git \
            qsdk-probe/nss-profiles \
            2>&1 | tee results/nss-profiles-clone.txt

          exit 0

      - name: Search profile dependency definitions
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS PROFILE REFERENCES ====="

            grep -RniE \
              'qca-nss-debug|NSS_COMMON|nss-debug' \
              qsdk-probe/nss-profiles \
              --exclude-dir=.git \
              2>/dev/null \
              | head -2000

          } > results/nss-profile-references.txt

          cat results/nss-profile-references.txt

          exit 0

      - name: Search remote refs for QSDK14 R9
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS-HOST QSDK14/R9 REFS ====="

            git ls-remote \
              https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-host.git \
              2>/dev/null \
              | grep -Ei \
                '14\.0|r9|NHSS' \
              | head -1000

          } > results/nss-host-r9-refs.txt

          {
            echo "===== NSS-PROFILES QSDK14/R9 REFS ====="

            git ls-remote \
              https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-profiles.git \
              2>/dev/null \
              | grep -Ei \
                '14\.0|r9|NHSS' \
              | head -1000

          } > results/nss-profiles-r9-refs.txt

          exit 0

      - name: Produce summary
        shell: bash
        run: |
          {
            echo "===== STAGE7 SUMMARY ====="
            echo ""

            if find qsdk-probe/nss-host \
              -type f \
              -name 'nss_debug.h' \
              -print -quit \
              2>/dev/null \
              | grep -q .
            then
              echo "nss_debug.h: FOUND"
              find qsdk-probe/nss-host \
                -type f \
                -name 'nss_debug.h' \
                -print
            else
              echo "nss_debug.h: NOT FOUND DIRECTLY"
            fi

            echo ""

            if grep -Rqi \
              'qca-nss-debug' \
              qsdk-probe/nss-host \
              qsdk-probe/nss-profiles \
              --exclude-dir=.git \
              2>/dev/null
            then
              echo "qca-nss-debug package reference: FOUND"
            else
              echo "qca-nss-debug package reference: NOT FOUND"
            fi

          } | tee results/stage7-summary.txt

      - name: Upload Stage7 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage7-Probe
          path: results/
          retention-days: 7
