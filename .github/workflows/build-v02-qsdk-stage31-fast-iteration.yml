name: SBE1V1K V0.2 QSDK Stage31 Fast Iteration
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      id: checkout
    - name: Initialize diagnostics
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/initialize\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nmkdir -p results\ncat > results/step-manifest.json <<'STAGE31_MANIFEST'\n[\n  {\n    \"id\": \"checkout\",\n    \"name\": \"Checkout\"\n  },\n  {\n    \"id\": \"initialize\",\n    \"name\": \"Initialize diagnostics\"\n  },\n  {\n    \"id\": \"free_disk\",\n    \"name\": \"Free disk\"\n  },\n  {\n    \"id\": \"dependencies\",\n    \"name\": \"Install dependencies\"\n  },\n  {\n    \"id\": \"baseline\",\n    \"name\": \"Clone SBE1V1K baseline\"\n  },\n  {\n    \"id\": \"downloads_cache\",\n    \"name\": \"Cache OpenWrt downloads\"\n  },\n  {\n    \"id\": \"qsdk_sources\",\n    \"name\": \"Fetch exact QSDK sources\"\n  },\n  {\n    \"id\": \"ssdk_source_inspection\",\n    \"name\": \"Inspect pinned SSDK source and package build evidence\"\n  },\n  {\n    \"id\": \"phy_headers\",\n    \"name\": \"Export pinned PHY headers and verify include parent\"\n  },\n  {\n    \"id\": \"source_download\",\n    \"name\": \"Download sources\"\n  },\n  {\n    \"id\": \"kernel_build\",\n    \"name\": \"Build OpenWrt kernel\"\n  },\n  {\n    \"id\": \"kernel_toolchain\",\n    \"name\": \"Locate kernel and toolchain\"\n  },\n  {\n    \"id\": \"kernel_symvers\",\n    \"name\": \"Verify kernel Module.symvers\"\n  },\n  {\n    \"id\": \"include_flags\",\n    \"name\": \"Generate QSDK include flags\"\n  },\n  {\n    \"id\": \"ppe_compat\",\n    \"name\": \"Apply exact successful Stage12 PPE patch\"\n  },\n  {\n    \"id\": \"api_probe\",\n    \"name\": \"Repeat verified Stage12 DSA and vmalloc compile probe\"\n  },\n  {\n    \"id\": \"nss_debug\",\n    \"name\": \"Compile QCA NSS Debug\"\n  },\n  {\n    \"id\": \"bridge_audit\",\n    \"name\": \"Audit Linux 6.18.39 bridge semantics and patch SSDK\"\n  },\n  {\n    \"id\": \"bridge_probe\",\n    \"name\": \"Compile and MODPOST exact Stage16 bridge helper\"\n  },\n  {\n    \"id\": \"prototypes\",\n    \"name\": \"Audit pinned declarations and add exact SSDK MIB prototypes\"\n  },\n  {\n    \"id\": \"linux618_headers\",\n    \"name\": \"Apply Linux 6.18 platform-device and pinconf compatibility\"\n  },\n  {\n    \"id\": \"ssdk_build\",\n    \"name\": \"Build exact SSDK through verified mk entry\"\n  },\n  {\n    \"id\": \"ppe_build\",\n    \"name\": \"Build PPE with SSDK and NSS Debug exports\"\n  }\n]\nSTAGE31_MANIFEST\nprintf 'repository=%s\\nrun_id=%s\\nrun_attempt=%s\\nworkflow_ref=%s\\nworkflow_sha=%s\\n' \\\n  \"$GITHUB_REPOSITORY\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \\\n  \"$GITHUB_WORKFLOW_REF\" \"$GITHUB_WORKFLOW_SHA\" > results/run-context.txt\nmkdir -p results/workflow-source\nif [ -d .github/workflows ]; then\n  cp -a .github/workflows/. results/workflow-source/\nfi\n"
      id: initialize
    - name: Free disk
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/free_disk\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nsudo rm -rf /usr/local/lib/android || true\nsudo rm -rf /usr/share/dotnet || true\nsudo rm -rf /opt/ghc || true\nsudo apt-get clean\ndf -h\n"
      id: free_disk
    - name: Install dependencies
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/dependencies\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nsudo apt-get update\nsudo apt-get install -y \\\n  build-essential clang flex bison g++ gawk \\\n  gcc-multilib gettext git libncurses-dev \\\n  libssl-dev python3-setuptools rsync swig \\\n  unzip zlib1g-dev file wget curl jq bc kmod\n"
      id: dependencies
    - name: Clone SBE1V1K baseline
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/baseline\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\ngit clone \\\n  https://github.com/luckkyboy/SBE1V1K.git \\\n  openwrt\n\ncd openwrt\n\ngit checkout \\\n  02fb9517c9aefac9f3825a15ae46e7998bae7edd\n\ncp configs/sbe1v1k.config .config\n\n./scripts/feeds update -a\n./scripts/feeds install -a\nmake defconfig\n"
      id: baseline
    - name: Cache OpenWrt downloads
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: sbe1v1k-openwrt-dl-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: 'sbe1v1k-stage20-${{ runner.os }}-

          sbe1v1k-stage19-${{ runner.os }}-

          sbe1v1k-stage18-${{ runner.os }}-

          sbe1v1k-stage17-${{ runner.os }}-

          sbe1v1k-stage16-${{ runner.os }}-

          sbe1v1k-stage15-${{ runner.os }}-

          sbe1v1k-stage14-${{ runner.os }}-

          sbe1v1k-stage13-${{ runner.os }}-

          sbe1v1k-stage12-${{ runner.os }}-

          sbe1v1k-openwrt-dl-${{ runner.os }}-

          '
      id: downloads_cache
    - name: Cache prepared OpenWrt toolchain and kernel
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: 'openwrt/staging_dir

          openwrt/build_dir/host

          openwrt/build_dir/hostpkg

          openwrt/build_dir/toolchain-*

          openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommbe_ipq95xx'
        key: sbe1v1k-kernel618-fast-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: 'sbe1v1k-kernel618-fast-${{ runner.os }}-

          '
      id: prepared_cache
    - name: Fetch exact QSDK sources
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/qsdk_sources\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -e\n\nmkdir -p qsdk-src results\n\ngit clone \\\n  https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \\\n  qsdk-src/qca-nss-ppe\n\ngit -C qsdk-src/qca-nss-ppe checkout \\\n  87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5\n\ngit clone \\\n  https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \\\n  qsdk-src/qca-ssdk\n\ngit -C qsdk-src/qca-ssdk checkout \\\n  717b74016b0c131575bcd81b9e039d3f7974b02a\n\n{\n  echo \"PPE=$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)\"\n  echo \"SSDK=$(git -C qsdk-src/qca-ssdk rev-parse HEAD)\"\n} | tee results/qsdk-commits.txt\n\ntest \"$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)\" = 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5\ntest \"$(git -C qsdk-src/qca-ssdk rev-parse HEAD)\" = 717b74016b0c131575bcd81b9e039d3f7974b02a\ngit clone https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git qsdk-src/qca-nss-phy\ngit -C qsdk-src/qca-nss-phy checkout --detach 16eec6ac35820cb67af59223e8b4c2dba7179655\ntest \"$(git -C qsdk-src/qca-nss-phy rev-parse HEAD)\" = 16eec6ac35820cb67af59223e8b4c2dba7179655\necho \"PHY=$(git -C qsdk-src/qca-nss-phy rev-parse HEAD)\" >> results/qsdk-commits.txt\ngit -C qsdk-src/qca-nss-phy log -1 --format=fuller > results/phy-source-commit.txt\ngit -C qsdk-src/qca-nss-phy ls-tree -r --name-only HEAD > results/phy-source-tree.txt\n"
      id: qsdk_sources
    - name: Inspect pinned SSDK source and package build evidence
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/ssdk_source_inspection\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nmkdir -p results/ssdk-source-context\ngit -C \"$SSDK\" ls-tree -r --name-only HEAD > results/ssdk-source-tree.txt\ngit -C \"$SSDK\" log -1 --format=fuller > results/ssdk-source-commit.txt\nfind \"$SSDK\" -path \"$SSDK/.git\" -prune -o -type f \\( -iname '*makefile*' -o -name '*.mk' -o -name '*build*.sh' -o -name 'make.sh' -o -name 'Kbuild' \\) -print | sort > results/ssdk-build-entry-inventory.txt\ncp -a \"$SSDK/mk\" results/ssdk-source-context/\ncat > results/ssdk-source-context/QSDK-package-Makefile <<'QSDK_PACKAGE'\n\ninclude $(TOPDIR)/rules.mk\ninclude $(INCLUDE_DIR)/kernel.mk\n\nPKG_NAME:=qca-ssdk\nPKG_SOURCE_PROTO:=git\nPKG_BRANCH:=master\nPKG_RELEASE:=1\n\nifeq ($(CONFIG_TARGET_ipq),y)\n\tsubtarget:=$(SUBTARGET)\nelse\n\tsubtarget:=$(CONFIG_TARGET_BOARD)\nendif\n\nifneq (, $(findstring _64, $(subtarget)))\n\thal_arch:=$(subst _64,,$(subtarget))\nelse ifneq (, $(findstring _32, $(subtarget)))\n\thal_arch:=$(subst _32,,$(subtarget))\nelse\n\thal_arch:=$(subtarget)\nendif\n\ninclude $(INCLUDE_DIR)/local-development.mk\nifeq ($(DUMP)$(PKG_VERSION),)\n\tPKG_VERSION:=$(shell git ls-remote $(PKG_SOURCE_URL) $(PKG_BRANCH) | cut -b -7)\nendif\n\nLOCAL_VARIANT=$(patsubst qca-ssdk-%,%,$(patsubst qca-ssdk-%,%,$(BUILD_VARIANT)))\ninclude $(INCLUDE_DIR)/package.mk\n\ndefine KernelPackage/qca-ssdk/default-nohnat\n  SECTION:=kernel\n  CATEGORY:=Kernel modules\n  SUBMENU:=Network Devices\n  TITLE:=Kernel driver for QCA SSDK\n  FILES:=$(PKG_BUILD_DIR)/build/bin/qca-ssdk.ko\n  AUTOLOAD:=$(call AutoLoad,30,qca-ssdk)\n  PROVIDES:=qca-ssdk\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat\n$(call KernelPackage/qca-ssdk/default-nohnat)\n  DEPENDS:=@!(TARGET_ipq_ipq40xx||TARGET_ipq40xx)||TARGET_ar71xx \\\n\t+kmod-qca-nss-phy\n  VARIANT:=nohnat\n\n  ifneq (, $(findstring $(hal_arch), \"ipq50xx\"))\n    ifeq (, $(CONFIG_LOWMEM_FLASH))\n      ifneq ($(LINUX_VERSION),$(filter 5.4%,$(LINUX_VERSION)))\n      DEPENDS+=kmod-ipt-filter +kmod-ppp\n      QCASSDK_CONFIG_OPTS+= HNAT_FEATURE=enable\n      endif\n    endif\n  endif\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat/Description\nThis package contains a qca-ssdk driver for QCA chipset\nendef\n\ndefine KernelPackage/qca-ssdk-hnat\n$(call KernelPackage/qca-ssdk/default-nohnat)\n  DEPENDS:=@TARGET_ipq_ipq40xx||TARGET_ipq40xx||TARGET_ar71xx||TARGET_ipq806x +kmod-ipt-extra \\\n\t  +kmod-ipt-filter +(TARGET_ipq806x||TARGET_ipq):kmod-qca-rfs +kmod-ppp\n  TITLE+= (hnat)\n  VARIANT:=hnat\nendef\n\ndefine KernelPackage/qca-ssdk-hnat/Description\nThis package contains a qca-ssdk-hnat driver for QCA chipset\nendef\n\nGCC_VERSION=$(shell echo \"$(CONFIG_GCC_VERSION)\" | sed 's/[^0-9.]*\\([0-9.]*\\).*/\\1/')\nifeq ($(GCC_VERSION), 4.8)\n\tGCC_VERSION=4.8.3\nendif\n\nifdef CONFIG_TOOLCHAIN_BIN_PATH\n\tTOOLCHAIN_BIN_PATH=$(CONFIG_TOOLCHAIN_BIN_PATH)\nelse\n\tTOOLCHAIN_BIN_PATH=$(TOOLCHAIN_DIR)/bin\nendif\n\nifdef CONFIG_TARGET_NAME\n\tQCASSDK_CONFIG_OPTS+= \\\n\t\t\t      TARGET_NAME=$(CONFIG_TARGET_NAME)\nelse ifneq ($(CONFIG_ARCH),)\n\tQCASSDK_CONFIG_OPTS+= \\\n\t\t\t      TARGET_NAME=$(subst \",,$(CONFIG_ARCH))-openwrt-linux$(if $(CONFIG_TARGET_SUFFIX),-$(subst \",,$(CONFIG_TARGET_SUFFIX)))\nendif\n\nQCASSDK_CONFIG_OPTS+= TOOL_PATH=$(TOOLCHAIN_BIN_PATH) \\\n                SYS_PATH=$(LINUX_DIR) \\\n                TOOLPREFIX=$(TARGET_CROSS) \\\n                KVER=$(LINUX_VERSION) \\\n                ARCH=$(LINUX_KARCH) \\\n\t\tTARGET_SUFFIX=$(CONFIG_TARGET_SUFFIX) \\\n\t\tGCC_VERSION=$(GCC_VERSION) \\\n\t\tSoC=$(hal_arch) \\\n\t\tCFLAGS=-I$(STAGING_DIR)/usr/include\n\nifeq ($(LOCAL_VARIANT),hnat)\n    QCASSDK_CONFIG_OPTS+= HNAT_FEATURE=enable\n    ifeq ($(CONFIG_TARGET_ar71xx),)\n    \tQCASSDK_CONFIG_OPTS+= RFS_FEATURE=enable\n    endif\nendif\n\nifneq (, $(findstring $(hal_arch), \"ipq95xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=APPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq807x\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=HPPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq60xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=CPPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq50xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=MP\nelse ifneq (, $(findstring $(hal_arch), \"ipq53xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=MPPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq54xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=MRPPE\nendif\n\nifneq (, $(findstring $(CONFIG_KERNEL_IPQ_MEM_PROFILE), 256)$(CONFIG_LOWMEM_FLASH))\n\tQCASSDK_CONFIG_OPTS+= MINI_SSDK=enable\n\tifeq ($(CONFIG_LOWMEM_FLASH),y)\n\t\tQCASSDK_CONFIG_OPTS+= LOWMEM_FLASH=enable\n\tendif\nendif\n\ndefine Build/InstallDev\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/api\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/ref\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/fal\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/sal\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/init\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/api/sw_ioctl.h $(1)/usr/include/qca-ssdk/api\n\tif [ -f $(PKG_BUILD_DIR)/include/ref/ref_vsi.h ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_vsi.h $(1)/usr/include/qca-ssdk/ref/; \\\n\tfi\n\tif [ -f $(PKG_BUILD_DIR)/include/ref/ref_fdb.h ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_fdb.h $(1)/usr/include/qca-ssdk/ref/; \\\n\tfi\n\tif [ -f $(PKG_BUILD_DIR)/include/ref/ref_port_ctrl.h ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_port_ctrl.h $(1)/usr/include/qca-ssdk/ref/; \\\n\tfi\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/init $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/fal $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/common/*.h $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/sal/os/linux/*.h $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/sal/os/*.h $(1)/usr/include/qca-ssdk\n\nendef\n\nLNX_CONFIG_OPTS :=\n\nifneq (, $(findstring $(hal_arch), \"ipq807x\" \"ipq60xx\" \"ipq95xx\" \"ipq53xx\"))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)' MODULE_TYPE=KSLIB modules\nelse ifeq ($(LINUX_VERSION), $(filter 6.1%, $(LINUX_VERSION)))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)' MODULE_TYPE=KSLIB modules\nelse ifeq ($(LINUX_VERSION), $(filter 6.6%, $(LINUX_VERSION)))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)' MODULE_TYPE=KSLIB modules\nendif\n\ndefine Build/Compile\n\t$(MAKE) -C $(PKG_BUILD_DIR)/mk $(strip $(QCASSDK_CONFIG_OPTS)) $(LNX_CONFIG_OPTS)\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat/install\n\t$(INSTALL_DIR) $(1)/etc/init.d\n\t$(INSTALL_BIN) ./files/qca-ssdk $(1)/etc/init.d/qca-ssdk\nendef\n\ndefine KernelPackage/qca-ssdk-hnat/install\n\t$(INSTALL_DIR) $(1)/etc/init.d\n\t$(INSTALL_BIN) ./files/qca-ssdk $(1)/etc/init.d/qca-ssdk\nendef\n\n$(eval $(call KernelPackage,qca-ssdk-nohnat))\n$(eval $(call KernelPackage,qca-ssdk-hnat))\nQSDK_PACKAGE\ncat > results/ssdk-build-provenance.txt <<'PROVENANCE'\nSource: https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git\nSource commit: 717b74016b0c131575bcd81b9e039d3f7974b02a\nPackage: https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ssdk.git\nPackage reference commit: c7ebac1882395c7ee35453cde6775c7026b813b8\nPackage reference branch: win.nss.1.1 (fixed snapshot, not claimed as a release manifest pairing)\nPackage Build/Compile: make -C $(PKG_BUILD_DIR)/mk\nipq95xx -> CHIP_TYPE=APPE; MODULE_TYPE=KSLIB; LNX_MAKEOPTS; modules\nmk/Makefile -> kernel M=$(MK_PATH); copies mk/Module.symvers to root and ko to build/bin.\nStage16 retains Stage13/14 MINI_SSDK=disable PTP_FEATURE=disable SWCONFIG_FEATURE=disable.\nNo OS_VER override or kernel version spoofing; effective values are captured.\nmk/build.sh is a developer matrix runner referring to absent make.sh, not the package entry.\nPROVENANCE\npython3 <<'PY'\nfrom pathlib import Path\nimport hashlib\nexpected = {'mk/build.sh': '1307f7f33feeae5f1f7c30b2159026757b6983fb3a5fbdefca688732015a7de9', 'mk/cflags.mk': '905e4f5ae54f52e2e48720511e83d788ac25d623657f019e54bd72b4e6bded2a', 'mk/chip.mk': '04a92d2fa375c0aa65b9ca935fc00b74fcebaf6011f25513d93c400cdc086e3c', 'mk/feature.mk': '6295cf05c4311950bd2e9cc3e00f89171c6eb09be99384e4f944d792d32b50a7', 'mk/make.sh': '7fb02f94256ad2f8fd1a2e7794ec17893bc7db17f577cf62e5da2a53b68db808', 'mk/Makefile': 'adf8f279aba5635deba314138874eb5b33211c2c84f782f216bd05b923be4f1f', 'mk/obj.mk': 'c222542a7702df0fb719f25097e7a3a69aeccdb11d0c006517a4a42829fdb66b'}\nbase = Path('qsdk-src/qca-ssdk')\nlines = []\nfor name, digest in expected.items():\n    actual = hashlib.sha256((base / name).read_bytes()).hexdigest()\n    lines.append(f'{actual}  {name}')\n    assert actual == digest, f'Unexpected SSDK build input: {name}'\nPath('results/ssdk-build-input-sha256.txt').write_text('\\n'.join(lines) + '\\n')\nPY\n"
