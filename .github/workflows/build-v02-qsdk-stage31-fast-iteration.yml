dk-src/qca-nss-ppe apply --check \"$GITHUB_WORKSPACE/results/linux-6.18-stage12-compat.patch\"\ngit -C qsdk-src/qca-nss-ppe apply \"$GITHUB_WORKSPACE/results/linux-6.18-stage12-compat.patch\"\ngit -C qsdk-src/qca-nss-ppe diff > results/linux-6.18-stage13-ppe-compat.patch\nsha256sum results/linux-6.18-stage12-compat.patch > results/ppe-patch-sha256.txt\n"
