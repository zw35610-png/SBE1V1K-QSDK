    - name: Audit pinned declarations and add exact SSDK MIB prototypes
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/prototypes\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\nmkdir -p results/stage31-prototypes\npython3 <<'PY' 2>&1 | tee results/stage31-prototypes/audit.log\nfrom pathlib import Path\nimport hashlib, json, re, difflib, sys, traceback, os, subprocess\nworkspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()\nroot = workspace / 'qsdk-src/qca-ssdk'\nout = workspace / 'results/stage31-prototypes'\nout.mkdir(parents=True, exist_ok=True)\nexpected = {'include/ref/ref_mib.h': '0727c3d0e155570151445cd4237d46caf1f77a8b05e3606dad2b9f3ef5a68b13', 'src/init/ssdk_init.c': '97f7606b99b5bf78e0ba48ea3d7b0a6bc8ada4e62c8b0c9bcc15c381288393ec', 'src/ref/ref_mib.c': '8526b0d13e650e0d6148b0d6bbb3c24177aa69a008d9dd5dedd4d736f7790e42'}\nnames = ('_qca_ar8327_sw_capture_port_tx_counter',\n         '_qca_ar8327_sw_capture_port_rx_counter', 'qca_ar8327_sw_mib_task')\nstatus = {'state': 'RUNNING', 'phase': 'source_preflight', 'source_root': str(root), 'verified': False, 'method': 'shared exact prototypes; unchanged bodies and linkage'}\n(out/'status.json').write_text(json.dumps(status, indent=2))\n# Persist failures before the workflow proceeds to always-upload diagnostics.\nhash_checks = []\ndef audit_failure(exc_type, exc, tb):\n    status.update(state='FAIL', verified=False, error_type=exc_type.__name__, error=str(exc))\n    (out/'status.json').write_text(json.dumps(status, indent=2) + '\\n')\n    (out/'failure.txt').write_text(''.join(traceback.format_exception(exc_type, exc, tb)))\n    sys.__excepthook__(exc_type, exc, tb)\nsys.excepthook = audit_failure\nrequired_commit = '717b74016b0c131575bcd81b9e039d3f7974b02a'\nstatus['required_commit'] = required_commit\nif not root.is_dir():\n    raise RuntimeError(f'SSDK source directory missing: {root}')\nactual_commit = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()\nstatus['actual_commit'] = actual_commit\n(out/'status.json').write_text(json.dumps(status, indent=2) + '\\n')\nif actual_commit != required_commit:\n    raise RuntimeError(f'SSDK commit mismatch: expected={required_commit}; actual={actual_commit}')\nstatus['phase'] = 'source_hashes'\nbefore = {}\nfor rel, digest in expected.items():\n    p = root/rel\n    raw = p.read_bytes()\n    actual = hashlib.sha256(raw).hexdigest()\n    blob = subprocess.check_output(['git', '-C', str(root), 'show', required_commit + ':' + rel])\n    blob_digest = hashlib.sha256(blob).hexdigest()\n    hash_checks.append(dict(path=rel, expected_git_blob_sha256=digest, actual_sha256=actual,\n                            git_blob_sha256=blob_digest, crlf_count=raw.count(b'\\r\\n'),\n                            matches_blob=raw == blob))\n    (out/'hash-checks.json').write_text(json.dumps(hash_checks, indent=2) + '\\n')\n    assert blob_digest == digest, f'Pinned blob hash differs: {rel}'\n    assert actual == digest, f'Unexpected pinned source: {rel}; expected={digest}; actual={actual}'\n    before[rel] = p.read_text()\n    (out/(p.name + '.before')).write_text(before[rel])\nstatus['phase'] = 'declarations_and_uses'\nhits = []\npaths = {name: set() for name in names}\nfor p in sorted(root.rglob('*')):\n    if p.suffix not in ('.c', '.h') or '.git' in p.parts:\n        continue\n    for i, line in enumerate(p.read_text(errors='replace').splitlines(), 1):\n        for name in names:\n            if re.search(r'\\b' + re.escape(name) + r'\\b', line):\n                rel = p.relative_to(root).as_posix()\n                paths[name].add(rel)\n                hits.append(f'{rel}:{i}:{line}')\n(out/'declarations-and-uses.txt').write_text('\\n'.join(hits) + '\\n')\nassert paths[names[0]] == paths[names[1]] == {'src/ref/ref_mib.c'}, paths\nassert paths[names[2]] == {'src/ref/ref_mib.c', 'src/init/ssdk_init.c'}, paths\nc = before['src/ref/ref_mib.c']\nh = before['include/ref/ref_mib.h']\ninit = before['src/init/ssdk_init.c']\nfor name in names[:2]:\n    assert len(re.findall(r'\\bint\\s+' + name + r'\\(a_uint32_t dev_id, int port\\)\\s*\\{', c)) == 1\nassert len(re.findall(r'\\bvoid\\s+qca_ar8327_sw_mib_task\\(struct qca_phy_priv \\*priv\\)\\s*\\{', c)) == 1\nassert '#include \"ref_mib.h\"' in init\nextern = 'extern void qca_ar8327_sw_mib_task(struct qca_phy_priv *priv);\\n'\nassert init.count(extern) == 1\nanchor = '#if defined(IN_SWCONFIG)'\nassert h.count(anchor) == 1\ndecls = ('/* Stage31: common declarations, also required with SWCONFIG disabled. */\\n'\n         'struct qca_phy_priv;\\n'\n         'int _qca_ar8327_sw_capture_port_tx_counter(a_uint32_t dev_id, int port);\\n'\n         'int _qca_ar8327_sw_capture_port_rx_counter(a_uint32_t dev_id, int port);\\n'\n         'void qca_ar8327_sw_mib_task(struct qca_phy_priv *priv);\\n\\n')\nh = h.replace('#define _REF_MIB_H_\\n', '#define _REF_MIB_H_\\n\\n#include \"sw.h\"\\n')\nh = h.replace(anchor, decls + anchor)\nassert c.count('#include \"ref_vlan.h\"') == 1\nc = c.replace('#include \"ref_vlan.h\"', '#include \"ref_vlan.h\"\\n#include \"ref_mib.h\"')\ninit = init.replace(extern, '')\n# Validate exact declaration placement as well as definitions before writing.\nstatus['phase'] = 'patch_postconditions'\nassert h.count('#define _REF_MIB_H_') == 1\nassert h.count('#include \"sw.h\"') == 1\nfor declaration in decls.splitlines()[2:5]:\n    assert h.count(declaration) == 1, declaration\n    assert h.index(declaration) < h.index(anchor), declaration\nassert c.count('#include \"ref_mib.h\"') == 1\nassert c.index('#include \"ref_mib.h\"') < c.index(names[0])\nassert c.replace('\\n#include \"ref_mib.h\"', '', 1) == before['src/ref/ref_mib.c']\nassert init == before['src/init/ssdk_init.c'].replace(extern, '', 1)\nafter = {'src/ref/ref_mib.c': c, 'include/ref/ref_mib.h': h, 'src/init/ssdk_init.c': init}\npatch = ''\nfor rel, text in after.items():\n    (root/rel).write_text(text, newline='\\n')\n    (out/Path(rel).name).write_text(text)\n    patch += ''.join(difflib.unified_diff(before[rel].splitlines(True), text.splitlines(True), fromfile='a/'+rel, tofile='b/'+rel))\n(out/'ssdk-stage31-prototypes.patch').write_text(patch)\nstatus.update(state='PASS', phase='complete', verified=True, source_sha256=expected, declarations=list(names))\n(out/'status.json').write_text(json.dumps(status, indent=2) + '\\n')\nprint('Three shared prototypes verified; no function body or linkage changes.')\nPY\n"
      id: prototypes
    - name: Apply Linux 6.18 SFP MDIO-I2C and PHY registration compatibility
      shell: bash
      run: "set -euo pipefail\nsource results/environment.txt\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nSRC=\"$SSDK/src/hsl/phy/sfp_phy.c\"\nMDIO_I2C=\"$KERNEL_DIR/drivers/net/mdio/mdio-i2c.c\"\nOUT=\"$GITHUB_WORKSPACE/results/stage31-sfp-compat\"\nmkdir -p \"$OUT\"\ntest -f \"$SRC\"\ntest -f \"$MDIO_I2C\"\ncp \"$SRC\" \"$OUT/sfp_phy.c.before\"\n\ngrep -n -C 8 -E 'qcom_mdio_i2c_data|phy_driver_register|phy_driver_unregister|phy_drivers_register|phy_drivers_unregister' \\\n  \"$SRC\" > \"$OUT/qca-before-use-sites.txt\" || true\n\n# Verify Linux 6.18's real mdio-i2c private-data ABI before patching.\ngrep -n -C 6 -E 'struct i2c_adapter \\*i2c = bus->priv|bus->priv = i2c' \\\n  \"$MDIO_I2C\" > \"$OUT/linux-mdio-i2c-priv-contract.txt\" || true\ngrep -q -F 'struct i2c_adapter *i2c = bus->priv;' \"$MDIO_I2C\" || {\n  echo \"Linux 6.18 mdio-i2c bus->priv contract not verified; refusing patch\" >&2\n  exit 91\n}\n\ngrep -n -E 'phy_drivers_register|phy_drivers_unregister' \\\n  \"$KERNEL_DIR/include/linux/phy.h\" > \"$OUT/linux-phy-registration-api.txt\"\ngrep -q 'int phy_drivers_register' \"$KERNEL_DIR/include/linux/phy.h\"\ngrep -q 'void phy_drivers_unregister' \"$KERNEL_DIR/include/linux/phy.h\"\n\npython3 - <<'PY'\nfrom pathlib import Path\np = Path(\"qsdk-src/qca-ssdk/src/hsl/phy/sfp_phy.c\")\nt = p.read_text()\nrepl = [\n  (\"struct qcom_mdio_i2c_data *bus_priv;\",\n   \"struct i2c_adapter *bus_priv;\"),\n  (\"i2c_transfer(bus_priv->i2c, msgs, ARRAY_SIZE(msgs))\",\n   \"i2c_transfer(bus_priv, msgs, ARRAY_SIZE(msgs))\"),\n  (\"phy_driver_register(&sfp_phy_driver, THIS_MODULE)\",\n   \"phy_drivers_register(&sfp_phy_driver, 1, THIS_MODULE)\"),\n  (\"phy_driver_unregister(&sfp_phy_driver)\",\n   \"phy_drivers_unregister(&sfp_phy_driver, 1)\"),\n]\nfor old, new in repl:\n    n = t.count(old)\n    if n != 1:\n        raise SystemExit(f\"Refusing non-exact SFP patch: expected 1, got {n}: {old}\")\n    t = t.replace(old, new, 1)\np.write_text(t)\nPY\n\ncp \"$SRC\" \"$OUT/sfp_phy.c.after\"\ngit -C \"$SSDK\" diff -- src/hsl/phy/sfp_phy.c > \"$OUT/sfp-phy-stage31.patch\"\ngrep -n -C 8 -E 'i2c_adapter \\*bus_priv|i2c_transfer\\(bus_priv|phy_drivers_register|phy_drivers_unregister' \\\n  \"$SRC\" > \"$OUT/qca-after-use-sites.txt\"\n\ncat > \"$OUT/semantic-note.txt\" <<'EOF'\nNo qcom_mdio_i2c_data layout was invented.\nLinux 6.18 mdio-i2c uses struct i2c_adapter * directly as mii_bus->priv.\nQSDK SFP EEPROM I2C access is adapted to that verified contract.\nThe single PHY driver uses exported plural registration APIs with n=1.\nCompile validation only; SFP/Combo-port runtime testing is still required.\nEOF\n"
      id: sfp_compat
