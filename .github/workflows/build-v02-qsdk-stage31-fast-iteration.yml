    - name: Audit Linux 6.18.39 bridge semantics and patch SSDK
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/bridge_audit\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\nsource results/environment.txt\nexport KERNEL_DIR\npython3 <<'PY'\nfrom pathlib import Path\nimport os, re, json, hashlib, shutil, difflib\nout = Path('results/bridge-api')\nout.mkdir(parents=True, exist_ok=True)\nkernel = Path(os.environ['KERNEL_DIR'])\nfiles = ['net/bridge/br_fdb.c', 'net/bridge/br_device.c',\n         'net/bridge/br_private.h', 'net/core/rtnetlink.c',\n         'include/linux/netdevice.h', 'include/linux/if_bridge.h']\n(out/'review.txt').write_text(\"Stage16 reviewed source evidence\\n\\nLinux 6.18.39:\\nhttps://github.com/gregkh/linux/blob/v6.18.39/net/bridge/br_fdb.c\\nhttps://github.com/gregkh/linux/blob/v6.18.39/include/linux/netdevice.h\\nhttps://github.com/gregkh/linux/blob/v6.18.39/net/core/rtnetlink.c\\nhttps://github.com/gregkh/linux/blob/v6.18.39/net/bridge/br_device.c\\n\\nHistorical QSDK helper implementation (comparison evidence, NOT a release\\nmanifest pairing for SSDK 717b740):\\nhttps://github.com/Leo357449107/qsdk_cmiot-ax6/blob/d5887fa1ec8b8163c127d0ed619857da894486ee/qca/src/linux-4.4/net/bridge/br_fdb.c\\nSource SHA256: 36a2d9915c74e33b0dc602c2e7874afb05f1cf4fe28687d587b1e471cdd1f0ad\\n\\nBoth VID-0 paths delete the supplied MAC only on the supplied bridge port,\\nfirst in VID 0 then in each usable VLAN configured on that port. Other ports'\\nentries are rejected by the FDB destination-port comparison. No blanket flush.\\nNonzero VID validation differs across kernels and is deliberately NOT exposed\\nby this two-argument compatibility helper; the pinned SSDK call uses zero.\\n\\nbr_fdb_delete is not exported. Use the bridge master's ndo_fdb_del callback,\\npassing the original port (not the master) and all seven actual arguments.\\nDo not call the physical port's ndo_fdb_del and do not use external_learn_del.\\nThe bridge performs hash locking, switchdev notification and RTM_DELNEIGH.\\nnotified is initialized and passed by address; no duplicate notification.\\n\\nDevice lifetime: existing dev_get_by_name/dev_put retained; RTNL protects\\nmembership, master lifetime and VLAN traversal during callback invocation.\\nUse rtnl_trylock to avoid blocking under unknown caller-held SSDK/RTNL locks.\\nContention, atomic context or an RTNL-owning caller gets SW_BUSY and must retry\\nfrom process context without RTNL. Never use rtnl_is_locked as ownership proof.\\nENOENT means already absent; other failures are logged and returned to SSDK.\\nThis is a compile probe, not runtime validation of ACL/FDB or DSA/MAP-T.\\n\")\n(out/'legacy-QSDK-helper.txt').write_text('int br_fdb_delete_by_netdev(struct net_device *dev,\\n\\t\\t\\t    const unsigned char *addr, u16 vid)\\n{\\n\\tint err;\\n\\tstruct net_bridge_vlan_group *vg;\\n\\tstruct net_bridge_vlan *v;\\n\\tstruct net_bridge_port *p = br_port_get_rcu(dev);\\n\\n\\tif (!p) {\\n\\t\\tpr_info(\"bridge: %s not a bridge port\\\\n\",\\n\\t\\t\\tdev->name);\\n\\t\\treturn -EINVAL;\\n\\t}\\n\\tvg = nbp_vlan_group(p);\\n\\n\\tif (vid) {\\n\\t\\tv = br_vlan_find(vg, vid);\\n\\t\\tif (!v) {\\n\\t\\t\\tpr_info(\"bridge: with unconfigured vlan %d on %s\\\\n\"\\n\\t\\t\\t\\t, vid, dev->name);\\n\\t\\t\\treturn -EINVAL;\\n\\t\\t}\\n\\n\\t\\treturn __br_fdb_delete(p, addr, vid);\\n\\t}\\n\\terr = __br_fdb_delete(p, addr, 0);\\n\\n\\tif (!vg || !vg->num_vlans)\\n\\t\\treturn err;\\n\\n\\tlist_for_each_entry(v, &vg->vlan_list, vlist) {\\n\\t\\tif (!br_vlan_should_use(v))\\n\\t\\t\\tcontinue;\\n\\t\\terr &= __br_fdb_delete(p, addr, v->vid);\\n\\t}\\n\\treturn err;\\n}\\n')\ntexts = {}\nfor name in files:\n    p = kernel / name\n    dest = out / name\n    dest.parent.mkdir(parents=True, exist_ok=True)\n    shutil.copy2(p, dest)\n    texts[name] = p.read_text()\nstatus = {'verified': False, 'kernel': str(kernel), 'checks': {},\n          'sha256': {n: hashlib.sha256((kernel/n).read_bytes()).hexdigest() for n in files}}\ndef check(name, condition):\n    status['checks'][name] = bool(condition)\n    (out/'status.json').write_text(json.dumps(status, indent=2)+'\\n')\n    if not condition:\n        raise SystemExit('Bridge API audit failed: ' + name)\ndef function(text, name):\n    m = re.search(r'^.*\\b' + re.escape(name) + r'\\([^;]*?\\n\\{', text, re.M)\n    if not m:\n        raise SystemExit('Missing function: ' + name)\n    start = text.index('{', m.start())\n    depth, end = 1, start+1\n    while depth:\n        depth += (text[end] == '{') - (text[end] == '}')\n        end += 1\n    return text[m.start():end]\ndef compact(s):\n    return re.sub(r'\\s+', '', s)\nexpected = {'fdb_delete_by_addr_and_port': 'ffe4957b983af950eef7f88923d050951750f07269aac67a3c1484d2b7ce00cd', '__br_fdb_delete': '37993edc658da75c0dd8e2ee621a26df481a1822ac3e98b2ae08a61419328cfb', 'br_fdb_delete': '3f8f3a12adb098a6ddc91989b91464087d9291e98184ac1533e2394d08275891'}\nfor name, expected_hash in expected.items():\n    body = function(texts['net/bridge/br_fdb.c'], name)\n    (out/(name+'.txt')).write_text(body+'\\n')\n    check(name + '_reviewed_6_18_39_body',\n          hashlib.sha256(compact(body).encode()).hexdigest() == expected_hash)\nnetdev = compact(texts['include/linux/netdevice.h'])\ncheck('seven_argument_ndo_fdb_del',\n      '(*ndo_fdb_del)(structndmsg*ndm,structnlattr*tb[],structnet_device*dev,constunsignedchar*addr,u16vid,bool*notified,structnetlink_ext_ack*extack);' in netdev)\ncheck('bridge_ops_dispatch', '.ndo_fdb_del=br_fdb_delete,' in compact(texts['net/bridge/br_device.c']))\nrtnl = compact(texts['net/core/rtnetlink.c'])\ncheck('rtnetlink_uses_master_ops_with_original_port',\n      'structnet_device*br_dev=netdev_master_upper_dev_get(dev);' in rtnl and\n      'ops=br_dev->netdev_ops;' in rtnl and\n      'ops->ndo_fdb_del(ndm,tb,dev,addr,vid,&notified,extack)' in rtnl)\nexported = {r.split()[1] for r in (kernel/'Module.symvers').read_text().splitlines() if len(r.split()) >= 4}\ncheck('required_helpers_exported', {'rtnl_trylock', 'rtnl_unlock', 'netdev_master_upper_dev_get'} <= exported)\ncheck('bridge_enabled', bool(re.search(r'^CONFIG_BRIDGE=[ym]$', (kernel/'.config').read_text(), re.M)))\ncheck('legacy_helper_absent', 'br_fdb_delete_by_netdev' not in texts['include/linux/if_bridge.h'] and 'br_fdb_delete_by_netdev' not in exported)\n\nssdk = Path('qsdk-src/qca-ssdk')\np = ssdk/'src/ref/ref_acl.c'\nbefore = p.read_text()\ncheck('pinned_ref_acl_source', hashlib.sha256(before.encode()).hexdigest() == '9f2270d3d338e9e3e00228500266aba0fb2c15ba79f975998605445000757d23')\ncall = 'br_fdb_delete_by_netdev(eth_dev, entry->src_mac.uc, 0);'\ncheck('single_expected_call', before.count(call) == 1)\nheader = ssdk/'src/ref/ssdk_stage16_bridge.h'\nheader.write_text(r\"\"\"/* SPDX-License-Identifier: GPL-2.0-only */\n#ifndef SSDK_STAGE16_BRIDGE_H\n#define SSDK_STAGE16_BRIDGE_H\n\n#include <linux/errno.h>\n#include <linux/if_bridge.h>\n#include <linux/interrupt.h>\n#include <linux/netdevice.h>\n#include <linux/neighbour.h>\n#include <linux/rtnetlink.h>\n\n/*\n * Replacement for the ref_acl.c br_fdb_delete_by_netdev(port, addr, 0)\n * call ONLY. Linux 6.18.39 br_fdb_delete() keeps port ownership checks and\n * deletes VID 0 plus the port's usable VLANs, like the QSDK VID-0 path.\n * Use the bridge master's ops but pass the original PORT as the device.\n * The bridge handles its hash lock, switchdev and RTM_DELNEIGH notification.\n * Caller owns a dev reference. Never wait for RTNL under unknown SSDK locks:\n * return -EAGAIN on contention (including a caller already holding RTNL).\n * The API caller must retry SW_BUSY from process context without RTNL held.\n */\nstatic inline int ssdk_stage16_fdb_delete(struct net_device *port,\n\t\t\t\t\tconst unsigned char *addr)\n{\n\tstruct net_device *bridge;\n\tstruct ndmsg ndm = { .ndm_family = AF_BRIDGE,\n\t\t\t    .ndm_flags = NTF_MASTER };\n\tstruct nlattr *tb[NDA_MAX + 1] = { NULL };\n\tbool notified = false;\n\tint err = -EINVAL;\n\n\tif (in_atomic() || in_interrupt() || irqs_disabled())\n\t\treturn -EAGAIN;\n\tif (!rtnl_trylock())\n\t\treturn -EAGAIN;\n\n\tif (!netif_is_bridge_port(port))\n\t\tgoto out;\n\tbridge = netdev_master_upper_dev_get(port);\n\tif (!bridge || !netif_is_bridge_master(bridge))\n\t\tgoto out;\n\terr = -EOPNOTSUPP;\n\tif (!bridge->netdev_ops || !bridge->netdev_ops->ndo_fdb_del)\n\t\tgoto out;\n\n\tndm.ndm_ifindex = port->ifindex;\n\terr = bridge->netdev_ops->ndo_fdb_del(&ndm, tb, port, addr, 0,\n\t\t\t\t\t    &notified, NULL);\nout:\n\trtnl_unlock();\n\treturn err;\n}\n#endif\n\"\"\")\nreplacement = 'int fdb_err;\\n\\n\\t\\t\\tfdb_err = ssdk_stage16_fdb_delete(eth_dev, entry->src_mac.uc);\\n\\t\\t\\t/* A missing FDB entry already satisfies the deletion request. */\\n\\t\\t\\tif (fdb_err && fdb_err != -ENOENT) {\\n\\t\\t\\t\\tSSDK_ERROR(\"bridge FDB delete failed on %s: %d\\\\n\",\\n\\t\\t\\t\\t\\t\\teth_dev->name, fdb_err);\\n\\t\\t\\t\\trv = fdb_err == -EAGAIN ? SW_BUSY :\\n\\t\\t\\t\\t\\t(fdb_err == -EOPNOTSUPP ? SW_NOT_SUPPORTED : SW_FAIL);\\n\\t\\t\\t}'\nafter = before.replace('#include <linux/if_bridge.h>', '#include <linux/if_bridge.h>\\n#include \"ssdk_stage16_bridge.h\"').replace(call, replacement)\np.write_text(after)\npatch = ''.join(difflib.unified_diff(before.splitlines(True), after.splitlines(True),\n              fromfile='a/src/ref/ref_acl.c', tofile='b/src/ref/ref_acl.c'))\npatch += ''.join(difflib.unified_diff([], header.read_text().splitlines(True),\n              fromfile='/dev/null', tofile='b/src/ref/ssdk_stage16_bridge.h'))\nPath('results/ssdk-stage16-bridge.patch').write_text(patch)\nshutil.copy2(p, out/'ref_acl.c')\nshutil.copy2(header, out/header.name)\nstatus['verified'] = True\nstatus['scope'] = 'ref_acl VID-0 call only; original port + MAC, VID 0 and usable port VLANs'\nstatus['locking'] = 'RTNL trylock; contention/atomic context => SW_BUSY, no silent skip'\n(out/'status.json').write_text(json.dumps(status, indent=2)+'\\n')\nprint(json.dumps(status, indent=2))\nPY\n"
      id: bridge_audit
