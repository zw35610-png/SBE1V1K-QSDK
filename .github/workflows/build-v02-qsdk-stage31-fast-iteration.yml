    - name: Apply Linux 6.18 phylink PCS compatibility
      shell: bash
      run: "set -euo pipefail\nsource results/environment.txt\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nSRC=\"$SSDK/src/init/ssdk_init.c\"\nPHYLINK_H=\"$KERNEL_DIR/include/linux/phylink.h\"\nOUT=\"$GITHUB_WORKSPACE/results/stage31-phylink-compat\"\nmkdir -p \"$OUT\"\ntest -f \"$SRC\"\ntest -f \"$PHYLINK_H\"\n\ncp \"$SRC\" \"$OUT/ssdk_init.c.before\"\ngrep -n -C 10 -E 'ssdk_pcs_get_state|pcs_get_state|neg_mode' \"$SRC\" \\\n  > \"$OUT/qca-phylink-before.txt\" || true\ngrep -n -C 8 -E 'pcs_get_state|struct phylink_pcs' \"$PHYLINK_H\" \\\n  > \"$OUT/linux618-phylink-api.txt\" || true\n\n# Refuse to patch unless the running OpenWrt kernel tree proves the\n# Linux 6.18 callback shape that Stage23's compiler reported.\npython3 - <<'PY'\nfrom pathlib import Path\nh = Path(\"openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommbe_ipq95xx/linux-6.18.39/include/linux/phylink.h\")\n# Fall back to the KERNEL_DIR discovered by the workflow if the\n# canonical build_dir path changes; shell validation below is primary.\nif h.exists():\n    text = h.read_text(errors=\"ignore\")\n    if \"pcs_get_state\" not in text:\n        raise SystemExit(\"pcs_get_state not found in phylink.h\")\nPY\n\n# The Stage23 compiler established:\n# pcs_get_state(struct phylink_pcs *, unsigned int,\n#               struct phylink_link_state *)\n# Linux 6.18 passes negotiation mode into the callback; the old\n# persistent phylink_pcs.neg_mode member no longer exists.\npython3 - <<'PY'\nfrom pathlib import Path\np = Path(\"qsdk-src/qca-ssdk/src/init/ssdk_init.c\")\nt = p.read_text()\n\nold_sig = \"static void ssdk_pcs_get_state(struct phylink_pcs *pcs, struct phylink_link_state *state)\"\nnew_sig = \"static void ssdk_pcs_get_state(struct phylink_pcs *pcs, unsigned int neg_mode, struct phylink_link_state *state)\"\nif t.count(old_sig) != 1:\n    raise SystemExit(f\"Expected exactly one old pcs_get_state signature, got {t.count(old_sig)}\")\nt = t.replace(old_sig, new_sig, 1)\n\n# This callback only reads current hardware/link state; it did not use\n# the old pcs->neg_mode value. Mark the new argument intentionally unused.\nanchor = new_sig + \"\\n{\"\nif t.count(anchor) != 1:\n    raise SystemExit(\"Unable to locate patched pcs_get_state body\")\nt = t.replace(anchor, anchor + \"\\n\\t(void)neg_mode;\", 1)\n\nold_member = \"\\tport_priv->phylink_pcs.neg_mode = true;\\n\"\nif t.count(old_member) != 1:\n    raise SystemExit(f\"Expected exactly one removed phylink_pcs.neg_mode assignment, got {t.count(old_member)}\")\nt = t.replace(old_member, \"\", 1)\n\np.write_text(t)\nPY\n\ncp \"$SRC\" \"$OUT/ssdk_init.c.after\"\ngit -C \"$SSDK\" diff -- src/init/ssdk_init.c > \"$OUT/ssdk-init-stage31.patch\"\ngrep -n -C 10 -E 'ssdk_pcs_get_state|pcs_get_state|neg_mode' \"$SRC\" \\\n  > \"$OUT/qca-phylink-after.txt\" || true\n\ncat > \"$OUT/semantic-note.txt\" <<'EOF'\nLinux 6.18 changed phylink PCS get_state to receive neg_mode as a\ncallback argument and removed phylink_pcs.neg_mode storage.\nQSDK's get_state implementation does not depend on negotiation mode,\nso Stage31 accepts and intentionally ignores the new argument, and\nremoves only the obsolete member assignment. No link-state logic is\ndisabled or hard-coded.\nEOF\n"
      id: phylink_compat
    - name: Apply Linux 6.18 DSA compatibility - robust line transform
      shell: bash
      run: "set -euo pipefail\nsource results/environment.txt\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nSRC=\"$SSDK/src/init/ssdk_init.c\"\nDSAH=\"$KERNEL_DIR/include/net/dsa.h\"\nOUT=\"$GITHUB_WORKSPACE/results/stage31-dsa-compat\"\nmkdir -p \"$OUT\"\ntest -f \"$SRC\"\ntest -f \"$DSAH\"\ncp \"$SRC\" \"$OUT/ssdk_init.c.before\"\n\ngrep -q 'dsa_user_dev_check' \"$DSAH\"\ngrep -q 'dsa_port_to_conduit' \"$DSAH\"\n\npython3 - <<'PY'\nfrom pathlib import Path\n\np = Path(\"qsdk-src/qca-ssdk/src/init/ssdk_init.c\")\nlines = p.read_text().splitlines()\n\n# 1) Simple public-API renames.\ntext = chr(10).join(lines) + chr(10)\nif text.count(\"dsa_slave_dev_check\") != 2:\n    raise SystemExit(\"Expected exactly two dsa_slave_dev_check uses\")\ntext = text.replace(\"dsa_slave_dev_check\", \"dsa_user_dev_check\")\nif text.count(\"dp->cpu_dp->master\") != 1:\n    raise SystemExit(\"Expected exactly one dp->cpu_dp->master use\")\ntext = text.replace(\"dp->cpu_dp->master\", \"dsa_port_to_conduit(dp)\", 1)\nlines = text.splitlines()\n\n# 2) Remove obsolete DSA notifier callback + notifier object.\na = next(i for i,x in enumerate(lines) if x.startswith(\"static int ssdk_dsa_event_nb(\"))\nb = next(i for i in range(a, len(lines)) if lines[i] == \"};\" and\n         i > 0 and \"notifier_call = ssdk_dsa_event_nb\" in lines[i-1])\n# Include the callback, blank separator, notifier object; preserve the\n# surrounding #if/#endif because other DSA helpers share that guard.\ndel lines[a:b+1]\n\n# 3) Remove complete obsolete register/unregister blocks by finding\n# the call and expanding to its surrounding CONFIG_NET_DSA guard.\nfor needle in (\n    \"register_dsa_blocking_notifier(&ssdk_dsa_notifier_nb);\",\n    \"unregister_dsa_blocking_notifier(&ssdk_dsa_notifier_nb);\",\n):\n    hit = next(i for i,x in enumerate(lines) if needle in x)\n    lo = hit\n    while lo >= 0 and lines[lo] != \"#if IS_ENABLED(CONFIG_NET_DSA)\":\n        lo -= 1\n    hi = hit\n    while hi < len(lines) and lines[hi] != \"#endif\":\n        hi += 1\n    if lo < 0 or hi >= len(lines):\n        raise SystemExit(\"Could not bound obsolete DSA notifier block: \" + needle)\n    del lines[lo:hi+1]\n\n# 4) Insert Linux 6.18 link-change handling in existing netdev notifier.\nfn = next(i for i,x in enumerate(lines) if x.startswith(\"static int ssdk_dev_event(\"))\nsw = next(i for i in range(fn, len(lines)) if lines[i].strip() == \"switch (event) {\")\ncompat = [\n    \"#if IS_ENABLED(CONFIG_NET_DSA)\",\n    \"        case NETDEV_CHANGE:\",\n    \"            if (dsa_user_dev_check(dev))\",\n    \"                return ssdk_dsa_event_link_change(dev, netif_carrier_ok(dev));\",\n    \"            break;\",\n    \"#endif\",\n]\nlines[sw+1:sw+1] = compat\n\nout = chr(10).join(lines) + chr(10)\n\n# Hard pre-build invariants.\nforbidden = [\n    \"dsa_slave_dev_check\",\n    \"DSA_NOTIFIER_PORT_LINK\",\n    \"struct dsa_notifier_link\",\n    \"register_dsa_blocking_notifier\",\n    \"unregister_dsa_blocking_notifier\",\n    \"ssdk_dsa_event_nb\",\n    \"ssdk_dsa_notifier_nb\",\n]\nremain = [x for x in forbidden if x in out]\nif remain:\n    raise SystemExit(\"Obsolete DSA API remains: \" + \", \".join(remain))\nif out.count(\"case NETDEV_CHANGE:\") != 1:\n    raise SystemExit(\"Expected exactly one NETDEV_CHANGE compatibility case\")\nif \"dsa_port_to_conduit(dp)\" not in out:\n    raise SystemExit(\"dsa_port_to_conduit mapping missing\")\nif \"dsa_user_dev_check\" not in out:\n    raise SystemExit(\"dsa_user_dev_check mapping missing\")\n\np.write_text(out)\nPY\n\ncp \"$SRC\" \"$OUT/ssdk_init.c.after\"\ngit -C \"$SSDK\" diff -- src/init/ssdk_init.c > \"$OUT/ssdk-init-stage31.patch\"\n\n# Syntax-shape evidence saved into artifact.\ngrep -n -C 8 -E 'NETDEV_CHANGE|dsa_user_dev_check|dsa_port_to_conduit' \"$SRC\" \\\n  > \"$OUT/dsa-after-sites.txt\"\n! grep -Eq 'DSA_NOTIFIER_PORT_LINK|dsa_notifier_link|register_dsa_blocking_notifier|unregister_dsa_blocking_notifier' \"$SRC\"\n\ncat > \"$OUT/semantic-note.txt\" <<'EOF'\nStage31 uses a line-oriented transform rather than YAML/Bash/Python\nescaped multiline C strings. It maps slave->user terminology, uses\ndsa_port_to_conduit(), removes the obsolete QSDK blocking DSA link\nnotifier, and routes DSA user NETDEV_CHANGE through the existing SSDK\nlink-change handler using netif_carrier_ok(). Runtime validation is\nstill required before any firmware release.\nEOF\n"
      id: dsa_compat
    - name: Apply Linux 6.18 MDIO bitbang and bin_attribute compatibility
      shell: bash
      run: "set -euo pipefail\nsource results/environment.txt\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nSRC=\"$SSDK/src/init/ssdk_plat.c\"\nMDIO_H=\"$KERNEL_DIR/include/linux/mdio-bitbang.h\"\nSYSFS_H=\"$KERNEL_DIR/include/linux/sysfs.h\"\nOUT=\"$GITHUB_WORKSPACE/results/stage31-ssdk-plat-compat\"\nmkdir -p \"$OUT\"\ntest -f \"$SRC\" && test -f \"$MDIO_H\" && test -f \"$SYSFS_H\"\ncp \"$SRC\" \"$OUT/ssdk_plat.c.before\"\ngrep -n -A45 -B5 'struct mdiobb_ctrl' \"$MDIO_H\" > \"$OUT/linux618-mdiobb-api.txt\" || true\ngrep -n -A35 -B5 'struct bin_attribute' \"$SYSFS_H\" > \"$OUT/linux618-bin-attribute-api.txt\" || true\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport difflib\n\np = Path(\"qsdk-src/qca-ssdk/src/init/ssdk_plat.c\")\nbefore = p.read_text()\ntext = before\n\ndef stub_function(src, name, unused):\n    start = src.find(\"sw_error_t \" + name + \"(\")\n    if start < 0:\n        raise SystemExit(\"Missing function: \" + name)\n    brace = src.find(\"{\", start)\n    depth = 0\n    end = None\n    for i in range(brace, len(src)):\n        if src[i] == \"{\": depth += 1\n        elif src[i] == \"}\":\n            depth -= 1\n            if depth == 0:\n                end = i + 1\n                break\n    if end is None:\n        raise SystemExit(\"Unbalanced function: \" + name)\n    sig = src[start:brace]\n    body = \"{\\n\\t/* Linux 6.18 has no QSDK mdiobb_ctrl sw_read/sw_write hooks. */\\n\"\n    for arg in unused:\n        body += f\"\\t(void){arg};\\n\"\n    body += \"\\treturn SW_NOT_FOUND;\\n}\"\n    return src[:start] + sig + body + src[end:]\n\n# Compile-probe compatibility only. Keep symbols but disable the removed\n# Qualcomm raw GPIO hooks. Runtime semantics must be reviewed before flashing.\ntext = stub_function(text, \"qca_bitbang_mii_raw_read_try\", [\"bus\",\"reg\",\"val\"])\ntext = stub_function(text, \"qca_bitbang_mii_raw_write_try\", [\"bus\",\"reg\",\"val\"])\ntext = stub_function(text, \"qca_bitbang_mii_raw_update_try\", [\"bus\",\"reg\",\"clear\",\"set\"])\n\ncallbacks = [\n    \"ssdk_packet_counter_bin_read\",\n    \"ssdk_packet_counter_bin_write\",\n    \"ssdk_byte_counter_bin_read\",\n    \"ssdk_byte_counter_bin_write\",\n]\nfor name in callbacks:\n    pos = text.find(name + \"(\")\n    if pos < 0: raise SystemExit(\"Missing callback: \" + name)\n    brace = text.find(\"{\", pos)\n    head = text[pos:brace]\n    if \"struct bin_attribute *\" not in head:\n        raise SystemExit(\"Expected old bin_attribute signature: \" + name)\n    text = text[:pos] + head.replace(\"struct bin_attribute *\",\n                                    \"const struct bin_attribute *\", 1) + text[brace:]\n\nif \"gpio_priv->sw_read\" in text or \"gpio_priv->sw_write\" in text:\n    raise SystemExit(\"obsolete mdiobb_ctrl hook remains\")\nfor name in callbacks:\n    pos = text.find(name + \"(\"); brace = text.find(\"{\", pos)\n    if \"const struct bin_attribute *\" not in text[pos:brace]:\n        raise SystemExit(\"const conversion missing: \" + name)\n\np.write_text(text)\nout = Path(\"results/stage31-ssdk-plat-compat\")\n(out/\"ssdk_plat.c.after\").write_text(text)\n(out/\"ssdk-plat-stage31.patch\").write_text(\"\".join(difflib.unified_diff(\n    before.splitlines(True), text.splitlines(True),\n    fromfile=\"a/src/init/ssdk_plat.c\", tofile=\"b/src/init/ssdk_plat.c\")))\nPY\n\ngrep -n -C 8 -E 'qca_bitbang_mii_raw_(read|write|update)_try|ssdk_(packet|byte)_counter_bin_(read|write)' \\\n  \"$SRC\" > \"$OUT/after-sites.txt\"\n! grep -Eq 'gpio_priv->sw_read|gpio_priv->sw_write' \"$SRC\"\ncat > \"$OUT/semantic-note.txt\" <<'EOF'\nStage31 compile-probe compatibility:\n1. Linux 6.18 upstream mdiobb_ctrl lacks the QSDK sw_read/sw_write extension.\n   The three raw GPIO helper symbols are retained but return SW_NOT_FOUND.\n   Runtime behavior MUST be reviewed before a flashable release.\n2. Linux 6.18 bin_attribute read/write callbacks use\n   const struct bin_attribute *; four SSDK counter callbacks are updated.\nEOF\n"
      id: ssdk_plat_compat
    - name: Apply Linux 6.18 platform-device and pinconf compatibility
      shell: bash
      run: "set -euo pipefail\nsource results/environment.txt\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nDTS=\"$SSDK/src/init/ssdk_dts.c\"\nMHT=\"$SSDK/src/init/ssdk_mht_pinctrl.c\"\nOUT=\"$GITHUB_WORKSPACE/results/stage31-linux618-includes\"\nmkdir -p \"$OUT\"\ntest -f \"$DTS\"\ntest -f \"$MHT\"\n\ncp \"$DTS\" \"$OUT/ssdk_dts.c.before\"\ncp \"$MHT\" \"$OUT/ssdk_mht_pinctrl.c.before\"\n\n# Save the exact kernel API evidence used by this compatibility step.\ngrep -n -A20 -B5 'struct platform_device' \\\n  \"$KERNEL_DIR/include/linux/platform_device.h\" \\\n  > \"$OUT/linux618-platform-device.txt\" || true\ngrep -n -A35 -B5 'PIN_CONFIG_OUTPUT' \\\n  \"$KERNEL_DIR/include/linux/pinctrl/pinconf-generic.h\" \\\n  > \"$OUT/linux618-pinconf-generic.txt\" || true\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport difflib\n\nout = Path(\"results/stage31-linux618-includes\")\n\ndef add_include(path_s, header):\n    p = Path(path_s)\n    before = p.read_text()\n    inc = f\"#include <{header}>\"\n    if inc in before:\n        after = before\n    else:\n        lines = before.splitlines(True)\n        first = next((i for i, line in enumerate(lines)\n                      if line.lstrip().startswith(\"#include\")), None)\n        if first is None:\n            raise SystemExit(f\"No include block found in {p}\")\n        lines.insert(first, inc + \"\\n\")\n        after = \"\".join(lines)\n        p.write_text(after)\n    return before, after\n\ndts_before, dts_after = add_include(\n    \"qsdk-src/qca-ssdk/src/init/ssdk_dts.c\",\n    \"linux/platform_device.h\"\n)\nmht_before, mht_after = add_include(\n    \"qsdk-src/qca-ssdk/src/init/ssdk_mht_pinctrl.c\",\n    \"linux/pinctrl/pinconf-generic.h\"\n)\n\n(out / \"ssdk_dts.c.after\").write_text(dts_after)\n(out / \"ssdk_mht_pinctrl.c.after\").write_text(mht_after)\n\npatch = []\npatch += difflib.unified_diff(\n    dts_before.splitlines(True), dts_after.splitlines(True),\n    fromfile=\"a/src/init/ssdk_dts.c\",\n    tofile=\"b/src/init/ssdk_dts.c\"\n)\npatch += difflib.unified_diff(\n    mht_before.splitlines(True), mht_after.splitlines(True),\n    fromfile=\"a/src/init/ssdk_mht_pinctrl.c\",\n    tofile=\"b/src/init/ssdk_mht_pinctrl.c\"\n)\n(out / \"stage31-linux618-includes.patch\").write_text(\"\".join(patch))\n\nif \"#include <linux/platform_device.h>\" not in dts_after:\n    raise SystemExit(\"platform_device compatibility include missing\")\nif \"#include <linux/pinctrl/pinconf-generic.h>\" not in mht_after:\n    raise SystemExit(\"pinconf-generic compatibility include missing\")\nPY\n\ngrep -n -m1 'linux/platform_device.h' \"$DTS\"\ngrep -n -m1 'linux/pinctrl/pinconf-generic.h' \"$MHT\"\n\ncat > \"$OUT/semantic-note.txt\" <<'EOF'\nStage31 compile compatibility:\n- ssdk_dts.c dereferences struct platform_device, so Linux 6.18 requires\n  linux/platform_device.h for the complete structure definition.\n- ssdk_mht_pinctrl.c uses PIN_CONFIG_OUTPUT, which is provided by\n  linux/pinctrl/pinconf-generic.h.\nThese are header/API visibility fixes, not runtime behavior substitutions.\nEOF\n"
      id: linux618_headers
    - name: Build exact SSDK through verified mk entry
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/ssdk_build\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\nsource results/environment.txt\nexport STAGING_DIR=\"$GITHUB_WORKSPACE/openwrt/staging_dir\"\nexport PATH=\"$TOOLCHAIN_DIR/bin:$PATH\"\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nMK_PATH=\"$SSDK/mk\"\ntest -f \"$MK_PATH/Makefile\"\ntest -s \"$KERNEL_DIR/Module.symvers\"\ntest \"$(git -C \"$SSDK\" rev-parse HEAD)\" = 717b74016b0c131575bcd81b9e039d3f7974b02a\ngit -C \"$SSDK\" status --short > results/ssdk-source-status.txt\n\n# Qualcomm feed c7ebac1 Build/Compile uses $(PKG_BUILD_DIR)/mk.\n# Both paths are explicit: setting PRJ_PATH alone skips MK_PATH initialization.\n# Keep the Stage13 full-size / no-swconfig / no-PTP compile-probe choices.\n# Do not run mk/build.sh: it references an absent make.sh and a devtest tree.\nvars=(\n  PRJ_PATH=\"$SSDK\" MK_PATH=\"$MK_PATH\" SYS_PATH=\"$KERNEL_DIR\"\n  ARCH=arm64 CROSS_COMPILE=\"$CROSS_COMPILE\" TOOLPREFIX=\"$CROSS_COMPILE\"\n  TOOL_PATH=\"$TOOLCHAIN_DIR/bin\" KVER=6.18.39\n  TARGET_NAME=aarch64-openwrt-linux-musl TARGET_SUFFIX=musl\n  \"GCC_VERSION=$($GCC -dumpfullversion)\"\n  SoC=ipq95xx CHIP_TYPE=APPE MODULE_TYPE=KSLIB\n  MINI_SSDK=disable PTP_FEATURE=disable SWCONFIG_FEATURE=disable\n  \"KCFLAGS=-I$GITHUB_WORKSPACE/qsdk-include -Wno-error=missing-prototypes -Wno-error=missing-declarations\"\n  SHELL=/bin/bash V=1\n  \"LNX_MAKEOPTS=ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE V=1\"\n)\n# Fast probe: -k keeps independent objects compiling; use every available runner CPU.\nargs=(-C \"$MK_PATH\" -k -j\"$(nproc)\" \"${vars[@]}\" modules)\nprintf '%q ' make \"${args[@]}\" > results/ssdk-build-command.txt\nprintf '\\n' >> results/ssdk-build-command.txt\n\ncat > results/ssdk-inspect.mk <<'MK'\n.PHONY: stage31_inspect\nstage31_inspect:\n\t@$(foreach v,PRJ_PATH MK_PATH SYS_PATH ARCH CROSS_COMPILE SoC CHIP_TYPE SUPPORT_CHIP KVER OS_VER MODULE_TYPE MINI_SSDK FAL IN_ACL IN_IP IN_PPPOE IN_POLICER IN_QM IN_QOS IN_VSI IN_VPORT IN_TUNNEL IN_MAPT IN_COSMAP IN_SERVCODE SWCONFIG IN_PTP KCFLAGS MODULE_CFLAG MODULE_INC SSDK_OBJ,$(info $(v)=$($(v)))) true\nMK\nset +e\nmake -C \"$MK_PATH\" \"${vars[@]}\" -f \"$MK_PATH/Makefile\" \\\n  -f \"$GITHUB_WORKSPACE/results/ssdk-inspect.mk\" stage31_inspect \\\n  > results/ssdk-effective-config.txt 2>&1\ninspect_rc=$?\necho \"$inspect_rc\" > results/ssdk-config-inspect-exit-code.txt\nif [ \"$inspect_rc\" != 0 ]; then\n  cp results/ssdk-effective-config.txt results/ssdk-compile.log\n  echo \"$inspect_rc\" > results/ssdk-exit-code.txt\n  exit 0\nfi\n\n# Stage31 fast mode: keep prototype/declaration diagnostics as warnings,\n# but preserve all other real compiler errors. One pass avoids wasting a\n# full compile on warning-only failures.\necho FAST_MODE_PROTOTYPE_WARNINGS_NOT_FATAL > results/ssdk-warning-fallback.txt\necho SKIPPED_FAST_MODE > results/ssdk-strict-exit-code.txt\nmake \"${args[@]}\" 2>&1 | tee results/ssdk-compile.log\nrc=${PIPESTATUS[0]}\ncp results/ssdk-compile.log results/ssdk-fast-compile.log\necho \"$rc\" > results/ssdk-exit-code.txt\nfind \"$SSDK\" -type f \\( -name '*.ko' -o -name Module.symvers \\) -print \\\n  | sort > results/ssdk-generated.txt\n# mk/Makefile copies these on success; check instead of fabricating a table.\nif [ \"$rc\" = 0 ]; then\n  if [ -s \"$MK_PATH/qca-ssdk.ko\" ] && [ -s \"$SSDK/build/bin/qca-ssdk.ko\" ] &&\n     [ -s \"$MK_PATH/Module.symvers\" ] && [ -s \"$SSDK/Module.symvers\" ] &&\n     cmp -s \"$MK_PATH/Module.symvers\" \"$SSDK/Module.symvers\" &&\n     cmp -s \"$MK_PATH/qca-ssdk.ko\" \"$SSDK/build/bin/qca-ssdk.ko\"; then\n    echo VERIFIED > results/ssdk-products-check.txt\n    modinfo \"$MK_PATH/qca-ssdk.ko\" > results/ssdk-modinfo.txt 2>&1\n  else\n    echo 'SSDK returned zero but expected products are missing or inconsistent.' \\\n      > results/ssdk-products-check.txt\n    echo 90 > results/ssdk-exit-code.txt\n  fi\nfi\ngit -C \"$SSDK\" diff > results/ssdk-build-changes.patch\ncp \"$SSDK/src/ref/ssdk_stage16_bridge.h\" results/ssdk-source-context/\nexit 0\n"
      id: ssdk_build
    - name: Build PPE with SSDK and NSS Debug exports
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/ppe_build\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset +e\nset -uo pipefail\nsource results/environment.txt\nexport STAGING_DIR=\"$GITHUB_WORKSPACE/openwrt/staging_dir\"\nexport PATH=\"$TOOLCHAIN_DIR/bin:$PATH\"\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\nDEBUG_DIR=\"$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/nss_debug\"\nPPE_DIR=\"$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/drv/ppe_drv\"\nFLAGS=$(cat results/qsdk-header-flags.txt)\nextras=()\n: > results/kbuild-extra-symbols.txt\n# Never import incomplete/stale SSDK exports after a failed build.\nif [ \"$(cat results/ssdk-exit-code.txt 2>/dev/null)\" = 0 ] &&\n   [ -s \"$SSDK/Module.symvers\" ] &&\n   [ -n \"$(find \"$SSDK\" -name 'qca-ssdk.ko' -type f -print -quit)\" ]; then\n  extras+=(\"$SSDK/Module.symvers\")\nelse\n  echo 'SSDK dependency unavailable; PPE build is diagnostic only.' > results/ppe-dependency-status.txt\nfi\nif [ \"$(cat results/nss-debug-exit-code.txt 2>/dev/null)\" = 0 ] &&\n   [ -s \"$DEBUG_DIR/Module.symvers\" ] && [ -s \"$DEBUG_DIR/qca-nss-debug.ko\" ]; then\n  extras+=(\"$DEBUG_DIR/Module.symvers\")\nfi\nfor f in \"${extras[@]}\"; do printf '%s\\n' \"$f\" >> results/kbuild-extra-symbols.txt; done\nargs=(-C \"$KERNEL_DIR\" M=\"$PPE_DIR\" ARCH=arm64\n  CROSS_COMPILE=\"$CROSS_COMPILE\" SoC=ipq95xx CONFIG_NET_DSA=y\n  KCFLAGS=\"$FLAGS\" \"KBUILD_EXTRA_SYMBOLS=${extras[*]}\" modules V=1)\nprintf '%q ' make \"${args[@]}\" > results/ppe-build-command.txt\nprintf '\\n' >> results/ppe-build-command.txt\nmake \"${args[@]}\" 2>&1 | tee results/ppe-compile.log\nrc=${PIPESTATUS[0]}\necho \"$rc\" > results/ppe-exit-code.txt\nif [ \"$rc\" = 0 ]; then\n  if [ -s \"$PPE_DIR/qca-nss-ppe.ko\" ]; then\n    modinfo \"$PPE_DIR/qca-nss-ppe.ko\" > results/ppe-modinfo.txt 2>&1\n    echo VERIFIED > results/ppe-products-check.txt\n  else\n    echo 'PPE returned zero without qca-nss-ppe.ko' > results/ppe-products-check.txt\n    echo 91 > results/ppe-exit-code.txt\n  fi\nfi\nexit 0\n"
      id: ppe_build
    - name: Collect all products and audit unresolved symbols
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/collect\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\npython3 <<'PY'\nfrom pathlib import Path\nimport json\nimport os\nimport re\nimport shutil\nimport subprocess\n\nroot = Path.cwd()\nout = root / 'results'\nout.mkdir(exist_ok=True)\nenv = {}\nenvfile = out / 'environment.txt'\nif envfile.exists():\n    env = dict(line.split('=', 1) for line in envfile.read_text().splitlines() if '=' in line)\nssdk = root / 'qsdk-src/qca-ssdk'\nppe = root / 'qsdk-src/qca-nss-ppe/drv/ppe_drv'\ndebug = root / 'qsdk-src/qca-nss-ppe/nss_debug'\n\ndef write(name, lines):\n    (out / name).write_text('\\n'.join(lines) + ('\\n' if lines else ''))\n\ndef rc(name):\n    p = out / (name + '-exit-code.txt')\n    return p.read_text().strip() if p.exists() else 'NOT_RUN'\n\ndef symbols(path):\n    if not path.is_file():\n        return set()\n    return {row.split()[1] for row in path.read_text().splitlines() if len(row.split()) >= 4}\n\nproducts = []\nfor base in (ssdk, root / 'qsdk-src/qca-nss-ppe'):\n    if not base.exists():\n        continue\n    for p in sorted(base.rglob('*')):\n        if p.is_file() and (p.suffix in ('.ko', '.o', '.mod') or p.name in ('Module.symvers', 'modules.order')):\n            rel = p.relative_to(root)\n            dest = out / 'modules' / rel\n            dest.parent.mkdir(parents=True, exist_ok=True)\n            shutil.copy2(p, dest)\n            products.append(f'{rel.as_posix()}\\t{p.stat().st_size}')\nwrite('module-products.txt', products)\n\nssdk_tables = []\nfor p in sorted(ssdk.rglob('Module.symvers')) if ssdk.exists() else []:\n    names = symbols(p)\n    ssdk_tables.append(f'{p.relative_to(root)}\\tbytes={p.stat().st_size}\\texports={len(names)}\\tfal={sum(x.startswith(\"fal_\") for x in names)}')\nwrite('ssdk-symvers-inventory.txt', ssdk_tables)\nexports = symbols(ssdk / 'Module.symvers')\nfal_exports = sorted(x for x in exports if x.startswith('fal_'))\nwrite('ssdk-fal-exports.txt', fal_exports)\nwrite('ssdk-all-exports.txt', sorted(exports))\n\nfor name in ('ssdk', 'nss-debug', 'ppe'):\n    log = out / (name + '-compile.log')\n    lines = log.read_text(errors='replace').splitlines() if log.exists() else []\n    write(name + '-errors.txt', [l for l in lines if re.search(r'error:|fatal error:|undefined!|implicit declaration|No rule to make target|No such file|has no member|incompatible pointer|conflicting types|too few arguments|too many arguments', l, re.I)])\n    if name == 'ppe':\n        write('ppe-modpost-unresolved.txt', [l for l in lines if 'undefined!' in l or 'suppressed' in l and 'unresolved' in l])\n        write('ppe-compile-depth.txt', [l for l in lines if re.search(r'CC \\[M\\]|LD \\[M\\]|MODPOST|\\.ko', l)])\n\n# Runs inside the inherited all-products diagnostic Python block.\nssdk_log = out / 'ssdk-compile.log'\nssdk_lines = ssdk_log.read_text(errors='replace').splitlines() if ssdk_log.exists() else []\ncompiler_error = re.compile(r'\\.(?:c|h):\\d+(?::\\d+)?:\\s+(?:fatal\\s+)?error:')\ncompiler_command = re.compile(r'aarch64[^\\s]*-(?:gcc|cc)\\b.*(?:\\s-c\\s).*\\.c(?:\\s|$)')\nfirst_index = next((i for i, line in enumerate(ssdk_lines) if compiler_error.search(line)), None)\ncompile_commands = [line for line in ssdk_lines if compiler_command.search(line)]\nwrite('ssdk-compiler-commands.txt', compile_commands)\nwrite('ssdk-compile-depth.txt', [line for line in ssdk_lines if re.search(r'CC\\s+\\[M\\]|LD\\s+\\[M\\]|MODPOST|\\.ko', line)])\nif first_index is not None:\n    write('ssdk-first-compiler-error.txt', [f'log_line={first_index + 1}', ssdk_lines[first_index]])\n    write('ssdk-first-compiler-error-context.txt', ssdk_lines[max(0, first_index-20):first_index+41])\n    match = re.search(r'([^\\s:]+\\.(?:c|h)):(\\d+)', ssdk_lines[first_index])\n    if match:\n        name, line_no = match.group(1), int(match.group(2))\n        for candidate in (Path(name), ssdk / 'mk' / name, ssdk / name):\n            candidate = candidate.resolve()\n            if candidate.is_file() and candidate.is_relative_to(ssdk.resolve()):\n                source = candidate.read_text(errors='replace').splitlines()\n                write('ssdk-first-error-source.txt', [str(candidate)] + [f'{i+1}: {source[i]}' for i in range(max(0,line_no-21), min(len(source),line_no+20))])\n                break\nelse:\n    write('ssdk-first-compiler-error.txt', ['No source-positioned compiler error found; inspect ssdk-errors.txt and ssdk-compile.log.'])\nobjects = sorted(p.relative_to(ssdk).as_posix() for p in ssdk.rglob('*.o')) if ssdk.exists() else []\nwrite('ssdk-object-inventory.txt', objects)\nssdk_started = bool(compile_commands or objects or first_index is not None)\nwrite('ssdk-stage31-status.txt', [f'compiler_started={ssdk_started}', f'object_count={len(objects)}', f'first_compiler_error_line={first_index + 1 if first_index is not None else \"NONE\"}', f'make_exit={rc(\"ssdk\")}'])\n\n# An exhaustive strong-undefined-symbol comparison independent of MODPOST's\n# first-ten-errors display limit. This does not replace MODPOST's CRC,\n# namespace and license validation.\nkernel_table = Path(env['KERNEL_DIR']) / 'Module.symvers' if 'KERNEL_DIR' in env else None\navailable = symbols(kernel_table) if kernel_table else set()\nextra_file = out / 'kbuild-extra-symbols.txt'\nextra_paths = extra_file.read_text().splitlines() if extra_file.exists() else []\nfor path in extra_paths:\n    available.update(symbols(Path(path)))\nnm_status = 'NOT_AVAILABLE'\nneeded, missing = set(), set()\nobj = ppe / 'qca-nss-ppe.o'\nif obj.is_file() and 'CROSS_COMPILE' in env:\n    try:\n        proc = subprocess.run([env['CROSS_COMPILE'] + 'nm', '-u', str(obj)], capture_output=True, text=True)\n        (out / 'ppe-nm-undefined.raw.txt').write_text(proc.stdout + proc.stderr)\n        nm_status = str(proc.returncode)\n        if proc.returncode == 0:\n            needed = {parts[-1] for line in proc.stdout.splitlines() if len(parts := line.split()) >= 2 and parts[-2] == 'U'}\n            missing = needed - available\n    except OSError as exc:\n        nm_status = str(exc)\nwrite('ppe-required-symbols.txt', sorted(needed))\nwrite('ppe-unresolved-all.txt', sorted(missing))\nwrite('ppe-fal-resolution.tsv', ['symbol\\tSSDK_exported\\tavailable_to_MODPOST'] + [f'{s}\\t{int(s in exports)}\\t{int(s in available)}' for s in sorted(needed) if s.startswith('fal_')])\n\nfor name in ('tools.log', 'toolchain.log', 'kernel-compile.log'):\n    if (root / name).is_file():\n        shutil.copy2(root / name, out / name)\nif (root / 'openwrt/.config').is_file():\n    shutil.copy2(root / 'openwrt/.config', out / 'openwrt.config')\nif kernel_table and kernel_table.is_file():\n    shutil.copy2(kernel_table, out / 'kernel-Module.symvers')\n    config = kernel_table.parent / '.config'\n    if config.is_file():\n        shutil.copy2(config, out / 'kernel.config')\n\nssdk_modules = sorted(str(p.relative_to(root)) for p in ssdk.rglob('qca-ssdk.ko')) if ssdk.exists() else []\nphy_status_file = out / 'phy-header-status.json'\nphy_status = json.loads(phy_status_file.read_text()) if phy_status_file.exists() else {}\nphy_flag_seen = any('-I' + str(root / 'qsdk-include') in line for line in compile_commands)\nbridge_status_path = out / 'bridge-api/status.json'\nbridge_status = json.loads(bridge_status_path.read_text()) if bridge_status_path.exists() else {}\nprototype_status_file = out / 'stage31-prototypes/status.json'\nprototype_status = json.loads(prototype_status_file.read_text()) if prototype_status_file.exists() else {}\nfallback_file = out / 'ssdk-warning-fallback.txt'\nfallback = fallback_file.read_text().strip() if fallback_file.exists() else 'NOT_RUN'\nmissing_warnings = [line for line in ssdk_lines if 'warning:' in line and ('[-Wmissing-prototypes]' in line or '[-Wmissing-declarations]' in line)]\nwrite('ssdk-missing-prototypes-warnings.txt', missing_warnings)\n# Also capture non-source failures such as assembler, linker, MODPOST and make.\nreal_error = next((line for line in ssdk_lines\n                   if re.search(r'\\berror:|fatal error:|undefined!|No rule to make target|make(?:\\[\\d+\\])?: \\*\\*\\*', line, re.I)\n                   and 'missing-prototypes' not in line\n                   and 'missing-declarations' not in line), None)\nif real_error is None:\n    real_error = next((line for line in ssdk_lines if re.search(r'\\berror:|fatal error:|undefined!|No rule to make target|make(?:\\[\\d+\\])?: \\*\\*\\*', line, re.I)), None)\nwrite('ssdk-first-real-error.txt', [real_error] if real_error else ['No error found; see exit code and full log.'])\n# Preserve skipped/unstarted states rather than inventing failed verifications.\nstep_outcomes = json.loads(os.environ.get('STAGE31_STEPS_JSON', '{}'))\n(out / 'github-step-outcomes.json').write_text(json.dumps(step_outcomes, indent=2) + '\\n')\nmanifest_file = out / 'step-manifest.json'\nmanifest = json.loads(manifest_file.read_text()) if manifest_file.is_file() else [{'id': 'checkout', 'name': 'Checkout'}, {'id': 'initialize', 'name': 'Initialize diagnostics'}, {'id': 'free_disk', 'name': 'Free disk'}, {'id': 'dependencies', 'name': 'Install dependencies'}, {'id': 'baseline', 'name': 'Clone SBE1V1K baseline'}, {'id': 'downloads_cache', 'name': 'Cache OpenWrt downloads'}, {'id': 'qsdk_sources', 'name': 'Fetch exact QSDK sources'}, {'id': 'ssdk_source_inspection', 'name': 'Inspect pinned SSDK source and package build evidence'}, {'id': 'phy_headers', 'name': 'Export pinned PHY headers and verify include parent'}, {'id': 'source_download', 'name': 'Download sources'}, {'id': 'kernel_build', 'name': 'Build OpenWrt kernel'}, {'id': 'kernel_toolchain', 'name': 'Locate kernel and toolchain'}, {'id': 'kernel_symvers', 'name': 'Verify kernel Module.symvers'}, {'id': 'include_flags', 'name': 'Generate QSDK include flags'}, {'id': 'ppe_compat', 'name': 'Apply exact successful Stage12 PPE patch'}, {'id': 'api_probe', 'name': 'Repeat verified Stage12 DSA and vmalloc compile probe'}, {'id': 'nss_debug', 'name': 'Compile QCA NSS Debug'}, {'id': 'bridge_audit', 'name': 'Audit Linux 6.18.39 bridge semantics and patch SSDK'}, {'id': 'bridge_probe', 'name': 'Compile and MODPOST exact Stage16 bridge helper'}, {'id': 'prototypes', 'name': 'Audit pinned declarations and add exact SSDK MIB prototypes'}, {'id': 'ssdk_build', 'name': 'Build exact SSDK through verified mk entry'}, {'id': 'ppe_build', 'name': 'Build PPE with SSDK and NSS Debug exports'}]\nstep_records = []\nfor item in manifest:\n    sid = item['id']\n    context = step_outcomes.get(sid, {})\n    record = dict(item, **context)\n    status_dir = out / 'steps' / sid\n    exit_file = status_dir / 'exit-code.txt'\n    if exit_file.is_file():\n        record['shell_exit'] = exit_file.read_text().strip()\n    failure = status_dir / 'failure.txt'\n    if failure.is_file():\n        record['shell_failure'] = failure.read_text()\n    if sid == 'downloads_cache' and context.get('outcome') == 'failure':\n        record['state'] = 'WARN'\n    elif context.get('outcome') == 'failure' or record.get('shell_exit', '0') != '0':\n        record['state'] = 'FAIL'\n    elif context.get('outcome') == 'success':\n        record['state'] = 'PASS'\n    elif context.get('outcome') == 'cancelled':\n        record['state'] = 'CANCELLED'\n    elif (status_dir / 'state.txt').is_file():\n        record['state'] = (status_dir / 'state.txt').read_text().strip()\n    else:\n        record['state'] = 'NOT_RUN'\n    step_records.append(record)\n(out / 'step-results.json').write_text(json.dumps(step_records, indent=2) + '\\n')\nfirst_failed_step = next((s for s in step_records if s['state'] == 'FAIL' and s['id'] != 'downloads_cache'), None)\nincomplete_steps = [s for s in step_records if s['state'] in ('RUNNING', 'CANCELLED')]\nprototype_state = prototype_status.get('state', 'NOT_RUN')\nif not prototype_status and (out / 'steps/prototypes/state.txt').exists():\n    prototype_state = 'STARTED_WITHOUT_STATUS'\n(out / 'first-failed-step.json').write_text(json.dumps(first_failed_step, indent=2) + '\\n')\nstats = {\n    'prototype_audit_state': prototype_state,\n    'prototype_audit_verified': prototype_status.get('verified'),\n    'prototype_audit_detail': prototype_status,\n    'first_failed_step': first_failed_step,\n    'incomplete_steps': incomplete_steps,\n    'ssdk_strict_exit': rc('ssdk-strict'),\n    'ssdk_warning_fallback': fallback,\n    'ssdk_missing_prototypes_warning_count': len(missing_warnings),\n    'ssdk_first_real_error': real_error,\n    'stage': 31,\n    'bridge_api_state': 'PASS' if bridge_status.get('verified') else ('FAIL' if bridge_status else 'NOT_RUN'),\n    'bridge_api_verified': bridge_status.get('verified'),\n    'bridge_probe_exit': rc('stage16-bridge-probe'),\n    'bridge_probe_ko': (out / 'stage16-bridge-probe/stage16_bridge_probe.ko').is_file(),\n    'phy_commit_required': '16eec6ac35820cb67af59223e8b4c2dba7179655',\n    'phy_header_status': phy_status,\n    'phy_include_in_ssdk_gcc': phy_flag_seen,\n    'purpose': 'Compile probe only; no flashing; inherited MAP-T/DSA compatibility is not runtime validation',\n    'ssdk_commit_required': '717b74016b0c131575bcd81b9e039d3f7974b02a',\n    'kernel_required': '6.18.39',\n    'target': 'IPQ9574/ipq95xx/APPE/arm64',\n    'ssdk_exit': rc('ssdk'), 'nss_debug_exit': rc('nss-debug'), 'ppe_exit': rc('ppe'),\n    'ssdk_modules': ssdk_modules,\n    'ssdk_compiler_started': ssdk_started,\n    'ssdk_object_count': len(objects),\n    'ssdk_source_object_count': sum(p.startswith('src/') and not p.endswith('.mod.o') for p in objects),\n    'ssdk_first_compiler_error': ssdk_lines[first_index] if first_index is not None else None,\n    'ssdk_symvers_bytes': (ssdk / 'Module.symvers').stat().st_size if (ssdk / 'Module.symvers').exists() else 0,\n    'ssdk_export_count': len(exports), 'ssdk_fal_export_count': len(fal_exports),\n    'nss_debug_ko': (debug / 'qca-nss-debug.ko').is_file(),\n    'ppe_ko': (ppe / 'qca-nss-ppe.ko').is_file(),\n    'ppe_linked_object': obj.is_file(),\n    'ppe_source_object_count': sum(1 for p in ppe.glob('*.o') if p.name != 'qca-nss-ppe.o' and not p.name.endswith('.mod.o')),\n    'ppe_all_object_count': len(list(ppe.glob('*.o'))),\n    'extra_symvers': extra_paths, 'symbol_audit_exit': nm_status,\n    'ppe_unresolved_count': len(missing) if nm_status == '0' else None,\n    'ppe_unresolved_fal_count': sum(s.startswith('fal_') for s in missing) if nm_status == '0' else None,\n}\nstats['success'] = bool(first_failed_step is None and not incomplete_steps and stats['prototype_audit_verified'] and stats['bridge_api_verified'] and stats['bridge_probe_exit'] == '0' and stats['bridge_probe_ko'] and phy_status.get('verified') and phy_flag_seen and all(rc(n) == '0' for n in ('ssdk', 'nss-debug', 'ppe')) and ssdk_started and ssdk_modules and fal_exports and stats['ppe_ko'] and stats['nss_debug_ko'] and nm_status == '0' and not missing and str(ssdk / 'Module.symvers') in extra_paths)\n(out / 'stage31-summary.json').write_text(json.dumps(stats, indent=2) + '\\n')\nsummary = ['STAGE 31: ' + ('PASS' if stats['success'] else 'FAIL / INCOMPLETE')]\nsummary += [f'{k}: {v}' for k, v in stats.items()]\nwrite('stage31-summary.txt', summary)\nprint('\\n'.join(summary))\nif os.environ.get('GITHUB_STEP_SUMMARY'):\n    with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:\n        f.write('```text\\n' + '\\n'.join(summary) + '\\n```\\n')\nPY\n"
      if: always()
      env:
        STAGE30_STEPS_JSON: ${{ toJSON(steps) }}
      id: collect
    - name: Upload Stage31 diagnostics and modules
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SBE1V1K-V0.2-QSDK-Stage31
        path: results/
        retention-days: 14
        if-no-files-found: error
      id: upload
    - name: Require real SSDK and PPE module success
      shell: bash
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/require_success\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\npython3 <<'PY'\nimport json\nfrom pathlib import Path\np = Path('results/stage31-summary.json')\nassert p.is_file(), 'Missing Stage31 diagnostics'\ns = json.loads(p.read_text())\nassert s['success'], 'Stage31 compile incomplete; download the uploaded diagnostics'\nPY\n"
      if: always()
      id: require_success
