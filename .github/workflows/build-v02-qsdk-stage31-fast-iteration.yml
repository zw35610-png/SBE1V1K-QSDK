be-exit-code.txt\nset -e\ntest \"$rc\" = 0\ntest -s \"$PROBE/stage16_bridge_probe.ko\"\n\"${CROSS_COMPILE}nm\" -u \"$PROBE/stage16_bridge_probe.ko\" > results/stage16-bridge-probe-undefined.txt\nmodinfo \"$PROBE/stage16_bridge_probe.ko\" > results/stage16-bridge-probe-modinfo.txt\n"
