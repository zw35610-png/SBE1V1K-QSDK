    - name: Export pinned PHY headers and verify include parent
      run: "# Stage31 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE31_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/phy_headers\"\nmkdir -p \"$STAGE31_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE31_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\" \"$STAGE31_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE31_STEP_DIR/console.log\") 2>&1\nstage31_finish() {\n  local stage31_rc=\"$1\" stage31_line=\"$2\" stage31_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage31_rc\" > \"$STAGE31_STEP_DIR/exit-code.txt\"\n  if [ \"$stage31_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE31_STEP_DIR/state.txt\"\n  else\n    printf '%s\\n' FAIL > \"$STAGE31_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage31_line\" \"$stage31_command\" > \"$STAGE31_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage31_rc\"\n}\ntrap 'stage31_finish \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\npython3 <<'PY'\nfrom pathlib import Path\nimport hashlib, json, re, shutil\nroot = Path.cwd()\nphy = root / 'qsdk-src/qca-nss-phy'\nssdk = root / 'qsdk-src/qca-ssdk'\nparent = root / 'qsdk-include'\ndest = parent / 'qca-nss-phy'\ndest.mkdir(parents=True, exist_ok=True)\nout = root / 'results'\n# Qualcomm nss-host c887f125 Build/InstallDev exports nss_ext/*h here.\n# Also export the three linux_std headers directly referenced by SSDK 717b740.\nheaders = sorted((phy / 'nss_ext').glob('*.h')) + [\n    phy / 'linux_std/qcom_phy_lib.h',\n    phy / 'linux_std/clock/qca8k_clk.h',\n    phy / 'linux_std/mdio_ahb/mdio-ahb.h',\n]\nassert headers and len({p.name for p in headers}) == len(headers)\nmanifest = []\nfor p in headers:\n    assert p.is_file(), p\n    shutil.copy2(p, dest / p.name)\n    digest = hashlib.sha256(p.read_bytes()).hexdigest()\n    assert hashlib.sha256((dest / p.name).read_bytes()).hexdigest() == digest\n    manifest.append(f'{digest}  {p.relative_to(phy).as_posix()} -> qca-nss-phy/{p.name}')\nreferences = set()\nfor base in (ssdk, root / 'qsdk-src/qca-nss-ppe'):\n    for p in base.rglob('*'):\n        if p.suffix in ('.c', '.h'):\n            references.update(re.findall(r'#\\s*include\\s*[<\"](qca-nss-phy/[^\">]+)[\">]', p.read_text(errors='replace')))\nassert 'qca-nss-phy/nss_phy_ptp.h' in references\nmissing = sorted(name for name in references if not (parent / name).is_file())\n(out / 'phy-header-manifest.txt').write_text('\\n'.join(manifest) + '\\n')\n(out / 'phy-header-references.txt').write_text('\\n'.join(sorted(references)) + '\\n')\nstatus = {'source_commit': '16eec6ac35820cb67af59223e8b4c2dba7179655',\n          'include_parent': str(parent), 'exported_header_count': len(headers),\n          'missing_headers': missing, 'verified': not missing}\n(out / 'phy-header-status.json').write_text(json.dumps(status, indent=2) + '\\n')\nshutil.copytree(dest, out / 'phy-exported-headers/qca-nss-phy', dirs_exist_ok=True)\nassert not missing, f'Missing real PHY headers: {missing}'\nprint(json.dumps(status, indent=2))\nPY\n"
      id: phy_headers
