name: SBE1V1K QSDK Probe V2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates
          mkdir -p results

      - name: Probe known QSDK repositories
        shell: bash
        run: |
          set +e

          probe() {
            NAME="$1"
            URL="$2"
            HASH="$3"

            echo "========================================"
            echo "NAME: $NAME"
            echo "URL : $URL"
            echo "HASH: $HASH"
            echo "========================================"

            mkdir -p "work/$NAME"

            git ls-remote "$URL" \
              > "results/${NAME}-refs.txt" 2>&1

            grep -i "$HASH" \
              "results/${NAME}-refs.txt" \
              > "results/${NAME}-hash-match.txt" || true

            grep -iE 'NHSS.QSDK.14|QSDK.14|r9' \
              "results/${NAME}-refs.txt" \
              > "results/${NAME}-r9.txt" || true

            git clone --filter=blob:none \
              --no-checkout "$URL" "work/$NAME" \
              > "results/${NAME}-clone.txt" 2>&1

            if [ -d "work/$NAME/.git" ]; then
              cd "work/$NAME"

              git rev-list --all \
                > "../../results/${NAME}-commits.txt" 2>&1

              grep -i "^$HASH" \
                "../../results/${NAME}-commits.txt" \
                > "../../results/${NAME}-commit-match.txt" || true

              git log --all \
                --oneline \
                --decorate \
                --grep='QSDK.14\|r9' \
                -i \
                -n 200 \
                > "../../results/${NAME}-log-r9.txt" 2>&1

              cd ../..
            fi
          }

          probe \
            qca-nss-dp \
            https://github.com/openwrt/qca-nss-dp.git \
            22555a9

          probe \
            qca-nss-ecm \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-ecm.git \
            e978478

          probe \
            qca-nss-netfn \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-netfn.git \
            07fbf1b

          probe \
            qca-nss-ae-clients \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-ae-clients.git \
            b959456

          echo "===== SUMMARY =====" > results/SUMMARY.txt

          for f in results/*-commit-match.txt; do
            echo "" >> results/SUMMARY.txt
            echo "===== $f =====" >> results/SUMMARY.txt
            cat "$f" >> results/SUMMARY.txt
          done

          cat results/SUMMARY.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK-Probe-V2
          path: results/
          retention-days: 7
