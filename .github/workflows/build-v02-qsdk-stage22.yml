            assert h.index(declaration) < h.index(anchor), declaration
        assert c.count('#include "ref_mib.h"') == 1
        assert c.index('#include "ref_mib.h"') < c.index(names[0])
        assert c.replace('\n#include "ref_mib.h"', '', 1) == before['src/ref/ref_mib.c']
        assert init == before['src/init/ssdk_init.c'].replace(extern, '', 1)
        after = {'src/ref/ref_mib.c': c, 'include/ref/ref_mib.h': h, 'src/init/ssdk_init.c': init}
        patch = ''
        for rel, text in after.items():
            (root/rel).write_text(text, newline='\n')
            (out/Path(rel).name).write_text(text)
            patch += ''.join(difflib.unified_diff(before[rel].splitlines(True), text.splitlines(True), fromfile='a/'+rel, tofile='b/'+rel))
        (out/'ssdk-stage22-prototypes.patch').write_text(patch)
        status.update(state='PASS', phase='complete', verified=True, source_sha256=expected, declarations=list(names))
        (out/'status.json').write_text(json.dumps(status, indent=2) + '\n')
        print('Three shared prototypes verified; no function body or linkage changes.')
        PY
      id: prototypes
    - name: Apply Linux 6.18 SFP MDIO-I2C and PHY registration compatibility
      shell: bash
      run: |
        set -euo pipefail
        source results/environment.txt
        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        SRC="$SSDK/src/hsl/phy/sfp_phy.c"
        MDIO_I2C="$KERNEL_DIR/drivers/net/mdio/mdio-i2c.c"
        OUT="$GITHUB_WORKSPACE/results/stage22-sfp-compat"
        mkdir -p "$OUT"
        test -f "$SRC"
        test -f "$MDIO_I2C"
        cp "$SRC" "$OUT/sfp_phy.c.before"

        grep -n -C 8 -E 'qcom_mdio_i2c_data|phy_driver_register|phy_driver_unregister|phy_drivers_register|phy_drivers_unregister' \
          "$SRC" > "$OUT/qca-before-use-sites.txt" || true

        # Verify Linux 6.18's real mdio-i2c private-data ABI before patching.
        grep -n -C 6 -E 'struct i2c_adapter \*i2c = bus->priv|bus->priv = i2c' \
          "$MDIO_I2C" > "$OUT/linux-mdio-i2c-priv-contract.txt" || true
        grep -q -F 'struct i2c_adapter *i2c = bus->priv;' "$MDIO_I2C" || {
          echo "Linux 6.18 mdio-i2c bus->priv contract not verified; refusing patch" >&2
          exit 91
        }

        grep -n -E 'phy_drivers_register|phy_drivers_unregister' \
          "$KERNEL_DIR/include/linux/phy.h" > "$OUT/linux-phy-registration-api.txt"
        grep -q 'int phy_drivers_register' "$KERNEL_DIR/include/linux/phy.h"
        grep -q 'void phy_drivers_unregister' "$KERNEL_DIR/include/linux/phy.h"

        python3 - <<'PY'
        from pathlib import Path
        p = Path("qsdk-src/qca-ssdk/src/hsl/phy/sfp_phy.c")
        t = p.read_text()
        repl = [
          ("struct qcom_mdio_i2c_data *bus_priv;",
           "struct i2c_adapter *bus_priv;"),
          ("i2c_transfer(bus_priv->i2c, msgs, ARRAY_SIZE(msgs))",
           "i2c_transfer(bus_priv, msgs, ARRAY_SIZE(msgs))"),
          ("phy_driver_register(&sfp_phy_driver, THIS_MODULE)",
           "phy_drivers_register(&sfp_phy_driver, 1, THIS_MODULE)"),
          ("phy_driver_unregister(&sfp_phy_driver)",
           "phy_drivers_unregister(&sfp_phy_driver, 1)"),
        ]
        for old, new in repl:
            n = t.count(old)
            if n != 1:
                raise SystemExit(f"Refusing non-exact SFP patch: expected 1, got {n}: {old}")
            t = t.replace(old, new, 1)
        p.write_text(t)
        PY

        cp "$SRC" "$OUT/sfp_phy.c.after"
        git -C "$SSDK" diff -- src/hsl/phy/sfp_phy.c > "$OUT/sfp-phy-stage22.patch"
        grep -n -C 8 -E 'i2c_adapter \*bus_priv|i2c_transfer\(bus_priv|phy_drivers_register|phy_drivers_unregister' \
          "$SRC" > "$OUT/qca-after-use-sites.txt"

        cat > "$OUT/semantic-note.txt" <<'EOF'
        No qcom_mdio_i2c_data layout was invented.
        Linux 6.18 mdio-i2c uses struct i2c_adapter * directly as mii_bus->priv.
        QSDK SFP EEPROM I2C access is adapted to that verified contract.
        The single PHY driver uses exported plural registration APIs with n=1.
        Compile validation only; SFP/Combo-port runtime testing is still required.
        EOF
      id: sfp_compat

