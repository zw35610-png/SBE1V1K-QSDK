        expected = {'include/ref/ref_mib.h': '0727c3d0e155570151445cd4237d46caf1f77a8b05e3606dad2b9f3ef5a68b13', 'src/init/ssdk_init.c': '97f7606b99b5bf78e0ba48ea3d7b0a6bc8ada4e62c8b0c9bcc15c381288393ec', 'src/ref/ref_mib.c': '8526b0d13e650e0d6148b0d6bbb3c24177aa69a008d9dd5dedd4d736f7790e42'}
        names = ('_qca_ar8327_sw_capture_port_tx_counter',
                 '_qca_ar8327_sw_capture_port_rx_counter', 'qca_ar8327_sw_mib_task')
        status = {'state': 'RUNNING', 'phase': 'source_preflight', 'source_root': str(root), 'verified': False, 'method': 'shared exact prototypes; unchanged bodies and linkage'}
        (out/'status.json').write_text(json.dumps(status, indent=2))
