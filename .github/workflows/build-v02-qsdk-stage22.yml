    - name: Build PPE with SSDK and NSS Debug exports
      shell: bash
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/ppe_build"
        mkdir -p "$STAGE22_STEP_DIR"
