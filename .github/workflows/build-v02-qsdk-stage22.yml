    - name: Locate kernel and toolchain
      shell: bash
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/kernel_toolchain"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        mapfile -t kernels < <(find "$GITHUB_WORKSPACE/openwrt/build_dir" -type d -path '*/linux-qualcommbe_ipq95xx/linux-6.18.39')
        test "${#kernels[@]}" = 1
        KERNEL_DIR="${kernels[0]}"
        mapfile -t compilers < <(find -L "$GITHUB_WORKSPACE/openwrt/staging_dir" -path '*/toolchain-aarch64*/bin/aarch64-openwrt-linux-musl-gcc' -type f)
        test "${#compilers[@]}" = 1
        GCC="${compilers[0]}"
        TOOLCHAIN_DIR="$(dirname "$(dirname "$GCC")")"
        CROSS_COMPILE="${GCC%gcc}"
        test -x "$GCC"
        grep -q 'CONFIG_TARGET_qualcommbe_ipq95xx=y' openwrt/.config
        grep -q 'CONFIG_ARM64=y' "$KERNEL_DIR/.config"
        grep -q 'CONFIG_MODULES=y' "$KERNEL_DIR/.config"
        grep -Eq '"6\.18\.39(["-])' "$KERNEL_DIR/include/generated/utsrelease.h"
        {
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          echo "GCC=$GCC"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
        } | tee results/environment.txt
        "$GCC" --version > results/compiler-version.txt
        cat "$KERNEL_DIR/include/generated/utsrelease.h" > results/kernel-version.txt
        git -C openwrt rev-parse HEAD > results/openwrt-commit.txt
      id: kernel_toolchain
