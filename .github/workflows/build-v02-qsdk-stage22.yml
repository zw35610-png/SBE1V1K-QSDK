        hash_checks = []
        def audit_failure(exc_type, exc, tb):
            status.update(state='FAIL', verified=False, error_type=exc_type.__name__, error=str(exc))
            (out/'status.json').write_text(json.dumps(status, indent=2) + '\n')
            (out/'failure.txt').write_text(''.join(traceback.format_exception(exc_type, exc, tb)))
            sys.__excepthook__(exc_type, exc, tb)
        sys.excepthook = audit_failure
        required_commit = '717b74016b0c131575bcd81b9e039d3f7974b02a'
        status['required_commit'] = required_commit
        if not root.is_dir():
            raise RuntimeError(f'SSDK source directory missing: {root}')
        actual_commit = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
        status['actual_commit'] = actual_commit
        (out/'status.json').write_text(json.dumps(status, indent=2) + '\n')
        if actual_commit != required_commit:
            raise RuntimeError(f'SSDK commit mismatch: expected={required_commit}; actual={actual_commit}')
        status['phase'] = 'source_hashes'
        before = {}
        for rel, digest in expected.items():
            p = root/rel
            raw = p.read_bytes()
            actual = hashlib.sha256(raw).hexdigest()
            blob = subprocess.check_output(['git', '-C', str(root), 'show', required_commit + ':' + rel])
            blob_digest = hashlib.sha256(blob).hexdigest()
            hash_checks.append(dict(path=rel, expected_git_blob_sha256=digest, actual_sha256=actual,
                                    git_blob_sha256=blob_digest, crlf_count=raw.count(b'\r\n'),
                                    matches_blob=raw == blob))
            (out/'hash-checks.json').write_text(json.dumps(hash_checks, indent=2) + '\n')
            assert blob_digest == digest, f'Pinned blob hash differs: {rel}'
            assert actual == digest, f'Unexpected pinned source: {rel}; expected={digest}; actual={actual}'
            before[rel] = p.read_text()
            (out/(p.name + '.before')).write_text(before[rel])
        status['phase'] = 'declarations_and_uses'
        hits = []
        paths = {name: set() for name in names}
        for p in sorted(root.rglob('*')):
            if p.suffix not in ('.c', '.h') or '.git' in p.parts:
                continue
            for i, line in enumerate(p.read_text(errors='replace').splitlines(), 1):
                for name in names:
                    if re.search(r'\b' + re.escape(name) + r'\b', line):
                        rel = p.relative_to(root).as_posix()
