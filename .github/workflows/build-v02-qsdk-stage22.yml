# Compile probe only; no firmware image creation, module loading or flashing.
name: SBE1V1K V0.2 QSDK Stage22 preparation diagnostics and SSDK prototypes
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      id: checkout
    - name: Initialize diagnostics
      shell: bash
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/initialize"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        mkdir -p results
        cat > results/step-manifest.json <<'STAGE22_MANIFEST'
        [
          {
            "id": "checkout",
            "name": "Checkout"
          },
          {
            "id": "initialize",
            "name": "Initialize diagnostics"
          },
          {
            "id": "free_disk",
            "name": "Free disk"
          },
          {
            "id": "dependencies",
            "name": "Install dependencies"
          },
          {
            "id": "baseline",
            "name": "Clone SBE1V1K baseline"
          },
          {
            "id": "downloads_cache",
            "name": "Cache OpenWrt downloads"
          },
          {
            "id": "qsdk_sources",
            "name": "Fetch exact QSDK sources"
          },
          {
            "id": "ssdk_source_inspection",
            "name": "Inspect pinned SSDK source and package build evidence"
          },
          {
            "id": "phy_headers",
            "name": "Export pinned PHY headers and verify include parent"
          },
          {
            "id": "source_download",
            "name": "Download sources"
          },
          {
            "id": "kernel_build",
            "name": "Build OpenWrt kernel"
          },
          {
            "id": "kernel_toolchain",
            "name": "Locate kernel and toolchain"
          },
          {
            "id": "kernel_symvers",
            "name": "Verify kernel Module.symvers"
          },
          {
            "id": "include_flags",
            "name": "Generate QSDK include flags"
          },
          {
            "id": "ppe_compat",
            "name": "Apply exact successful Stage12 PPE patch"
          },
          {
            "id": "api_probe",
            "name": "Repeat verified Stage12 DSA and vmalloc compile probe"
          },
          {
            "id": "nss_debug",
            "name": "Compile QCA NSS Debug"
          },
          {
            "id": "bridge_audit",
            "name": "Audit Linux 6.18.39 bridge semantics and patch SSDK"
          },
          {
            "id": "bridge_probe",
            "name": "Compile and MODPOST exact Stage16 bridge helper"
          },
          {
            "id": "prototypes",
            "name": "Audit pinned declarations and add exact SSDK MIB prototypes"
          },
          {
            "id": "ssdk_build",
            "name": "Build exact SSDK through verified mk entry"
          },
          {
            "id": "ppe_build",
            "name": "Build PPE with SSDK and NSS Debug exports"
          }
        ]
        STAGE22_MANIFEST
        printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\nworkflow_ref=%s\nworkflow_sha=%s\n' \
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
          "$GITHUB_WORKFLOW_REF" "$GITHUB_WORKFLOW_SHA" > results/run-context.txt
        mkdir -p results/workflow-source
        if [ -d .github/workflows ]; then
          cp -a .github/workflows/. results/workflow-source/
        fi
      id: initialize
    - name: Free disk
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/free_disk"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo apt-get clean
        df -h
      id: free_disk
    - name: Install dependencies
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/dependencies"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib gettext git libncurses-dev \
          libssl-dev python3-setuptools rsync swig \
          unzip zlib1g-dev file wget curl jq bc kmod
      id: dependencies
    - name: Clone SBE1V1K baseline
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/baseline"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        git clone \
          https://github.com/luckkyboy/SBE1V1K.git \
          openwrt

        cd openwrt

        git checkout \
          02fb9517c9aefac9f3825a15ae46e7998bae7edd

        cp configs/sbe1v1k.config .config

        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig
      id: baseline
    - name: Cache OpenWrt downloads
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: sbe1v1k-stage22-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          sbe1v1k-stage20-${{ runner.os }}-
          sbe1v1k-stage19-${{ runner.os }}-
          sbe1v1k-stage18-${{ runner.os }}-
          sbe1v1k-stage17-${{ runner.os }}-
          sbe1v1k-stage16-${{ runner.os }}-
          sbe1v1k-stage15-${{ runner.os }}-
          sbe1v1k-stage14-${{ runner.os }}-
          sbe1v1k-stage13-${{ runner.os }}-
          sbe1v1k-stage12-${{ runner.os }}-
          sbe1v1k-openwrt-dl-${{ runner.os }}-
      id: downloads_cache
    - name: Fetch exact QSDK sources
      shell: bash
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/qsdk_sources"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -e

        mkdir -p qsdk-src results

        git clone \
          https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
          qsdk-src/qca-nss-ppe

        git -C qsdk-src/qca-nss-ppe checkout \
          87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

        git clone \
          https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
          qsdk-src/qca-ssdk

        git -C qsdk-src/qca-ssdk checkout \
          717b74016b0c131575bcd81b9e039d3f7974b02a

        {
          echo "PPE=$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)"
          echo "SSDK=$(git -C qsdk-src/qca-ssdk rev-parse HEAD)"
        } | tee results/qsdk-commits.txt

        test "$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)" = 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5
        test "$(git -C qsdk-src/qca-ssdk rev-parse HEAD)" = 717b74016b0c131575bcd81b9e039d3f7974b02a
        git clone https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git qsdk-src/qca-nss-phy
        git -C qsdk-src/qca-nss-phy checkout --detach 16eec6ac35820cb67af59223e8b4c2dba7179655
        test "$(git -C qsdk-src/qca-nss-phy rev-parse HEAD)" = 16eec6ac35820cb67af59223e8b4c2dba7179655
        echo "PHY=$(git -C qsdk-src/qca-nss-phy rev-parse HEAD)" >> results/qsdk-commits.txt
        git -C qsdk-src/qca-nss-phy log -1 --format=fuller > results/phy-source-commit.txt
        git -C qsdk-src/qca-nss-phy ls-tree -r --name-only HEAD > results/phy-source-tree.txt
      id: qsdk_sources
    - name: Inspect pinned SSDK source and package build evidence
      run: "# Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.\nSTAGE22_STEP_DIR=\"$GITHUB_WORKSPACE/results/steps/ssdk_source_inspection\"\
        \nmkdir -p \"$STAGE22_STEP_DIR\"\nprintf '%s\\n' RUNNING > \"$STAGE22_STEP_DIR/state.txt\"\ncp \"${BASH_SOURCE[0]}\"\
        \ \"$STAGE22_STEP_DIR/script.sh\"\nexec > >(tee \"$STAGE22_STEP_DIR/console.log\") 2>&1\nstage22_finish() {\n  local\
        \ stage22_rc=\"$1\" stage22_line=\"$2\" stage22_command=\"$3\"\n  trap - EXIT\n  printf '%s\\n' \"$stage22_rc\" >\
        \ \"$STAGE22_STEP_DIR/exit-code.txt\"\n  if [ \"$stage22_rc\" -eq 0 ]; then\n    printf '%s\\n' PASS > \"$STAGE22_STEP_DIR/state.txt\"\
        \n  else\n    printf '%s\\n' FAIL > \"$STAGE22_STEP_DIR/state.txt\"\n    printf 'line=%s\\ncommand=%s\\n' \"$stage22_line\"\
        \ \"$stage22_command\" > \"$STAGE22_STEP_DIR/failure.txt\"\n  fi\n  exit \"$stage22_rc\"\n}\ntrap 'stage22_finish\
        \ \"$?\" \"$LINENO\" \"$BASH_COMMAND\"' EXIT\n# Original step body follows.\nset -euo pipefail\nSSDK=\"$GITHUB_WORKSPACE/qsdk-src/qca-ssdk\"\
        \nmkdir -p results/ssdk-source-context\ngit -C \"$SSDK\" ls-tree -r --name-only HEAD > results/ssdk-source-tree.txt\n\
        git -C \"$SSDK\" log -1 --format=fuller > results/ssdk-source-commit.txt\nfind \"$SSDK\" -path \"$SSDK/.git\" -prune\
        \ -o -type f \\( -iname '*makefile*' -o -name '*.mk' -o -name '*build*.sh' -o -name 'make.sh' -o -name 'Kbuild' \\\
        ) -print | sort > results/ssdk-build-entry-inventory.txt\ncp -a \"$SSDK/mk\" results/ssdk-source-context/\ncat > results/ssdk-source-context/QSDK-package-Makefile\
        \ <<'QSDK_PACKAGE'\n\ninclude $(TOPDIR)/rules.mk\ninclude $(INCLUDE_DIR)/kernel.mk\n\nPKG_NAME:=qca-ssdk\nPKG_SOURCE_PROTO:=git\n\
        PKG_BRANCH:=master\nPKG_RELEASE:=1\n\nifeq ($(CONFIG_TARGET_ipq),y)\n\tsubtarget:=$(SUBTARGET)\nelse\n\tsubtarget:=$(CONFIG_TARGET_BOARD)\n\
        endif\n\nifneq (, $(findstring _64, $(subtarget)))\n\thal_arch:=$(subst _64,,$(subtarget))\nelse ifneq (, $(findstring\
        \ _32, $(subtarget)))\n\thal_arch:=$(subst _32,,$(subtarget))\nelse\n\thal_arch:=$(subtarget)\nendif\n\ninclude $(INCLUDE_DIR)/local-development.mk\n\
        ifeq ($(DUMP)$(PKG_VERSION),)\n\tPKG_VERSION:=$(shell git ls-remote $(PKG_SOURCE_URL) $(PKG_BRANCH) | cut -b -7)\n\
        endif\n\nLOCAL_VARIANT=$(patsubst qca-ssdk-%,%,$(patsubst qca-ssdk-%,%,$(BUILD_VARIANT)))\ninclude $(INCLUDE_DIR)/package.mk\n\
        \ndefine KernelPackage/qca-ssdk/default-nohnat\n  SECTION:=kernel\n  CATEGORY:=Kernel modules\n  SUBMENU:=Network\
        \ Devices\n  TITLE:=Kernel driver for QCA SSDK\n  FILES:=$(PKG_BUILD_DIR)/build/bin/qca-ssdk.ko\n  AUTOLOAD:=$(call\
        \ AutoLoad,30,qca-ssdk)\n  PROVIDES:=qca-ssdk\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat\n$(call KernelPackage/qca-ssdk/default-nohnat)\n\
        \  DEPENDS:=@!(TARGET_ipq_ipq40xx||TARGET_ipq40xx)||TARGET_ar71xx \\\n\t+kmod-qca-nss-phy\n  VARIANT:=nohnat\n\n \
        \ ifneq (, $(findstring $(hal_arch), \"ipq50xx\"))\n    ifeq (, $(CONFIG_LOWMEM_FLASH))\n      ifneq ($(LINUX_VERSION),$(filter\
        \ 5.4%,$(LINUX_VERSION)))\n      DEPENDS+=kmod-ipt-filter +kmod-ppp\n      QCASSDK_CONFIG_OPTS+= HNAT_FEATURE=enable\n\
        \      endif\n    endif\n  endif\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat/Description\nThis package contains\
        \ a qca-ssdk driver for QCA chipset\nendef\n\ndefine KernelPackage/qca-ssdk-hnat\n$(call KernelPackage/qca-ssdk/default-nohnat)\n\
        \  DEPENDS:=@TARGET_ipq_ipq40xx||TARGET_ipq40xx||TARGET_ar71xx||TARGET_ipq806x +kmod-ipt-extra \\\n\t  +kmod-ipt-filter\
        \ +(TARGET_ipq806x||TARGET_ipq):kmod-qca-rfs +kmod-ppp\n  TITLE+= (hnat)\n  VARIANT:=hnat\nendef\n\ndefine KernelPackage/qca-ssdk-hnat/Description\n\
        This package contains a qca-ssdk-hnat driver for QCA chipset\nendef\n\nGCC_VERSION=$(shell echo \"$(CONFIG_GCC_VERSION)\"\
        \ | sed 's/[^0-9.]*\\([0-9.]*\\).*/\\1/')\nifeq ($(GCC_VERSION), 4.8)\n\tGCC_VERSION=4.8.3\nendif\n\nifdef CONFIG_TOOLCHAIN_BIN_PATH\n\
        \tTOOLCHAIN_BIN_PATH=$(CONFIG_TOOLCHAIN_BIN_PATH)\nelse\n\tTOOLCHAIN_BIN_PATH=$(TOOLCHAIN_DIR)/bin\nendif\n\nifdef\
        \ CONFIG_TARGET_NAME\n\tQCASSDK_CONFIG_OPTS+= \\\n\t\t\t      TARGET_NAME=$(CONFIG_TARGET_NAME)\nelse ifneq ($(CONFIG_ARCH),)\n\
        \tQCASSDK_CONFIG_OPTS+= \\\n\t\t\t      TARGET_NAME=$(subst \",,$(CONFIG_ARCH))-openwrt-linux$(if $(CONFIG_TARGET_SUFFIX),-$(subst\
        \ \",,$(CONFIG_TARGET_SUFFIX)))\nendif\n\nQCASSDK_CONFIG_OPTS+= TOOL_PATH=$(TOOLCHAIN_BIN_PATH) \\\n             \
        \   SYS_PATH=$(LINUX_DIR) \\\n                TOOLPREFIX=$(TARGET_CROSS) \\\n                KVER=$(LINUX_VERSION)\
        \ \\\n                ARCH=$(LINUX_KARCH) \\\n\t\tTARGET_SUFFIX=$(CONFIG_TARGET_SUFFIX) \\\n\t\tGCC_VERSION=$(GCC_VERSION)\
        \ \\\n\t\tSoC=$(hal_arch) \\\n\t\tCFLAGS=-I$(STAGING_DIR)/usr/include\n\nifeq ($(LOCAL_VARIANT),hnat)\n    QCASSDK_CONFIG_OPTS+=\
        \ HNAT_FEATURE=enable\n    ifeq ($(CONFIG_TARGET_ar71xx),)\n    \tQCASSDK_CONFIG_OPTS+= RFS_FEATURE=enable\n    endif\n\
        endif\n\nifneq (, $(findstring $(hal_arch), \"ipq95xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=APPE\nelse ifneq (, $(findstring\
        \ $(hal_arch), \"ipq807x\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=HPPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq60xx\"\
        ))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=CPPE\nelse ifneq (, $(findstring $(hal_arch), \"ipq50xx\"))\n\tQCASSDK_CONFIG_OPTS+=\
        \ CHIP_TYPE=MP\nelse ifneq (, $(findstring $(hal_arch), \"ipq53xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=MPPE\nelse\
        \ ifneq (, $(findstring $(hal_arch), \"ipq54xx\"))\n\tQCASSDK_CONFIG_OPTS+= CHIP_TYPE=MRPPE\nendif\n\nifneq (, $(findstring\
        \ $(CONFIG_KERNEL_IPQ_MEM_PROFILE), 256)$(CONFIG_LOWMEM_FLASH))\n\tQCASSDK_CONFIG_OPTS+= MINI_SSDK=enable\n\tifeq\
        \ ($(CONFIG_LOWMEM_FLASH),y)\n\t\tQCASSDK_CONFIG_OPTS+= LOWMEM_FLASH=enable\n\tendif\nendif\n\ndefine Build/InstallDev\n\
        \t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/api\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/ref\n\
        \t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/fal\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/sal\n\t$(INSTALL_DIR) $(1)/usr/include/qca-ssdk/init\n\
        \t$(CP) -rf $(PKG_BUILD_DIR)/include/api/sw_ioctl.h $(1)/usr/include/qca-ssdk/api\n\tif [ -f $(PKG_BUILD_DIR)/include/ref/ref_vsi.h\
        \ ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_vsi.h $(1)/usr/include/qca-ssdk/ref/; \\\n\tfi\n\tif [\
        \ -f $(PKG_BUILD_DIR)/include/ref/ref_fdb.h ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_fdb.h $(1)/usr/include/qca-ssdk/ref/;\
        \ \\\n\tfi\n\tif [ -f $(PKG_BUILD_DIR)/include/ref/ref_port_ctrl.h ]; then \\\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/ref/ref_port_ctrl.h\
        \ $(1)/usr/include/qca-ssdk/ref/; \\\n\tfi\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/init $(1)/usr/include/qca-ssdk\n\t\
        $(CP) -rf $(PKG_BUILD_DIR)/include/fal $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/common/*.h\
        \ $(1)/usr/include/qca-ssdk\n\t$(CP) -rf $(PKG_BUILD_DIR)/include/sal/os/linux/*.h $(1)/usr/include/qca-ssdk\n\t$(CP)\
        \ -rf $(PKG_BUILD_DIR)/include/sal/os/*.h $(1)/usr/include/qca-ssdk\n\nendef\n\nLNX_CONFIG_OPTS :=\n\nifneq (, $(findstring\
        \ $(hal_arch), \"ipq807x\" \"ipq60xx\" \"ipq95xx\" \"ipq53xx\"))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)'\
        \ MODULE_TYPE=KSLIB modules\nelse ifeq ($(LINUX_VERSION), $(filter 6.1%, $(LINUX_VERSION)))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)'\
        \ MODULE_TYPE=KSLIB modules\nelse ifeq ($(LINUX_VERSION), $(filter 6.6%, $(LINUX_VERSION)))\nLNX_CONFIG_OPTS += LNX_MAKEOPTS='$(KERNEL_MAKEOPTS)'\
        \ MODULE_TYPE=KSLIB modules\nendif\n\ndefine Build/Compile\n\t$(MAKE) -C $(PKG_BUILD_DIR)/mk $(strip $(QCASSDK_CONFIG_OPTS))\
        \ $(LNX_CONFIG_OPTS)\nendef\n\ndefine KernelPackage/qca-ssdk-nohnat/install\n\t$(INSTALL_DIR) $(1)/etc/init.d\n\t\
        $(INSTALL_BIN) ./files/qca-ssdk $(1)/etc/init.d/qca-ssdk\nendef\n\ndefine KernelPackage/qca-ssdk-hnat/install\n\t\
        $(INSTALL_DIR) $(1)/etc/init.d\n\t$(INSTALL_BIN) ./files/qca-ssdk $(1)/etc/init.d/qca-ssdk\nendef\n\n$(eval $(call\
        \ KernelPackage,qca-ssdk-nohnat))\n$(eval $(call KernelPackage,qca-ssdk-hnat))\nQSDK_PACKAGE\ncat > results/ssdk-build-provenance.txt\
        \ <<'PROVENANCE'\nSource: https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git\nSource commit: 717b74016b0c131575bcd81b9e039d3f7974b02a\n\
        Package: https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ssdk.git\nPackage reference commit: c7ebac1882395c7ee35453cde6775c7026b813b8\n\
