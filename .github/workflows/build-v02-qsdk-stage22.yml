                 'int _qca_ar8327_sw_capture_port_tx_counter(a_uint32_t dev_id, int port);\n'
                 'int _qca_ar8327_sw_capture_port_rx_counter(a_uint32_t dev_id, int port);\n'
                 'void qca_ar8327_sw_mib_task(struct qca_phy_priv *priv);\n\n')
