    - name: Export pinned PHY headers and verify include parent
      run: |
        # Stage22 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE22_STEP_DIR="$GITHUB_WORKSPACE/results/steps/phy_headers"
        mkdir -p "$STAGE22_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE22_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE22_STEP_DIR/script.sh"
        exec > >(tee "$STAGE22_STEP_DIR/console.log") 2>&1
        stage22_finish() {
          local stage22_rc="$1" stage22_line="$2" stage22_command="$3"
          trap - EXIT
          printf '%s\n' "$stage22_rc" > "$STAGE22_STEP_DIR/exit-code.txt"
          if [ "$stage22_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE22_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE22_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage22_line" "$stage22_command" > "$STAGE22_STEP_DIR/failure.txt"
          fi
          exit "$stage22_rc"
        }
        trap 'stage22_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        python3 <<'PY'
        from pathlib import Path
        import hashlib, json, re, shutil
        root = Path.cwd()
        phy = root / 'qsdk-src/qca-nss-phy'
        ssdk = root / 'qsdk-src/qca-ssdk'
        parent = root / 'qsdk-include'
        dest = parent / 'qca-nss-phy'
        dest.mkdir(parents=True, exist_ok=True)
        out = root / 'results'
        # Qualcomm nss-host c887f125 Build/InstallDev exports nss_ext/*h here.
        # Also export the three linux_std headers directly referenced by SSDK 717b740.
        headers = sorted((phy / 'nss_ext').glob('*.h')) + [
            phy / 'linux_std/qcom_phy_lib.h',
            phy / 'linux_std/clock/qca8k_clk.h',
            phy / 'linux_std/mdio_ahb/mdio-ahb.h',
        ]
        assert headers and len({p.name for p in headers}) == len(headers)
        manifest = []
        for p in headers:
            assert p.is_file(), p
            shutil.copy2(p, dest / p.name)
            digest = hashlib.sha256(p.read_bytes()).hexdigest()
            assert hashlib.sha256((dest / p.name).read_bytes()).hexdigest() == digest
            manifest.append(f'{digest}  {p.relative_to(phy).as_posix()} -> qca-nss-phy/{p.name}')
        references = set()
        for base in (ssdk, root / 'qsdk-src/qca-nss-ppe'):
            for p in base.rglob('*'):
                if p.suffix in ('.c', '.h'):
                    references.update(re.findall(r'#\s*include\s*[<"](qca-nss-phy/[^">]+)[">]', p.read_text(errors='replace')))
        assert 'qca-nss-phy/nss_phy_ptp.h' in references
        missing = sorted(name for name in references if not (parent / name).is_file())
        (out / 'phy-header-manifest.txt').write_text('\n'.join(manifest) + '\n')
        (out / 'phy-header-references.txt').write_text('\n'.join(sorted(references)) + '\n')
        status = {'source_commit': '16eec6ac35820cb67af59223e8b4c2dba7179655',
                  'include_parent': str(parent), 'exported_header_count': len(headers),
                  'missing_headers': missing, 'verified': not missing}
        (out / 'phy-header-status.json').write_text(json.dumps(status, indent=2) + '\n')
        shutil.copytree(dest, out / 'phy-exported-headers/qca-nss-phy', dirs_exist_ok=True)
        assert not missing, f'Missing real PHY headers: {missing}'
        print(json.dumps(status, indent=2))
        PY
      id: phy_headers
