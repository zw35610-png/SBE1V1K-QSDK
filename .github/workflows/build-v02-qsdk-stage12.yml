name: SBE1V1K V0.2 QSDK Stage12 VLAN DSA Compat

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: mkdir -p results

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq bc

      - name: Clone SBE1V1K baseline
        run: |
          git clone \
            https://github.com/luckkyboy/SBE1V1K.git \
            openwrt

          cd openwrt

          git checkout \
            02fb9517c9aefac9f3825a15ae46e7998bae7edd

          cp configs/sbe1v1k.config .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: sbe1v1k-stage12-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            sbe1v1k-stage12-${{ runner.os }}-
            sbe1v1k-stage11-${{ runner.os }}-
            sbe1v1k-stage10-${{ runner.os }}-
            sbe1v1k-stage9-${{ runner.os }}-
            sbe1v1k-openwrt-dl-${{ runner.os }}-

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build OpenWrt kernel
        shell: bash
        run: |
          set -o pipefail
          cd openwrt

          make tools/install -j$(nproc) \
            2>&1 | tee ../tools.log

          make toolchain/install -j$(nproc) \
            2>&1 | tee ../toolchain.log

          make target/linux/compile -j$(nproc) \
            2>&1 | tee ../kernel-compile.log

      - name: Fetch exact QSDK sources
        shell: bash
        run: |
          set -e

          mkdir -p qsdk-src results

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
            qsdk-src/qca-nss-ppe

          git -C qsdk-src/qca-nss-ppe checkout \
            87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
            qsdk-src/qca-ssdk

          git -C qsdk-src/qca-ssdk checkout \
            717b74016b0c131575bcd81b9e039d3f7974b02a

          {
            echo "PPE=$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)"
            echo "SSDK=$(git -C qsdk-src/qca-ssdk rev-parse HEAD)"
          } | tee results/qsdk-commits.txt

      - name: Locate kernel and toolchain
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/build_dir" \
            -type d \
            -path '*/linux-*/linux-6.18.39' \
            -print -quit)

          TOOLCHAIN_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/staging_dir" \
            -maxdepth 1 \
            -type d \
            -name 'toolchain-aarch64*' \
            -print -quit)

          GCC=$(find \
            "$TOOLCHAIN_DIR/bin" \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -print -quit)

          CROSS_PREFIX="${GCC%gcc}"

          {
            echo "KERNEL_DIR=$KERNEL_DIR"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "GCC=$GCC"
            echo "CROSS_COMPILE=$CROSS_PREFIX"
          } | tee results/environment.txt

          test -d "$KERNEL_DIR"
          test -x "$GCC"

      - name: Verify kernel Module.symvers
        shell: bash
        run: |
          set +e

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          {
            echo "===== KERNEL BUILD CHECK ====="
            echo "Kernel: $KERNEL_DIR"
            echo ""

            if [ -s "$KERNEL_DIR/Module.symvers" ]; then
              echo "Module.symvers: PRESENT"
              echo -n "Lines: "
              wc -l < "$KERNEL_DIR/Module.symvers"
              echo -n "Size: "
              stat -c '%s bytes' "$KERNEL_DIR/Module.symvers"
            else
              echo "Module.symvers: MISSING OR EMPTY"
            fi
          } | tee results/kernel-symvers-check.txt

      - name: Generate QSDK include flags
        shell: bash
        run: |
          set -e

          SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
          PPE="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe"

          test -f "$SSDK/include/fal/fal_rss_hash.h"
          test -f "$SSDK/include/sal/os/aos_mem.h"
          test -f "$PPE/nss_debug/exports/nss_debug.h"

          find "$SSDK" \
            -type f \
            -name '*.h' \
            -printf '%h\n' \
            | sort -u \
            > results/ssdk-header-dirs.txt

          : > results/qsdk-header-flags.txt

          printf -- '-I%s ' "$SSDK/include" \
            >> results/qsdk-header-flags.txt

          while IFS= read -r DIR
          do
            printf -- '-I%s ' "$DIR" \
              >> results/qsdk-header-flags.txt
          done < results/ssdk-header-dirs.txt

          printf -- '-I%s ' \
            "$PPE/nss_debug/exports" \
            >> results/qsdk-header-flags.txt

          printf -- '%s ' \
            '-Wno-error=ignored-qualifiers' \
            '-Wno-error=missing-prototypes' \
            '-Wno-error=shift-count-overflow' \
            >> results/qsdk-header-flags.txt

      - name: Apply Linux 6.18 DSA compatibility
        shell: bash
        run: |
          set -e

          PPE="qsdk-src/qca-nss-ppe/drv/ppe_drv"

          find "$PPE" \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 \
            | xargs -0 sed -i \
              's/dsa_slave_dev_check/dsa_user_dev_check/g'

          {
            echo "===== DSA USER API ====="

            grep -Rni \
              'dsa_user_dev_check' \
              "$PPE" \
              --include='*.c' \
              --include='*.h' || true

          } > results/dsa-compat.txt

      - name: Apply Linux 6.18 platform remove compatibility
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("qsdk-src/qca-nss-ppe/drv/ppe_drv/ppe_drv.c")
          s = p.read_text()

          m = re.search(
              r'\.remove\s*=\s*([A-Za-z_][A-Za-z0-9_]*)',
              s
          )

          if not m:
              print("No .remove callback found")
              raise SystemExit(0)

          fn = m.group(1)
          print("remove callback:", fn)

          pattern = re.compile(
              r'(static\s+)int(\s+' +
              re.escape(fn) +
              r'\s*\(\s*struct\s+platform_device\s*\*\s*'
              r'[A-Za-z_][A-Za-z0-9_]*\s*\))'
          )

          s2, n = pattern.subn(
              r'\1void\2',
              s,
              count=1
          )

          if n:
              start = s2.find("static void " + fn)
              brace = s2.find("{", start)

              if start >= 0 and brace >= 0:
                  depth = 0
                  end = None

                  for i in range(brace, len(s2)):
                      if s2[i] == "{":
                          depth += 1
                      elif s2[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end = i + 1
                              break

                  if end:
                      body = s2[start:end]
                      body = re.sub(
                          r'\breturn\s+0\s*;',
                          'return;',
                          body
                      )
                      s2 = s2[:start] + body + s2[end:]

          p.write_text(s2)

          print("definition replacements:", n)
          PY

      - name: Apply Linux 6.18 sysctl const compatibility
        shell: bash
        run: |
          set -e

          PPE="qsdk-src/qca-nss-ppe/drv/ppe_drv"

          find "$PPE" \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 \
            | xargs -0 sed -Ei \
              's/\bstruct ctl_table \*([A-Za-z_][A-Za-z0-9_]*)/const struct ctl_table *\1/g'

      - name: Apply Stage10 PPE Flow compatibility
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "qsdk-src/qca-nss-ppe/drv/ppe_drv/ppe_drv_flow.c"
          )

          s = p.read_text()

          if "#include <linux/vmalloc.h>" not in s:
              includes = list(
                  re.finditer(
                      r'^#include\s+[<"].*[>"]\s*$',
                      s,
                      re.M
                  )
              )

              if not includes:
                  raise RuntimeError(
                      "Could not locate include block"
                  )

              pos = includes[-1].end()

              s = (
                  s[:pos]
                  + "\n#include <linux/vmalloc.h>"
                  + s[pos:]
              )

          helper = r'''
          /*
           * Temporary QSDK14 / Linux 6.18 MAP-T compatibility.
           * Compile-depth probe only.
           */
          static inline bool
          ppe_drv_flow_dev_is_mapt(struct net_device *dev)
          {
              (void)dev;
              return false;
          }
          '''

          marker = "ppe_drv_flow_dev_is_mapt"

          if marker not in s:
              includes = list(
                  re.finditer(
                      r'^#include\s+[<"].*[>"]\s*$',
                      s,
                      re.M
                  )
              )

              pos = includes[-1].end()

              s = (
                  s[:pos]
                  + "\n\n"
                  + helper
                  + "\n"
                  + s[pos:]
              )

          s, n1 = re.subn(
              r'\(\s*dev_eg->priv_flags_ext\s*&\s*'
              r'IFF_EXT_MAPT\s*\)',
              r'ppe_drv_flow_dev_is_mapt(dev_eg)',
              s
          )

          s, n2 = re.subn(
              r'\(\s*dev_in->priv_flags_ext\s*&\s*'
              r'IFF_EXT_MAPT\s*\)',
              r'ppe_drv_flow_dev_is_mapt(dev_in)',
              s
          )

          p.write_text(s)

          print("dev_eg replacements:", n1)
          print("dev_in replacements:", n2)

          if n1 == 0 or n2 == 0:
              raise RuntimeError(
                  "MAP-T expressions not both replaced"
              )
          PY

      - name: Inspect DSA tag protocol definitions
        shell: bash
        run: |
          set +e

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          {
            echo "===== LINUX DSA TAG PROTOCOLS ====="

            grep -Rni \
              'DSA_TAG_PROTO_.*8021Q' \
              "$KERNEL_DIR/include" \
              "$KERNEL_DIR/net/dsa" \
              2>/dev/null \
              | head -500 || true

            echo ""
            echo "===== QSDK QCA 8021Q REFERENCES ====="

            grep -Rni \
              'DSA_TAG_PROTO_QCA_8021Q' \
              qsdk-src/qca-nss-ppe \
              --exclude-dir=.git \
              2>/dev/null || true

          } | tee results/dsa-tag-original.txt

      - name: Apply Linux 6.18 DSA tag compatibility
        shell: bash
        run: |
          set -e

          PPE="qsdk-src/qca-nss-ppe/drv/ppe_drv"

          COUNT_BEFORE=$(grep -R \
            'DSA_TAG_PROTO_QCA_8021Q' \
            "$PPE" \
            --include='*.c' \
            --include='*.h' \
            | wc -l || true)

          #
          # QSDK14 name:
          # DSA_TAG_PROTO_QCA_8021Q
          #
          # Upstream Linux 6.18 name:
          # DSA_TAG_PROTO_8021Q
          #
          find "$PPE" \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -print0 \
            | xargs -0 sed -i \
              's/DSA_TAG_PROTO_QCA_8021Q/DSA_TAG_PROTO_8021Q/g'

          COUNT_AFTER=$(grep -R \
            'DSA_TAG_PROTO_QCA_8021Q' \
            "$PPE" \
            --include='*.c' \
            --include='*.h' \
            | wc -l || true)

          {
            echo "QCA_8021Q references before: $COUNT_BEFORE"
            echo "QCA_8021Q references remaining: $COUNT_AFTER"
            echo ""

            echo "===== NEW 8021Q REFERENCES ====="

            grep -Rni \
              'DSA_TAG_PROTO_8021Q' \
              "$PPE" \
              --include='*.c' \
              --include='*.h' || true

          } | tee results/dsa-tag-compat.txt

      - name: Save Stage11 compatibility patch
        shell: bash
        run: |
          git -C qsdk-src/qca-nss-ppe diff \
            > results/linux-6.18-stage11-compat.patch || true

          echo "===== STAGE11 PATCH ====="
          cat results/linux-6.18-stage11-compat.patch

      - name: Verify actual DSA API and patch Stage12 VLAN
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          results = Path("results")
          env = dict(line.split("=", 1) for line in
                     (results / "environment.txt").read_text().splitlines())
          kernel = Path(env["KERNEL_DIR"])
          header = kernel / "include/net/dsa.h"
          text = header.read_text()
          (results / "kernel-dsa.h").write_text(text)
          makefile = (kernel / "Makefile").read_text()
          version = ".".join(re.search(r"^" + key + r"\s*=\s*(\d+)\s*$",
                                      makefile, re.M).group(1)
                             for key in ("VERSION", "PATCHLEVEL", "SUBLEVEL"))
          report = results / "stage12-dsa-api-check.txt"
          report.write_text(f"Kernel: {version}\nHeader: {header}\n"
                            f"SHA256: {hashlib.sha256(header.read_bytes()).hexdigest()}\n")

          def require(ok, message):
              with report.open("a") as out:
                  out.write(("PASS: " if ok else "FAIL: ") + message + "\n")
              if not ok:
                  raise RuntimeError(message)

          require(version == "6.18.39", "Expected Linux 6.18.39")
          # Check the implementation, not just the presence of a similar name.
          clean = re.sub(r"/\*.*?\*/|//[^\n]*", "", text, flags=re.S)
          helper = re.search(
              r"static\s+inline\s+struct\s+net_device\s*\*\s*"
              r"dsa_port_to_conduit\s*\(\s*const\s+struct\s+dsa_port\s*\*\s*dp\s*\)"
              r"\s*\{([^{}]*)\}", clean, re.S)
          require(helper is not None,
                  "dsa_port_to_conduit(const struct dsa_port *) returns net_device *")
          expected = ("if (dp->cpu_port_in_lag) "
                      "return dsa_port_lag_dev_get(dp->cpu_dp); "
                      "return dp->cpu_dp->conduit;")
          compact = lambda value: re.sub(r"\s+", "", value)
          require(compact(helper.group(1)) == compact(expected),
                  "Implementation handles CPU-port LAG before cpu_dp->conduit")
          with report.open("a") as out:
              out.write("\nVerified implementation:\n" + helper.group(0) + "\n")

          p = Path("qsdk-src/qca-nss-ppe/drv/ppe_drv/ppe_drv_vlan.c")
          original = p.read_text()
          (results / "ppe_drv_vlan.before-stage12.c").write_text(original)
          s, count = re.subn(r"\bdsa_port_to_master\s*\(\s*dp\s*\)",
                             "dsa_port_to_conduit(dp)", original)
          require(count == 4, "Exactly four expected VLAN DSA call sites")
          require(not re.search(r"\bdsa_port_to_master\s*\(", s),
                  "No legacy DSA calls remain in VLAN source")
          # Insert before the first include, outside conditional DSA includes.
          if "#include <linux/vmalloc.h>" not in s:
              first = re.search(r"^#include\b", s, re.M)
              require(first is not None, "VLAN include block located")
              s = s[:first.start()] + "#include <linux/vmalloc.h>\n" + s[first.start():]
          p.write_text(s)
          (results / "ppe_drv_vlan.after-stage12.c").write_text(s)
          print(report.read_text())

          # Kbuild object-only probe: type-check using the real kernel config,
          # generated headers and cross compiler, without unrelated MODPOST.
          probe = results / "stage12-api-probe"
          probe.mkdir(exist_ok=True)
          (probe / "Makefile").write_text("obj-m += stage12_api.o\n")
          (probe / "stage12_api.c").write_text('''\
          #include <linux/module.h>
          #include <linux/vmalloc.h>
          #include <net/dsa.h>
          static __used struct net_device *stage12_dsa(const struct dsa_port *dp)
          {
              return dsa_port_to_conduit(dp);
          }
          static __used void stage12_vmalloc(void)
          {
              void *p = vzalloc(64);
              vfree(p);
          }
          MODULE_LICENSE("GPL");
          ''')
          PY

          KERNEL_DIR=$(sed -n 's/^KERNEL_DIR=//p' results/environment.txt)
          CROSS_PREFIX=$(sed -n 's/^CROSS_COMPILE=//p' results/environment.txt)
          set +e
          make -C "$KERNEL_DIR" \
            M="$GITHUB_WORKSPACE/results/stage12-api-probe" \
            ARCH=arm64 CROSS_COMPILE="$CROSS_PREFIX" \
            KCFLAGS="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion" \
            stage12_api.o V=1 2>&1 | tee results/stage12-api-probe.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > results/stage12-api-probe-exit-code.txt
          exit "$RC"


      - name: Compile QCA NSS Debug
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          DEBUG_DIR="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/nss_debug"

          FLAGS=$(cat results/qsdk-header-flags.txt)

          make \
            -C "$KERNEL_DIR" \
            M="$DEBUG_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            KCFLAGS="$FLAGS" \
            modules \
            V=1 \
            2>&1 | tee results/nss-debug-compile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            > results/nss-debug-exit-code.txt

          exit 0

      - name: Compile PPE
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          PPE_DIR="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/drv/ppe_drv"

          FLAGS=$(cat results/qsdk-header-flags.txt)

          make \
            -C "$KERNEL_DIR" \
            M="$PPE_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            SoC=ipq95xx \
            CONFIG_NET_DSA=y \
            KCFLAGS="$FLAGS" \
            modules \
            V=1 \
            2>&1 | tee results/ppe-compile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            > results/ppe-exit-code.txt

          exit 0

      - name: Save Stage12 compatibility patch and build logs
        if: always()
        shell: bash
        run: |
          mkdir -p results
          if [ -d qsdk-src/qca-nss-ppe/.git ]; then
            git -C qsdk-src/qca-nss-ppe diff \
              > results/linux-6.18-stage12-compat.patch
            if [ -f results/ppe_drv_vlan.before-stage12.c ] && \
               [ -f results/ppe_drv_vlan.after-stage12.c ]; then
              diff -u --label a/drv/ppe_drv/ppe_drv_vlan.c \
                --label b/drv/ppe_drv/ppe_drv_vlan.c \
                results/ppe_drv_vlan.before-stage12.c \
                results/ppe_drv_vlan.after-stage12.c \
                > results/stage12-vlan-only.patch || test "$?" -eq 1
            fi
          fi
          for LOG in tools.log toolchain.log kernel-compile.log; do
            if [ -f "$LOG" ]; then cp "$LOG" results/; fi
          done
          if [ -f openwrt/.config ]; then cp openwrt/.config results/openwrt.config; fi

      - name: Analyze Stage12 compilation
        if: always()
        shell: bash
        run: |
          {
            echo "===== PPE ERRORS ====="

            grep -iE \
              'error:|fatal error:|implicit declaration|undefined!|has no member|incompatible pointer|conflicting types|too few arguments|too many arguments|unknown type|undeclared|MODPOST|No such file' \
              results/ppe-compile.log \
              | head -6000 || true

          } > results/ppe-errors.txt

          {
            echo "===== PPE COMPILE DEPTH ====="

            grep -E \
              'CC \[M\]|LD \[M\]|MODPOST|\.ko' \
              results/ppe-compile.log \
              | head -6000 || true

          } > results/ppe-compile-depth.txt

          {
            echo "===== MISSING HEADERS ====="

            grep -hE \
              'fatal error: .*: No such file or directory' \
              results/nss-debug-compile.log \
              results/ppe-compile.log \
              2>/dev/null \
              | sed -E \
                's/.*fatal error: ([^:]+): No such file or directory.*/\1/' \
              | sort -u || true

          } > results/missing-headers.txt

          {
            echo "===== LINUX API ERRORS ====="

            grep -hiE \
              'implicit declaration|has no member named|too few arguments|too many arguments|incompatible pointer|conflicting types|undeclared|unknown type name' \
              results/ppe-compile.log \
              2>/dev/null \
              | head -6000 || true

          } > results/linux-api-errors.txt

          {
            echo "===== SHIFT WARNINGS ====="

            grep -n -B8 -A12 \
              'shift-count-overflow' \
              results/ppe-compile.log \
              | head -3000 || true

          } > results/shift-overflow-analysis.txt

          cat results/ppe-errors.txt

      - name: Collect Stage12 products
        if: always()
        shell: bash
        run: |
          mkdir -p results/modules

          find qsdk-src/qca-nss-ppe \
            -type f \
            \( \
              -name '*.ko' \
              -o -name '*.o' \
              -o -name 'Module.symvers' \
            \) \
            -exec cp --parents -v {} results/modules/ \; \
            2>/dev/null || true

          find results/modules \
            -type f \
            > results/module-products.txt || true

      - name: Stage12 summary
        if: always()
        shell: bash
        run: |
          {
            echo "===== STAGE12 SUMMARY ====="
            echo "Compile-depth experiment only; no firmware flashing."
            echo "Stage11 baseline PPE object count: 21"
            echo -n "Stage12 API probe exit: "
            cat results/stage12-api-probe-exit-code.txt 2>/dev/null || echo NOT_RUN
            echo ""

            echo -n "NSS Debug exit: "
            cat results/nss-debug-exit-code.txt \
              2>/dev/null || echo UNKNOWN

            echo -n "PPE exit: "
            cat results/ppe-exit-code.txt \
              2>/dev/null || echo UNKNOWN

            echo ""

            KERNEL_DIR=$(grep '^KERNEL_DIR=' \
              results/environment.txt \
              | cut -d= -f2- || true)

            if [ -s "$KERNEL_DIR/Module.symvers" ]; then
              echo "Kernel Module.symvers: OK"
            else
              echo "Kernel Module.symvers: MISSING"
            fi

            if find qsdk-src/qca-nss-ppe/nss_debug \
              -name 'qca-nss-debug.ko' \
              -print -quit \
              | grep -q .
            then
              echo "qca-nss-debug.ko: GENERATED"
            else
              echo "qca-nss-debug.ko: NOT GENERATED"
            fi

            if find qsdk-src/qca-nss-ppe/drv/ppe_drv \
              -name 'qca-nss-ppe.ko' \
              -print -quit \
              | grep -q .
            then
              echo "qca-nss-ppe.ko: GENERATED"
            else
              echo "qca-nss-ppe.ko: NOT GENERATED"
            fi

            echo ""
            echo -n "PPE object count: "

            find qsdk-src/qca-nss-ppe/drv/ppe_drv \
              -name '*.o' \
              2>/dev/null | wc -l || true

            echo ""
            echo "===== VLAN AND LATER OBJECTS ====="
            for OBJ in ppe_drv_vlan ppe_drv_vp ppe_drv_vsi ppe_drv_v4 ppe_drv_v6; do
              if [ -s "qsdk-src/qca-nss-ppe/drv/ppe_drv/$OBJ.o" ]; then
                echo "$OBJ.o: GENERATED"
              else
                echo "$OBJ.o: NOT GENERATED"
              fi
            done

            echo ""
            echo -n "Missing header count: "
            if [ -f results/nss-debug-compile.log ] || [ -f results/ppe-compile.log ]; then
              grep -hE 'fatal error: .*: No such file or directory' \
                results/nss-debug-compile.log results/ppe-compile.log 2>/dev/null \
                | sed -E 's/.*fatal error: ([^:]+): No such file or directory.*/\1/' \
                | sort -u | wc -l || true
            else
              echo UNKNOWN
            fi
            echo "Remaining missing headers:"

            cat results/missing-headers.txt \
              2>/dev/null || true

            echo ""
            echo "===== FIRST PPE ERRORS ====="

            head -150 \
              results/ppe-errors.txt \
              2>/dev/null || true

          } | tee results/stage12-summary.txt
          cat results/stage12-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage12
          path: results/
          retention-days: 7
          if-no-files-found: error
