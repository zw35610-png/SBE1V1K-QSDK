name: SBE1V1K-QSDK66-V5.7.3-Root-Fix

on:
  workflow_dispatch:

env:
  BOARD: sbe1v1k
  SOC: ipq9574

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            flex \
            bison \
            libncurses-dev \
            zlib1g-dev \
            python3 \
            rsync \
            unzip \
            git

      - name: Detect QSDK root
        shell: bash
        run: |
          echo "Searching QSDK root..."

          ROOT=""

          if [ -f "./Makefile" ] && [ -d "./scripts" ]; then
            ROOT="."
          else
            ROOT=$(find . -type f -name Makefile -path "*/scripts/../Makefile" 2>/dev/null | head -1 | xargs -r dirname)
          fi

          if [ -z "$ROOT" ]; then
            echo "Cannot find QSDK root"
            find . -maxdepth 3 -type f -name Makefile
            exit 1
          fi

          echo "QSDK_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Using: $ROOT"

      - name: Show tree
        run: |
          cd "$QSDK_ROOT"
          pwd
          ls -la
          ls -la scripts || true

      - name: Prepare feeds
        run: |
          cd "$QSDK_ROOT"

          if [ -x scripts/feeds ]; then
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          else
            echo "No feeds script"
          fi

      - name: Prepare config
        run: |
          cd "$QSDK_ROOT"

          if [ ! -f .config ]; then
            echo "Creating default config"
            touch .config
          fi

          echo "Config ready"

      - name: Build check
        run: |
          cd "$QSDK_ROOT"
          make defconfig || true

      - name: Check source
        run: |
          cd "$QSDK_ROOT"
          ls package target include

      - name: Build packages
        run: |
          cd "$QSDK_ROOT"
          make package/compile V=s -j$(nproc)

      - name: Build firmware
        run: |
          cd "$QSDK_ROOT"
          make V=s -j$(nproc)

      - name: Verify output
        run: |
          find . -type f | grep -E "factory|sysupgrade|img" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-V5.7.3-build
          path: |
            **/bin/**

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-V5.7.3-logs
          path: |
            **/logs/**
            **/build_dir/**
