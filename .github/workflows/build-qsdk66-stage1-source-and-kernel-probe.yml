name: SBE1V1K QSDK 6.6 Stage 1 - Source and Kernel Probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QSDK_PREFERRED_REF: NHSS.QSDK.14.0.r9
  DEVICE_BASE_COMMIT: 02fb9517c9aefac9f3825a15ae46e7998bae7edd
  PPE_COMMIT: 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5
  SSDK_COMMIT: 717b74016b0c131575bcd81b9e039d3f7974b02a
  PHY_COMMIT: 16eec6ac35820cb67af59223e8b4c2dba7179655
  NSS_DP_COMMIT: 22555a9fce967f21f4772495844a5c2e0d501a95
  ECM_COMMIT_PREFIX: e978478
  FLOWMGR_COMMIT_PREFIX: 07fbf1b

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout current SBE1V1K-QSDK repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install probe dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex gawk gcc-aarch64-linux-gnu \
            git jq libelf-dev libssl-dev python3 rsync unzip wget xz-utils zstd
          git --version
          python3 --version
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Initialize Stage 1 results
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stage1-results stage1-work
          mkdir -p stage1-results/{remotes,kernel,qsdk-openwrt,device,components} stage1-work
          {
            echo "stage=QSDK-6.6-Stage1"
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "runner=$(uname -a)"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "preferred_qsdk_ref=${QSDK_PREFERRED_REF}"
            echo "device_base_commit=${DEVICE_BASE_COMMIT}"
            echo "ppe_commit=${PPE_COMMIT}"
            echo "ssdk_commit=${SSDK_COMMIT}"
            echo "phy_commit=${PHY_COMMIT}"
            echo "nss_dp_commit=${NSS_DP_COMMIT}"
            echo "ecm_commit_prefix=${ECM_COMMIT_PREFIX}"
            echo "flowmgr_commit_prefix=${FLOWMGR_COMMIT_PREFIX}"
          } | tee stage1-results/environment.txt

      - name: Probe CodeLinaro QSDK repositories and 13/14 refs
        id: remote_probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/stage1-results/remotes"
          mkdir -p "$OUT"

          probe_remote() {
            local name="$1" url="$2" tmp="$OUT/${name}.all.tmp"
            echo "===== $name =====" | tee "$OUT/${name}.status.txt"
            echo "$url" | tee -a "$OUT/${name}.status.txt"
            local rc=1
            for attempt in 1 2 3 4; do
              echo "attempt=$attempt" | tee -a "$OUT/${name}.status.txt"
              timeout 120 git ls-remote --heads --tags "$url" >"$tmp" 2>"$OUT/${name}.stderr.txt"
              rc=$?
              [ "$rc" -eq 0 ] && break
              sleep $((attempt * 5))
            done
            echo "exit=$rc" | tee -a "$OUT/${name}.status.txt"
            if [ "$rc" -eq 0 ]; then
              mv "$tmp" "$OUT/${name}.all.txt"
              grep -Ei 'NHSS\.QSDK\.(13|14)|QSDK\.(13|14)' "$OUT/${name}.all.txt" \
                > "$OUT/${name}.qsdk13-14.txt" || true
              grep -F "$QSDK_PREFERRED_REF" "$OUT/${name}.all.txt" \
                > "$OUT/${name}.preferred.txt" || true
              echo "ref_count=$(wc -l < "$OUT/${name}.all.txt")" | tee -a "$OUT/${name}.status.txt"
              echo "qsdk13_14_count=$(wc -l < "$OUT/${name}.qsdk13-14.txt")" | tee -a "$OUT/${name}.status.txt"
              echo "preferred_count=$(wc -l < "$OUT/${name}.preferred.txt")" | tee -a "$OUT/${name}.status.txt"
            else
              rm -f "$tmp"
            fi
            return 0
          }

          probe_remote qsdk-openwrt https://git.codelinaro.org/clo/qsdk/oss/system/openwrt.git
          probe_remote linux-ipq-6.6 https://git.codelinaro.org/clo/qsdk/oss/kernel/linux-ipq-6.6.git
          probe_remote nss-ppe https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git
          probe_remote qca-ssdk https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git
          probe_remote qca-nss-phy https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git
          probe_remote nss-dp https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-dp.git
          probe_remote qca-nss-ecm https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-ecm.git
          probe_remote nss-netfn https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-netfn.git
          probe_remote qca-nss-netfn https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-netfn.git
          probe_remote feed-nss-host https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-host.git
          probe_remote feed-nss-clients https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git
          probe_remote feed-ssdk https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ssdk.git
          probe_remote feed-wlan-open https://git.codelinaro.org/clo/qsdk/oss/system/feeds/wlan-open.git

          {
            echo "=== Preferred ref hits ==="
            grep -H . "$OUT"/*.preferred.txt 2>/dev/null || true
            echo
            echo "=== QSDK 13/14 refs ==="
            grep -H . "$OUT"/*.qsdk13-14.txt 2>/dev/null || true
          } | tee "$OUT/summary.txt"
          exit 0

      - name: Fetch QSDK 14 OpenWrt tree and inspect IPQ95xx structure
        id: qsdk_openwrt
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/stage1-results/qsdk-openwrt"
          DST="$GITHUB_WORKSPACE/stage1-work/qsdk-openwrt"
          URL=https://git.codelinaro.org/clo/qsdk/oss/system/openwrt.git
          rm -rf "$DST"
          mkdir -p "$DST"
          git -C "$DST" init
          git -C "$DST" remote add origin "$URL"

          rc=1
          for attempt in 1 2 3; do
            timeout 900 git -C "$DST" fetch --depth=1 origin "$QSDK_PREFERRED_REF" \
              >"$OUT/fetch.log" 2>&1
            rc=$?
            [ "$rc" -eq 0 ] && break
            sleep $((attempt * 10))
          done
          echo "$rc" > "$OUT/fetch-exit.txt"
          if [ "$rc" -ne 0 ]; then
            echo "Preferred ref fetch failed; Stage 1 keeps remote inventory for fallback selection." | tee "$OUT/status.txt"
            exit 0
          fi

          git -C "$DST" checkout --detach FETCH_HEAD >>"$OUT/fetch.log" 2>&1
          git -C "$DST" rev-parse HEAD | tee "$OUT/commit.txt"
          git -C "$DST" log -1 --format=fuller > "$OUT/commit-log.txt"

          {
            echo "=== top level ==="
            find "$DST" -maxdepth 2 -type d | sed "s#^$DST##" | sort | head -n 250
            echo
            echo "=== ipq95/ipq957/IPQ95 hits ==="
            find "$DST/target" "$DST/package" -type f 2>/dev/null | \
              grep -Ei 'ipq95|ipq957|nss|ppe|ssdk|netfn|ecm' | head -n 1500 || true
          } > "$OUT/tree-inventory.txt"

          grep -RInE 'ipq95xx|ipq957[04]|qca-nss-ppe|qca-nss-dp|qca-nss-ecm|netfn|flowmgr' \
            "$DST/target" "$DST/package" "$DST/include" 2>/dev/null \
            | head -n 4000 > "$OUT/ipq95xx-qca-hits.txt" || true

          find "$DST" -maxdepth 3 -type f \( -name 'feeds.conf*' -o -name 'local-development.mk' -o -name 'Makefile' \) \
            | sort > "$OUT/build-files.txt"
          for f in "$DST"/feeds.conf*; do
            [ -f "$f" ] && { echo "===== ${f#$DST/} ====="; cat "$f"; }
          done > "$OUT/feeds.txt" 2>/dev/null || true

          if [ -x "$DST/scripts/feeds" ]; then
            "$DST/scripts/feeds" list -n > "$OUT/feeds-list.txt" 2>&1 || true
          fi
          exit 0

      - name: Fetch Qualcomm linux-ipq-6.6 and inspect vendor API
        id: kernel_probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/stage1-results/kernel"
          DST="$GITHUB_WORKSPACE/stage1-work/linux-ipq-6.6"
          URL=https://git.codelinaro.org/clo/qsdk/oss/kernel/linux-ipq-6.6.git
          rm -rf "$DST"
          mkdir -p "$DST"
          git -C "$DST" init
          git -C "$DST" remote add origin "$URL"

          rc=1
          for attempt in 1 2 3; do
            timeout 1200 git -C "$DST" fetch --depth=1 origin "$QSDK_PREFERRED_REF" \
              >"$OUT/fetch.log" 2>&1
            rc=$?
            [ "$rc" -eq 0 ] && break
            sleep $((attempt * 10))
          done
          echo "$rc" > "$OUT/fetch-exit.txt"
          if [ "$rc" -ne 0 ]; then
            echo "Preferred kernel ref fetch failed; see remote inventory." | tee "$OUT/status.txt"
            exit 0
          fi

          git -C "$DST" checkout --detach FETCH_HEAD >>"$OUT/fetch.log" 2>&1
          git -C "$DST" rev-parse HEAD | tee "$OUT/commit.txt"
          git -C "$DST" log -1 --format=fuller > "$OUT/commit-log.txt"

          make -s -C "$DST" kernelversion 2>/dev/null | tee "$OUT/kernel-version.txt" || true
          {
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' "$DST/Makefile" || true
            echo
            echo "=== dmac/cacheflush API ==="
            grep -RInE 'dmac_(inv|clean|flush)_range(_no_dsb)?' \
              "$DST/arch/arm64/include" "$DST/arch/arm64/mm" 2>/dev/null | head -n 500 || true
            echo
            echo "=== IPQ95xx DTS ==="
            find "$DST/arch/arm64/boot/dts" -type f 2>/dev/null | grep -Ei 'ipq95|ipq957' | sort | head -n 1000 || true
            echo
            echo "=== Qualcomm EDMA/PPE/NSS kernel-side hits ==="
            grep -RIlE 'ipq95xx|ipq957[04]|nss[-_ ]?ppe|qca[-_ ]?ppe|edma' \
              "$DST/drivers/net" "$DST/include" 2>/dev/null | head -n 1200 || true
          } > "$OUT/kernel-api-inventory.txt"

          for sym in dmac_inv_range dmac_inv_range_no_dsb dmac_clean_range_no_dsb; do
            if grep -Rqs "$sym" "$DST/arch/arm64/include" "$DST/arch/arm64/mm" 2>/dev/null; then
              echo "$sym=YES"
            else
              echo "$sym=NO"
            fi
          done | tee "$OUT/nss-dp-required-cache-api.txt"

          find "$DST/arch/arm64/boot/dts" -type f 2>/dev/null | grep -Ei 'ipq95|ipq957' \
            > "$OUT/ipq95xx-dts-files.txt" || true
          exit 0

      - name: Fetch pinned stock-lineage QSDK components
        id: component_probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/stage1-results/components"
          ROOT="$GITHUB_WORKSPACE/stage1-work/components"
          mkdir -p "$ROOT" "$OUT"

          fetch_commit() {
            local name="$1" url="$2" commit="$3"
            local dst="$ROOT/$name"
            rm -rf "$dst"
            mkdir -p "$dst"
            git -C "$dst" init -q
            git -C "$dst" remote add origin "$url"
            local rc=1
            for attempt in 1 2 3; do
              timeout 600 git -C "$dst" fetch --depth=1 origin "$commit" \
                >"$OUT/${name}-fetch.log" 2>&1
              rc=$?
              [ "$rc" -eq 0 ] && break
              sleep $((attempt * 5))
            done
            if [ "$rc" -eq 0 ]; then
              git -C "$dst" checkout -q --detach FETCH_HEAD
              printf '%s\tOK\t%s\t%s\n' "$name" "$(git -C "$dst" rev-parse HEAD)" "$url" \
                | tee -a "$OUT/pinned-components.tsv"
              git -C "$dst" log -1 --format=fuller > "$OUT/${name}-commit.txt"
              git -C "$dst" ls-tree -r --name-only HEAD > "$OUT/${name}-tree.txt"
            else
              printf '%s\tFAIL\t%s\t%s\n' "$name" "$commit" "$url" \
                | tee -a "$OUT/pinned-components.tsv"
            fi
            return 0
          }

          : > "$OUT/pinned-components.tsv"
          fetch_commit qca-nss-ppe https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git "$PPE_COMMIT"
          fetch_commit qca-ssdk https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git "$SSDK_COMMIT"
          fetch_commit qca-nss-phy https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git "$PHY_COMMIT"
          fetch_commit qca-nss-dp https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-dp.git "$NSS_DP_COMMIT"

          # Resolve the exact ECM commit from the known stock/QSDK14-r9 prefix.
          ECM_URL=https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-ecm.git
          rm -rf "$ROOT/qca-nss-ecm"
          git clone --filter=blob:none --no-checkout "$ECM_URL" "$ROOT/qca-nss-ecm" \
            >"$OUT/qca-nss-ecm-clone.log" 2>&1 || true
          if [ -d "$ROOT/qca-nss-ecm/.git" ]; then
            git -C "$ROOT/qca-nss-ecm" fetch --all --tags --prune \
              >>"$OUT/qca-nss-ecm-clone.log" 2>&1 || true
            full_ecm=$(git -C "$ROOT/qca-nss-ecm" rev-list --all 2>/dev/null | grep -m1 "^${ECM_COMMIT_PREFIX}" || true)
            echo "ecm_prefix=$ECM_COMMIT_PREFIX" | tee "$OUT/ecm-resolution.txt"
            echo "ecm_full=$full_ecm" | tee -a "$OUT/ecm-resolution.txt"
            if [ -n "$full_ecm" ]; then
              git -C "$ROOT/qca-nss-ecm" checkout -q --detach "$full_ecm" || true
              git -C "$ROOT/qca-nss-ecm" log -1 --format=fuller > "$OUT/qca-nss-ecm-commit.txt" || true
            fi
          fi
          exit 0

      - name: Inventory SBE1V1K device support for later QSDK 6.6 transplant
        id: device_probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/stage1-results/device"
          DST="$GITHUB_WORKSPACE/stage1-work/sbe1v1k-device-base"
          URL=https://github.com/luckkyboy/SBE1V1K.git
          rm -rf "$DST"
          mkdir -p "$DST"
          git -C "$DST" init -q
          git -C "$DST" remote add origin "$URL"
          timeout 900 git -C "$DST" fetch --depth=1 origin "$DEVICE_BASE_COMMIT" \
            >"$OUT/fetch.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/fetch-exit.txt"
          if [ "$rc" -ne 0 ]; then exit 0; fi
          git -C "$DST" checkout -q --detach FETCH_HEAD
          git -C "$DST" rev-parse HEAD | tee "$OUT/commit.txt"

          {
            echo "=== SBE1V1K named files ==="
            find "$DST" -type f | grep -Ei 'sbe1v1k|rtl826|qcn9274' | sed "s#^$DST/##" | sort || true
            echo
            echo "=== SBE1V1K references ==="
            grep -RIlE 'askey,sbe1v1k|askey_sbe1v1k|SBE1V1K|RTQ7300T' \
              "$DST/target" "$DST/package" 2>/dev/null | sed "s#^$DST/##" | sort || true
          } > "$OUT/device-files.txt"

          while IFS= read -r rel; do
            [ -f "$DST/$rel" ] || continue
            mkdir -p "$OUT/files/$(dirname "$rel")"
            cp -a "$DST/$rel" "$OUT/files/$rel"
          done < <(grep -E '^(target|package)/' "$OUT/device-files.txt" | sort -u)

          grep -RInE 'askey,sbe1v1k|askey_sbe1v1k|SBE1V1K|RTQ7300T' \
            "$DST/target" "$DST/package" 2>/dev/null | head -n 2500 > "$OUT/device-context.txt" || true
          exit 0

      - name: Compare QSDK 6.6 kernel with NSS-DP requirements
        id: compatibility_summary
        continue-on-error: true
        shell: bash
        run: |
          set +e
          R="$GITHUB_WORKSPACE/stage1-results"
          K="$GITHUB_WORKSPACE/stage1-work/linux-ipq-6.6"
          DP="$GITHUB_WORKSPACE/stage1-work/components/qca-nss-dp"
          Q="$GITHUB_WORKSPACE/stage1-work/qsdk-openwrt"

          kernel_ver="NOT_FETCHED"
          [ -s "$R/kernel/kernel-version.txt" ] && kernel_ver=$(head -n1 "$R/kernel/kernel-version.txt")
          qsdk_commit="NOT_FETCHED"
          [ -s "$R/qsdk-openwrt/commit.txt" ] && qsdk_commit=$(head -n1 "$R/qsdk-openwrt/commit.txt")
          kernel_commit="NOT_FETCHED"
          [ -s "$R/kernel/commit.txt" ] && kernel_commit=$(head -n1 "$R/kernel/commit.txt")

          dmac_inv=NO
          dmac_inv_nodsb=NO
          dmac_clean_nodsb=NO
          [ -d "$K" ] && grep -Rqs 'dmac_inv_range' "$K/arch/arm64/include" "$K/arch/arm64/mm" 2>/dev/null && dmac_inv=YES
          [ -d "$K" ] && grep -Rqs 'dmac_inv_range_no_dsb' "$K/arch/arm64/include" "$K/arch/arm64/mm" 2>/dev/null && dmac_inv_nodsb=YES
          [ -d "$K" ] && grep -Rqs 'dmac_clean_range_no_dsb' "$K/arch/arm64/include" "$K/arch/arm64/mm" 2>/dev/null && dmac_clean_nodsb=YES

          ipq95_dts=0
          [ -d "$K/arch/arm64/boot/dts" ] && ipq95_dts=$(find "$K/arch/arm64/boot/dts" -type f 2>/dev/null | grep -Eic 'ipq95|ipq957' || true)
          qsdk_ipq95_hits=0
          [ -s "$R/qsdk-openwrt/ipq95xx-qca-hits.txt" ] && qsdk_ipq95_hits=$(wc -l < "$R/qsdk-openwrt/ipq95xx-qca-hits.txt")
          dp_ipq95=NO
          [ -d "$DP" ] && [ -f "$DP/hal/soc_ops/ipq95xx/nss_ipq95xx.h" ] && dp_ipq95=YES

          cat > "$R/stage1-summary.txt" <<EOF
          SBE1V1K QSDK 6.6 Stage 1
          ========================
          preferred_qsdk_ref: $QSDK_PREFERRED_REF
          qsdk_openwrt_commit: $qsdk_commit
          linux_ipq_6_6_commit: $kernel_commit
          kernel_version: $kernel_ver

          vendor_cache_api:
            dmac_inv_range: $dmac_inv
            dmac_inv_range_no_dsb: $dmac_inv_nodsb
            dmac_clean_range_no_dsb: $dmac_clean_nodsb

          ipq95xx:
            kernel_dts_file_count: $ipq95_dts
            qsdk_openwrt_reference_count: $qsdk_ipq95_hits
            nss_dp_ipq95xx_hal: $dp_ipq95

          pinned_components:
          $(sed 's/^/  /' "$R/components/pinned-components.tsv" 2>/dev/null)

          Interpretation gate:
          - If QSDK OpenWrt + linux-ipq-6.6 fetch and the three dmac APIs are present, use the native QSDK 6.6 base for Stage 2.
          - If the preferred r9 ref is absent, use the remote inventory to select the matching QSDK 14/13 6.6 ref; do not fall back to Linux 6.18.
          - Stage 1 is source/ABI reconnaissance only. It does not produce a flashable firmware.
          EOF
          sed -i 's/^          //' "$R/stage1-summary.txt"
          cat "$R/stage1-summary.txt"

          python3 - <<'PY'
          import json, os, pathlib
          r = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'stage1-results'
          def first(path, default=''):
              p=r/path
              return p.read_text(errors='replace').splitlines()[0] if p.exists() and p.stat().st_size else default
          data={
              'stage':'QSDK-6.6-Stage1',
              'preferred_qsdk_ref':os.environ.get('QSDK_PREFERRED_REF'),
              'qsdk_openwrt_commit':first(pathlib.Path('qsdk-openwrt/commit.txt'),'NOT_FETCHED'),
              'kernel_commit':first(pathlib.Path('kernel/commit.txt'),'NOT_FETCHED'),
              'kernel_version':first(pathlib.Path('kernel/kernel-version.txt'),'NOT_FETCHED'),
              'device_base_commit':os.environ.get('DEVICE_BASE_COMMIT'),
              'ppe_commit':os.environ.get('PPE_COMMIT'),
              'ssdk_commit':os.environ.get('SSDK_COMMIT'),
              'phy_commit':os.environ.get('PHY_COMMIT'),
              'nss_dp_commit':os.environ.get('NSS_DP_COMMIT'),
          }
          (r/'stage1-summary.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          exit 0

      - name: Package Stage 1 diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p stage1-results/workflow-source
          cp "$GITHUB_WORKSPACE/.github/workflows/$(basename "${GITHUB_WORKFLOW_REF%%@*}")" \
            stage1-results/workflow-source/ 2>/dev/null || true
          df -h > stage1-results/disk-usage.txt
          du -sh stage1-work/* stage1-results/* 2>/dev/null | sort -h > stage1-results/size-summary.txt || true
          tar -C stage1-results -czf SBE1V1K-QSDK-6.6-Stage1-results.tar.gz .
          ls -lh SBE1V1K-QSDK-6.6-Stage1-results.tar.gz

      - name: Upload Stage 1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK-6.6-Stage1
          path: |
            stage1-results/
            SBE1V1K-QSDK-6.6-Stage1-results.tar.gz
          if-no-files-found: warn
          retention-days: 14
