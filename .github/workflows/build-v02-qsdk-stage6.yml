name: SBE1V1K V0.2 QSDK Stage6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq bc

      - name: Clone SBE1V1K baseline
        run: |
          git clone \
            https://github.com/luckkyboy/SBE1V1K.git \
            openwrt

          cd openwrt

          git checkout \
            02fb9517c9aefac9f3825a15ae46e7998bae7edd

          cp configs/sbe1v1k.config .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: sbe1v1k-openwrt-dl-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            sbe1v1k-openwrt-dl-${{ runner.os }}-

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build OpenWrt tools and toolchain
        shell: bash
        run: |
          set -o pipefail

          cd openwrt

          make tools/install -j$(nproc) \
            2>&1 | tee ../tools.log

          make toolchain/install -j$(nproc) \
            2>&1 | tee ../toolchain.log

          make target/linux/prepare -j$(nproc) \
            2>&1 | tee ../target-linux-prepare.log

      - name: Fetch exact QSDK14 R9 PPE and SSDK
        shell: bash
        run: |
          set -e

          mkdir -p qsdk-src

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
            qsdk-src/qca-nss-ppe

          git -C qsdk-src/qca-nss-ppe checkout \
            87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
            qsdk-src/qca-ssdk

          git -C qsdk-src/qca-ssdk checkout \
            717b74016b0c131575bcd81b9e039d3f7974b02a

      - name: Locate build environment
        shell: bash
        run: |
          set -e

          mkdir -p results

          KERNEL_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/build_dir" \
            -type d \
            -path '*/linux-*/linux-6.18*' \
            -print -quit)

          TOOLCHAIN_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/staging_dir" \
            -maxdepth 1 \
            -type d \
            -name 'toolchain-aarch64*' \
            -print -quit)

          GCC=$(find \
            "$TOOLCHAIN_DIR/bin" \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -print -quit)

          CROSS_PREFIX="${GCC%gcc}"

          {
            echo "KERNEL_DIR=$KERNEL_DIR"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "GCC=$GCC"
            echo "CROSS_COMPILE=$CROSS_PREFIX"
          } | tee results/environment.txt

          test -d "$KERNEL_DIR"
          test -x "$GCC"

      - name: Fully prepare Linux kernel
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            olddefconfig

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            prepare

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            modules_prepare

          {
            test -f "$KERNEL_DIR/include/generated/autoconf.h" \
              && echo "autoconf.h: OK"

            test -f "$KERNEL_DIR/include/config/auto.conf" \
              && echo "auto.conf: OK"

            test -f "$KERNEL_DIR/include/generated/utsrelease.h" \
              && echo "utsrelease.h: OK"
          } | tee results/kernel-check.txt

      - name: Discover all SSDK header directories
        shell: bash
        run: |
          set -e

          SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"

          find "$SSDK" \
            -type f \
            -name '*.h' \
            -printf '%h\n' \
            | sort -u \
            > results/ssdk-header-dirs.txt

          echo "===== SSDK HEADER DIRECTORIES ====="
          cat results/ssdk-header-dirs.txt

          echo ""
          echo "===== FIND CRITICAL HEADERS ====="

          find "$SSDK" \
            -type f \
            \( -name 'aos_mem.h' -o -name 'fal_rss_hash.h' \) \
            -print \
            | tee results/critical-header-locations.txt

      - name: Generate SSDK include flags
        shell: bash
        run: |
          set -e

          SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"

          : > results/ssdk-include-flags.txt

          # IMPORTANT:
          # PPE uses paths such as:
          #   <fal/fal_rss_hash.h>
          #   <common/sw.h>
          # Therefore the SSDK include root itself must be present.
          printf -- '-I%s ' "$SSDK/include" \
            >> results/ssdk-include-flags.txt

          # Add every directory that actually contains headers.
          # This covers direct includes such as <aos_mem.h>.
          while IFS= read -r DIR
          do
            printf -- '-I%s ' "$DIR" \
              >> results/ssdk-include-flags.txt
          done < results/ssdk-header-dirs.txt

          echo ""
          echo "===== GENERATED INCLUDE FLAGS ====="
          cat results/ssdk-include-flags.txt
          echo ""

      - name: Verify critical SSDK headers
        shell: bash
        run: |
          set -e

          SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"

          {
            echo "===== CRITICAL SSDK HEADERS ====="

            test -f "$SSDK/include/fal/fal_rss_hash.h" \
              && echo "fal/fal_rss_hash.h: OK"

            test -f "$SSDK/include/sal/os/aos_mem.h" \
              && echo "aos_mem.h: OK"

            echo ""
            echo "===== INCLUDE ROOT ====="
            echo "$SSDK/include"

          } | tee results/critical-headers.txt

      - name: Compile QSDK14 R9 PPE
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          PPE_DIR="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/drv/ppe_drv"

          QSDK_HEADERS=$(cat \
            results/ssdk-include-flags.txt)

          echo "===== PPE BUILD =====" \
            | tee results/ppe-build-info.txt

          echo "PPE_DIR=$PPE_DIR" \
            | tee -a results/ppe-build-info.txt

          echo "Header directory count:" \
            | tee -a results/ppe-build-info.txt

          wc -l results/ssdk-header-dirs.txt \
            | tee -a results/ppe-build-info.txt

          echo "" \
            | tee -a results/ppe-build-info.txt

          echo "===== KCFLAGS =====" \
            | tee -a results/ppe-build-info.txt

          echo "$QSDK_HEADERS" \
            | tee -a results/ppe-build-info.txt

          make \
            -C "$KERNEL_DIR" \
            M="$PPE_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            SoC=ipq95xx \
            CONFIG_NET_DSA=y \
            KCFLAGS="$QSDK_HEADERS" \
            modules \
            V=1 \
            2>&1 | tee results/ppe-compile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            | tee results/ppe-exit-code.txt

          exit 0

      - name: Verify SSDK header injection
        if: always()
        shell: bash
        run: |
          {
            echo "===== GCC COMMANDS CONTAINING QCA-SSDK ====="

            grep -F 'qca-ssdk' \
              results/ppe-compile.log \
              | head -100 || true

          } > results/header-injection.txt

          cat results/header-injection.txt

      - name: Analyze PPE compile depth
        if: always()
        shell: bash
        run: |
          {
            echo "===== COMPILED OBJECTS ====="

            grep -E \
              'CC \[M\]|LD \[M\]|MODPOST|\.o$|\.ko$' \
              results/ppe-compile.log \
              | head -1000 || true

          } > results/ppe-compile-depth.txt

          {
            echo "===== PPE ERRORS ====="

            grep -iE \
              'error:|fatal error:|implicit declaration|undefined|No such file|No rule to make target' \
              results/ppe-compile.log \
              | head -2000 || true

          } > results/ppe-errors.txt

          {
            echo "===== GENERATED FILES ====="

            find qsdk-src/qca-nss-ppe \
              -type f \
              \( \
                -name '*.o' \
                -o -name '*.ko' \
                -o -name '*.mod' \
                -o -name 'Module.symvers' \
              \) \
              | sort || true

          } > results/ppe-generated.txt

          echo ""
          echo "PPE exit code:"
          cat results/ppe-exit-code.txt || true

          echo ""
          cat results/ppe-errors.txt

      - name: Check critical header results
        if: always()
        shell: bash
        run: |
          {
            echo "===== HEADER COMPILE CHECK ====="

            if grep -q \
              'fal/fal_rss_hash.h: No such file or directory' \
              results/ppe-compile.log
            then
              echo "fal/fal_rss_hash.h: FAILED"
            else
              echo "fal/fal_rss_hash.h: PASSED"
            fi

            if grep -q \
              'aos_mem.h: No such file or directory' \
              results/ppe-compile.log
            then
              echo "aos_mem.h: FAILED"
            else
              echo "aos_mem.h: PASSED"
            fi

          } | tee results/header-result.txt

      - name: Upload Stage6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage6
          path: results/
          retention-days: 7
