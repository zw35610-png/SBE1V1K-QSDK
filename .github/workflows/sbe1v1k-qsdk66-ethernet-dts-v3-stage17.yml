name: SBE1V1K QSDK 6.6 Ethernet DTS V3 - Native NSS-DP Derivation
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  OPENWRT_TAG: v24.10.2
  FEED_IPQ_BRANCH: ath.13.0
  DEVICE_BASE_COMMIT: 02fb9517c9aefac9f3825a15ae46e7998bae7edd
  STAGE: QSDK-6.6-Stage17
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  transplant-cascade:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout current project
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install OpenWrt build dependencies
      shell: bash
      run: "set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y \\\n  build-essential clang flex bison g++ gawk\
        \ gcc-multilib g++-multilib \\\n  gettext git libncurses-dev libssl-dev python3 python3-setuptools \\\n  rsync swig\
        \ unzip zlib1g-dev file wget curl xsltproc libxml-parser-perl \\\n  python3-dev time jq patch quilt ccache zstd libelf-dev\
        \ bc device-tree-compiler\n"
    - name: Initialize Stage 17 workspace
      shell: bash
      run: "set -euxo pipefail\nrm -rf stage17-work stage17-results\nmkdir -p stage17-work stage17-results/{sources,integration,device,config,bootstrap,kernel,packages,image,discovery}\n\
        {\n  echo \"stage=${STAGE}\"\n  echo \"date_utc=$(date -u +%FT%TZ)\"\n  echo \"runner=$(uname -a)\"\n  echo \"repo=${GITHUB_REPOSITORY}\"\
        \n  echo \"ref=${GITHUB_REF}\"\n  echo \"sha=${GITHUB_SHA}\"\n  echo \"openwrt_tag=${OPENWRT_TAG}\"\n  echo \"feed_ipq_branch=${FEED_IPQ_BRANCH}\"\
        \n} | tee stage17-results/environment.txt\n"
    - name: Cache downloads and ccache
      uses: actions/cache@v4
      with:
        path: 'stage17-work/openwrt/dl

          .ccache

          '
        key: qsdk66-stage5-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}
        restore-keys: 'qsdk66-stage5-${{ runner.os }}-

          qsdk66-${{ runner.os }}-

          '
    - name: Restore prepared host and toolchain cache from Stage 16
      id: bootstrap-cache
      uses: actions/cache/restore@v4
      with:
        path: 'stage16-work/openwrt/staging_dir/host

          stage16-work/openwrt/staging_dir/toolchain-*

          '
        key: qsdk66-bootstrap-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}-v10
    - name: Fetch OpenWrt, feed-ipq and SBE1V1K source
      id: sources
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$GITHUB_WORKSPACE/stage17-work/feed-ipq\"\nD=\"$GITHUB_WORKSPACE/stage17-work/sbe1v1k\"\
        \nOUT=\"$GITHUB_WORKSPACE/stage17-results/sources\"\n\nclone_retry() {\n  local name=\"$1\" url=\"$2\" ref=\"$3\"\
        \ dst=\"$4\" log=\"$OUT/${name}-clone.log\"\n  rm -rf \"$dst\"\n  local rc=1\n  for n in 1 2 3; do\n    echo \"[$name]\
        \ attempt=$n url=$url ref=$ref\" | tee -a \"$log\"\n    git clone --depth=1 --branch \"$ref\" \"$url\" \"$dst\" >>\"\
        $log\" 2>&1\n    rc=$?\n    [ \"$rc\" -eq 0 ] && break\n    rm -rf \"$dst\"\n    sleep $((n * 6))\n  done\n  echo\
        \ \"$rc\" > \"$OUT/${name}-clone-exit.txt\"\n  if [ \"$rc\" -eq 0 ]; then\n    git -C \"$dst\" rev-parse HEAD | tee\
        \ \"$OUT/${name}-commit.txt\"\n    git -C \"$dst\" log -1 --format=fuller > \"$OUT/${name}-commit-log.txt\"\n  fi\n\
        }\n\nclone_retry openwrt https://github.com/openwrt/openwrt.git \"$OPENWRT_TAG\" \"$O\"\nclone_retry feed-ipq https://github.com/zilogic-systems/feed-ipq.git\
        \ \"$FEED_IPQ_BRANCH\" \"$F\"\n\nrm -rf \"$D\"\ngit init -q \"$D\"\ngit -C \"$D\" remote add origin https://github.com/luckkyboy/SBE1V1K.git\n\
        rc=1\nfor n in 1 2 3; do\n  git -C \"$D\" fetch --depth=1 origin \"$DEVICE_BASE_COMMIT\" >\"$OUT/device-fetch.log\"\
        \ 2>&1\n  rc=$?\n  [ \"$rc\" -eq 0 ] && break\n  sleep $((n * 6))\ndone\necho \"$rc\" > \"$OUT/device-fetch-exit.txt\"\
        \nif [ \"$rc\" -eq 0 ]; then\n  git -C \"$D\" checkout -q --detach FETCH_HEAD\n  git -C \"$D\" rev-parse HEAD | tee\
        \ \"$OUT/device-commit.txt\"\nfi\nexit 0\n"
    - name: Integrate native QSDK13 IPQ95xx target and feeds
      id: integrate
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$GITHUB_WORKSPACE/stage17-work/feed-ipq\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nrc=0\nexec > >(tee \"$OUT/integration.log\") 2>&1\n\nif [ ! -d \"$O\" ] || [ ! -d \"$F\" ]; then\n  echo 90 > \"\
        $OUT/integration-exit.txt\"\n  exit 0\nfi\n\necho \"=== selectively apply feed-ipq OpenWrt 24.10 patches ===\"\n:\
        \ > \"$OUT/patch-status.tsv\"\nshopt -s nullglob\nmapfile -t patches < <(find \"$F/patches/openwrt/24.10\" -type f\
        \ -name '*.patch' 2>/dev/null | sort)\nfor p in \"${patches[@]}\"; do\n  name=\"$(basename \"$p\")\"\n  if git -C\
        \ \"$O\" apply --check \"$p\" >/dev/null 2>&1; then\n    git -C \"$O\" apply \"$p\"\n    prc=$?\n    echo -e \"$name\\\
        tAPPLIED\\t$prc\" >> \"$OUT/patch-status.tsv\"\n  elif (cd \"$O\" && patch --dry-run -p1 --forward --batch < \"$p\"\
        \ >/dev/null 2>&1); then\n    (cd \"$O\" && patch -p1 --forward --batch < \"$p\")\n    prc=$?\n    echo -e \"$name\\\
        tPATCHED\\t$prc\" >> \"$OUT/patch-status.tsv\"\n  else\n    # Stage 3 proved the baseline builds without the non-applicable\
        \ bbfdm/xmppc patches.\n    echo -e \"$name\\tSKIPPED_NOT_APPLICABLE\\t0\" >> \"$OUT/patch-status.tsv\"\n  fi\ndone\n\
        \necho \"=== install IPQ95xx target ===\"\nrm -rf \"$O/target/linux/ipq95xx\"\ncp -a \"$F/targets/ipq95xx\" \"$O/target/linux/ipq95xx\"\
        \ || rc=2\n\necho \"=== add feed-ipq feed roots ===\"\ncp \"$O/feeds.conf.default\" \"$OUT/feeds.conf.default.before\"\
        \n: > \"$OUT/local-feeds-added.txt\"\nfor d in \"$F\"/feeds/*; do\n  [ -d \"$d\" ] || continue\n  name=\"ipq_$(basename\
        \ \"$d\" | tr '.-' '__')\"\n  echo \"src-link $name $d\" >> \"$O/feeds.conf.default\"\n  echo \"$name $d\" >> \"$OUT/local-feeds-added.txt\"\
        \ndone\nif [ -d \"$F/ipq-ext\" ]; then\n  echo \"src-link ipq_ext $F/ipq-ext\" >> \"$O/feeds.conf.default\"\n  echo\
        \ \"ipq_ext $F/ipq-ext\" >> \"$OUT/local-feeds-added.txt\"\nfi\n\n(cd \"$O\" && ./scripts/feeds update -a) > \"$OUT/feeds-update.log\"\
        \ 2>&1\nfurc=$?\n(cd \"$O\" && ./scripts/feeds install -a) > \"$OUT/feeds-install.log\" 2>&1\nfirc=$?\necho \"feeds_update_exit=$furc\"\
        \ >> \"$OUT/integration.log\"\necho \"feeds_install_exit=$firc\" >> \"$OUT/integration.log\"\n[ \"$furc\" -ne 0 ]\
        \ && rc=3\n[ \"$firc\" -ne 0 ] && rc=4\necho \"$rc\" > \"$OUT/integration-exit.txt\"\nexit 0\n"
    - name: Transplant SBE1V1K DTS and engineering device profile
      id: transplant
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nD=\"$GITHUB_WORKSPACE/stage17-work/sbe1v1k\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\
        \nrc=0\n\nSRC_DTS=\"$D/target/linux/qualcommbe/dts/ipq9570-sbe1v1k.dts\"\nif [ ! -f \"$SRC_DTS\" ]; then\n  echo \"\
        missing source DTS: $SRC_DTS\" | tee \"$OUT/transplant.log\"\n  echo 90 > \"$OUT/transplant-exit.txt\"\n  exit 0\n\
        fi\n\ncp \"$SRC_DTS\" \"$OUT/ipq9570-sbe1v1k.source.dts\"\nsha256sum \"$SRC_DTS\" > \"$OUT/source-dts.sha256\"\n\n\
        for arch in arm64 arm; do\n  QDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/$arch/boot/dts/qcom\"\n  [ -d \"$QDIR\"\
        \ ] || continue\n  cp \"$SRC_DTS\" \"$QDIR/ipq9574-sbe1v1k.dts\" || rc=1\n  MF=\"$QDIR/Makefile\"\n  if [ -f \"$MF\"\
        \ ] && ! grep -q 'ipq9574-sbe1v1k.dtb' \"$MF\"; then\n    printf '\\n# SBE1V1K engineering transplant\\ndtb-$(CONFIG_ARCH_QCOM)\
        \ += ipq9574-sbe1v1k.dtb\\n' >> \"$MF\"\n  fi\ndone\n\nIMG=\"$O/target/linux/ipq95xx/image/generic.mk\"\nif [ -f \"\
        $IMG\" ] && ! grep -q '^define Device/askey_sbe1v1k' \"$IMG\"; then\n  printf '%s\\n' \\\n    '' \\\n    '# SBE1V1K\
        \ engineering-only profile. DO NOT FLASH.' \\\n    '# DEVICE_DTS_CONFIG temporarily reuses the closest eMMC IPQ9574\
        \ reference' \\\n    '# only so Stage 17 can exercise the QSDK image pipeline; board-config parity' \\\n    '# must\
        \ be verified before any flashable release.' \\\n    'define Device/askey_sbe1v1k' \\\n    '\t$(call Device/FitImage)'\
        \ \\\n    '\t$(call Device/EmmcImage)' \\\n    '\tDEVICE_VENDOR := Askey' \\\n    '\tDEVICE_MODEL := SBE1V1K' \\\n\
        \    '\tDEVICE_DTS := ipq9574-sbe1v1k' \\\n    '\tDEVICE_DTS_CONFIG := config-rdp433-mht-phy' \\\n    '\tDEVICE_FLASH_TYPE\
        \ := emmc' \\\n    '\tDEVICE_BOARD_CONFIG := board-cfg-ipq9574' \\\n    '\tSOC := ipq9574' \\\n    '\tDEVICE_PACKAGES\
        \ += uboot-ipq9574-mmc board-cfg-ipq95xx' \\\n    'endef' \\\n    'TARGET_DEVICES += askey_sbe1v1k' >> \"$IMG\"\n\
        fi\n\n# Bring the standalone RTL826x firmware package into the tree if present.\nif [ -d \"$D/package/firmware/rtl826x-firmware\"\
        \ ]; then\n  rm -rf \"$O/package/firmware/rtl826x-firmware\"\n  cp -a \"$D/package/firmware/rtl826x-firmware\" \"\
        $O/package/firmware/rtl826x-firmware\"\n  echo \"rtl826x_firmware_package=COPIED\" > \"$OUT/rtl826x-status.txt\"\n\
        else\n  echo \"rtl826x_firmware_package=NOT_FOUND\" > \"$OUT/rtl826x-status.txt\"\nfi\n\n# Inventory remaining runtime-only\
        \ device support without blindly applying 6.18 patches to 6.6.\n{\n  echo \"=== SBE1V1K relevant source files ===\"\
        \n  find \"$D\" -type f | grep -Ei 'sbe1v1k|rtl8261|rtl826x' | sed \"s#^$D/##\" | sort || true\n  echo\n  echo \"\
        === SBE1V1K references ===\"\n  grep -RInE 'askey,sbe1v1k|askey_sbe1v1k|SBE1V1K|rtl8261n' \"$D/target\" \"$D/package\"\
        \ 2>/dev/null | head -n 5000 || true\n  echo\n  echo \"=== 6.18 patches touching SBE1V1K/RTL ===\"\n  grep -RIlE 'SBE1V1K|rtl8261n|RTL8261'\
        \ \"$D/target/linux/qualcommbe/patches-6.18\" 2>/dev/null | sort || true\n} > \"$OUT/remaining-runtime-support.txt\"\
        \n\necho \"$rc\" > \"$OUT/transplant-exit.txt\"\ngrep -nE 'askey_sbe1v1k|ipq9574-sbe1v1k' \"$IMG\" > \"$OUT/profile-lines.txt\"\
        \ 2>/dev/null || true\nfind \"$O/target/linux/ipq95xx/files-6.6\" -type f -name '*sbe1v1k*' -o -name '*SBE1V1K*' 2>/dev/null\
        \ | sort > \"$OUT/transplanted-files.txt\" || true\nexit 0\n"
    - name: Adapt SBE1V1K DTS to QSDK 6.6 label model
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nQDIR=\"\
        $O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\nDTS=\"$QDIR/ipq9574-sbe1v1k.dts\"\nmkdir -p \"$OUT\"\
        \n\nif [ ! -f \"$DTS\" ]; then\n  echo \"missing transplanted DTS: $DTS\" | tee \"$OUT/dts-adapt.log\"\n  echo 90\
        \ > \"$OUT/dts-adapt-exit.txt\"\n  exit 0\nfi\n\n# Inventory the actual QSDK 6.6 label model before touching the board\
        \ DTS.\n{\n  echo '=== QSDK IPQ9574 DTS/DTSI files ==='\n  find \"$QDIR\" -maxdepth 1 -type f \\( -name 'ipq9574*.dts'\
        \ -o -name 'ipq9574*.dtsi' \\) -printf '%f\\n' | sort\n  echo\n  echo '=== PCIe controller labels ==='\n  grep -RInE\
        \ '^[[:space:]]*[A-Za-z0-9_]+:[[:space:]]*(pci|pcie)@' \"$QDIR\"/ipq9574*.dts* 2>/dev/null || true\n  echo\n  echo\
        \ '=== PPE-like labels/nodes ==='\n  grep -RInEi '^[[:space:]]*[A-Za-z0-9_]+:.*(ppe|ethernet)|compatible.*(ppe|ess)|ethernet-ports'\
        \ \"$QDIR\"/ipq9574*.dts* 2>/dev/null | head -n 1200 || true\n  echo\n  echo '=== clock labels ==='\n  grep -RInE\
        \ '^[[:space:]]*(ref_48mhz_clk|xo_board_clk|xo_clk):' \"$QDIR\"/ipq9574*.dts* 2>/dev/null || true\n} > \"$OUT/qsdk-dts-label-inventory.txt\"\
        \n\npython3 - \"$DTS\" \"$QDIR\" \"$OUT\" <<'PY'\nimport re, sys, pathlib, json\np=pathlib.Path(sys.argv[1]); qdir=pathlib.Path(sys.argv[2]);\
        \ out=pathlib.Path(sys.argv[3])\ntext=p.read_text(errors='replace')\norig=text\n\n# Labels provided by ipq9574 base\
        \ DTSI files in this QSDK target.\nbase_files=sorted(qdir.glob('ipq9574*.dtsi'))\nbase='\\n'.join(x.read_text(errors='replace')\
        \ for x in base_files)\nlabels=set(re.findall(r'(?m)^\\s*([A-Za-z_][A-Za-z0-9_]*):\\s*[^;\\n{]+\\{', base))\n\n# Find\
        \ controller labels by node-name, preserving source order.\npcie_labels=[]\nfor m in re.finditer(r'(?m)^\\s*([A-Za-z_][A-Za-z0-9_]*):\\\
        s*pcie@[0-9a-fA-Fx]+\\s*\\{', base):\n    if m.group(1) not in pcie_labels:\n        pcie_labels.append(m.group(1))\n\
        \n# Helper: find and remove a top-level '&label { ... };' override block.\ndef find_override(s,label):\n    m=re.search(r'(?m)^\\\
        s*&'+re.escape(label)+r'\\s*\\{',s)\n    if not m: return None\n    start=m.start(); brace=s.find('{',m.start());\
        \ depth=0; i=brace\n    in_str=False; esc=False\n    while i < len(s):\n        c=s[i]\n        if in_str:\n     \
        \       if esc: esc=False\n            elif c=='\\\\': esc=True\n            elif c=='\"': in_str=False\n        else:\n\
        \            if c=='\"': in_str=True\n            elif c=='{': depth+=1\n            elif c=='}':\n              \
        \  depth-=1\n                if depth==0:\n                    j=i+1\n                    while j<len(s) and s[j].isspace():\
        \ j+=1\n                    if j<len(s) and s[j]==';': j+=1\n                    while j<len(s) and s[j] in ' \\t\\\
        r': j+=1\n                    if j<len(s) and s[j]=='\\n': j+=1\n                    return start,j,s[start:j]\n \
        \       i+=1\n    return None\n\nactions=[]\nremoved=[]\n\n# Stage 6 proved that QSDK13 does not use upstream pcie1/2/3\
        \ controller labels.\n# Its native IPQ9574/RDP433 board DTS uses pcie1_x1, pcie2_x2 and pcie3_x2.\n# Map the SBE1V1K\
        \ upstream overrides onto those native QSDK labels while preserving\n# all Wi-Fi child nodes for compile validation.\n\
        pcie_labels={'pcie1':'pcie1_x1','pcie2':'pcie2_x2','pcie3':'pcie3_x2'}\nfor old,newlab in pcie_labels.items():\n \
        \   if re.search(r'(?m)^\\s*&'+re.escape(old)+r'\\s*\\{', text):\n        text=re.sub(r'(?m)^(\\s*)&'+re.escape(old)+r'(\\\
        s*\\{)', r'\\1&'+newlab+r'\\2', text, count=1)\n        actions.append({'type':'pcie-qsdk-label-map','from':old,'to':newlab})\n\
        \n# QSDK 6.6 may not expose the upstream fixed-clock labels. They are only board\n# overrides, so drop them for compile\
        \ validation and retain an audit record.\nfor lab in ['ref_48mhz_clk','xo_board_clk','xo_clk']:\n    if lab not in\
        \ labels:\n        found=find_override(text,lab)\n        if found:\n            a,b,blk=found; removed.append((lab,blk));\
        \ text=text[:a]+text[b:]\n            actions.append({'type':'remove-missing-clock-override','label':lab})\n\n# The\
        \ upstream SBE1V1K DTS models wired ports under &qcom_ppe. QSDK13 often owns\n# PPE/port topology through its board-config/SSDK\
        \ path instead. If qcom_ppe is not\n# present in the QSDK base DTSI, remove this override only for Stage 17 compile\n\
        # validation; save the whole block for later board-config parity work.\nif 'qcom_ppe' not in labels:\n    found=find_override(text,'qcom_ppe')\n\
        \    if found:\n        a,b,blk=found; removed.append(('qcom_ppe',blk)); text=text[:a]+text[b:]\n        actions.append({'type':'remove-upstream-ppe-override','label':'qcom_ppe'})\n\
        \np.write_text(text)\n(out/'dts-adapt-actions.json').write_text(json.dumps(actions,indent=2))\n(out/'dts-adapt-removed.txt').write_text('\\\
        n\\n'.join('===== '+k+' =====\\n'+v for k,v in removed))\n(out/'dts-adapted.dts').write_text(text)\n(out/'dts-adapt-before.sha256').write_text(__import__('hashlib').sha256(orig.encode()).hexdigest()+'\\\
        n')\n(out/'dts-adapt-after.sha256').write_text(__import__('hashlib').sha256(text.encode()).hexdigest()+'\\n')\nprint('base_labels',len(labels))\n\
        print('pcie_labels',pcie_labels)\nprint('actions',actions)\nPY\nrc=$?\necho \"$rc\" > \"$OUT/dts-adapt-exit.txt\"\n\
        cat \"$OUT/dts-adapt-actions.json\" 2>/dev/null || true\nexit 0\n"
    - name: Resolve duplicate QSDK tzapp reserved-memory label
      id: tzapp-fix
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nDTS=\"\
        $O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts\"\nmkdir -p \"$OUT\"\nif [ ! -f \"\
        $DTS\" ]; then\n  echo 90 > \"$OUT/tzapp-fix-exit.txt\"\n  exit 0\nfi\npython3 - \"$DTS\" \"$OUT\" <<'PY'\nimport\
        \ pathlib, re, sys, json\np=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])\ntext=p.read_text(errors='replace')\n\
        pat=re.compile(r'(?ms)^[ \\t]*tzapp\\s*:\\s*tzapp@49[Bb]00000\\s*\\{.*?^[ \\t]*\\};\\s*')\nm=pat.search(text)\nresult={'found':\
        \ bool(m), 'action': 'none'}\nif m:\n    removed=m.group(0)\n    text=text[:m.start()]+text[m.end():]\n    p.write_text(text)\n\
        \    (out/'tzapp-removed.dtsfrag').write_text(removed)\n    result['action']='remove-board-local-duplicate-for-compile-validation'\n\
        \    result['board_node']='tzapp@49B00000'\n    result['conflicts_with']='QSDK base tzapp@49600000'\n(out/'tzapp-fix.json').write_text(json.dumps(result,indent=2)+'\\\
        n')\nprint(json.dumps(result,indent=2))\nPY\nrc=$?\necho \"$rc\" > \"$OUT/tzapp-fix-exit.txt\"\ncp \"$DTS\" \"$OUT/dts-after-tzapp-fix.dts\"\
        \ 2>/dev/null || true\nexit 0\n"
    - name: Restore native QSDK q6 reserved-memory regions
      id: q6-memory
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nDTS=\"\
        $O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts\"\nQDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\
        \nmkdir -p \"$OUT\"\nif [ ! -f \"$DTS\" ] || [ ! -d \"$QDIR\" ]; then\n  echo 90 > \"$OUT/q6-memory-fix-exit.txt\"\
        \n  exit 0\nfi\npython3 - \"$DTS\" \"$QDIR\" \"$OUT\" <<'PY'\nimport pathlib, re, sys, json, hashlib\nboard = pathlib.Path(sys.argv[1])\n\
        qdir = pathlib.Path(sys.argv[2])\nout = pathlib.Path(sys.argv[3])\ntext = board.read_text(errors='replace')\n\ndef\
        \ brace_block(s, start):\n    i = s.find('{', start)\n    if i < 0:\n        return None\n    depth = 0\n    in_str\
        \ = False\n    esc = False\n    line_comment = False\n    block_comment = False\n    j = i\n    while j < len(s):\n\
        \        c = s[j]\n        n = s[j+1] if j+1 < len(s) else ''\n        if line_comment:\n            if c == '\\n':\n\
        \                line_comment = False\n        elif block_comment:\n            if c == '*' and n == '/':\n      \
        \          block_comment = False\n                j += 1\n        elif in_str:\n            if esc:\n            \
        \    esc = False\n            elif c == '\\\\':\n                esc = True\n            elif c == '\"':\n       \
        \         in_str = False\n        else:\n            if c == '/' and n == '/':\n                line_comment = True\n\
        \                j += 1\n            elif c == '/' and n == '*':\n                block_comment = True\n         \
        \       j += 1\n            elif c == '\"':\n                in_str = True\n            elif c == '{':\n         \
        \       depth += 1\n            elif c == '}':\n                depth -= 1\n                if depth == 0:\n     \
        \               k = j + 1\n                    while k < len(s) and s[k] in ' \\t\\r':\n                        k\
        \ += 1\n                    if k < len(s) and s[k] == ';':\n                        k += 1\n                    while\
        \ k < len(s) and s[k] in ' \\t\\r':\n                        k += 1\n                    if k < len(s) and s[k] ==\
        \ '\\n':\n                        k += 1\n                    return start, k, s[start:k]\n        j += 1\n    return\
        \ None\n\nlabels = [\"q6_region\", \"q6_etr_region\"]\nfound = {}\nhits = []\n\ncandidates = sorted(\n    [p for p\
        \ in qdir.rglob(\"ipq9574*.dts*\") if p.resolve() != board.resolve()],\n    key=lambda p: (0 if \"rdp433\" in p.name.lower()\
        \ else 1, str(p))\n)\nfor p in candidates:\n    try:\n        s = p.read_text(errors='replace')\n    except Exception:\n\
        \        continue\n    for lab in labels:\n        if lab in found:\n            continue\n        m = re.search(r'(?m)^[\
        \ \\t]*' + re.escape(lab) + r'\\s*:\\s*[A-Za-z0-9,_@.+\\-]+\\s*\\{', s)\n        if not m:\n            continue\n\
        \        blk = brace_block(s, m.start())\n        if blk:\n            found[lab] = {\"source\": str(p.relative_to(qdir)),\
        \ \"block\": blk[2]}\n            hits.append(f\"{lab}\\t{p.relative_to(qdir)}\")\n\n(out / \"q6-memory-source-hits.txt\"\
        ).write_text(\"\\n\".join(hits) + (\"\\n\" if hits else \"\"))\n\n# Find the board root reserved-memory block and\
        \ insert missing native regions.\nrm = re.search(r'(?m)^[ \\t]*reserved-memory\\s*\\{', text)\ninjected = []\nif rm:\n\
        \    rb = brace_block(text, rm.start())\n    if rb:\n        a, b, block = rb\n        insert_at = block.rfind('}')\n\
        \        payload = \"\"\n        for lab in labels:\n            if re.search(r'(?m)^[ \\t]*' + re.escape(lab) + r'\\\
        s*:', block):\n                continue\n            if lab in found:\n                native = found[lab][\"block\"\
        ]\n                native = \"\\n\".join(\"        \" + ln if ln.strip() else ln for ln in native.strip().splitlines())\n\
        \                payload += \"\\n\" + native + \"\\n\"\n                injected.append(lab)\n        if payload:\n\
        \            new_block = block[:insert_at] + payload + block[insert_at:]\n            text = text[:a] + new_block\
        \ + text[b:]\n            board.write_text(text)\n\nresult = {\n    \"required\": labels,\n    \"found\": {k: v[\"\
        source\"] for k, v in found.items()},\n    \"injected\": injected,\n    \"complete\": all(x in injected or re.search(r'(?m)^[\
        \ \\t]*'+re.escape(x)+r'\\s*:', text) for x in labels),\n    \"sha256\": hashlib.sha256(text.encode()).hexdigest(),\n\
        }\n(out / \"q6-memory-fix.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n(out / \"dts-after-q6-memory-fix.dts\"\
        ).write_text(text)\nprint(json.dumps(result, indent=2))\nsys.exit(0 if result[\"complete\"] else 2)\nPY\nrc=$?\necho\
        \ \"$rc\" > \"$OUT/q6-memory-fix-exit.txt\"\nexit 0\n"
    - name: Fix Linux 6.6 Realtek PHY package path
      id: realtek-path
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nMK=\"\
        $O/package/kernel/linux/modules/netdevices.mk\"\nmkdir -p \"$OUT\"\n\nif [ ! -f \"$MK\" ]; then\n  echo 90 > \"$OUT/realtek-path-fix-exit.txt\"\
        \n  exit 0\nfi\n\ncp \"$MK\" \"$OUT/netdevices.mk.before\"\npython3 - \"$MK\" \"$OUT\" <<'PY'\nimport pathlib, sys,\
        \ json, re\nmk = pathlib.Path(sys.argv[1])\nout = pathlib.Path(sys.argv[2])\ns = mk.read_text(errors=\"replace\")\n\
        before = s\ns, n = re.subn(\n    r'drivers/net/phy/realtek/realtek\\.ko',\n    'drivers/net/phy/realtek.ko',\n   \
        \ s\n)\nmk.write_text(s)\nresult = {\n    \"replacement_count\": n,\n    \"changed\": s != before,\n    \"new_path_present\"\
        : \"drivers/net/phy/realtek.ko\" in s,\n    \"old_path_present\": \"drivers/net/phy/realtek/realtek.ko\" in s,\n}\n\
        (out / \"realtek-path-fix.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\nprint(json.dumps(result, indent=2))\n\
        sys.exit(0 if result[\"new_path_present\"] and not result[\"old_path_present\"] else 2)\nPY\nrc=$?\ncp \"$MK\" \"\
        $OUT/netdevices.mk.after\"\necho \"$rc\" > \"$OUT/realtek-path-fix-exit.txt\"\ngrep -n -A14 -B4 'KernelPackage/phy-realtek'\
        \ \"$MK\" > \"$OUT/phy-realtek-package-block.txt\" 2>/dev/null || true\nexit 0\n"
    - name: Integrate exact QSDK13 NetFN and ECM client feed
      id: nss-clients-feed
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nW=\"$GITHUB_WORKSPACE/stage17-work\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nSRC=\"$W/nss-clients-feed\"\nURL=\"https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git\"\nCOMMIT=\"\
        0012113f650506cc9b350f67194caff19b03ad32\"\nmkdir -p \"$OUT\"\n\nrm -rf \"$SRC\"\ngit clone --filter=blob:none --no-checkout\
        \ \"$URL\" \"$SRC\" > \"$OUT/nss-clients-clone.log\" 2>&1\nrc=$?\nif [ \"$rc\" -ne 0 ]; then\n  echo \"$rc\" > \"\
        $OUT/nss-clients-feed-exit.txt\"\n  exit 0\nfi\n\ngit -C \"$SRC\" checkout \"$COMMIT\" >> \"$OUT/nss-clients-clone.log\"\
        \ 2>&1\ncrc=$?\ngit -C \"$SRC\" rev-parse HEAD > \"$OUT/nss-clients-commit.txt\" 2>/dev/null || true\n\n{\n  echo\
        \ \"requested_commit=$COMMIT\"\n  echo \"checkout_exit=$crc\"\n  echo \"actual_commit=$(cat \"$OUT/nss-clients-commit.txt\"\
        \ 2>/dev/null)\"\n} > \"$OUT/nss-clients-selected-ref.txt\"\n\nfind \"$SRC\" -maxdepth 2 -type f -name Makefile -printf\
        \ '%P\\n' \\\n  | grep -E 'qca-nss-(netfn|ecm)|flow' > \"$OUT/nss-clients-package-tree.txt\" || true\n\nif [ \"$crc\"\
        \ -ne 0 ] || \\\n   [ ! -f \"$SRC/qca-nss-netfn/Makefile\" ] || \\\n   [ ! -f \"$SRC/qca-nss-ecm/Makefile\" ]; then\n\
        \  echo 92 > \"$OUT/nss-clients-feed-exit.txt\"\n  exit 0\nfi\n\n# Register the exact local feed.\ngrep -v '^src-link\
        \ stage17_nss_clients ' \"$O/feeds.conf.default\" > \"$O/feeds.conf.default.tmp\" || true\nmv \"$O/feeds.conf.default.tmp\"\
        \ \"$O/feeds.conf.default\"\necho \"src-link stage17_nss_clients $SRC\" >> \"$O/feeds.conf.default\"\n\ncd \"$O\"\n\
        ./scripts/feeds update stage17_nss_clients > \"$OUT/nss-clients-feeds-update.log\" 2>&1\nurc=$?\n./scripts/feeds install\
        \ -p stage17_nss_clients -f \\\n  qca-nss-netfn qca-nss-netfn-pkt-steer qca-nss-ecm \\\n  > \"$OUT/nss-clients-feeds-install.log\"\
        \ 2>&1\nirc=$?\n\n{\n  echo \"update=$urc\"\n  echo \"install=$irc\"\n  echo \"netfn=$(test -e package/feeds/stage17_nss_clients/qca-nss-netfn\
        \ && echo yes || echo no)\"\n  echo \"netfn_pkt_steer=$(test -e package/feeds/stage17_nss_clients/qca-nss-netfn-pkt-steer\
        \ && echo yes || echo no)\"\n  echo \"ecm=$(test -e package/feeds/stage17_nss_clients/qca-nss-ecm && echo yes || echo\
        \ no)\"\n} > \"$OUT/nss-clients-feed-status.txt\"\n\nif [ \"$urc\" -eq 0 ] && [ \"$irc\" -eq 0 ] \\\n   && [ -e package/feeds/stage17_nss_clients/qca-nss-netfn\
        \ ] \\\n   && [ -e package/feeds/stage17_nss_clients/qca-nss-ecm ]; then\n  echo 0 > \"$OUT/nss-clients-feed-exit.txt\"\
        \nelse\n  echo 2 > \"$OUT/nss-clients-feed-exit.txt\"\nfi\nexit 0\n"
    - name: Restore QSDK local-development build helpers
      id: localdev
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nW=\"$GITHUB_WORKSPACE/stage17-work\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nQ=\"$W/qsdk-openwrt-repo\"\nURL=\"https://git.codelinaro.org/clo/qsdk/oss/system/openwrt_repo.git\"\nmkdir -p \"\
        $OUT\"\n\nrm -rf \"$Q\"\ngit clone --depth 1 \"$URL\" \"$Q\" > \"$OUT/localdev-clone.log\" 2>&1\ncrc=$?\n\nsrc=\"\"\
        \nif [ \"$crc\" -eq 0 ]; then\n  src=\"$Q/include/local-development.mk\"\nfi\n\n# If the shallow default branch lacks\
        \ it, fetch a QSDK13 tag and retry.\nif [ ! -f \"$src\" ]; then\n  tag=\"$(git ls-remote --tags \"$URL\" 'refs/tags/NHSS.QSDK.13*'\
        \ 2>/dev/null \\\n      | sed 's#refs/tags/##' | sed 's/\\^{}//' | awk '{print $2}' | sort -V | tail -n1)\"\n  echo\
        \ \"fallback_tag=$tag\" > \"$OUT/localdev-ref.txt\"\n  if [ -n \"$tag\" ]; then\n    rm -rf \"$Q\"\n    git clone\
        \ --depth 1 --branch \"$tag\" \"$URL\" \"$Q\" >> \"$OUT/localdev-clone.log\" 2>&1\n    src=\"$Q/include/local-development.mk\"\
        \n  fi\nelse\n  echo \"fallback_tag=default-branch\" > \"$OUT/localdev-ref.txt\"\nfi\n\nif [ ! -f \"$src\" ]; then\n\
        \  echo 91 > \"$OUT/local-development-exit.txt\"\n  exit 0\nfi\n\ncp \"$src\" \"$OUT/local-development.mk.original\"\
        \ncp \"$src\" \"$O/include/local-development.mk\"\n\n# Adapt QSDK's expected local source root to this workflow layout\
        \ where the\n# exact nss-clients checkout is a sibling of the OpenWrt tree.\npython3 - \"$O/include/local-development.mk\"\
        \ <<'PY'\nfrom pathlib import Path\nimport sys\np = Path(sys.argv[1])\ns = p.read_text(errors=\"replace\")\nrepls\
        \ = [\n    (\"$(TOPDIR)/qca/src/$(PKG_NAME)\", \"$(TOPDIR)/../nss-clients-feed/$(PKG_NAME)\"),\n    (\"$(TOPDIR)/qca/src/$(PKG_NAME)/\"\
        , \"$(TOPDIR)/../nss-clients-feed/$(PKG_NAME)/\"),\n]\nfor a,b in repls:\n    s = s.replace(a,b)\n# Avoid dirty working-tree\
        \ suffixes creating unstable package versions.\ns = s.replace(\"git describe --dirty\", \"git describe\")\np.write_text(s)\n\
        PY\n\ncp \"$O/include/local-development.mk\" \"$OUT/local-development.mk.adapted\"\n{\n  echo \"exists=$(test -f \"\
        $O/include/local-development.mk\" && echo true || echo false)\"\n  echo \"nss_source_root=$(realpath \"$W/nss-clients-feed\"\
        \ 2>/dev/null)\"\n  grep -nE 'qca/src|nss-clients-feed|git describe|LOCAL' \"$O/include/local-development.mk\" | head\
        \ -n 120 || true\n} > \"$OUT/local-development-status.txt\"\n\n# Snapshot the problematic package wrappers before\
        \ build.\nfor d in qca-nss-netfn qca-nss-netfn-pkt-steer qca-nss-ecm emesh-sp; do\n  [ -f \"$W/nss-clients-feed/$d/Makefile\"\
        \ ] || continue\n  cp \"$W/nss-clients-feed/$d/Makefile\" \"$OUT/${d}-Makefile.txt\"\ndone\n\necho 0 > \"$OUT/local-development-exit.txt\"\
        \nexit 0\n"
    - name: Configure SBE1V1K QSDK13 engineering profile
      id: config
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/config\"\ncd \"\
        $O\" || { echo 90 > \"$OUT/config-exit.txt\"; exit 0; }\n\ncat > .config <<'EOF'\nCONFIG_TARGET_ipq95xx=y\nCONFIG_TARGET_ipq95xx_generic=y\n\
        CONFIG_TARGET_ipq95xx_generic_DEVICE_askey_sbe1v1k=y\nCONFIG_DEVEL=y\nCONFIG_BUILD_LOG=y\nCONFIG_CCACHE=y\nCONFIG_PACKAGE_kmod-qca-ssdk-qca-nohnat=y\n\
        CONFIG_PACKAGE_kmod-qca-nss-phy=y\nCONFIG_PACKAGE_kmod-qca-nss-dp-qca=y\nCONFIG_PACKAGE_kmod-qca-nss-ppe=y\nEOF\n\n\
        # Select copied RTL826x firmware only if its package symbol exists after metadata generation.\nmake defconfig > \"\
        $OUT/defconfig-pass1.log\" 2>&1\nrc=$?\n\n# Enable native QSDK13 NetFN / ECM packages only when their symbols exist.\n\
        for sym in   CONFIG_PACKAGE_kmod-qca-nss-netfn   CONFIG_PACKAGE_kmod-qca-nss-netfn-pkt-steer   CONFIG_PACKAGE_kmod-qca-nss-ecm\
        \   CONFIG_PACKAGE_qca-nss-ecm; do\n  key=\"${sym#CONFIG_}\"\n  if grep -q \"$key\" tmp/.config-package.in 2>/dev/null;\
        \ then\n    echo \"$sym=y\" >> .config\n  fi\ndone\nmake defconfig > \"$OUT/defconfig-netfn-ecm.log\" 2>&1\nrc_ne=$?\n\
        [ \"$rc_ne\" -ne 0 ] && rc=$rc_ne\n\n# Second pass after Stage17 local nss-clients feed integration:\n# enable exact\
        \ package symbols actually exposed by the selected QSDK13 tag.\nfor key in \\\n  PACKAGE_kmod-qca-nss-netfn \\\n \
        \ PACKAGE_kmod-qca-nss-netfn-pkt-steer \\\n  PACKAGE_kmod-qca-nss-ecm \\\n  PACKAGE_qca-nss-ecm; do\n  if grep -q\
        \ \"^config $key$\" tmp/.config-package.in 2>/dev/null; then\n    echo \"CONFIG_${key}=y\" >> .config\n  fi\ndone\n\
        make defconfig > \"$OUT/defconfig-stage14-netfn-ecm.log\" 2>&1\nrc_ne2=$?\n[ \"$rc_ne2\" -ne 0 ] && rc=$rc_ne2\nif\
        \ grep -Rqs 'Package/rtl826x-firmware' package/firmware/rtl826x-firmware 2>/dev/null; then\n  echo 'CONFIG_PACKAGE_rtl826x-firmware=y'\
        \ >> .config\n  make defconfig > \"$OUT/defconfig-pass2.log\" 2>&1\n  rc2=$?\n  [ \"$rc2\" -ne 0 ] && rc=$rc2\nfi\n\
        \necho \"$rc\" > \"$OUT/config-exit.txt\"\ncp .config \"$OUT/final.config\" 2>/dev/null || true\ngrep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_.*(qca|nss|ppe|ssdk|netfn|ecm|rtl826)|CONFIG_KERNEL_.*(NSS|PPE|EDMA))'\
        \ .config \\\n  > \"$OUT/selected-config.txt\" 2>/dev/null || true\ngrep -nEi 'askey_sbe1v1k|rtl826|qca-nss|nss-ppe|nss-dp|ssdk|netfn|flowmgr|ecm'\
        \ tmp/.config-package.in \\\n  > \"$OUT/available-kconfig.txt\" 2>/dev/null || true\nexit 0\n\n{\n  echo \"=== NetFN\
        \ / ECM selected symbols ===\"\n  grep -E '^CONFIG_PACKAGE_.*(qca-nss-netfn|qca-nss-ecm).*=[ym]$' .config || true\n\
        } > \"$OUT/netfn-ecm-selected.txt\"\n\n# Stage17: select the IPQ95xx/PPE connection-manager path explicitly.\n# On\
        \ IPQ95xx, ECM Premium selects PPE; legacy qca-nss-drv dependencies apply\n# only to older IPQ50xx/60xx/80xx targets.\n\
        for line in \\\n  'CONFIG_PACKAGE_kmod-qca-nss-flowmgr=y' \\\n  'CONFIG_PACKAGE_kmod-qca-nss-netfn-pkt-steer=y' \\\
        \n  'CONFIG_PACKAGE_kmod-qca-nss-ecm-premium=y'; do\n  key=\"${line%%=*}\"\n  sed -i \"/^${key}=.*/d;/^# ${key} is\
        \ not set/d\" .config\n  echo \"$line\" >> .config\ndone\n\nmake defconfig > \"$OUT/defconfig-stage17-flowmgr-ecm-premium.log\"\
        \ 2>&1\nrc17=$?\n[ \"$rc17\" -ne 0 ] && rc=$rc17\n\n{\n  grep -E '^CONFIG_PACKAGE_kmod-qca-nss-(flowmgr|netfn-pkt-steer|ecm-premium)=[ym]$'\
        \ .config || true\n  grep -E '^# CONFIG_PACKAGE_kmod-qca-nss-(flowmgr|netfn-pkt-steer|ecm-premium) is not set$' .config\
        \ || true\n} > \"$OUT/stage17-flowmgr-ecm-selection.txt\"\n"
    - name: Download all selected sources
      id: download
      continue-on-error: true
      shell: bash
      run: 'set +e

        O="$GITHUB_WORKSPACE/stage17-work/openwrt"

        OUT="$GITHUB_WORKSPACE/stage17-results/config"

        cd "$O" || { echo 90 > "$OUT/download-exit.txt"; exit 0; }

        make -j"$(nproc)" download V=s > "$OUT/download.log" 2>&1

        rc=$?

        echo "$rc" > "$OUT/download-exit.txt"

        grep -nE ''(ERROR|Error|failed|404|hash mismatch)'' "$OUT/download.log" | tail -n 300 > "$OUT/download-errors.txt"
        || true

        exit 0

        '
    - name: Import prepared host and toolchain cache
      id: cache-import
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nSRC=\"$GITHUB_WORKSPACE/stage16-work/openwrt/staging_dir\"\
        \nOUT=\"$GITHUB_WORKSPACE/stage17-results/bootstrap\"\nmkdir -p \"$OUT\" \"$O/staging_dir\"\nimported=0\nif [ -d \"\
        $SRC/host\" ]; then\n  rm -rf \"$O/staging_dir/host\"\n  cp -a \"$SRC/host\" \"$O/staging_dir/host\"\n  imported=1\n\
        fi\nshopt -s nullglob\nfor d in \"$SRC\"/toolchain-*; do\n  bn=\"$(basename \"$d\")\"\n  rm -rf \"$O/staging_dir/$bn\"\
        \n  cp -a \"$d\" \"$O/staging_dir/$bn\"\n  imported=1\ndone\necho \"$imported\" > \"$OUT/cache-imported.txt\"\necho\
        \ \"cache_hit=${{ steps.bootstrap-cache.outputs.cache-hit }}\" > \"$OUT/cache-status.txt\"\necho \"cache_imported=$imported\"\
        \ >> \"$OUT/cache-status.txt\"\nfind \"$O/staging_dir\" -maxdepth 3 -type f \\(-name m4 -o -name '*gcc' -o -name '*g++'\\\
        ) -printf '%p\\n' 2>/dev/null | head -n 80 >> \"$OUT/cache-status.txt\" || true\nexit 0\n"
    - name: Bootstrap host tools and toolchain
      id: bootstrap
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/bootstrap\"\ncd\
        \ \"$O\" || { echo 90 > \"$OUT/bootstrap-exit.txt\"; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\n\
        imported=$(cat \"$OUT/cache-imported.txt\" 2>/dev/null || echo 0)\nhost_ok=0\ntc_ok=0\n[ -x \"$O/staging_dir/host/bin/m4\"\
        \ ] && host_ok=1\ncomp=$(find \"$O/staging_dir\" -path '*/bin/aarch64-openwrt-linux-musl-gcc' -type f -perm -111 2>/dev/null\
        \ | head -n1)\n[ -n \"$comp\" ] && tc_ok=1\n\necho \"imported=$imported host_ok=$host_ok toolchain_ok=$tc_ok compiler=$comp\"\
        \ | tee \"$OUT/bootstrap-fastpath.txt\"\nif [ \"$imported\" = \"1\" ] && [ \"$host_ok\" = \"1\" ] && [ \"$tc_ok\"\
        \ = \"1\" ]; then\n  echo \"FASTPATH: restored Stage 11 host/toolchain cache; skip full bootstrap\" | tee \"$OUT/tools.log\"\
        \ \"$OUT/toolchain.log\"\n  trc=0\n  crc=0\nelse\n  echo \"CACHE MISS/INCOMPLETE: run normal bootstrap\" | tee \"\
        $OUT/bootstrap-fallback.txt\"\n  timeout 3600 make -j\"$(nproc)\" tools/install V=s > \"$OUT/tools.log\" 2>&1\n  trc=$?\n\
        \  timeout 5400 make -j\"$(nproc)\" toolchain/install V=s > \"$OUT/toolchain.log\" 2>&1\n  crc=$?\nfi\necho \"$trc\"\
        \ > \"$OUT/tools-exit.txt\"\necho \"$crc\" > \"$OUT/toolchain-exit.txt\"\nif [ \"$trc\" -eq 0 ] && [ \"$crc\" -eq\
        \ 0 ]; then rc=0; else rc=1; fi\necho \"$rc\" > \"$OUT/bootstrap-exit.txt\"\ngrep -nE '(^|[[:space:]])(error:|fatal\
        \ error:|No rule to make target|Error [0-9]+)' \"$OUT/tools.log\" \"$OUT/toolchain.log\" \\\n  | tail -n 300 > \"\
        $OUT/bootstrap-errors.txt\" || true\nexit 0\n"
    - name: Save prepared host toolchain cache for next fast rounds
      if: always()
      uses: actions/cache/save@v4
      with:
        path: 'stage17-work/openwrt/staging_dir/host

          stage17-work/openwrt/staging_dir/toolchain-*

          '
        key: qsdk66-bootstrap-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}-v11
    - name: Derive Ethernet V3 from native db-al02-c2 NSS-DP nodes
      id: ethernet_v3
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nQDIR=\"\
        $O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\nDTS=\"$QDIR/ipq9574-sbe1v1k.dts\"\nREF=\"$QDIR/ipq9574-db-al02-c2.dts\"\
        \nmkdir -p \"$OUT\"\nexec > >(tee \"$OUT/ethernet-v3.log\") 2>&1\nif [ ! -f \"$DTS\" ] || [ ! -f \"$REF\" ]; then\
        \ echo 90 > \"$OUT/ethernet-v3-exit.txt\"; exit 0; fi\ncp \"$REF\" \"$OUT/ipq9574-db-al02-c2.reference.dts\"\n\npython3\
        \ - \"$DTS\" \"$REF\" \"$OUT\" <<'PY'\nfrom pathlib import Path\nimport re,sys,json\ndst,ref,out=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3])\n\
        rt=ref.read_text(errors=\"replace\")\ndt=dst.read_text(errors=\"replace\")\n\ndef node_for_id(text,qid):\n    m=re.search(r'qcom,id\\\
        s*=\\s*<\\s*%d\\s*>\\s*;'%qid,text)\n    if not m: raise RuntimeError(\"reference qcom,id %d not found\"%qid)\n  \
        \  brace=text.rfind('{',0,m.start())\n    start=text.rfind('\\n',0,brace)+1\n    depth=0\n    for i in range(brace,len(text)):\n\
        \        if text[i]=='{': depth+=1\n        elif text[i]=='}':\n            depth-=1\n            if depth==0:\n \
        \               semi=text.find(';',i)\n                block=text[start:(semi+1 if semi!=-1 else i+1)]\n         \
        \       if 'compatible = \"qcom,nss-dp\"' not in block:\n                    raise RuntimeError(\"id %d is not inside\
        \ qcom,nss-dp\"%qid)\n                return block\n    raise RuntimeError(\"unterminated node\")\n\ntargets={3:(18,\"\
        qsgmii\"),4:(19,\"qsgmii\"),5:(28,\"usxgmii\"),6:(0,\"usxgmii\")}\norig=[]; derived=[]\nfor qid,(phy,mode) in targets.items():\n\
        \    b=node_for_id(rt,qid); orig.append(b)\n    b=re.sub(r'^(\\s*)[A-Za-z_][A-Za-z0-9_]*:\\s*',r'\\1',b,count=1)\n\
        \    if re.search(r'qcom,phy-mdio-addr\\s*=',b):\n        b=re.sub(r'qcom,phy-mdio-addr\\s*=\\s*<[^>]+>\\s*;',f'qcom,phy-mdio-addr\
        \ = <{phy}>;',b)\n    else: b=b.replace('{','{\\n\\tqcom,phy-mdio-addr = <%d>;' % phy,1)\n    if re.search(r'phy-mode\\\
        s*=',b):\n        b=re.sub(r'phy-mode\\s*=\\s*\"[^\"]+\"\\s*;',f'phy-mode = \"{mode}\";',b)\n    else: b=b.replace('{','{\\\
        n\\tphy-mode = \"%s\";' % mode,1)\n    derived.append(b)\n\n(out/\"nss-dp-reference-original.txt\").write_text(\"\\\
        n\\n\".join(orig))\n(out/\"nss-dp-v3-derived.txt\").write_text(\"\\n\\n\".join(derived))\nallq=\"\\n\".join(p.read_text(errors=\"\
        replace\") for p in dst.parent.glob(\"ipq9574*.dts*\"))\nif not re.search(r'(?m)^\\s*ess_switch\\s*:',allq):\n   \
        \ raise RuntimeError(\"native ess_switch label missing\")\n\ness='''\\n&ess_switch {\n        switch_mac_mode = <0x0b>;\n\
        \        switch_mac_mode1 = <0x0d>;\n        switch_mac_mode2 = <0x0d>;\n        qcom,port_phyinfo {\n           \
        \     port@2 { port_id = <3>; phy_address = <18>; };\n                port@3 { port_id = <4>; phy_address = <19>;\
        \ };\n                port@4 { port_id = <5>; phy_address = <28>; ethernet-phy-ieee802.3-c45; };\n               \
        \ port@5 { port_id = <6>; phy_address = <0>; ethernet-phy-ieee802.3-c45; };\n        };\n};\n'''\nfragment=ess+\"\\\
        n\\n\"+\"\\n\\n\".join(derived)+\"\\n\"\n(out/\"ethernet-v3-fragment.dtsi\").write_text(fragment)\ndst.write_text(dt+\"\
        \\n\\n/* Ethernet V3: NSS-DP nodes derived from native db-al02-c2 */\\n\"+fragment)\n(out/\"ipq9574-sbe1v1k-ethernet-v3.dts\"\
        ).write_text(dst.read_text())\n(out/\"ethernet-v3-map.json\").write_text(json.dumps({\"modes\":[\"0x0b\",\"0x0d\"\
        ,\"0x0d\"],\"ports\":targets},indent=2)+\"\\n\")\nPY\nrc=$?\necho \"$rc\" > \"$OUT/ethernet-v3-exit.txt\"\nif [ \"\
        $rc\" -eq 0 ]; then\n grep -nE 'switch_mac_mode|port_phyinfo|port_id|phy_address|qcom,nss-dp|qcom,id|qcom,phy-mdio-addr|phy-mode'\
        \ \"$DTS\" > \"$OUT/ethernet-v3-lines.txt\" || true\nfi\nexit 0\n"
    - name: Stage17 native DTB preflight + Linux 6.6 compile
      id: kernel
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/kernel\"\ncd \"\
        $O\" || { echo 90 > \"$OUT/kernel-exit.txt\"; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\nCLEAN_PATH=\"\
        $(printf '%s' \"$PATH\" | tr ':' '\\n' | grep -Fvx \"$O/staging_dir/host/bin\" | paste -sd: -)\"\nexport PATH=\"$CLEAN_PATH\"\
        \n{\n  echo \"PATH=$PATH\"\n  for x in bash git g++ rsync grep gzip perl file make; do\n    printf '%s=' \"$x\"\n\
        \    command -v \"$x\" || true\n  done\n} > \"$OUT/native-prereq-paths.txt\"\n\n# Use OpenWrt's native DTB target.\
        \ It depends on the kernel configured stamp,\n# so the build system creates the kernel .config before device-tree\
        \ compilation.\ntimeout 2700 make -j\"$(nproc)\" target/linux/dtb V=s > \"$OUT/dtb-preflight.log\" 2>&1\ndtbrc=$?\n\
        echo \"$dtbrc\" > \"$OUT/dtb-preflight-exit.txt\"\n\ngrep -nE '(ERROR \\(|error:|fatal error:|Reference to non-existent|Duplicate\
        \ label|syntax error|Error [0-9]+|No rule to make target)' \\\n  \"$OUT/dtb-preflight.log\" | tail -n 400 > \"$OUT/dtb-preflight-errors.txt\"\
        \ || true\n\nKDIR=\"$(find \"$O/build_dir\" -maxdepth 3 -type d -path '*linux-ipq95xx_generic/linux-6.6.47' | head\
        \ -n1)\"\n{\n  echo \"dtb_exit=$dtbrc\"\n  echo \"kdir=$KDIR\"\n  if [ -n \"$KDIR\" ] && [ -d \"$KDIR\" ]; then\n\
        \    echo \"kernel_config_exists=$(test -f \"$KDIR/.config\" && echo true || echo false)\"\n    [ -f \"$KDIR/.config\"\
        \ ] && {\n      echo \"kernel_config_size=$(stat -c %s \"$KDIR/.config\" 2>/dev/null || echo 0)\"\n      sha256sum\
        \ \"$KDIR/.config\" 2>/dev/null || true\n    }\n  fi\n} > \"$OUT/kernel-preflight-state.txt\"\n\nfind build_dir -type\
        \ f \\( -name 'ipq9574-sbe1v1k.dtb' -o -name '*sbe1v1k*.dtb' \\) \\\n  -printf '%p\\t%s bytes\\n' 2>/dev/null | sort\
        \ > \"$OUT/sbe1v1k-dtb.txt\" || true\ndtb_count=$(wc -l < \"$OUT/sbe1v1k-dtb.txt\" 2>/dev/null || echo 0)\necho \"\
        $dtb_count\" > \"$OUT/sbe1v1k-dtb-count.txt\"\n\nif [ \"$dtbrc\" -ne 0 ] || [ \"$dtb_count\" -eq 0 ]; then\n  final_rc=\"\
        $dtbrc\"\n  [ \"$final_rc\" -eq 0 ] && final_rc=98\n  echo \"$final_rc\" > \"$OUT/kernel-exit.txt\"\n  cp \"$OUT/dtb-preflight.log\"\
        \ \"$OUT/kernel-build.log\"\n  cp \"$OUT/dtb-preflight-errors.txt\" \"$OUT/kernel-errors.txt\"\n  tail -n 500 \"$OUT/dtb-preflight.log\"\
        \ > \"$OUT/kernel-tail.txt\" 2>/dev/null || true\nelse\n  echo \"NATIVE_DTB_PREFLIGHT=PASS\" > \"$OUT/dtb-preflight-pass.txt\"\
        \n  timeout 5400 make -j\"$(nproc)\" target/linux/compile V=s > \"$OUT/kernel-build.log\" 2>&1\n  rc=$?\n  echo \"\
        $rc\" > \"$OUT/kernel-exit.txt\"\n  grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make\
        \ target|Error [0-9]+)' \\\n    \"$OUT/kernel-build.log\" | tail -n 500 > \"$OUT/kernel-errors.txt\" || true\n  tail\
        \ -n 500 \"$OUT/kernel-build.log\" > \"$OUT/kernel-tail.txt\" 2>/dev/null || true\nfi\n\nfirst_dtb=$(awk 'NR==1{print\
        \ $1}' \"$OUT/sbe1v1k-dtb.txt\")\nif [ -n \"$first_dtb\" ] && [ -f \"$first_dtb\" ]; then\n  dtc -I dtb -O dts -o\
        \ \"$OUT/sbe1v1k-built.dts\" \"$first_dtb\" 2>\"$OUT/dtc-decompile.err\" || true\n  grep -nE 'model =|compatible =|ethernet-ports|wifi@|rtl826|qca8075|qca8081|mmc|reserved-memory|q6_'\
        \ \\\n    \"$OUT/sbe1v1k-built.dts\" > \"$OUT/sbe1v1k-built-keynodes.txt\" 2>/dev/null || true\nfi\nexit 0\n"
    - name: Audit Ethernet V3 final DTB
      if: always()
      shell: bash
      run: "set +e\nR=\"$GITHUB_WORKSPACE/stage17-results\"; B=\"$R/kernel/sbe1v1k-built.dts\"\nif [ -f \"$B\" ]; then\n grep\
        \ -nE 'switch_mac_mode|port_phyinfo|port_id|phy_address|qcom,nss-dp|qcom,id|qcom,phy-mdio-addr|phy-mode' \"$B\" >\
        \ \"$R/kernel/ethernet-v3-built-audit.txt\" || true\n n=\"$(grep -c 'compatible = \"qcom,nss-dp\"' \"$B\" 2>/dev/null\
        \ || echo 0)\"\nelse n=0; fi\ne=\"$(cat \"$R/device/ethernet-v3-exit.txt\" 2>/dev/null || echo 99)\"\nd=\"$(cat \"\
        $R/kernel/dtb-preflight-exit.txt\" 2>/dev/null || echo 99)\"\nk=\"$(cat \"$R/kernel/kernel-exit.txt\" 2>/dev/null\
        \ || echo 99)\"\nc=\"$(cat \"$R/kernel/sbe1v1k-dtb-count.txt\" 2>/dev/null || echo 0)\"\n{ echo \"ethernet_patch_exit=$e\"\
        ; echo \"dtb_preflight_exit=$d\"; echo \"kernel_exit=$k\"; echo \"sbe1v1k_dtb_count=$c\"; echo \"built_nss_dp_nodes=$n\"\
        ;\n if [ \"$e\" = 0 ] && [ \"$d\" = 0 ] && [ \"$k\" = 0 ] && [ \"$c\" -gt 0 ] && [ \"$n\" -ge 4 ]; then echo \"VERDICT=ETHERNET_V3_DTB_COMPILE_PASS\"\
        ; else echo \"VERDICT=ETHERNET_V3_NOT_VALIDATED\"; fi; } | tee \"$R/ETHERNET-V3-VERDICT.txt\"\nexit 0"
    - name: Upload Ethernet V3 evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SBE1V1K-QSDK66-Ethernet-DTS-V3-Stage17
        if-no-files-found: error
        retention-days: 14
        path: stage17-results/
    name: Stage 17 - Adapt SBE1V1K DTS on QSDK 6.6 and cascade
