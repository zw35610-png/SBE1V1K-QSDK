name: SBE1V1K V5.7A1.1 R9 Reserved Memory Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl subversion swig time jq zstd

      - name: Clone Stable Preview 2 source
        run: |
          git clone --depth 1 https://github.com/yintaomu/SBE1V1K-OpenWrt.git openwrt
          cd openwrt
          git rev-parse HEAD | tee ../SOURCE_COMMIT.txt

      - name: Apply V5.7A1.1 R9 reserved-memory experiment
        run: |
          echo '' | base64 -d > /tmp/a11_patch.py
          cd openwrt
          python3 /tmp/a11_patch.py
          git diff -- target/linux/qualcommbe | tee ../A1.1-DTS-DIFF.txt
          grep -R -n -E 'a11_qcn9224|a11_dma_pool|a11_mlo_global_mem|memory-region-names' target/linux/qualcommbe | tee ../A1.1-PATCH-CHECK.txt

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SBE1V1K
        run: |
          cd openwrt
          cp configs/sbe1v1k.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommbe=y' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx=y' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y' .config

      - name: Download sources
        run: |
          cd openwrt
          make -j8 download

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" world || make -j1 V=s world

      - name: Validate and collect firmware
        run: |
          set -euo pipefail
          OUT=openwrt/bin/targets/qualcommbe/ipq95xx
          SYS="$OUT/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-squashfs-sysupgrade.bin"
          test -s "$SYS"
          mkdir -p artifact/VALIDATION
          cp "$OUT"/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-* artifact/
          cp "$OUT"/*.manifest "$OUT"/config.buildinfo "$OUT"/profiles.json "$OUT"/version.buildinfo artifact/ 2>/dev/null || true
          cp SOURCE_COMMIT.txt A1.1-DTS-DIFF.txt A1.1-PATCH-CHECK.txt artifact/VALIDATION/
          find artifact -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | tee artifact/VALIDATION/SHA256SUMS
          file artifact/* | tee artifact/VALIDATION/file-types.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.7A1.1-R9-Reserved-Memory
          path: artifact/
          if-no-files-found: error
          retention-days: 7
