name: SBE1V1K NSS Linux 6.18 Compatibility Probe V2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget bc bzip2 libelf-dev liblzma-dev python3-dev time xxd zstd

      - name: Checkout proven SBE1V1K baseline
        run: |
          git clone https://github.com/luckkyboy/SBE1V1K.git openwrt
          cd openwrt
          git checkout 02fb9517c9aefac9f3825a15ae46e7998bae7edd
          test "$(git rev-parse HEAD)" = "02fb9517c9aefac9f3825a15ae46e7998bae7edd"

      - name: Configure baseline
        working-directory: openwrt
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp configs/sbe1v1k.config .config
          make defconfig
          make download -j"$(nproc)"

      - name: Prepare toolchain and kernel tree
        working-directory: openwrt
        run: |
          set -e
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          make -j"$(nproc)" tools/install V=s
          make -j"$(nproc)" toolchain/install V=s
          make -j"$(nproc)" target/linux/prepare V=s

          TOOLCHAIN_GCC="$(find staging_dir/toolchain-* -type f -name 'aarch64-openwrt-linux-musl-gcc' -print -quit)"
          if [ -z "$TOOLCHAIN_GCC" ]; then
            echo "ERROR: OpenWrt AArch64 cross compiler was not created."
            find staging_dir -maxdepth 3 -type f -name '*gcc*' | head -100 || true
            exit 1
          fi
          echo "Cross compiler: $TOOLCHAIN_GCC"
          "$TOOLCHAIN_GCC" --version | head -1

          KERNEL_TREE="$(find build_dir -path '*linux-qualcommbe_ipq95xx/linux-6.18*' -type d -print -quit)"
          if [ -z "$KERNEL_TREE" ]; then
            echo "ERROR: Linux 6.18 kernel tree was not prepared."
            exit 1
          fi
          echo "$KERNEL_TREE" | tee ../kernel-tree.txt

      - name: Fetch exact QSDK14 core sources
        run: |
          mkdir -p qsdk-src
          git clone https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git qsdk-src/qca-nss-phy
          git -C qsdk-src/qca-nss-phy checkout 16eec6ac35820cb67af59223e8b4c2dba7179655
          git clone https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git qsdk-src/qca-ssdk
          git -C qsdk-src/qca-ssdk checkout 717b74016b0c131575bcd81b9e039d3f7974b02a
          git clone https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git qsdk-src/nss-ppe
          git -C qsdk-src/nss-ppe checkout 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5
          git clone https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-dp.git qsdk-src/nss-dp
          git -C qsdk-src/nss-dp checkout 22555a9fce967f21f4772495844a5c2e0d501a95

      - name: Static Linux 6.18 compatibility audit
        run: |
          mkdir -p results
          {
            echo "=== exact revisions ==="
            for d in qca-nss-phy qca-ssdk nss-ppe nss-dp; do
              printf '%-16s ' "$d"
              git -C "qsdk-src/$d" rev-parse HEAD
            done
            echo
            echo "=== source scale ==="
            for d in qca-nss-phy qca-ssdk nss-ppe nss-dp; do
              printf '%-16s C/H files=' "$d"
              find "qsdk-src/$d" -type f \( -name '*.c' -o -name '*.h' \) | wc -l
            done
            echo
            echo "=== likely kernel API touchpoints ==="
            grep -RInE --include='*.c' --include='*.h' \
              'ndo_|net_device|phylink|phy_device|napi_|netif_|nf_|flow_offload|xfrm|genl_|proc_ops|timer_setup|class_create|devm_|of_' \
              qsdk-src/qca-nss-phy qsdk-src/qca-ssdk qsdk-src/nss-ppe qsdk-src/nss-dp | head -3000 || true
          } | tee results/static-audit.txt

      - name: Build-package feasibility map
        run: |
          mkdir -p results
          {
            echo "This probe deliberately does not inject QSDK packages into the proven board tree."
            echo "It records package/source assumptions first, so a port is attempted only if bounded."
            echo
            echo "=== Makefiles ==="
            find qsdk-src -maxdepth 4 -type f -name Makefile -print | sort
            echo
            echo "=== kernel version conditionals ==="
            grep -RInE --include='Makefile' --include='*.mk' --include='*.c' --include='*.h' \
              'LINUX_VERSION|KERNEL_VERSION|6\.6|6\.1|5\.15|5\.4|version_code|LINUX_VERSION_CODE' qsdk-src | head -2000 || true
          } | tee results/feasibility.txt

      - name: Create stop-go summary
        if: always()
        run: |
          mkdir -p results
          {
            echo "SBE1V1K baseline: 02fb9517c9aefac9f3825a15ae46e7998bae7edd"
            echo "Target kernel: Linux 6.18.x"
            echo "QSDK source baseline: NHSS.QSDK.14-era exact core commits"
            echo
            echo "This is a compatibility probe only; it produces NO flashable firmware."
            echo "V2 prepares OpenWrt tools/toolchain before target/linux/prepare."
            echo "Next step is allowed only after reviewing static-audit.txt and feasibility.txt."
          } | tee results/README.txt
          cp kernel-tree.txt results/ 2>/dev/null || true

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-NSS-6.18-Compatibility-Probe-V2
          path: results/
          if-no-files-found: warn
          retention-days: 14
