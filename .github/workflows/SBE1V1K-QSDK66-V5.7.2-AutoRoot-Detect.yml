name: SBE1V1K-QSDK66-V5.7.2-AutoRoot-Detect

on:
  workflow_dispatch:

env:
  BOARD: sbe1v1k
  SOC: ipq9574

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            flex \
            bison \
            libncurses-dev \
            zlib1g-dev \
            python3 \
            rsync \
            unzip \
            git \
            device-tree-compiler

      - name: Detect QSDK root directory
        shell: bash
        run: |
          echo "Searching QSDK root..."

          ROOT=$(find . -maxdepth 3 -name Makefile -type f | head -n 1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "No OpenWrt/QSDK Makefile found"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "QSDK_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Using root: $ROOT"

      - name: Show source tree
        run: |
          cd "$QSDK_ROOT"
          ls -la
          ls -la scripts || true

      - name: Update feeds
        run: |
          cd "$QSDK_ROOT"
          if [ -x ./scripts/feeds ]; then
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          else
            echo "feeds script not found"
          fi

      - name: Prepare configuration
        run: |
          cd "$QSDK_ROOT"

          if [ -f .config ]; then
            echo "Existing config found"
          else
            echo "Generating default config"
            make defconfig
          fi

      - name: Check NSS PPE
        run: |
          cd "$QSDK_ROOT"

          for p in qca-nss-dp qca-nss-ppe qca-ssdk qca-ecm; do
            echo "Checking $p"
            grep -R "$p" package/ 2>/dev/null || true
          done

      - name: Build packages
        run: |
          cd "$QSDK_ROOT"
          make package/compile V=s -j$(nproc)

      - name: Build firmware
        run: |
          cd "$QSDK_ROOT"
          make V=s -j$(nproc)

      - name: Verify images
        run: |
          cd "$QSDK_ROOT"
          find bin -type f | grep -E "factory|sysupgrade|img" || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-V5.7.2-Build
          path: |
            **/bin/**

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.7.2-failure-log
          path: |
            **/logs/**
            **/build_dir/**
