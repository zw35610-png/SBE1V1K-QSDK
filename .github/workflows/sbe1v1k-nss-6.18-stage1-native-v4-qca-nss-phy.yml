name: SBE1V1K NSS 6.18 Stage1 Native V4 qca-nss-phy

on:
  workflow_dispatch:

jobs:
  stage1-native-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget bc bzip2 libelf-dev liblzma-dev libdeflate-tools python3-dev time xxd zstd

      - name: Checkout proven SBE1V1K baseline
        run: |
          set -e
          git clone --filter=blob:none https://github.com/luckkyboy/SBE1V1K.git openwrt
          cd openwrt
          git checkout 02fb9517c9aefac9f3825a15ae46e7998bae7edd
          test "$(git rev-parse HEAD)" = "02fb9517c9aefac9f3825a15ae46e7998bae7edd"

      - name: Add IPQ NSS host feed
        run: |
          set -e
          git clone --depth=1 https://github.com/zilogic-systems/feed-ipq.git feed-ipq
          echo "feed-ipq commit: $(git -C feed-ipq rev-parse HEAD)" > feed-ipq-revision.txt
          test -d feed-ipq/feeds/nss-host/qca-nss-phy
          printf '\nsrc-link ipq_nss_host %s/feed-ipq/feeds/nss-host\n' "$GITHUB_WORKSPACE" >> openwrt/feeds.conf.default

      - name: Configure qca-nss-phy
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p ipq_nss_host qca-nss-phy
          cp configs/sbe1v1k.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-qca-nss-phy=m
          CONFIG_PACKAGE_kmod-qca8084=m
          CONFIG_PACKAGE_kmod-qca81xx=m
          CONFIG_PACKAGE_kmod-qca8xxx-phc=m
          EOF
          make defconfig
          mkdir -p ../results
          cp .config ../results/final.config

      - name: Pin Stage17 proven qca-nss-phy source
        working-directory: openwrt
        run: |
          set -e
          MF=package/feeds/ipq_nss_host/qca-nss-phy/Makefile
          cp "$MF" ../results/qca-nss-phy-package-Makefile.before-pin.txt
          sed -i -E 's/^(PKG_VERSION):=.*/\1:=5a70c334200fe4728be20a0f0aebf9c09519377c/' "$MF"
          sed -i -E 's/^(PKG_SOURCE_VERSION):=.*/\1:=5a70c334200fe4728be20a0f0aebf9c09519377c/' "$MF"
          sed -i -E 's/^(PKG_MIRROR_HASH):=.*/\1:=skip/' "$MF"
          grep -q '^PKG_VERSION:=5a70c334200fe4728be20a0f0aebf9c09519377c$' "$MF"
          grep -q '^PKG_SOURCE_VERSION:=5a70c334200fe4728be20a0f0aebf9c09519377c$' "$MF"
          cp "$MF" ../results/qca-nss-phy-package-Makefile.after-pin.txt

      - name: Prepare only required OpenWrt host tools
        working-directory: openwrt
        run: |
          set -e
          make -j"$(nproc)" tools/install V=s
          test -x staging_dir/host/bin/openssl
          test -x staging_dir/host/bin/libdeflate-gzip
          {
            echo "openssl=$(readlink -f staging_dir/host/bin/openssl)"
            staging_dir/host/bin/openssl version
            echo "libdeflate-gzip=$(readlink -f staging_dir/host/bin/libdeflate-gzip)"
          } | tee ../results/host-tools.txt

      - name: Prepare OpenWrt kernel tree
        working-directory: openwrt
        run: |
          set -e
          make -j"$(nproc)" toolchain/install V=s
          make -j"$(nproc)" target/linux/prepare V=s
          LINUX_DIR="$(find "$PWD/build_dir" -path '*linux-qualcommbe_ipq95xx/linux-6.18*' -type d -print -quit)"
          test -n "$LINUX_DIR"
          {
            echo "LINUX_DIR=$LINUX_DIR"
            if test -f "$LINUX_DIR/.config"; then
              echo "CONFIG=$(readlink -f "$LINUX_DIR/.config")"
              grep -E '^(CONFIG_ARM64|CONFIG_MODULES|CONFIG_NET)=' "$LINUX_DIR/.config" || true
            else
              echo "CONFIG=not-created-yet (normal after target/linux/prepare)"
            fi
          } | tee ../results/kernel-config.txt

      - name: Native qca-nss-phy compile
        working-directory: openwrt
        run: |
          set +e
          echo "=== OpenWrt-native qca-nss-phy compile, V4 ===" | tee ../results/compile.log
          make -j"$(nproc)" package/feeds/ipq_nss_host/qca-nss-phy/compile V=s 2>&1 | tee -a ../results/compile.log
          RC=${PIPESTATUS[0]}
          echo "COMPILE_EXIT_CODE=$RC" | tee -a ../results/compile.log

          find build_dir -type f \( -name 'qca-nss-phy.ko' -o -name 'qca8084-phy.ko' \
            -o -name 'qca81xx-phy.ko' -o -name 'qca8xxx-phc.ko' \) \
            -printf '%p %s bytes\n' | sort | tee ../results/outputs.txt

          grep -nEi '(^|[ :])(error:|fatal error:|undefined reference|implicit declaration|incompatible|too few arguments|too many arguments|no such file)' \
            ../results/compile.log | head -400 > ../results/errors.txt || true
          exit 0

      - name: Verdict
        if: always()
        run: |
          mkdir -p results
          cp feed-ipq-revision.txt results/ 2>/dev/null || true
          {
            echo "Stage1 Native V4: qca-nss-phy"
            echo "Baseline: 02fb9517c9aefac9f3825a15ae46e7998bae7edd"
            echo "Stage17 source pin: 5a70c334200fe4728be20a0f0aebf9c09519377c"
            echo
            if grep -q 'COMPILE_EXIT_CODE=0' results/compile.log 2>/dev/null; then
              echo "VERDICT=PASS"
            elif test -f results/compile.log; then
              echo "VERDICT=COMPILE_FAILED"
              echo "Inspect the earliest relevant line in errors.txt and compile.log."
            else
              echo "VERDICT=INFRA_FAILURE"
              echo "The qca-nss-phy compile step was not reached."
            fi
          } | tee results/README.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-NSS-6.18-Stage1-Native-V4-qca-nss-phy
          path: results/
          if-no-files-found: warn
          retention-days: 14
