name: SBE1V1K QSDK 6.6 Stage 3 - Native QSDK13 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_TAG: v24.10.2
  FEED_IPQ_BRANCH: ath.13.0
  DEVICE_BASE_COMMIT: 02fb9517c9aefac9f3825a15ae46e7998bae7edd
  QSDK14_R9_MATCH_TAG: NHSS.QSDK.14.0.r9-00034-O
  STOCK_PPE_COMMIT: 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5
  STOCK_SSDK_COMMIT: 717b74016b0c131575bcd81b9e039d3f7974b02a
  STOCK_PHY_COMMIT: 16eec6ac35820cb67af59223e8b4c2dba7179655
  STOCK_NSS_DP_COMMIT: 22555a9fce967f21f4772495844a5c2e0d501a95
  STOCK_ECM_COMMIT: e978478f5dba749d412e144b8f3e7b152687d893

jobs:
  native-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout current project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install OpenWrt build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl xsltproc libxml-parser-perl \
            python3-dev time jq patch quilt ccache zstd libelf-dev bc device-tree-compiler
          git --version
          gcc --version | head -n1
          python3 --version

      - name: Initialize Stage 3 workspace
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stage3-work stage3-results
          mkdir -p stage3-work stage3-results/{sources,integration,config,kernel,packages,device,summary}
          {
            echo "stage=QSDK-6.6-Stage2"
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "runner=$(uname -a)"
            echo "repo=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "openwrt_tag=${OPENWRT_TAG}"
            echo "feed_ipq_branch=${FEED_IPQ_BRANCH}"
            echo "qsdk14_r9_match_tag=${QSDK14_R9_MATCH_TAG}"
          } | tee stage3-results/environment.txt

      - name: Fetch OpenWrt 24.10.2, feed-ipq QSDK13 and SBE1V1K source
        id: sources
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          F="$GITHUB_WORKSPACE/stage3-work/feed-ipq"
          D="$GITHUB_WORKSPACE/stage3-work/sbe1v1k"
          OUT="$GITHUB_WORKSPACE/stage3-results/sources"

          clone_retry() {
            local name="$1" url="$2" ref="$3" dst="$4" log="$OUT/${name}-clone.log"
            rm -rf "$dst"
            local rc=1
            for n in 1 2 3; do
              echo "[$name] attempt=$n url=$url ref=$ref" | tee -a "$log"
              git clone --depth=1 --branch "$ref" "$url" "$dst" >>"$log" 2>&1
              rc=$?
              [ "$rc" -eq 0 ] && break
              rm -rf "$dst"
              sleep $((n * 8))
            done
            echo "$rc" > "$OUT/${name}-clone-exit.txt"
            if [ "$rc" -eq 0 ]; then
              git -C "$dst" rev-parse HEAD | tee "$OUT/${name}-commit.txt"
              git -C "$dst" log -1 --format=fuller > "$OUT/${name}-commit-log.txt"
            fi
            return 0
          }

          clone_retry openwrt https://github.com/openwrt/openwrt.git "$OPENWRT_TAG" "$O"
          clone_retry feed-ipq https://github.com/zilogic-systems/feed-ipq.git "$FEED_IPQ_BRANCH" "$F"

          rm -rf "$D"
          git init -q "$D"
          git -C "$D" remote add origin https://github.com/luckkyboy/SBE1V1K.git
          rc=1
          for n in 1 2 3; do
            git -C "$D" fetch --depth=1 origin "$DEVICE_BASE_COMMIT" >"$OUT/device-fetch.log" 2>&1
            rc=$?
            [ "$rc" -eq 0 ] && break
            sleep $((n * 8))
          done
          echo "$rc" > "$OUT/device-fetch-exit.txt"
          if [ "$rc" -eq 0 ]; then
            git -C "$D" checkout -q --detach FETCH_HEAD
            git -C "$D" rev-parse HEAD | tee "$OUT/device-commit.txt"
          fi

          {
            echo "=== source status ==="
            for x in "$OUT"/*-exit.txt; do [ -f "$x" ] && echo "$(basename "$x"): $(cat "$x")"; done
            echo
            echo "=== feed-ipq top tree ==="
            [ -d "$F" ] && find "$F" -maxdepth 3 -type d | sed "s#^$F##" | sort | head -n 800
          } > "$OUT/source-summary.txt"
          exit 0

      - name: Inventory native QSDK13 IPQ95xx stack before integration
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set +e
          F="$GITHUB_WORKSPACE/stage3-work/feed-ipq"
          OUT="$GITHUB_WORKSPACE/stage3-results/packages"
          if [ ! -d "$F" ]; then
            echo "feed-ipq missing" > "$OUT/feed-inventory.txt"
            exit 0
          fi

          find "$F/feeds" "$F/ipq-ext" -type f -name Makefile 2>/dev/null | sort > "$OUT/all-package-makefiles.txt"
          grep -RIlE 'qca-nss-ppe|qca-nss-dp|qca-nss-ecm|qca-ssdk|qca-nss-phy|netfn|flowmgr|ppe-drv|nss-dp' \
            "$F/feeds" "$F/ipq-ext" 2>/dev/null | sort > "$OUT/acceleration-files.txt" || true

          {
            echo "=== acceleration package Makefiles and source pins ==="
            while IFS= read -r f; do
              case "$f" in
                */Makefile)
                  echo "===== ${f#$F/} ====="
                  grep -nE 'PKG_NAME|PKG_VERSION|PKG_SOURCE_VERSION|PKG_SOURCE_URL|PKG_BRANCH|KernelPackage|DEPENDS|FILES.*\.ko|AUTOLOAD' "$f" | head -n 160 || true
                  ;;
              esac
            done < "$OUT/acceleration-files.txt"
          } > "$OUT/acceleration-pins.txt"

          {
            echo "=== IPQ95xx target ==="
            sed -n '1,220p' "$F/targets/ipq95xx/Makefile" 2>/dev/null || true
            echo
            echo "=== kernel details ==="
            cat "$F/targets/ipq95xx/kernel-6.6" 2>/dev/null || true
            echo
            echo "=== image profiles ==="
            sed -n '1,240p' "$F/targets/ipq95xx/image/generic.mk" 2>/dev/null || true
          } > "$OUT/ipq95xx-native-target.txt"

          grep -RInE 'dmac_(inv|clean|flush)_range(_no_dsb)?' "$F/targets/ipq95xx" "$F/feeds" 2>/dev/null \
            | head -n 1000 > "$OUT/dmac-api-hits.txt" || true
          exit 0

      - name: Integrate feed-ipq ath.13.0 into OpenWrt 24.10.2
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          F="$GITHUB_WORKSPACE/stage3-work/feed-ipq"
          OUT="$GITHUB_WORKSPACE/stage3-results/integration"
          rc=0

          if [ ! -d "$O" ] || [ ! -d "$F" ]; then
            echo "source tree missing" | tee "$OUT/integration.log"
            echo 90 > "$OUT/integration-exit.txt"
            exit 0
          fi

          exec > >(tee "$OUT/integration.log") 2>&1
          echo "=== apply feed-ipq OpenWrt 24.10 patches ==="
          : > "$OUT/patch-status.tsv"
          shopt -s nullglob
          mapfile -t patches < <(find "$F/patches/openwrt/24.10" -type f -name '*.patch' 2>/dev/null | sort)
          echo "patch_count=${#patches[@]}"
          for p in "${patches[@]}"; do
            name="$(basename "$p")"
            if git -C "$O" apply --check "$p" >/dev/null 2>&1; then
              git -C "$O" apply "$p"
              prc=$?
              echo -e "$name\tgit-apply\t$prc" >> "$OUT/patch-status.tsv"
              [ "$prc" -ne 0 ] && rc=1
            else
              (cd "$O" && patch -p1 --forward --batch < "$p")
              prc=$?
              echo -e "$name\tpatch-p1\t$prc" >> "$OUT/patch-status.tsv"
              [ "$prc" -ne 0 ] && rc=1
            fi
          done

          echo "=== install native ipq95xx target ==="
          rm -rf "$O/target/linux/ipq95xx"
          cp -a "$F/targets/ipq95xx" "$O/target/linux/ipq95xx"
          trc=$?
          echo "target_copy_exit=$trc"
          [ "$trc" -ne 0 ] && rc=2

          echo "=== add local feed roots ==="
          cp "$O/feeds.conf.default" "$OUT/feeds.conf.default.before"
          : > "$OUT/local-feeds-added.txt"
          idx=0
          for d in "$F"/feeds/*; do
            [ -d "$d" ] || continue
            name="ipq_$(basename "$d" | tr '.-' '__')"
            echo "src-link $name $d" >> "$O/feeds.conf.default"
            echo "$name $d" >> "$OUT/local-feeds-added.txt"
            idx=$((idx+1))
          done
          if [ -d "$F/ipq-ext" ]; then
            echo "src-link ipq_ext $F/ipq-ext" >> "$O/feeds.conf.default"
            echo "ipq_ext $F/ipq-ext" >> "$OUT/local-feeds-added.txt"
          fi
          cp "$O/feeds.conf.default" "$OUT/feeds.conf.default.after"
          echo "local_feed_count=$idx"

          echo "=== feeds update/install ==="
          (cd "$O" && ./scripts/feeds update -a) > "$OUT/feeds-update.log" 2>&1
          furc=$?
          echo "feeds_update_exit=$furc"
          [ "$furc" -ne 0 ] && rc=3
          (cd "$O" && ./scripts/feeds install -a) > "$OUT/feeds-install.log" 2>&1
          firc=$?
          echo "feeds_install_exit=$firc"
          [ "$firc" -ne 0 ] && rc=4

          echo "$rc" > "$OUT/integration-exit.txt"
          exit 0

      - name: Configure IPQ9574 QSDK13 baseline profile
        id: config
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          OUT="$GITHUB_WORKSPACE/stage3-results/config"
          if [ ! -d "$O/target/linux/ipq95xx" ]; then
            echo 90 > "$OUT/config-exit.txt"
            exit 0
          fi

          cd "$O"
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq95xx=y
          CONFIG_TARGET_ipq95xx_generic=y
          CONFIG_TARGET_ipq95xx_generic_DEVICE_qcom_rdp433-mht-phy=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_CCACHE=y
          EOF

          make defconfig > "$OUT/defconfig.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/config-exit.txt"
          cp .config "$OUT/final.config" 2>/dev/null || true
          grep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_.*(qca|nss|ppe|ssdk|netfn|ecm)|CONFIG_KERNEL_.*(NSS|PPE|EDMA))' .config \
            > "$OUT/selected-qca-config.txt" 2>/dev/null || true

          if [ -f tmp/.config-package.in ]; then
            grep -nEi 'qca-nss|nss-ppe|nss-dp|ssdk|netfn|flowmgr|ecm' tmp/.config-package.in \
              > "$OUT/available-qca-kconfig.txt" || true
          fi

          find package/feeds -maxdepth 3 -type l -o -type d 2>/dev/null | \
            grep -Ei 'qca|nss|ppe|ssdk|netfn|ecm' | sort > "$OUT/qca-feed-paths.txt" || true
          exit 0

      - name: Download baseline sources
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          OUT="$GITHUB_WORKSPACE/stage3-results/config"
          cd "$O" || { echo 90 > "$OUT/download-exit.txt"; exit 0; }
          make -j8 download V=s > "$OUT/download.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/download-exit.txt"
          tail -n 300 "$OUT/download.log" > "$OUT/download-tail.txt" 2>/dev/null || true
          exit 0

      - name: Bootstrap OpenWrt host tools and toolchain
        id: bootstrap
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          OUT="$GITHUB_WORKSPACE/stage3-results/bootstrap"
          mkdir -p "$OUT"
          cd "$O" || { echo 90 > "$OUT/bootstrap-exit.txt"; exit 0; }

          echo "=== host tool bootstrap ===" > "$OUT/bootstrap.log"
          timeout 3600 make -j"$(nproc)" tools/install V=s >> "$OUT/bootstrap.log" 2>&1
          tools_rc=$?
          echo "$tools_rc" > "$OUT/tools-exit.txt"

          echo "=== toolchain bootstrap ===" >> "$OUT/bootstrap.log"
          timeout 5400 make -j"$(nproc)" toolchain/install V=s >> "$OUT/bootstrap.log" 2>&1
          tc_rc=$?
          echo "$tc_rc" > "$OUT/toolchain-exit.txt"

          for f in staging_dir/host/bin/m4 staging_dir/host/bin/flex staging_dir/host/bin/libdeflate-gzip; do
            if [ -x "$f" ]; then
              echo -e "$f\tOK" >> "$OUT/host-tools.tsv"
            else
              echo -e "$f\tMISSING" >> "$OUT/host-tools.tsv"
            fi
          done

          if [ "$tools_rc" -eq 0 ] && [ "$tc_rc" -eq 0 ]; then rc=0; else rc=1; fi
          echo "$rc" > "$OUT/bootstrap-exit.txt"
          tail -n 500 "$OUT/bootstrap.log" > "$OUT/bootstrap-tail.txt" 2>/dev/null || true
          grep -nE '(^|[[:space:]])(error:|fatal error:|No rule to make target|Error [0-9]+)' "$OUT/bootstrap.log" \
            | tail -n 300 > "$OUT/bootstrap-errors.txt" || true
          exit 0

      - name: Build native Linux 6.6 IPQ95xx kernel
        id: kernel
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          OUT="$GITHUB_WORKSPACE/stage3-results/kernel"
          cd "$O" || { echo 90 > "$OUT/kernel-exit.txt"; exit 0; }

          timeout 5400 make -j"$(nproc)" target/linux/compile V=s > "$OUT/kernel-build.log" 2>&1
          rc=$?
          echo "$rc" > "$OUT/kernel-exit.txt"
          tail -n 500 "$OUT/kernel-build.log" > "$OUT/kernel-tail.txt" 2>/dev/null || true
          grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|Error [0-9]+)' \
            "$OUT/kernel-build.log" | tail -n 300 > "$OUT/kernel-errors.txt" || true

          find build_dir -maxdepth 4 -type f \( -name vmlinux -o -name Image -o -name '*.dtb' \) \
            -printf '%p\t%s bytes\n' 2>/dev/null | sort > "$OUT/kernel-artifacts.txt" || true

          KDIR="$(find build_dir -maxdepth 2 -type d -name 'linux-ipq95xx*' | head -n1)"
          echo "kernel_build_dir=$KDIR" > "$OUT/kernel-info.txt"
          if [ -n "$KDIR" ]; then
            find "$KDIR" -maxdepth 2 -type d | head -n 100 >> "$OUT/kernel-info.txt"
            grep -RInE 'dmac_(inv|clean|flush)_range(_no_dsb)?' "$KDIR" 2>/dev/null \
              | head -n 500 > "$OUT/dmac-built-kernel-hits.txt" || true
          fi
          exit 0

      - name: Batch-build discovered QSDK acceleration packages
        id: qca_packages
        continue-on-error: true
        shell: bash
        run: |
          set +e
          O="$GITHUB_WORKSPACE/stage3-work/openwrt"
          OUT="$GITHUB_WORKSPACE/stage3-results/packages"
          cd "$O" || { echo 90 > "$OUT/package-batch-exit.txt"; exit 0; }

          : > "$OUT/package-candidates.tsv"
          : > "$OUT/package-build-status.tsv"

          discover_group() {
            local group="$1" regex="$2"
            find -L package/feeds -type f -name Makefile 2>/dev/null | while read -r mf; do
              if grep -qiE "$regex" "$mf"; then
                dir="${mf%/Makefile}"
                echo -e "$group\t$dir" >> "$OUT/package-candidates.tsv"
              fi
            done
          }

          discover_group ssdk 'KernelPackage/(qca-)?ssdk|PKG_NAME.*ssdk'
          discover_group phy 'KernelPackage/qca-nss-phy|PKG_NAME.*qca-nss-phy'
          discover_group nss_dp 'KernelPackage/.*nss.*dp|PKG_NAME.*nss-dp'
          discover_group ppe 'KernelPackage/qca-nss-ppe|PKG_NAME.*nss-ppe'
          discover_group netfn 'KernelPackage/.*netfn|PKG_NAME.*netfn|flowmgr'
          discover_group ecm 'KernelPackage/.*ecm|PKG_NAME.*ecm'
          awk '!seen[$0]++' "$OUT/package-candidates.tsv" > "$OUT/package-candidates.unique.tsv"
          mv "$OUT/package-candidates.unique.tsv" "$OUT/package-candidates.tsv"

          overall=0
          for group in ssdk phy nss_dp ppe netfn ecm; do
            while IFS=$'\t' read -r g dir; do
              [ "$g" = "$group" ] || continue
              rel="${dir#./}"
              log="$OUT/build-${group}-$(basename "$dir").log"
              echo "===== BUILD $group :: $rel =====" | tee "$log"
              timeout 3600 make -j"$(nproc)" "$rel/compile" V=s >> "$log" 2>&1
              rc=$?
              echo -e "$group\t$rel\t$rc" | tee -a "$OUT/package-build-status.tsv"
              grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|undefined!|No rule to make target|Error [0-9]+)' \
                "$log" | tail -n 180 > "$log.errors" || true
              [ "$rc" -ne 0 ] && overall=1
            done < "$OUT/package-candidates.tsv"
          done

          find build_dir -type f -name '*.ko' -printf '%p\t%s bytes\n' 2>/dev/null | sort \
            > "$OUT/all-built-kos.txt" || true
          grep -Ei 'qca|nss|ppe|ssdk|netfn|ecm' "$OUT/all-built-kos.txt" \
            > "$OUT/qca-built-kos.txt" || true
          echo "$overall" > "$OUT/package-batch-exit.txt"
          exit 0

      - name: Audit SBE1V1K transplant surface for next cascade
        id: device_audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          D="$GITHUB_WORKSPACE/stage3-work/sbe1v1k"
          F="$GITHUB_WORKSPACE/stage3-work/feed-ipq"
          OUT="$GITHUB_WORKSPACE/stage3-results/device"
          if [ ! -d "$D" ]; then
            echo "device source missing" > "$OUT/transplant-audit.txt"
            exit 0
          fi

          {
            echo "=== SBE1V1K direct references ==="
            grep -RInE 'askey,sbe1v1k|askey_sbe1v1k|SBE1V1K|rtl8261n' \
              "$D/target" "$D/package" 2>/dev/null | head -n 3000 || true
            echo
            echo "=== device-specific files ==="
            find "$D" -type f | grep -Ei 'sbe1v1k|rtl8261|rtl826x' | sed "s#^$D/##" | sort || true
            echo
            echo "=== feed-ipq candidate IPQ9574 DTS ==="
            find "$F/targets/ipq95xx" -type f 2>/dev/null | grep -Ei '9574|rdp433|dts' | head -n 1000 || true
          } > "$OUT/transplant-audit.txt"

          cp "$D/target/linux/qualcommbe/dts/ipq9570-sbe1v1k.dts" "$OUT/ipq9570-sbe1v1k.dts" 2>/dev/null || true
          cp "$D/configs/sbe1v1k.config" "$OUT/sbe1v1k-6.18-reference.config" 2>/dev/null || true
          exit 0

      - name: Generate Stage 3 decision summary
        if: always()
        shell: bash
        run: |
          set +e
          R="$GITHUB_WORKSPACE/stage3-results"
          val() { [ -f "$1" ] && cat "$1" || echo NOT_RUN; }
          KRC="$(val "$R/kernel/kernel-exit.txt")"
          IRC="$(val "$R/integration/integration-exit.txt")"
          CRC="$(val "$R/config/config-exit.txt")"
          DRC="$(val "$R/config/download-exit.txt")"
          PRC="$(val "$R/packages/package-batch-exit.txt")"
          KOS="$(wc -l < "$R/packages/qca-built-kos.txt" 2>/dev/null || echo 0)"
          DMAC="$(wc -l < "$R/packages/dmac-api-hits.txt" 2>/dev/null || echo 0)"

          cat > "$R/stage3-summary.txt" <<EOF
          SBE1V1K QSDK 6.6 Stage 3 - Native QSDK13 Baseline
          ==================================================
          openwrt_tag: $OPENWRT_TAG
          feed_ipq_branch: $FEED_IPQ_BRANCH
          native_target_kernel: 6.6.47 (from feed-ipq target metadata)
          integration_exit: $IRC
          config_exit: $CRC
          download_exit: $DRC
          kernel_exit: $KRC
          qca_package_batch_exit: $PRC
          qca_ko_count: $KOS
          source_dmac_api_hits: $DMAC

          QSDK14 stock-lineage intersection selected for later comparison:
            tag: $QSDK14_R9_MATCH_TAG
            PPE: $STOCK_PPE_COMMIT
            SSDK: $STOCK_SSDK_COMMIT
            PHY: $STOCK_PHY_COMMIT
            NSS-DP: $STOCK_NSS_DP_COMMIT
            ECM: $STOCK_ECM_COMMIT

          Decision:
          - Bootstrap the complete OpenWrt host tools/toolchain first, then prove the native QSDK13/IPQ95xx Linux 6.6 kernel and acceleration packages can build.
          - Do not flash any Stage 3 output.
          - If kernel + QSDK acceleration packages build, Stage 3 transplants SBE1V1K hardware support and continues the same run toward a complete engineering image.
          - If only a few packages fail, Stage 3 batch-fixes all independent failures in one round.
          EOF

          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path('stage3-results')
          def read(p):
              q=r/p
              return q.read_text(errors='replace').strip() if q.exists() else 'NOT_RUN'
          data={
              'stage':'QSDK-6.6-Stage2',
              'openwrt_tag':'v24.10.2',
              'feed_ipq_branch':'ath.13.0',
              'integration_exit':read('integration/integration-exit.txt'),
              'config_exit':read('config/config-exit.txt'),
              'download_exit':read('config/download-exit.txt'),
              'kernel_exit':read('kernel/kernel-exit.txt'),
              'package_batch_exit':read('packages/package-batch-exit.txt'),
              'package_status':read('packages/package-build-status.tsv'),
          }
          (r/'stage3-summary.json').write_text(json.dumps(data,indent=2,ensure_ascii=False))
          PY

          echo "===== STAGE 2 SUMMARY ====="
          cat "$R/stage3-summary.txt"
          echo
          echo "===== PACKAGE STATUS ====="
          cat "$R/packages/package-build-status.tsv" 2>/dev/null || true
          echo
          echo "===== QCA KOS ====="
          cat "$R/packages/qca-built-kos.txt" 2>/dev/null || true

      - name: Pack Stage 3 diagnostics
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          du -ah stage3-results | sort -h > stage3-results/size-summary.txt || true
          tar -C stage3-results -czf SBE1V1K-QSDK-6.6-Stage2-results.tar.gz .
          ls -lh SBE1V1K-QSDK-6.6-Stage2-results.tar.gz

      - name: Upload Stage 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK-6.6-Stage2
          if-no-files-found: warn
          retention-days: 14
          path: |
            stage3-results/
            SBE1V1K-QSDK-6.6-Stage2-results.tar.gz
