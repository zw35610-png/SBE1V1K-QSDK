name: SBE1V1K V5.7A1 WiFi Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget bc \
            bzip2 libelf-dev liblzma-dev python3-dev \
            time xxd zstd

      - name: Clone SBE1V1K WiFi source
        run: |
          git clone --depth=1 https://github.com/yintaomu/SBE1V1K-OpenWrt.git openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee ../source-info.txt
          git log -1 --oneline | tee -a ../source-info.txt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SBE1V1K
        working-directory: openwrt
        run: |
          test -f configs/sbe1v1k.config
          cp configs/sbe1v1k.config .config
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommbe=y' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx=y' .config
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_askey_sbe1v1k=y' .config
          grep -E 'CONFIG_TARGET_qualcommbe|askey_sbe1v1k|ath12k|qcn9274' .config | tee ../config-summary.txt

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" world || make -j1 V=s world

      - name: Validate SBE1V1K images
        shell: bash
        run: |
          set -euo pipefail
          OUT="openwrt/bin/targets/qualcommbe/ipq95xx"
          test -d "$OUT"

          SYS="$(find "$OUT" -maxdepth 1 -type f -name '*askey_sbe1v1k*squashfs-sysupgrade.bin' | head -n1)"
          INIT="$(find "$OUT" -maxdepth 1 -type f -name '*askey_sbe1v1k*initramfs-uImage.itb' | head -n1)"

          test -n "$SYS"
          test -s "$SYS"
          test -n "$INIT"
          test -s "$INIT"

          echo "sysupgrade=$SYS"
          echo "initramfs=$INIT"

          mkdir -p validation/sysupgrade
          tar -tf "$SYS" | tee validation/sysupgrade-file-list.txt

          tar -tf "$SYS" | grep -qE '/CONTROL$'
          tar -tf "$SYS" | grep -qE '/kernel$'
          tar -tf "$SYS" | grep -qE '/root$'

          tar -xf "$SYS" -C validation/sysupgrade

          KERNEL="$(find validation/sysupgrade -type f -name kernel | head -n1)"
          ROOT="$(find validation/sysupgrade -type f -name root | head -n1)"

          test -s "$KERNEL"
          test -s "$ROOT"

          file "$SYS" "$INIT" "$KERNEL" "$ROOT" | tee validation/file-types.txt
          sha256sum "$OUT"/* | tee validation/SHA256SUMS
          ls -lh "$OUT" | tee validation/image-list.txt

          cp source-info.txt validation/
          cp config-summary.txt validation/

      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp -av openwrt/bin/targets/qualcommbe/ipq95xx/* firmware/
          cp -av validation firmware/VALIDATION

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.7A1-WiFi-Test
          path: firmware/
          if-no-files-found: error
          retention-days: 14
