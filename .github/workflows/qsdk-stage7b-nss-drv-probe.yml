name: SBE1V1K QSDK Stage7B NSS Driver Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git findutils grep sed curl jq

      - name: Prepare directories
        run: |
          mkdir -p results
          mkdir -p qsdk-probe

      - name: Clone official QSDK nss-host feed
        shell: bash
        run: |
          set +e
          set -o pipefail

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-host.git \
            qsdk-probe/nss-host \
            2>&1 | tee results/nss-host-clone.txt

          RC=${PIPESTATUS[0]}
          echo "$RC" > results/nss-host-clone-exit.txt

          exit 0

      - name: List QSDK14 R9 tags
        shell: bash
        run: |
          set +e

          {
            echo "===== QSDK14 R9 TAGS ====="

            git -C qsdk-probe/nss-host tag -l \
              | grep -Ei 'NHSS\.QSDK\.14\.0\.r9' \
              | sort -V

          } | tee results/r9-tags.txt

          exit 0

      - name: Select newest available R9 tag
        shell: bash
        run: |
          set +e

          TAG=$(git -C qsdk-probe/nss-host tag -l \
            | grep -Ei 'NHSS\.QSDK\.14\.0\.r9' \
            | sort -V \
            | tail -1)

          echo "SELECTED_TAG=$TAG" \
            | tee results/selected-tag.txt

          if [ -n "$TAG" ]; then
            git -C qsdk-probe/nss-host checkout "$TAG"

            git -C qsdk-probe/nss-host rev-parse HEAD \
              > results/selected-tag-commit.txt
          fi

          exit 0

      - name: Inspect qca-nss-drv package
        shell: bash
        run: |
          set +e

          {
            echo "===== QCA NSS DRV DIRECTORY ====="

            find qsdk-probe/nss-host \
              -maxdepth 3 \
              -type d \
              -iname '*nss*drv*' \
              -print

            echo ""
            echo "===== QCA NSS DRV FILES ====="

            find qsdk-probe/nss-host \
              -path '*qca-nss-drv*' \
              -type f \
              -print \
              | sort

          } > results/nss-drv-files.txt

          cat results/nss-drv-files.txt

          exit 0

      - name: Extract qca-nss-drv Makefile
        shell: bash
        run: |
          set +e

          MAKEFILE=$(find qsdk-probe/nss-host \
            -path '*qca-nss-drv*/Makefile' \
            -type f \
            -print -quit)

          echo "MAKEFILE=$MAKEFILE" \
            | tee results/nss-drv-makefile-location.txt

          if [ -n "$MAKEFILE" ]; then
            cp "$MAKEFILE" \
              results/qca-nss-drv-Makefile.txt
          fi

          exit 0

      - name: Extract source metadata
        shell: bash
        run: |
          set +e

          {
            echo "===== SOURCE METADATA ====="

            grep -RniE \
              'PKG_SOURCE|PKG_SOURCE_URL|PKG_VERSION|PKG_RELEASE|PKG_SOURCE_VERSION|PKG_MIRROR_HASH|PKG_NAME|PKG_BUILD_DIR' \
              qsdk-probe/nss-host/qca-nss-drv \
              2>/dev/null \
              | head -1000

          } > results/nss-drv-source-metadata.txt

          cat results/nss-drv-source-metadata.txt

          exit 0

      - name: Search feed for nss_debug header references
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS_DEBUG.H REFERENCES ====="

            grep -RniE \
              'nss_debug\.h|nss_debug|qca-nss-debug' \
              qsdk-probe/nss-host \
              --exclude-dir=.git \
              2>/dev/null \
              | head -3000

          } > results/nss-debug-feed-references.txt

          cat results/nss-debug-feed-references.txt

          exit 0

      - name: Search feed for source URLs
        shell: bash
        run: |
          set +e

          {
            echo "===== POSSIBLE SOURCE URLS ====="

            grep -RhiE \
              'https?://|git@|git://' \
              qsdk-probe/nss-host/qca-nss-drv \
              2>/dev/null \
              | sort -u \
              | head -1000

          } > results/nss-drv-source-urls.txt

          cat results/nss-drv-source-urls.txt

          exit 0

      - name: Inspect QSDK source variables
        shell: bash
        run: |
          set +e

          {
            echo "===== QSDK SOURCE VARIABLES ====="

            grep -RniE \
              'QCA_NSS|NSS_DRV|NSS_SOURCE|NSS_GIT|NSS.*URL|PKG_SOURCE_PROTO|PKG_SOURCE_VERSION' \
              qsdk-probe/nss-host \
              --exclude-dir=.git \
              2>/dev/null \
              | head -3000

          } > results/nss-source-variables.txt

          exit 0

      - name: Clone official CodeLinaro nss-drv
        shell: bash
        run: |
          set +e
          set -o pipefail

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-drv.git \
            qsdk-probe/nss-drv-src \
            2>&1 | tee results/nss-drv-clone.txt

          RC=${PIPESTATUS[0]}
          echo "$RC" > results/nss-drv-clone-exit.txt

          if [ -d qsdk-probe/nss-drv-src/.git ]; then
            git -C qsdk-probe/nss-drv-src rev-parse HEAD \
              > results/nss-drv-head.txt

            git -C qsdk-probe/nss-drv-src tag -l \
              | grep -Ei '14\.0|r9|NHSS' \
              | sort -V \
              > results/nss-drv-r9-tags.txt
          fi

          exit 0

      - name: Search nss-drv source for nss_debug.h
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS_DEBUG.H FILE ====="

            find qsdk-probe/nss-drv-src \
              -type f \
              -name 'nss_debug.h' \
              -print \
              2>/dev/null

            echo ""
            echo "===== RELATED DEBUG HEADERS ====="

            find qsdk-probe/nss-drv-src \
              -type f \
              \( \
                -iname '*nss*debug*.h' \
                -o -iname '*debug*.h' \
              \) \
              -print \
              2>/dev/null \
              | sort

          } > results/nss-debug-source-files.txt

          cat results/nss-debug-source-files.txt

          exit 0

      - name: Search nss-drv source references
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS DEBUG REFERENCES IN SOURCE ====="

            grep -RniE \
              'nss_debug\.h|nss_debug' \
              qsdk-probe/nss-drv-src \
              --exclude-dir=.git \
              2>/dev/null \
              | head -3000

          } > results/nss-debug-source-references.txt

          exit 0

      - name: Find public include directories
        shell: bash
        run: |
          set +e

          {
            echo "===== NSS DRIVER HEADER DIRECTORIES ====="

            find qsdk-probe/nss-drv-src \
              -type f \
              -name '*.h' \
              -printf '%h\n' \
              2>/dev/null \
              | sort -u

          } > results/nss-drv-header-dirs.txt

          exit 0

      - name: Produce Stage7B summary
        shell: bash
        run: |
          {
            echo "===== STAGE7B SUMMARY ====="
            echo ""

            TAG=$(grep '^SELECTED_TAG=' \
              results/selected-tag.txt \
              | cut -d= -f2-)

            echo "Selected nss-host tag: $TAG"
            echo ""

            DEBUG_HEADER=$(find qsdk-probe/nss-drv-src \
              -type f \
              -name 'nss_debug.h' \
              -print -quit \
              2>/dev/null)

            if [ -n "$DEBUG_HEADER" ]; then
              echo "nss_debug.h: FOUND"
              echo "Path: $DEBUG_HEADER"
              echo "Include directory: $(dirname "$DEBUG_HEADER")"
            else
              echo "nss_debug.h: NOT FOUND IN nss-drv"
            fi

            echo ""

            if [ -f results/qca-nss-drv-Makefile.txt ]; then
              echo "qca-nss-drv package Makefile: FOUND"
            else
              echo "qca-nss-drv package Makefile: NOT FOUND"
            fi

          } | tee results/stage7b-summary.txt

      - name: Upload Stage7B diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage7B-Probe
          path: results/
          retention-days: 7
