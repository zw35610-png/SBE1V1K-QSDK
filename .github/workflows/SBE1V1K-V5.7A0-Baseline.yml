name: SBE1V1K V5.7A0 Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/SBE1V1K-V5.7A0-Baseline.yml"
      - "configs/sbe1v1k-v5.7a0.config"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget bc bzip2 libelf-dev liblzma-dev \
            python3-dev time xxd zstd

      - name: Clone OpenWrt main
        run: |
          git clone --depth=1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --oneline

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SBE1V1K
        run: |
          cp configs/sbe1v1k-v5.7a0.config openwrt/.config
          cd openwrt
          make defconfig
          grep -E 'CONFIG_TARGET_qualcommbe|askey_sbe1v1k' .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -type f -print -delete || true

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" world || {
            echo "::warning::Parallel build failed; retrying single-threaded for a useful error log"
            make -j1 V=s world
          }

      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail
          OUT="openwrt/bin/targets/qualcommbe/ipq95xx"
          test -d "$OUT"

          mkdir -p artifact
          cp -av "$OUT"/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-* artifact/ || true
          cp -av "$OUT"/sha256sums artifact/ 2>/dev/null || true
          cp -av "$OUT"/profiles.json artifact/ 2>/dev/null || true
          cp -av "$OUT"/config.buildinfo artifact/ 2>/dev/null || true
          cp -av "$OUT"/feeds.buildinfo artifact/ 2>/dev/null || true
          cp -av "$OUT"/version.buildinfo artifact/ 2>/dev/null || true

          printf '%s\n' "$OPENWRT_COMMIT" > artifact/OPENWRT_COMMIT.txt
          (cd artifact && sha256sum openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-* > SBE1V1K-SHA256SUMS.txt)

          echo "=== SBE1V1K artifacts ==="
          ls -lh artifact

          test -n "$(find artifact -maxdepth 1 -name '*initramfs*uImage.itb' -print -quit)"
          test -n "$(find artifact -maxdepth 1 -name '*sysupgrade.bin' -print -quit)"

      - name: Upload V5.7A0 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.7A0-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
