name: SBE1V1K V0.2 QSDK Stage2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq

      - name: Clone SBE1V1K
        run: |
          git clone \
            https://github.com/luckkyboy/SBE1V1K.git \
            openwrt

          cd openwrt

          git checkout \
            02fb9517c9aefac9f3825a15ae46e7998bae7edd

          cp configs/sbe1v1k.config .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          make defconfig

      - name: Download OpenWrt sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Prepare toolchain and kernel
        shell: bash
        run: |
          set -o pipefail

          cd openwrt

          make tools/install -j$(nproc) \
            V=s 2>&1 | tee ../tools.log

          make toolchain/install -j$(nproc) \
            V=s 2>&1 | tee ../toolchain.log

          make target/linux/prepare -j$(nproc) \
            V=s 2>&1 | tee ../kernel-prepare.log

      - name: Fetch QSDK14 R9 sources
        run: |
          mkdir -p qsdk-src

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
            qsdk-src/qca-nss-ppe

          git -C qsdk-src/qca-nss-ppe checkout \
            87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
            qsdk-src/qca-ssdk

          git -C qsdk-src/qca-ssdk checkout \
            717b74016b0c131575bcd81b9e039d3f7974b02a

      - name: Locate OpenWrt kernel
        shell: bash
        run: |
          set -e

          mkdir -p results

          echo "===== BUILD DIR =====" \
            > results/environment.txt

          find openwrt/build_dir/target-* \
            -maxdepth 2 \
            -type d \
            -name 'linux-*' \
            | sort \
            >> results/environment.txt || true

          echo "" >> results/environment.txt
          echo "===== STAGING DIR =====" \
            >> results/environment.txt

          find openwrt/staging_dir \
            -maxdepth 1 \
            -type d \
            | sort \
            >> results/environment.txt

          echo "" >> results/environment.txt
          echo "===== CROSS COMPILERS =====" \
            >> results/environment.txt

          find openwrt/staging_dir \
            -type f \
            -name '*gcc' \
            | head -50 \
            >> results/environment.txt

          cat results/environment.txt

      - name: Inspect PPE build interface
        shell: bash
        run: |
          set +e

          {
            echo "===== PPE TOP MAKEFILE ====="
            cat qsdk-src/qca-nss-ppe/Makefile

            echo ""
            echo "===== PPE DRIVER MAKEFILE ====="
            cat qsdk-src/qca-nss-ppe/drv/ppe_drv/Makefile

            echo ""
            echo "===== SSDK BUILD FILES ====="

            find qsdk-src/qca-ssdk \
              -maxdepth 3 \
              -type f \
              \( -name Makefile -o -name '*.mk' \) \
              | sort

          } > results/build-interface.txt

      - name: Attempt PPE compile against Linux 6.18
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(find \
            openwrt/build_dir/target-*/linux-*/linux-6.18* \
            -maxdepth 0 \
            -type d \
            | head -1)

          TOOLCHAIN_DIR=$(find \
            openwrt/staging_dir \
            -maxdepth 1 \
            -type d \
            -name 'toolchain-aarch64*' \
            | head -1)

          CROSS=$(find \
            "$TOOLCHAIN_DIR/bin" \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            | head -1)

          CROSS_PREFIX="${CROSS%gcc}"

          echo "KERNEL_DIR=$KERNEL_DIR" \
            | tee results/compile-env.txt

          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" \
            | tee -a results/compile-env.txt

          echo "CROSS_COMPILE=$CROSS_PREFIX" \
            | tee -a results/compile-env.txt

          echo "Starting PPE compile test..."

          make \
            -C "$KERNEL_DIR" \
            M="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe/drv/ppe_drv" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            SoC=ipq95xx \
            CONFIG_NET_DSA=y \
            modules \
            V=1 \
            2>&1 | tee results/ppe-compile.log

          echo "${PIPESTATUS[0]}" \
            > results/ppe-exit-code.txt

          exit 0

      - name: Extract compiler errors
        if: always()
        shell: bash
        run: |
          {
            echo "===== PPE COMPILER ERRORS ====="

            grep -iE \
              'error:|fatal error:|undefined|implicit declaration|No such file|No rule to make target' \
              results/ppe-compile.log \
              | head -500 || true

          } > results/ppe-errors.txt

          cat results/ppe-errors.txt

      - name: Find generated modules
        if: always()
        shell: bash
        run: |
          echo "===== GENERATED MODULES =====" \
            > results/modules.txt

          find qsdk-src \
            -type f \
            -name '*.ko' \
            >> results/modules.txt || true

          cat results/modules.txt

      - name: Upload Stage2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage2
          path: |
            results/
            kernel-prepare.log
          retention-days: 7
