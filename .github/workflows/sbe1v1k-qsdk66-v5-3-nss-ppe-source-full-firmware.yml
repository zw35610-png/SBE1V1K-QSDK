        du -ah stage17-results | sort -h > stage17-results/size-summary.txt || true

        tar -C stage17-results -czf SBE1V1K-QSDK66-V5-3-results.tar.gz .

        ls -lh SBE1V1K-QSDK66-V5-3-results.tar.gz

