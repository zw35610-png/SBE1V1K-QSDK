name: SBE1V1K QSDK 6.6 V5.3 Exact NSS-PPE Source Full Firmware
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  OPENWRT_TAG: v24.10.2
  FEED_IPQ_BRANCH: ath.13.0
  DEVICE_BASE_COMMIT: 02fb9517c9aefac9f3825a15ae46e7998bae7edd
  STAGE: QSDK-6.6-Stage17
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  transplant-cascade:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
    - name: Checkout current project
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install OpenWrt build dependencies
      shell: bash
      run: "set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y \\\n  build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \\\
        \n  gettext git libncurses-dev libssl-dev python3 python3-setuptools \\\n  rsync swig unzip zlib1g-dev file wget curl xsltproc libxml-parser-perl\
        \ \\\n  python3-dev time jq patch quilt ccache zstd libelf-dev bc device-tree-compiler\n"
    - name: Initialize Stage 17 workspace
      shell: bash
      run: "set -euxo pipefail\nrm -rf stage17-work stage17-results\nmkdir -p stage17-work stage17-results/{sources,integration,device,config,bootstrap,kernel,packages,image,discovery}\n\
        {\n  echo \"stage=${STAGE}\"\n  echo \"date_utc=$(date -u +%FT%TZ)\"\n  echo \"runner=$(uname -a)\"\n  echo \"repo=${GITHUB_REPOSITORY}\"\n  echo\
        \ \"ref=${GITHUB_REF}\"\n  echo \"sha=${GITHUB_SHA}\"\n  echo \"openwrt_tag=${OPENWRT_TAG}\"\n  echo \"feed_ipq_branch=${FEED_IPQ_BRANCH}\"\n} |\
        \ tee stage17-results/environment.txt\n"
    - name: Cache downloads and ccache
      uses: actions/cache@v4
      with:
        path: 'stage17-work/openwrt/dl

          .ccache

          '
        key: qsdk66-stage5-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}
        restore-keys: 'qsdk66-stage5-${{ runner.os }}-

          qsdk66-${{ runner.os }}-

          '
    - name: Restore prepared host and toolchain cache from Stage 16
      id: bootstrap-cache
      uses: actions/cache/restore@v4
      with:
        path: 'stage16-work/openwrt/staging_dir/host

          stage16-work/openwrt/staging_dir/toolchain-*

          '
        key: qsdk66-bootstrap-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}-v10
    - name: Fetch OpenWrt, feed-ipq and SBE1V1K source
      id: sources
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$GITHUB_WORKSPACE/stage17-work/feed-ipq\"\nD=\"$GITHUB_WORKSPACE/stage17-work/sbe1v1k\"\
        \nOUT=\"$GITHUB_WORKSPACE/stage17-results/sources\"\n\nclone_retry() {\n  local name=\"$1\" url=\"$2\" ref=\"$3\" dst=\"$4\" log=\"$OUT/${name}-clone.log\"\
        \n  rm -rf \"$dst\"\n  local rc=1\n  for n in 1 2 3; do\n    echo \"[$name] attempt=$n url=$url ref=$ref\" | tee -a \"$log\"\n    git clone --depth=1\
        \ --branch \"$ref\" \"$url\" \"$dst\" >>\"$log\" 2>&1\n    rc=$?\n    [ \"$rc\" -eq 0 ] && break\n    rm -rf \"$dst\"\n    sleep $((n * 6))\n  done\n\
        \  echo \"$rc\" > \"$OUT/${name}-clone-exit.txt\"\n  if [ \"$rc\" -eq 0 ]; then\n    git -C \"$dst\" rev-parse HEAD | tee \"$OUT/${name}-commit.txt\"\
        \n    git -C \"$dst\" log -1 --format=fuller > \"$OUT/${name}-commit-log.txt\"\n  fi\n}\n\nclone_retry openwrt https://github.com/openwrt/openwrt.git\
        \ \"$OPENWRT_TAG\" \"$O\"\nclone_retry feed-ipq https://github.com/zilogic-systems/feed-ipq.git \"$FEED_IPQ_BRANCH\" \"$F\"\n\nrm -rf \"$D\"\ngit\
        \ init -q \"$D\"\ngit -C \"$D\" remote add origin https://github.com/luckkyboy/SBE1V1K.git\nrc=1\nfor n in 1 2 3; do\n  git -C \"$D\" fetch --depth=1\
        \ origin \"$DEVICE_BASE_COMMIT\" >\"$OUT/device-fetch.log\" 2>&1\n  rc=$?\n  [ \"$rc\" -eq 0 ] && break\n  sleep $((n * 6))\ndone\necho \"$rc\"\
        \ > \"$OUT/device-fetch-exit.txt\"\nif [ \"$rc\" -eq 0 ]; then\n  git -C \"$D\" checkout -q --detach FETCH_HEAD\n  git -C \"$D\" rev-parse HEAD\
        \ | tee \"$OUT/device-commit.txt\"\nfi\nexit 0\n"
    - name: Integrate native QSDK13 IPQ95xx target and feeds
      id: integrate
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$GITHUB_WORKSPACE/stage17-work/feed-ipq\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nrc=0\nexec > >(tee \"$OUT/integration.log\") 2>&1\n\nif [ ! -d \"$O\" ] || [ ! -d \"$F\" ]; then\n  echo 90 > \"$OUT/integration-exit.txt\"\n\
        \  exit 0\nfi\n\necho \"=== selectively apply feed-ipq OpenWrt 24.10 patches ===\"\n: > \"$OUT/patch-status.tsv\"\nshopt -s nullglob\nmapfile -t\
        \ patches < <(find \"$F/patches/openwrt/24.10\" -type f -name '*.patch' 2>/dev/null | sort)\nfor p in \"${patches[@]}\"; do\n  name=\"$(basename\
        \ \"$p\")\"\n  if git -C \"$O\" apply --check \"$p\" >/dev/null 2>&1; then\n    git -C \"$O\" apply \"$p\"\n    prc=$?\n    echo -e \"$name\\tAPPLIED\\\
        t$prc\" >> \"$OUT/patch-status.tsv\"\n  elif (cd \"$O\" && patch --dry-run -p1 --forward --batch < \"$p\" >/dev/null 2>&1); then\n    (cd \"$O\"\
        \ && patch -p1 --forward --batch < \"$p\")\n    prc=$?\n    echo -e \"$name\\tPATCHED\\t$prc\" >> \"$OUT/patch-status.tsv\"\n  else\n    # Stage\
        \ 3 proved the baseline builds without the non-applicable bbfdm/xmppc patches.\n    echo -e \"$name\\tSKIPPED_NOT_APPLICABLE\\t0\" >> \"$OUT/patch-status.tsv\"\
        \n  fi\ndone\n\necho \"=== install IPQ95xx target ===\"\nrm -rf \"$O/target/linux/ipq95xx\"\ncp -a \"$F/targets/ipq95xx\" \"$O/target/linux/ipq95xx\"\
        \ || rc=2\n\necho \"=== add feed-ipq feed roots ===\"\ncp \"$O/feeds.conf.default\" \"$OUT/feeds.conf.default.before\"\n: > \"$OUT/local-feeds-added.txt\"\
        \nfor d in \"$F\"/feeds/*; do\n  [ -d \"$d\" ] || continue\n  name=\"ipq_$(basename \"$d\" | tr '.-' '__')\"\n  echo \"src-link $name $d\" >> \"\
        $O/feeds.conf.default\"\n  echo \"$name $d\" >> \"$OUT/local-feeds-added.txt\"\ndone\nif [ -d \"$F/ipq-ext\" ]; then\n  echo \"src-link ipq_ext\
        \ $F/ipq-ext\" >> \"$O/feeds.conf.default\"\n  echo \"ipq_ext $F/ipq-ext\" >> \"$OUT/local-feeds-added.txt\"\nfi\n\n(cd \"$O\" && ./scripts/feeds\
        \ update -a) > \"$OUT/feeds-update.log\" 2>&1\nfurc=$?\n(cd \"$O\" && ./scripts/feeds install -a) > \"$OUT/feeds-install.log\" 2>&1\nfirc=$?\necho\
        \ \"feeds_update_exit=$furc\" >> \"$OUT/integration.log\"\necho \"feeds_install_exit=$firc\" >> \"$OUT/integration.log\"\n[ \"$furc\" -ne 0 ] &&\
        \ rc=3\n[ \"$firc\" -ne 0 ] && rc=4\necho \"$rc\" > \"$OUT/integration-exit.txt\"\nexit 0\n"
    - name: Transplant SBE1V1K DTS and engineering device profile
      id: transplant
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nD=\"$GITHUB_WORKSPACE/stage17-work/sbe1v1k\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\
        \nrc=0\n\nSRC_DTS=\"$D/target/linux/qualcommbe/dts/ipq9570-sbe1v1k.dts\"\nif [ ! -f \"$SRC_DTS\" ]; then\n  echo \"missing source DTS: $SRC_DTS\"\
        \ | tee \"$OUT/transplant.log\"\n  echo 90 > \"$OUT/transplant-exit.txt\"\n  exit 0\nfi\n\ncp \"$SRC_DTS\" \"$OUT/ipq9570-sbe1v1k.source.dts\"\n\
        sha256sum \"$SRC_DTS\" > \"$OUT/source-dts.sha256\"\n\nfor arch in arm64 arm; do\n  QDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/$arch/boot/dts/qcom\"\
        \n  [ -d \"$QDIR\" ] || continue\n  cp \"$SRC_DTS\" \"$QDIR/ipq9574-sbe1v1k.dts\" || rc=1\n  MF=\"$QDIR/Makefile\"\n  if [ -f \"$MF\" ] && ! grep\
        \ -q 'ipq9574-sbe1v1k.dtb' \"$MF\"; then\n    printf '\\n# SBE1V1K engineering transplant\\ndtb-$(CONFIG_ARCH_QCOM) += ipq9574-sbe1v1k.dtb\\n' >>\
        \ \"$MF\"\n  fi\ndone\n\nIMG=\"$O/target/linux/ipq95xx/image/generic.mk\"\nif [ -f \"$IMG\" ] && ! grep -q '^define Device/askey_sbe1v1k' \"$IMG\"\
        ; then\n  printf '%s\\n' \\\n    '' \\\n    '# SBE1V1K engineering-only profile. DO NOT FLASH.' \\\n    '# DEVICE_DTS_CONFIG temporarily reuses\
        \ the closest eMMC IPQ9574 reference' \\\n    '# only so Stage 17 can exercise the QSDK image pipeline; board-config parity' \\\n    '# must be\
        \ verified before any flashable release.' \\\n    'define Device/askey_sbe1v1k' \\\n    '\t$(call Device/FitImage)' \\\n    '\t$(call Device/EmmcImage)'\
        \ \\\n    '\tDEVICE_VENDOR := Askey' \\\n    '\tDEVICE_MODEL := SBE1V1K' \\\n    '\tDEVICE_DTS := ipq9574-sbe1v1k' \\\n    '\tDEVICE_DTS_CONFIG\
        \ := config-rdp433-mht-phy' \\\n    '\tDEVICE_FLASH_TYPE := emmc' \\\n    '\tDEVICE_BOARD_CONFIG := board-cfg-ipq9574' \\\n    '\tSOC := ipq9574'\
        \ \\\n    '\tDEVICE_PACKAGES += uboot-ipq9574-mmc board-cfg-ipq95xx' \\\n    'endef' \\\n    'TARGET_DEVICES += askey_sbe1v1k' >> \"$IMG\"\nfi\n\
        \n# Bring the standalone RTL826x firmware package into the tree if present.\nif [ -d \"$D/package/firmware/rtl826x-firmware\" ]; then\n  rm -rf\
        \ \"$O/package/firmware/rtl826x-firmware\"\n  cp -a \"$D/package/firmware/rtl826x-firmware\" \"$O/package/firmware/rtl826x-firmware\"\n  echo \"\
        rtl826x_firmware_package=COPIED\" > \"$OUT/rtl826x-status.txt\"\nelse\n  echo \"rtl826x_firmware_package=NOT_FOUND\" > \"$OUT/rtl826x-status.txt\"\
        \nfi\n\n# Inventory remaining runtime-only device support without blindly applying 6.18 patches to 6.6.\n{\n  echo \"=== SBE1V1K relevant source\
        \ files ===\"\n  find \"$D\" -type f | grep -Ei 'sbe1v1k|rtl8261|rtl826x' | sed \"s#^$D/##\" | sort || true\n  echo\n  echo \"=== SBE1V1K references\
        \ ===\"\n  grep -RInE 'askey,sbe1v1k|askey_sbe1v1k|SBE1V1K|rtl8261n' \"$D/target\" \"$D/package\" 2>/dev/null | head -n 5000 || true\n  echo\n \
        \ echo \"=== 6.18 patches touching SBE1V1K/RTL ===\"\n  grep -RIlE 'SBE1V1K|rtl8261n|RTL8261' \"$D/target/linux/qualcommbe/patches-6.18\" 2>/dev/null\
        \ | sort || true\n} > \"$OUT/remaining-runtime-support.txt\"\n\necho \"$rc\" > \"$OUT/transplant-exit.txt\"\ngrep -nE 'askey_sbe1v1k|ipq9574-sbe1v1k'\
        \ \"$IMG\" > \"$OUT/profile-lines.txt\" 2>/dev/null || true\nfind \"$O/target/linux/ipq95xx/files-6.6\" -type f -name '*sbe1v1k*' -o -name '*SBE1V1K*'\
        \ 2>/dev/null | sort > \"$OUT/transplanted-files.txt\" || true\nexit 0\n"
    - name: Adapt SBE1V1K DTS to QSDK 6.6 label model
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nQDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\
        \nDTS=\"$QDIR/ipq9574-sbe1v1k.dts\"\nmkdir -p \"$OUT\"\n\nif [ ! -f \"$DTS\" ]; then\n  echo \"missing transplanted DTS: $DTS\" | tee \"$OUT/dts-adapt.log\"\
        \n  echo 90 > \"$OUT/dts-adapt-exit.txt\"\n  exit 0\nfi\n\n# Inventory the actual QSDK 6.6 label model before touching the board DTS.\n{\n  echo\
        \ '=== QSDK IPQ9574 DTS/DTSI files ==='\n  find \"$QDIR\" -maxdepth 1 -type f \\( -name 'ipq9574*.dts' -o -name 'ipq9574*.dtsi' \\) -printf '%f\\\
        n' | sort\n  echo\n  echo '=== PCIe controller labels ==='\n  grep -RInE '^[[:space:]]*[A-Za-z0-9_]+:[[:space:]]*(pci|pcie)@' \"$QDIR\"/ipq9574*.dts*\
        \ 2>/dev/null || true\n  echo\n  echo '=== PPE-like labels/nodes ==='\n  grep -RInEi '^[[:space:]]*[A-Za-z0-9_]+:.*(ppe|ethernet)|compatible.*(ppe|ess)|ethernet-ports'\
        \ \"$QDIR\"/ipq9574*.dts* 2>/dev/null | head -n 1200 || true\n  echo\n  echo '=== clock labels ==='\n  grep -RInE '^[[:space:]]*(ref_48mhz_clk|xo_board_clk|xo_clk):'\
        \ \"$QDIR\"/ipq9574*.dts* 2>/dev/null || true\n} > \"$OUT/qsdk-dts-label-inventory.txt\"\n\npython3 - \"$DTS\" \"$QDIR\" \"$OUT\" <<'PY'\nimport\
        \ re, sys, pathlib, json\np=pathlib.Path(sys.argv[1]); qdir=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3])\ntext=p.read_text(errors='replace')\n\
        orig=text\n\n# Labels provided by ipq9574 base DTSI files in this QSDK target.\nbase_files=sorted(qdir.glob('ipq9574*.dtsi'))\nbase='\\n'.join(x.read_text(errors='replace')\
        \ for x in base_files)\nlabels=set(re.findall(r'(?m)^\\s*([A-Za-z_][A-Za-z0-9_]*):\\s*[^;\\n{]+\\{', base))\n\n# Find controller labels by node-name,\
        \ preserving source order.\npcie_labels=[]\nfor m in re.finditer(r'(?m)^\\s*([A-Za-z_][A-Za-z0-9_]*):\\s*pcie@[0-9a-fA-Fx]+\\s*\\{', base):\n  \
        \  if m.group(1) not in pcie_labels:\n        pcie_labels.append(m.group(1))\n\n# Helper: find and remove a top-level '&label { ... };' override\
        \ block.\ndef find_override(s,label):\n    m=re.search(r'(?m)^\\s*&'+re.escape(label)+r'\\s*\\{',s)\n    if not m: return None\n    start=m.start();\
        \ brace=s.find('{',m.start()); depth=0; i=brace\n    in_str=False; esc=False\n    while i < len(s):\n        c=s[i]\n        if in_str:\n      \
        \      if esc: esc=False\n            elif c=='\\\\': esc=True\n            elif c=='\"': in_str=False\n        else:\n            if c=='\"': in_str=True\n\
        \            elif c=='{': depth+=1\n            elif c=='}':\n                depth-=1\n                if depth==0:\n                    j=i+1\n\
        \                    while j<len(s) and s[j].isspace(): j+=1\n                    if j<len(s) and s[j]==';': j+=1\n                    while j<len(s)\
        \ and s[j] in ' \\t\\r': j+=1\n                    if j<len(s) and s[j]=='\\n': j+=1\n                    return start,j,s[start:j]\n        i+=1\n\
        \    return None\n\nactions=[]\nremoved=[]\n\n# Stage 6 proved that QSDK13 does not use upstream pcie1/2/3 controller labels.\n# Its native IPQ9574/RDP433\
        \ board DTS uses pcie1_x1, pcie2_x2 and pcie3_x2.\n# Map the SBE1V1K upstream overrides onto those native QSDK labels while preserving\n# all Wi-Fi\
        \ child nodes for compile validation.\npcie_labels={'pcie1':'pcie1_x1','pcie2':'pcie2_x2','pcie3':'pcie3_x2'}\nfor old,newlab in pcie_labels.items():\n\
        \    if re.search(r'(?m)^\\s*&'+re.escape(old)+r'\\s*\\{', text):\n        text=re.sub(r'(?m)^(\\s*)&'+re.escape(old)+r'(\\s*\\{)', r'\\1&'+newlab+r'\\\
        2', text, count=1)\n        actions.append({'type':'pcie-qsdk-label-map','from':old,'to':newlab})\n\n# QSDK 6.6 may not expose the upstream fixed-clock\
        \ labels. They are only board\n# overrides, so drop them for compile validation and retain an audit record.\nfor lab in ['ref_48mhz_clk','xo_board_clk','xo_clk']:\n\
        \    if lab not in labels:\n        found=find_override(text,lab)\n        if found:\n            a,b,blk=found; removed.append((lab,blk)); text=text[:a]+text[b:]\n\
        \            actions.append({'type':'remove-missing-clock-override','label':lab})\n\n# The upstream SBE1V1K DTS models wired ports under &qcom_ppe.\
        \ QSDK13 often owns\n# PPE/port topology through its board-config/SSDK path instead. If qcom_ppe is not\n# present in the QSDK base DTSI, remove\
        \ this override only for Stage 17 compile\n# validation; save the whole block for later board-config parity work.\nif 'qcom_ppe' not in labels:\n\
        \    found=find_override(text,'qcom_ppe')\n    if found:\n        a,b,blk=found; removed.append(('qcom_ppe',blk)); text=text[:a]+text[b:]\n    \
        \    actions.append({'type':'remove-upstream-ppe-override','label':'qcom_ppe'})\n\np.write_text(text)\n(out/'dts-adapt-actions.json').write_text(json.dumps(actions,indent=2))\n\
        (out/'dts-adapt-removed.txt').write_text('\\n\\n'.join('===== '+k+' =====\\n'+v for k,v in removed))\n(out/'dts-adapted.dts').write_text(text)\n\
        (out/'dts-adapt-before.sha256').write_text(__import__('hashlib').sha256(orig.encode()).hexdigest()+'\\n')\n(out/'dts-adapt-after.sha256').write_text(__import__('hashlib').sha256(text.encode()).hexdigest()+'\\\
        n')\nprint('base_labels',len(labels))\nprint('pcie_labels',pcie_labels)\nprint('actions',actions)\nPY\nrc=$?\necho \"$rc\" > \"$OUT/dts-adapt-exit.txt\"\
        \ncat \"$OUT/dts-adapt-actions.json\" 2>/dev/null || true\nexit 0\n"
    - name: Resolve duplicate QSDK tzapp reserved-memory label
      id: tzapp-fix
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nDTS=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts\"\
        \nmkdir -p \"$OUT\"\nif [ ! -f \"$DTS\" ]; then\n  echo 90 > \"$OUT/tzapp-fix-exit.txt\"\n  exit 0\nfi\npython3 - \"$DTS\" \"$OUT\" <<'PY'\nimport\
        \ pathlib, re, sys, json\np=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])\ntext=p.read_text(errors='replace')\npat=re.compile(r'(?ms)^[\
        \ \\t]*tzapp\\s*:\\s*tzapp@49[Bb]00000\\s*\\{.*?^[ \\t]*\\};\\s*')\nm=pat.search(text)\nresult={'found': bool(m), 'action': 'none'}\nif m:\n   \
        \ removed=m.group(0)\n    text=text[:m.start()]+text[m.end():]\n    p.write_text(text)\n    (out/'tzapp-removed.dtsfrag').write_text(removed)\n\
        \    result['action']='remove-board-local-duplicate-for-compile-validation'\n    result['board_node']='tzapp@49B00000'\n    result['conflicts_with']='QSDK\
        \ base tzapp@49600000'\n(out/'tzapp-fix.json').write_text(json.dumps(result,indent=2)+'\\n')\nprint(json.dumps(result,indent=2))\nPY\nrc=$?\necho\
        \ \"$rc\" > \"$OUT/tzapp-fix-exit.txt\"\ncp \"$DTS\" \"$OUT/dts-after-tzapp-fix.dts\" 2>/dev/null || true\nexit 0\n"
    - name: Restore native QSDK q6 reserved-memory regions
      id: q6-memory
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nDTS=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts\"\
        \nQDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\nmkdir -p \"$OUT\"\nif [ ! -f \"$DTS\" ] || [ ! -d \"$QDIR\" ]; then\n  echo\
        \ 90 > \"$OUT/q6-memory-fix-exit.txt\"\n  exit 0\nfi\npython3 - \"$DTS\" \"$QDIR\" \"$OUT\" <<'PY'\nimport pathlib, re, sys, json, hashlib\nboard\
        \ = pathlib.Path(sys.argv[1])\nqdir = pathlib.Path(sys.argv[2])\nout = pathlib.Path(sys.argv[3])\ntext = board.read_text(errors='replace')\n\ndef\
        \ brace_block(s, start):\n    i = s.find('{', start)\n    if i < 0:\n        return None\n    depth = 0\n    in_str = False\n    esc = False\n \
        \   line_comment = False\n    block_comment = False\n    j = i\n    while j < len(s):\n        c = s[j]\n        n = s[j+1] if j+1 < len(s) else\
        \ ''\n        if line_comment:\n            if c == '\\n':\n                line_comment = False\n        elif block_comment:\n            if c\
        \ == '*' and n == '/':\n                block_comment = False\n                j += 1\n        elif in_str:\n            if esc:\n             \
        \   esc = False\n            elif c == '\\\\':\n                esc = True\n            elif c == '\"':\n                in_str = False\n      \
        \  else:\n            if c == '/' and n == '/':\n                line_comment = True\n                j += 1\n            elif c == '/' and n ==\
        \ '*':\n                block_comment = True\n                j += 1\n            elif c == '\"':\n                in_str = True\n            elif\
        \ c == '{':\n                depth += 1\n            elif c == '}':\n                depth -= 1\n                if depth == 0:\n              \
        \      k = j + 1\n                    while k < len(s) and s[k] in ' \\t\\r':\n                        k += 1\n                    if k < len(s)\
        \ and s[k] == ';':\n                        k += 1\n                    while k < len(s) and s[k] in ' \\t\\r':\n                        k += 1\n\
        \                    if k < len(s) and s[k] == '\\n':\n                        k += 1\n                    return start, k, s[start:k]\n       \
        \ j += 1\n    return None\n\nlabels = [\"q6_region\", \"q6_etr_region\"]\nfound = {}\nhits = []\n\ncandidates = sorted(\n    [p for p in qdir.rglob(\"\
        ipq9574*.dts*\") if p.resolve() != board.resolve()],\n    key=lambda p: (0 if \"rdp433\" in p.name.lower() else 1, str(p))\n)\nfor p in candidates:\n\
        \    try:\n        s = p.read_text(errors='replace')\n    except Exception:\n        continue\n    for lab in labels:\n        if lab in found:\n\
        \            continue\n        m = re.search(r'(?m)^[ \\t]*' + re.escape(lab) + r'\\s*:\\s*[A-Za-z0-9,_@.+\\-]+\\s*\\{', s)\n        if not m:\n\
        \            continue\n        blk = brace_block(s, m.start())\n        if blk:\n            found[lab] = {\"source\": str(p.relative_to(qdir)),\
        \ \"block\": blk[2]}\n            hits.append(f\"{lab}\\t{p.relative_to(qdir)}\")\n\n(out / \"q6-memory-source-hits.txt\").write_text(\"\\n\".join(hits)\
        \ + (\"\\n\" if hits else \"\"))\n\n# Find the board root reserved-memory block and insert missing native regions.\nrm = re.search(r'(?m)^[ \\t]*reserved-memory\\\
        s*\\{', text)\ninjected = []\nif rm:\n    rb = brace_block(text, rm.start())\n    if rb:\n        a, b, block = rb\n        insert_at = block.rfind('}')\n\
        \        payload = \"\"\n        for lab in labels:\n            if re.search(r'(?m)^[ \\t]*' + re.escape(lab) + r'\\s*:', block):\n           \
        \     continue\n            if lab in found:\n                native = found[lab][\"block\"]\n                native = \"\\n\".join(\"        \"\
        \ + ln if ln.strip() else ln for ln in native.strip().splitlines())\n                payload += \"\\n\" + native + \"\\n\"\n                injected.append(lab)\n\
        \        if payload:\n            new_block = block[:insert_at] + payload + block[insert_at:]\n            text = text[:a] + new_block + text[b:]\n\
        \            board.write_text(text)\n\nresult = {\n    \"required\": labels,\n    \"found\": {k: v[\"source\"] for k, v in found.items()},\n   \
        \ \"injected\": injected,\n    \"complete\": all(x in injected or re.search(r'(?m)^[ \\t]*'+re.escape(x)+r'\\s*:', text) for x in labels),\n   \
        \ \"sha256\": hashlib.sha256(text.encode()).hexdigest(),\n}\n(out / \"q6-memory-fix.json\").write_text(json.dumps(result, indent=2) + \"\\n\")\n\
        (out / \"dts-after-q6-memory-fix.dts\").write_text(text)\nprint(json.dumps(result, indent=2))\nsys.exit(0 if result[\"complete\"] else 2)\nPY\n\
        rc=$?\necho \"$rc\" > \"$OUT/q6-memory-fix-exit.txt\"\nexit 0\n"
    - name: Apply Ethernet V4 - insert NSS-DP nodes inside DTS root
      id: ethernet_v4
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/device\"\nQDIR=\"$O/target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom\"\
        \nDTS=\"$QDIR/ipq9574-sbe1v1k.dts\"\nREF=\"$QDIR/ipq9574-db-al02-c2.dts\"\nmkdir -p \"$OUT\"\nexec > >(tee \"$OUT/ethernet-v4.log\") 2>&1\nif [\
        \ ! -f \"$DTS\" ] || [ ! -f \"$REF\" ]; then echo 90 > \"$OUT/ethernet-v4-exit.txt\"; exit 0; fi\ncp \"$REF\" \"$OUT/ipq9574-db-al02-c2.reference.dts\"\
        \n\npython3 - \"$DTS\" \"$REF\" \"$OUT\" <<'PY'\nfrom pathlib import Path\nimport re,sys,json\ndst,ref,out=Path(sys.argv[1]),Path(sys.argv[2]),Path(sys.argv[3])\n\
        rt=ref.read_text(errors=\"replace\")\ndt=dst.read_text(errors=\"replace\")\n\ndef node_for_id(text,qid):\n    m=re.search(r'qcom,id\\s*=\\s*<\\\
        s*%d\\s*>\\s*;'%qid,text)\n    if not m: raise RuntimeError(\"reference qcom,id %d not found\"%qid)\n    brace=text.rfind('{',0,m.start())\n   \
        \ start=text.rfind('\\n',0,brace)+1\n    depth=0\n    for i in range(brace,len(text)):\n        if text[i]=='{': depth+=1\n        elif text[i]=='}':\n\
        \            depth-=1\n            if depth==0:\n                semi=text.find(';',i)\n                block=text[start:(semi+1 if semi!=-1 else\
        \ i+1)]\n                if 'compatible = \"qcom,nss-dp\"' not in block:\n                    raise RuntimeError(\"id %d is not inside qcom,nss-dp\"\
        %qid)\n                return block\n    raise RuntimeError(\"unterminated node\")\n\ntargets={3:(18,\"qsgmii\"),4:(19,\"qsgmii\"),5:(28,\"usxgmii\"\
        ),6:(0,\"usxgmii\")}\norig=[]; derived=[]\nfor qid,(phy,mode) in targets.items():\n    b=node_for_id(rt,qid); orig.append(b)\n    b=re.sub(r'^(\\\
        s*)[A-Za-z_][A-Za-z0-9_]*:\\s*',r'\\1',b,count=1)\n    if re.search(r'qcom,phy-mdio-addr\\s*=',b):\n        b=re.sub(r'qcom,phy-mdio-addr\\s*=\\\
        s*<[^>]+>\\s*;',f'qcom,phy-mdio-addr = <{phy}>;',b)\n    else: b=b.replace('{','{\\n\\tqcom,phy-mdio-addr = <%d>;' % phy,1)\n    if re.search(r'phy-mode\\\
        s*=',b):\n        b=re.sub(r'phy-mode\\s*=\\s*\"[^\"]+\"\\s*;',f'phy-mode = \"{mode}\";',b)\n    else: b=b.replace('{','{\\n\\tphy-mode = \"%s\"\
        ;' % mode,1)\n    derived.append(b)\n\n(out/\"nss-dp-reference-original.txt\").write_text(\"\\n\\n\".join(orig))\n(out/\"nss-dp-v3-derived.txt\"\
        ).write_text(\"\\n\\n\".join(derived))\nallq=\"\\n\".join(p.read_text(errors=\"replace\") for p in dst.parent.glob(\"ipq9574*.dts*\"))\nif not re.search(r'(?m)^\\\
        s*ess_switch\\s*:',allq):\n    raise RuntimeError(\"native ess_switch label missing\")\n\ness='''\\n&ess_switch {\n        switch_mac_mode = <0x0b>;\n\
        \        switch_mac_mode1 = <0x0d>;\n        switch_mac_mode2 = <0x0d>;\n        qcom,port_phyinfo {\n                port@2 { port_id = <3>; phy_address\
        \ = <18>; };\n                port@3 { port_id = <4>; phy_address = <19>; };\n                port@4 { port_id = <5>; phy_address = <28>; ethernet-phy-ieee802.3-c45;\
        \ };\n                port@5 { port_id = <6>; phy_address = <0>; ethernet-phy-ieee802.3-c45; };\n        };\n};\n'''\ndpfrag=\"\\n\\n\\t/* Ethernet\
        \ V4: native QSDK NSS-DP root children */\\n\"+\"\\n\\n\".join(derived)+\"\\n\"\nroot_end=dt.rfind(\"\\n};\")\nif root_end < 0: raise RuntimeError(\"\
        target DTS final root closing not found\")\npatched=dt[:root_end]+dpfrag+dt[root_end:]+\"\\n\"+ess+\"\\n\"\n(out/\"ethernet-v4-dp-fragment.dtsi\"\
        ).write_text(dpfrag)\n(out/\"ethernet-v4-ess-overlay.dtsi\").write_text(ess)\ndst.write_text(patched)\n(out/\"ipq9574-sbe1v1k-ethernet-v4.dts\"\
        ).write_text(patched)\n(out/\"ethernet-v4-map.json\").write_text(json.dumps({\"modes\":[\"0x0b\",\"0x0d\",\"0x0d\"],\"ports\":targets},indent=2)+\"\
        \\n\")\nPY\nrc=$?\necho \"$rc\" > \"$OUT/ethernet-v4-exit.txt\"\nif [ \"$rc\" -eq 0 ]; then\n grep -nE 'switch_mac_mode|port_phyinfo|port_id|phy_address|qcom,nss-dp|qcom,id|qcom,phy-mdio-addr|phy-mode'\
        \ \"$DTS\" > \"$OUT/ethernet-v4-lines.txt\" || true\nfi\nexit 0\n"
    - name: Fix Linux 6.6 Realtek PHY package path
