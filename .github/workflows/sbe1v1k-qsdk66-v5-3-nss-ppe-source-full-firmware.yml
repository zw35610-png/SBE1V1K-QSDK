      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nW=\"$GITHUB_WORKSPACE/stage17-work\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nSRC=\"$W/nss-clients-feed\"\nURL=\"https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git\"\nCOMMIT=\"0012113f650506cc9b350f67194caff19b03ad32\"\
        \nmkdir -p \"$OUT\"\n\nrm -rf \"$SRC\"\ngit clone --filter=blob:none --no-checkout \"$URL\" \"$SRC\" > \"$OUT/nss-clients-clone.log\" 2>&1\nrc=$?\n\
        if [ \"$rc\" -ne 0 ]; then\n  echo \"$rc\" > \"$OUT/nss-clients-feed-exit.txt\"\n  exit 0\nfi\n\ngit -C \"$SRC\" checkout \"$COMMIT\" >> \"$OUT/nss-clients-clone.log\"\
        \ 2>&1\ncrc=$?\ngit -C \"$SRC\" rev-parse HEAD > \"$OUT/nss-clients-commit.txt\" 2>/dev/null || true\n\n{\n  echo \"requested_commit=$COMMIT\"\n\
        \  echo \"checkout_exit=$crc\"\n  echo \"actual_commit=$(cat \"$OUT/nss-clients-commit.txt\" 2>/dev/null)\"\n} > \"$OUT/nss-clients-selected-ref.txt\"\
        \n\nfind \"$SRC\" -maxdepth 2 -type f -name Makefile -printf '%P\\n' \\\n  | grep -E 'qca-nss-(netfn|ecm)|flow' > \"$OUT/nss-clients-package-tree.txt\"\
        \ || true\n\nif [ \"$crc\" -ne 0 ] || \\\n   [ ! -f \"$SRC/qca-nss-netfn/Makefile\" ] || \\\n   [ ! -f \"$SRC/qca-nss-ecm/Makefile\" ]; then\n \
        \ echo 92 > \"$OUT/nss-clients-feed-exit.txt\"\n  exit 0\nfi\n\n# Register the exact local feed.\ngrep -v '^src-link stage17_nss_clients ' \"$O/feeds.conf.default\"\
        \ > \"$O/feeds.conf.default.tmp\" || true\nmv \"$O/feeds.conf.default.tmp\" \"$O/feeds.conf.default\"\necho \"src-link stage17_nss_clients $SRC\"\
        \ >> \"$O/feeds.conf.default\"\n\ncd \"$O\"\n./scripts/feeds update stage17_nss_clients > \"$OUT/nss-clients-feeds-update.log\" 2>&1\nurc=$?\n./scripts/feeds\
        \ install -p stage17_nss_clients -f \\\n  qca-nss-netfn qca-nss-netfn-pkt-steer qca-nss-ecm \\\n  > \"$OUT/nss-clients-feeds-install.log\" 2>&1\n\
        irc=$?\n\n{\n  echo \"update=$urc\"\n  echo \"install=$irc\"\n  echo \"netfn=$(test -e package/feeds/stage17_nss_clients/qca-nss-netfn && echo yes\
        \ || echo no)\"\n  echo \"netfn_pkt_steer=$(test -e package/feeds/stage17_nss_clients/qca-nss-netfn-pkt-steer && echo yes || echo no)\"\n  echo\
        \ \"ecm=$(test -e package/feeds/stage17_nss_clients/qca-nss-ecm && echo yes || echo no)\"\n} > \"$OUT/nss-clients-feed-status.txt\"\n\nif [ \"$urc\"\
        \ -eq 0 ] && [ \"$irc\" -eq 0 ] \\\n   && [ -e package/feeds/stage17_nss_clients/qca-nss-netfn ] \\\n   && [ -e package/feeds/stage17_nss_clients/qca-nss-ecm\
        \ ]; then\n  echo 0 > \"$OUT/nss-clients-feed-exit.txt\"\nelse\n  echo 2 > \"$OUT/nss-clients-feed-exit.txt\"\nfi\nexit 0\n"
    - name: Restore QSDK local-development build helpers
      id: localdev
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nW=\"$GITHUB_WORKSPACE/stage17-work\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/integration\"\
        \nQ=\"$W/qsdk-openwrt-repo\"\nURL=\"https://git.codelinaro.org/clo/qsdk/oss/system/openwrt_repo.git\"\nmkdir -p \"$OUT\"\n\nrm -rf \"$Q\"\ngit clone\
        \ --depth 1 \"$URL\" \"$Q\" > \"$OUT/localdev-clone.log\" 2>&1\ncrc=$?\n\nsrc=\"\"\nif [ \"$crc\" -eq 0 ]; then\n  src=\"$Q/include/local-development.mk\"\
        \nfi\n\n# If the shallow default branch lacks it, fetch a QSDK13 tag and retry.\nif [ ! -f \"$src\" ]; then\n  tag=\"$(git ls-remote --tags \"$URL\"\
        \ 'refs/tags/NHSS.QSDK.13*' 2>/dev/null \\\n      | sed 's#refs/tags/##' | sed 's/\\^{}//' | awk '{print $2}' | sort -V | tail -n1)\"\n  echo \"\
        fallback_tag=$tag\" > \"$OUT/localdev-ref.txt\"\n  if [ -n \"$tag\" ]; then\n    rm -rf \"$Q\"\n    git clone --depth 1 --branch \"$tag\" \"$URL\"\
        \ \"$Q\" >> \"$OUT/localdev-clone.log\" 2>&1\n    src=\"$Q/include/local-development.mk\"\n  fi\nelse\n  echo \"fallback_tag=default-branch\" >\
        \ \"$OUT/localdev-ref.txt\"\nfi\n\nif [ ! -f \"$src\" ]; then\n  echo 91 > \"$OUT/local-development-exit.txt\"\n  exit 0\nfi\n\ncp \"$src\" \"$OUT/local-development.mk.original\"\
        \ncp \"$src\" \"$O/include/local-development.mk\"\n\n# Adapt QSDK's expected local source root to this workflow layout where the\n# exact nss-clients\
        \ checkout is a sibling of the OpenWrt tree.\npython3 - \"$O/include/local-development.mk\" <<'PY'\nfrom pathlib import Path\nimport sys\np = Path(sys.argv[1])\n\
        s = p.read_text(errors=\"replace\")\nrepls = [\n    (\"$(TOPDIR)/qca/src/$(PKG_NAME)\", \"$(TOPDIR)/../nss-clients-feed/$(PKG_NAME)\"),\n    (\"\
        $(TOPDIR)/qca/src/$(PKG_NAME)/\", \"$(TOPDIR)/../nss-clients-feed/$(PKG_NAME)/\"),\n]\nfor a,b in repls:\n    s = s.replace(a,b)\n# Avoid dirty\
        \ working-tree suffixes creating unstable package versions.\ns = s.replace(\"git describe --dirty\", \"git describe\")\np.write_text(s)\nPY\n\n\
        cp \"$O/include/local-development.mk\" \"$OUT/local-development.mk.adapted\"\n{\n  echo \"exists=$(test -f \"$O/include/local-development.mk\" &&\
        \ echo true || echo false)\"\n  echo \"nss_source_root=$(realpath \"$W/nss-clients-feed\" 2>/dev/null)\"\n  grep -nE 'qca/src|nss-clients-feed|git\
        \ describe|LOCAL' \"$O/include/local-development.mk\" | head -n 120 || true\n} > \"$OUT/local-development-status.txt\"\n\n# Snapshot the problematic\
        \ package wrappers before build.\nfor d in qca-nss-netfn qca-nss-netfn-pkt-steer qca-nss-ecm emesh-sp; do\n  [ -f \"$W/nss-clients-feed/$d/Makefile\"\
        \ ] || continue\n  cp \"$W/nss-clients-feed/$d/Makefile\" \"$OUT/${d}-Makefile.txt\"\ndone\n\necho 0 > \"$OUT/local-development-exit.txt\"\nexit\
        \ 0\n"
    - name: Restore exact NSS-PPE base + NetFN / ECM / emesh local source tree
      id: local-sources
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/local-sources\"\nROOT=\"$O/qca/src/nss/clients\"\
        \nPREFERRED_TAG=\"NHSS.QSDK.13.1.5.r1-00011-O\"\n\nmkdir -p \"$OUT\" \"$ROOT\"\n: > \"$OUT/source-tree-status.tsv\"\n: > \"$OUT/source-tree-errors.txt\"\
        \n: > \"$OUT/source-resolver.log\"\n\nresolve_project() {\n  name=\"$1\"\n  dest=\"$2\"\n  shift 2\n\n  rm -rf \"$dest\"\n  local url=\"\" tag=\"\
        \" list=\"$OUT/${name}.ls-remote.txt\"\n  : > \"$list\"\n\n  for candidate in \"$@\"; do\n    echo \"=== probing $name :: $candidate ===\" | tee\
        \ -a \"$OUT/source-resolver.log\"\n    timeout 120 git ls-remote --tags \"$candidate\" 'refs/tags/NHSS.QSDK.13*' \\\n      > \"$OUT/${name}.probe.txt\"\
        \ 2>>\"$OUT/source-tree-errors.txt\"\n    rc=$?\n    if [ \"$rc\" -eq 0 ] && [ -s \"$OUT/${name}.probe.txt\" ]; then\n      url=\"$candidate\"\n\
        \      cp \"$OUT/${name}.probe.txt\" \"$list\"\n      break\n    fi\n  done\n\n  if [ -z \"$url\" ]; then\n    printf '%s\\t%s\\t%s\\t%s\\n' \"\
        $name\" \"NO_URL\" \"-\" \"91\" >> \"$OUT/source-tree-status.tsv\"\n    return 91\n  fi\n\n  if grep -qE \"refs/tags/${PREFERRED_TAG}(\\^\\{\\})?$\"\
        \ \"$list\"; then\n    tag=\"$PREFERRED_TAG\"\n  else\n    tags=\"$(\n      awk '{print $2}' \"$list\" \\\n        | sed -e 's#refs/tags/##' -e\
        \ 's/\\^{}$//' \\\n        | sort -Vu\n    )\"\n    tag=\"$(printf '%s\\n' \"$tags\" | grep '^NHSS\\.QSDK\\.13\\.1\\.5\\.r1-' | sort -V | tail -n1)\"\
        \n    [ -n \"$tag\" ] || tag=\"$(printf '%s\\n' \"$tags\" | grep '^NHSS\\.QSDK\\.13\\.1\\.5' | sort -V | tail -n1)\"\n    [ -n \"$tag\" ] || tag=\"\
        $(printf '%s\\n' \"$tags\" | grep '^NHSS\\.QSDK\\.13\\.1' | sort -V | tail -n1)\"\n    [ -n \"$tag\" ] || tag=\"$(printf '%s\\n' \"$tags\" | grep\
        \ '^NHSS\\.QSDK\\.13\\.0' | sort -V | tail -n1)\"\n  fi\n\n  if [ -z \"$tag\" ]; then\n    printf '%s\\t%s\\t%s\\t%s\\n' \"$name\" \"$url\" \"NO_QSDK13_TAG\"\
        \ \"92\" >> \"$OUT/source-tree-status.tsv\"\n    return 92\n  fi\n\n  mkdir -p \"$dest\"\n  git -C \"$dest\" init -q\n  git -C \"$dest\" remote\
        \ add origin \"$url\"\n  timeout 300 git -C \"$dest\" fetch -q --depth 1 origin \"refs/tags/$tag\" \\\n    >> \"$OUT/source-resolver.log\" 2>>\"\
        $OUT/source-tree-errors.txt\"\n  rc=$?\n  if [ \"$rc\" -ne 0 ]; then\n    printf '%s\\t%s\\t%s\\t%s\\n' \"$name\" \"$url\" \"$tag\" \"$rc\" >> \"\
        $OUT/source-tree-status.tsv\"\n    rm -rf \"$dest\"\n    return \"$rc\"\n  fi\n\n  git -C \"$dest\" checkout -q --detach FETCH_HEAD \\\n    >> \"\
        $OUT/source-resolver.log\" 2>>\"$OUT/source-tree-errors.txt\"\n  rc=$?\n  if [ \"$rc\" -ne 0 ] || [ ! -f \"$dest/Makefile\" ]; then\n    printf\
        \ '%s\\t%s\\t%s\\t%s\\n' \"$name\" \"$url\" \"$tag\" \"93\" >> \"$OUT/source-tree-status.tsv\"\n    return 93\n  fi\n\n  commit=\"$(git -C \"$dest\"\
        \ rev-parse HEAD 2>/dev/null || echo unknown)\"\n  printf '%s\\t%s\\t%s\\t%s\\t%s\\n' \"$name\" \"$url\" \"$tag\" \"$commit\" \"0\" >> \"$OUT/source-tree-status.tsv\"\
        \n  printf '%s\\n' \"$tag\" > \"$OUT/${name}.selected-tag.txt\"\n  printf '%s\\n' \"$commit\" > \"$OUT/${name}.commit.txt\"\n  find \"$dest\" -maxdepth\
        \ 2 -type f \\( -name Makefile -o -name '*.c' -o -name '*.h' \\) \\\n    | sed \"s#^$O/##\" | sort | head -n 1000 > \"$OUT/${name}.tree.txt\" ||\
        \ true\n  return 0\n}\n\noverall=0\n\nresolve_project \\\n  nss-netfn \\\n  \"$ROOT/qca-nss-netfn\" \\\n  \"https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-netfn.git\"\
        \ \\\n  || overall=1\n\nresolve_project \\\n  qca-nss-ecm \\\n  \"$ROOT/qca-nss-ecm\" \\\n  \"https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-ecm.git\"\
        \ \\\n  \"https://git.codelinaro.org/clo/femto5g/oss/lklm/qca-nss-ecm.git\" \\\n  || overall=1\n\nresolve_project \\\n  emesh-sp \\\n  \"$ROOT/emesh-sp\"\
        \ \\\n  \"https://git.codelinaro.org/clo/femto5g/oss/lklm/emesh-sp.git\" \\\n  \"https://git.codelinaro.org/clo/qsdk/oss/lklm/emesh-sp.git\" \\\n\
        \  || overall=1\n\n\n# V5.3: V5.2 captured the real qca-nss-ppe-rule package recipe:\n#   LOCAL_SRC := $(TOPDIR)/qca/src/nss/base/qca-nss-ppe\n\
        # The rule module is built from the SAME nss-ppe source tree as qca-nss-ppe,\n# not from a separate nss-ppe-rule repository.\n#\n# V5.1's successful\
        \ qca-nss-ppe download log also captured the exact source:\n#   repo   = https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git\n#   commit =\
        \ 0161cd27ea8d20079814d8562dc59cdb79f1f9d5\nPPE_RECIPE=\"$O/package/feeds/stage17_nss_clients/qca-nss-ppe-rule/Makefile\"\nPPE_URL=\"https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git\"\
        \nPPE_COMMIT=\"0161cd27ea8d20079814d8562dc59cdb79f1f9d5\"\nPPE_DEST=\"$O/qca/src/nss/base/qca-nss-ppe\"\n\nif [ ! -f \"$PPE_RECIPE\" ]; then\n \
        \ echo \"MISSING_RECIPE=$PPE_RECIPE\" | tee -a \"$OUT/source-tree-errors.txt\"\n  overall=1\nelse\n  cp \"$PPE_RECIPE\" \"$OUT/qca-nss-ppe-rule-package-Makefile.txt\"\
        \n  ppe_local_src=\"$(sed -nE 's/^[[:space:]]*LOCAL_SRC[[:space:]]*:?=[[:space:]]*//p' \"$PPE_RECIPE\" | head -n1)\"\n  printf '%s\\n' \"$ppe_local_src\"\
        \ > \"$OUT/qca-nss-ppe-rule-LOCAL_SRC.txt\"\n  printf '%s\\n' \"$PPE_DEST\" > \"$OUT/qca-nss-ppe-rule-destination.txt\"\n\n  # Hard gate: the recipe\
        \ must still point at the path proven by V5.2.\n  if [ \"$ppe_local_src\" != '$(TOPDIR)/qca/src/nss/base/qca-nss-ppe' ]; then\n    echo \"UNEXPECTED_PPE_RULE_LOCAL_SRC=$ppe_local_src\"\
        \ | tee -a \"$OUT/source-tree-errors.txt\"\n    overall=1\n  else\n    rm -rf \"$PPE_DEST\"\n    mkdir -p \"$PPE_DEST\"\n    git -C \"$PPE_DEST\"\
        \ init -q\n    git -C \"$PPE_DEST\" remote add origin \"$PPE_URL\"\n\n    # Fast path: fetch the exact commit directly.\n    timeout 300 git -C\
        \ \"$PPE_DEST\" fetch -q --depth 1 origin \"$PPE_COMMIT\" \\\n      >> \"$OUT/source-resolver.log\" 2>>\"$OUT/source-tree-errors.txt\"\n    ppe_rc=$?\n\
        \n    # Fallback: some Git servers disallow shallow fetch-by-SHA.\n    if [ \"$ppe_rc\" -ne 0 ]; then\n      echo \"Direct commit fetch failed;\
        \ retrying with repository fetch.\" \\\n        | tee -a \"$OUT/source-resolver.log\"\n      timeout 600 git -C \"$PPE_DEST\" fetch -q origin \\\
        \n        >> \"$OUT/source-resolver.log\" 2>>\"$OUT/source-tree-errors.txt\"\n      ppe_rc=$?\n    fi\n\n    if [ \"$ppe_rc\" -eq 0 ]; then\n  \
        \    git -C \"$PPE_DEST\" checkout -q --detach \"$PPE_COMMIT\" \\\n        >> \"$OUT/source-resolver.log\" 2>>\"$OUT/source-tree-errors.txt\"\n\
        \      ppe_rc=$?\n    fi\n\n    if [ \"$ppe_rc\" -ne 0 ]; then\n      printf '%s\\t%s\\t%s\\t%s\\t%s\\n' \\\n        \"nss-ppe-base\" \"$PPE_URL\"\
        \ \"exact-commit\" \"$PPE_COMMIT\" \"$ppe_rc\" \\\n        >> \"$OUT/source-tree-status.tsv\"\n      overall=1\n    else\n      got=\"$(git -C \"\
        $PPE_DEST\" rev-parse HEAD 2>/dev/null || echo unknown)\"\n      printf '%s\\t%s\\t%s\\t%s\\t%s\\n' \\\n        \"nss-ppe-base\" \"$PPE_URL\" \"\
        exact-commit\" \"$got\" \"0\" \\\n        >> \"$OUT/source-tree-status.tsv\"\n      printf '%s\\n' \"$got\" > \"$OUT/nss-ppe-base.commit.txt\"\n\
        \      find \"$PPE_DEST\" -maxdepth 3 -type f \\\n        \\( -name Makefile -o -name '*.c' -o -name '*.h' \\) \\\n        | sed \"s#^$O/##\" |\
        \ sort | head -n 2000 \\\n        > \"$OUT/nss-ppe-base.tree.txt\" || true\n\n      # qca-nss-ppe-rule specifically builds drv/ppe_rule from this\
        \ source.\n      if [ ! -f \"$PPE_DEST/Makefile\" ]; then\n        echo \"MISSING_NSS_PPE_ROOT_MAKEFILE=$PPE_DEST/Makefile\" \\\n          | tee\
        \ -a \"$OUT/source-tree-errors.txt\"\n        overall=1\n      fi\n      if [ ! -f \"$PPE_DEST/drv/ppe_rule/Makefile\" ]; then\n        echo \"\
        MISSING_PPE_RULE_MAKEFILE=$PPE_DEST/drv/ppe_rule/Makefile\" \\\n          | tee -a \"$OUT/source-tree-errors.txt\"\n        overall=1\n      fi\n\
        \    fi\n  fi\nfi\n\nfor p in \\\n  \"$ROOT/qca-nss-netfn/Makefile\" \\\n  \"$ROOT/qca-nss-ecm/Makefile\" \\\n  \"$ROOT/emesh-sp/Makefile\" \\\n\
        \  \"${PPE_DEST:-/nonexistent}/Makefile\"; do\n  if [ ! -f \"$p\" ]; then\n    echo \"MISSING_LOCAL_SOURCE=$p\" | tee -a \"$OUT/source-tree-errors.txt\"\
        \n    overall=1\n  fi\ndone\n\nfind \"$O/build_dir\" -maxdepth 5 -type d \\( \\\n  -name 'qca-nss-netfn*' -o \\\n  -name 'qca-nss-ppe-rule*' -o\
        \ \\\n  -name 'qca-nss-ppe-*' -o \\\n  -name 'qca-nss-ecm*' -o \\\n  -name 'emesh-sp*' \\\n\\) -print -exec rm -rf {} + 2>/dev/null > \"$OUT/cleaned-build-dirs.txt\"\
        \ || true\n\n{\n  echo \"preferred_tag=$PREFERRED_TAG\"\n  echo \"local_source_root=$ROOT\"\n  echo \"source_tree_exit=$overall\"\n} > \"$OUT/source-tree-summary.txt\"\
        \necho \"$overall\" > \"$OUT/source-tree-exit.txt\"\nexit 0\n"
    - name: Configure SBE1V1K QSDK13 engineering profile
      id: config
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/config\"\ncd \"$O\" || { echo 90 > \"$OUT/config-exit.txt\"\
        ; exit 0; }\n\ncat > .config <<'EOF'\nCONFIG_TARGET_ipq95xx=y\nCONFIG_TARGET_ipq95xx_generic=y\nCONFIG_TARGET_ipq95xx_generic_DEVICE_askey_sbe1v1k=y\n\
        CONFIG_DEVEL=y\nCONFIG_BUILD_LOG=y\nCONFIG_CCACHE=y\nCONFIG_PACKAGE_kmod-qca-ssdk-qca-nohnat=y\nCONFIG_PACKAGE_kmod-qca-nss-phy=y\nCONFIG_PACKAGE_kmod-qca-nss-dp-qca=y\n\
        CONFIG_PACKAGE_kmod-qca-nss-ppe=y\nEOF\n\n# Select copied RTL826x firmware only if its package symbol exists after metadata generation.\nmake defconfig\
        \ > \"$OUT/defconfig-pass1.log\" 2>&1\nrc=$?\n\n# Enable native QSDK13 NetFN / ECM packages only when their symbols exist.\nfor sym in   CONFIG_PACKAGE_kmod-qca-nss-netfn\
        \   CONFIG_PACKAGE_kmod-qca-nss-netfn-pkt-steer   CONFIG_PACKAGE_kmod-qca-nss-ecm   CONFIG_PACKAGE_qca-nss-ecm; do\n  key=\"${sym#CONFIG_}\"\n \
        \ if grep -q \"$key\" tmp/.config-package.in 2>/dev/null; then\n    echo \"$sym=y\" >> .config\n  fi\ndone\nmake defconfig > \"$OUT/defconfig-netfn-ecm.log\"\
        \ 2>&1\nrc_ne=$?\n[ \"$rc_ne\" -ne 0 ] && rc=$rc_ne\n\n# Second pass after Stage17 local nss-clients feed integration:\n# enable exact package symbols\
        \ actually exposed by the selected QSDK13 tag.\nfor key in \\\n  PACKAGE_kmod-qca-nss-netfn \\\n  PACKAGE_kmod-qca-nss-netfn-pkt-steer \\\n  PACKAGE_kmod-qca-nss-ecm\
        \ \\\n  PACKAGE_qca-nss-ecm; do\n  if grep -q \"^config $key$\" tmp/.config-package.in 2>/dev/null; then\n    echo \"CONFIG_${key}=y\" >> .config\n\
        \  fi\ndone\nmake defconfig > \"$OUT/defconfig-stage14-netfn-ecm.log\" 2>&1\nrc_ne2=$?\n[ \"$rc_ne2\" -ne 0 ] && rc=$rc_ne2\nif grep -Rqs 'Package/rtl826x-firmware'\
        \ package/firmware/rtl826x-firmware 2>/dev/null; then\n  echo 'CONFIG_PACKAGE_rtl826x-firmware=y' >> .config\n  make defconfig > \"$OUT/defconfig-pass2.log\"\
        \ 2>&1\n  rc2=$?\n  [ \"$rc2\" -ne 0 ] && rc=$rc2\nfi\n\necho \"$rc\" > \"$OUT/config-exit.txt\"\ncp .config \"$OUT/final.config\" 2>/dev/null ||\
        \ true\ngrep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_.*(qca|nss|ppe|ssdk|netfn|ecm|rtl826)|CONFIG_KERNEL_.*(NSS|PPE|EDMA))' .config \\\n  > \"$OUT/selected-config.txt\"\
        \ 2>/dev/null || true\ngrep -nEi 'askey_sbe1v1k|rtl826|qca-nss|nss-ppe|nss-dp|ssdk|netfn|flowmgr|ecm' tmp/.config-package.in \\\n  > \"$OUT/available-kconfig.txt\"\
        \ 2>/dev/null || true\n\n{\n  echo \"=== NetFN / ECM selected symbols ===\"\n  grep -E '^CONFIG_PACKAGE_.*(qca-nss-netfn|qca-nss-ecm).*=[ym]$' .config\
        \ || true\n} > \"$OUT/netfn-ecm-selected.txt\"\n\n# Stage17: select the IPQ95xx/PPE connection-manager path explicitly.\n# On IPQ95xx, ECM Premium\
        \ selects PPE; legacy qca-nss-drv dependencies apply\n# only to older IPQ50xx/60xx/80xx targets.\nfor line in \\\n  'CONFIG_PACKAGE_kmod-qca-nss-flowmgr=y'\
        \ \\\n  'CONFIG_PACKAGE_kmod-qca-nss-netfn-pkt-steer=y' \\\n  'CONFIG_PACKAGE_kmod-qca-nss-ecm-premium=y'; do\n  key=\"${line%%=*}\"\n  sed -i \"\
        /^${key}=.*/d;/^# ${key} is not set/d\" .config\n  echo \"$line\" >> .config\ndone\n\nmake defconfig > \"$OUT/defconfig-stage17-flowmgr-ecm-premium.log\"\
        \ 2>&1\nrc17=$?\n[ \"$rc17\" -ne 0 ] && rc=$rc17\n\n{\n  grep -E '^CONFIG_PACKAGE_kmod-qca-nss-(flowmgr|netfn-pkt-steer|ecm-premium)=[ym]$' .config\
        \ || true\n  grep -E '^# CONFIG_PACKAGE_kmod-qca-nss-(flowmgr|netfn-pkt-steer|ecm-premium) is not set$' .config || true\n} > \"$OUT/stage17-flowmgr-ecm-selection.txt\"\
        \n\n\n# V5 hard gate: these three packages are required for the intended\n# IPQ95xx PPE/NetFN/ECM path. Record the exact post-defconfig state.\n\
        v5_gate=0\nfor sym in \\\n  CONFIG_PACKAGE_kmod-qca-nss-flowmgr \\\n  CONFIG_PACKAGE_kmod-qca-nss-netfn-pkt-steer \\\n  CONFIG_PACKAGE_kmod-qca-nss-ecm-premium;\
        \ do\n  if grep -qx \"${sym}=y\" .config; then\n    echo \"${sym}=y\"\n  else\n    echo \"MISSING: ${sym}=y\"\n    v5_gate=1\n  fi\ndone | tee \"\
        $OUT/v5-required-config.txt\"\n\ncp .config \"$OUT/final.config\" 2>/dev/null || true\ngrep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_.*(qca|nss|ppe|ssdk|netfn|flowmgr|ecm|rtl826)|CONFIG_KERNEL_.*(NSS|PPE|EDMA))'\
        \ .config \\\n  > \"$OUT/selected-config.txt\" 2>/dev/null || true\n\necho \"$v5_gate\" > \"$OUT/v5-config-gate-exit.txt\"\nif [ \"$v5_gate\" -ne\
        \ 0 ]; then\n  rc=3\nfi\necho \"$rc\" > \"$OUT/config-exit.txt\"\nexit 0\n"
    - name: Download all selected sources
      id: download
      continue-on-error: true
      shell: bash
      run: 'set +e

        O="$GITHUB_WORKSPACE/stage17-work/openwrt"

        OUT="$GITHUB_WORKSPACE/stage17-results/config"

        cd "$O" || { echo 90 > "$OUT/download-exit.txt"; exit 0; }

        make -j"$(nproc)" download V=s > "$OUT/download.log" 2>&1

        rc=$?

        echo "$rc" > "$OUT/download-exit.txt"

        grep -nE ''(ERROR|Error|failed|404|hash mismatch)'' "$OUT/download.log" | tail -n 300 > "$OUT/download-errors.txt" || true

        exit 0

        '
    - name: Import prepared host and toolchain cache
      id: cache-import
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nSRC=\"$GITHUB_WORKSPACE/stage16-work/openwrt/staging_dir\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/bootstrap\"\
        \nmkdir -p \"$OUT\" \"$O/staging_dir\"\nimported=0\nif [ -d \"$SRC/host\" ]; then\n  rm -rf \"$O/staging_dir/host\"\n  cp -a \"$SRC/host\" \"$O/staging_dir/host\"\
        \n  imported=1\nfi\nshopt -s nullglob\nfor d in \"$SRC\"/toolchain-*; do\n  bn=\"$(basename \"$d\")\"\n  rm -rf \"$O/staging_dir/$bn\"\n  cp -a\
        \ \"$d\" \"$O/staging_dir/$bn\"\n  imported=1\ndone\necho \"$imported\" > \"$OUT/cache-imported.txt\"\necho \"cache_hit=${{ steps.bootstrap-cache.outputs.cache-hit\
        \ }}\" > \"$OUT/cache-status.txt\"\necho \"cache_imported=$imported\" >> \"$OUT/cache-status.txt\"\nfind \"$O/staging_dir\" -maxdepth 3 -type f\
        \ \\(-name m4 -o -name '*gcc' -o -name '*g++'\\) -printf '%p\\n' 2>/dev/null | head -n 80 >> \"$OUT/cache-status.txt\" || true\nexit 0\n"
    - name: Bootstrap host tools and toolchain
      id: bootstrap
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/bootstrap\"\ncd \"$O\" || { echo 90 > \"$OUT/bootstrap-exit.txt\"\
        ; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\nimported=$(cat \"$OUT/cache-imported.txt\" 2>/dev/null || echo 0)\nhost_ok=0\ntc_ok=0\n\
        [ -x \"$O/staging_dir/host/bin/m4\" ] && host_ok=1\ncomp=$(find \"$O/staging_dir\" -path '*/bin/aarch64-openwrt-linux-musl-gcc' -type f -perm -111\
        \ 2>/dev/null | head -n1)\n[ -n \"$comp\" ] && tc_ok=1\n\necho \"imported=$imported host_ok=$host_ok toolchain_ok=$tc_ok compiler=$comp\" | tee\
        \ \"$OUT/bootstrap-fastpath.txt\"\nif [ \"$imported\" = \"1\" ] && [ \"$host_ok\" = \"1\" ] && [ \"$tc_ok\" = \"1\" ]; then\n  echo \"FASTPATH:\
        \ restored Stage 11 host/toolchain cache; skip full bootstrap\" | tee \"$OUT/tools.log\" \"$OUT/toolchain.log\"\n  trc=0\n  crc=0\nelse\n  echo\
        \ \"CACHE MISS/INCOMPLETE: run normal bootstrap\" | tee \"$OUT/bootstrap-fallback.txt\"\n  timeout 3600 make -j\"$(nproc)\" tools/install V=s >\
        \ \"$OUT/tools.log\" 2>&1\n  trc=$?\n  timeout 5400 make -j\"$(nproc)\" toolchain/install V=s > \"$OUT/toolchain.log\" 2>&1\n  crc=$?\nfi\necho\
        \ \"$trc\" > \"$OUT/tools-exit.txt\"\necho \"$crc\" > \"$OUT/toolchain-exit.txt\"\nif [ \"$trc\" -eq 0 ] && [ \"$crc\" -eq 0 ]; then rc=0; else\
        \ rc=1; fi\necho \"$rc\" > \"$OUT/bootstrap-exit.txt\"\ngrep -nE '(^|[[:space:]])(error:|fatal error:|No rule to make target|Error [0-9]+)' \"$OUT/tools.log\"\
        \ \"$OUT/toolchain.log\" \\\n  | tail -n 300 > \"$OUT/bootstrap-errors.txt\" || true\nexit 0\n"
    - name: Save prepared host toolchain cache for next fast rounds
      if: always()
      uses: actions/cache/save@v4
      with:
        path: 'stage17-work/openwrt/staging_dir/host

          stage17-work/openwrt/staging_dir/toolchain-*

          '
        key: qsdk66-bootstrap-${{ runner.os }}-${{ env.OPENWRT_TAG }}-${{ env.FEED_IPQ_BRANCH }}-v11
    - name: Native OpenWrt DTB preflight then full Linux 6.6 build
      id: kernel
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/kernel\"\ncd \"$O\" || { echo 90 > \"$OUT/kernel-exit.txt\"\
        ; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\nCLEAN_PATH=\"$(printf '%s' \"$PATH\" | tr ':' '\\n' | grep -Fvx \"$O/staging_dir/host/bin\"\
        \ | paste -sd: -)\"\nexport PATH=\"$CLEAN_PATH\"\n{\n  echo \"PATH=$PATH\"\n  for x in bash git g++ rsync grep gzip perl file make; do\n    printf\
        \ '%s=' \"$x\"\n    command -v \"$x\" || true\n  done\n} > \"$OUT/native-prereq-paths.txt\"\n\n# Use OpenWrt's native DTB target. It depends on\
        \ the kernel configured stamp,\n# so the build system creates the kernel .config before device-tree compilation.\ntimeout 2700 make -j\"$(nproc)\"\
        \ target/linux/dtb V=s > \"$OUT/dtb-preflight.log\" 2>&1\ndtbrc=$?\necho \"$dtbrc\" > \"$OUT/dtb-preflight-exit.txt\"\n\ngrep -nE '(ERROR \\(|error:|fatal\
        \ error:|Reference to non-existent|Duplicate label|syntax error|Error [0-9]+|No rule to make target)' \\\n  \"$OUT/dtb-preflight.log\" | tail -n\
        \ 400 > \"$OUT/dtb-preflight-errors.txt\" || true\n\nKDIR=\"$(find \"$O/build_dir\" -maxdepth 3 -type d -path '*linux-ipq95xx_generic/linux-6.6.47'\
        \ | head -n1)\"\n{\n  echo \"dtb_exit=$dtbrc\"\n  echo \"kdir=$KDIR\"\n  if [ -n \"$KDIR\" ] && [ -d \"$KDIR\" ]; then\n    echo \"kernel_config_exists=$(test\
        \ -f \"$KDIR/.config\" && echo true || echo false)\"\n    [ -f \"$KDIR/.config\" ] && {\n      echo \"kernel_config_size=$(stat -c %s \"$KDIR/.config\"\
        \ 2>/dev/null || echo 0)\"\n      sha256sum \"$KDIR/.config\" 2>/dev/null || true\n    }\n  fi\n} > \"$OUT/kernel-preflight-state.txt\"\n\nfind\
        \ build_dir -type f \\( -name 'ipq9574-sbe1v1k.dtb' -o -name '*sbe1v1k*.dtb' \\) \\\n  -printf '%p\\t%s bytes\\n' 2>/dev/null | sort > \"$OUT/sbe1v1k-dtb.txt\"\
        \ || true\ndtb_count=$(wc -l < \"$OUT/sbe1v1k-dtb.txt\" 2>/dev/null || echo 0)\necho \"$dtb_count\" > \"$OUT/sbe1v1k-dtb-count.txt\"\n\nif [ \"\
        $dtbrc\" -ne 0 ] || [ \"$dtb_count\" -eq 0 ]; then\n  final_rc=\"$dtbrc\"\n  [ \"$final_rc\" -eq 0 ] && final_rc=98\n  echo \"$final_rc\" > \"$OUT/kernel-exit.txt\"\
        \n  cp \"$OUT/dtb-preflight.log\" \"$OUT/kernel-build.log\"\n  cp \"$OUT/dtb-preflight-errors.txt\" \"$OUT/kernel-errors.txt\"\n  tail -n 500 \"\
        $OUT/dtb-preflight.log\" > \"$OUT/kernel-tail.txt\" 2>/dev/null || true\nelse\n  echo \"NATIVE_DTB_PREFLIGHT=PASS\" > \"$OUT/dtb-preflight-pass.txt\"\
        \n  timeout 5400 make -j\"$(nproc)\" target/linux/compile V=s > \"$OUT/kernel-build.log\" 2>&1\n  rc=$?\n  echo \"$rc\" > \"$OUT/kernel-exit.txt\"\
        \n  grep -nE '(^|[[:space:]])(error:|fatal error:|undefined reference|No rule to make target|Error [0-9]+)' \\\n    \"$OUT/kernel-build.log\" |\
        \ tail -n 500 > \"$OUT/kernel-errors.txt\" || true\n  tail -n 500 \"$OUT/kernel-build.log\" > \"$OUT/kernel-tail.txt\" 2>/dev/null || true\nfi\n\
        \nfirst_dtb=$(awk 'NR==1{print $1}' \"$OUT/sbe1v1k-dtb.txt\")\nif [ -n \"$first_dtb\" ] && [ -f \"$first_dtb\" ]; then\n  dtc -I dtb -O dts -o \"\
        $OUT/sbe1v1k-built.dts\" \"$first_dtb\" 2>\"$OUT/dtc-decompile.err\" || true\n  grep -nE 'model =|compatible =|ethernet-ports|wifi@|rtl826|qca8075|qca8081|mmc|reserved-memory|q6_'\
        \ \\\n    \"$OUT/sbe1v1k-built.dts\" > \"$OUT/sbe1v1k-built-keynodes.txt\" 2>/dev/null || true\nfi\nexit 0\n"
    - name: Build QSDK acceleration + exact NSS-PPE source + FlowMgr / NetFN / ECM
      id: packages
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/packages\"\ncd \"$O\" || { echo 90 > \"$OUT/package-batch-exit.txt\"\
        ; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\nsrc_rc=$(cat \"$GITHUB_WORKSPACE/stage17-results/local-sources/source-tree-exit.txt\"\
        \ 2>/dev/null || echo 99)\nif [ \"$src_rc\" != \"0\" ]; then\n  echo \"SKIPPED_LOCAL_SOURCE_TREE_$src_rc\" > \"$OUT/package-batch-exit.txt\"\n \
        \ echo -e \"all\\tSKIPPED: source_tree_exit=$src_rc\\t99\" > \"$OUT/package-build-status.tsv\"\n  exit 0\nfi\n\ncgrc=$(cat \"$GITHUB_WORKSPACE/stage17-results/config/v5-config-gate-exit.txt\"\
        \ 2>/dev/null || echo 99)\nif [ \"$cgrc\" != \"0\" ]; then\n  echo \"SKIPPED_V5_CONFIG_GATE_$cgrc\" > \"$OUT/package-batch-exit.txt\"\n  echo -e\
        \ \"all\\tSKIPPED: v5_config_gate=$cgrc\\t99\" > \"$OUT/package-build-status.tsv\"\n  exit 0\nfi\n\n# Do not generate misleading MODPOST noise when\
        \ the board kernel/DTB itself failed.\nkrc=$(cat \"$GITHUB_WORKSPACE/stage17-results/kernel/kernel-exit.txt\" 2>/dev/null || echo 99)\nif [ \"$krc\"\
        \ != \"0\" ]; then\n  echo \"SKIPPED_KERNEL_EXIT_$krc\" > \"$OUT/package-batch-exit.txt\"\n  echo -e \"all\\tSKIPPED: kernel_exit=$krc\\t99\" >\
        \ \"$OUT/package-build-status.tsv\"\n  exit 0\nfi\n\n: > \"$OUT/package-candidates.tsv\"\n: > \"$OUT/package-build-status.tsv\"\n\ndiscover_group()\
        \ {\n  local group=\"$1\" regex=\"$2\"\n  find -L package/feeds/ipq_* package/firmware/rtl826x-firmware -type f -name Makefile 2>/dev/null | while\
        \ read -r mf; do\n    if grep -qiE \"$regex\" \"$mf\"; then\n      dir=\"${mf%/Makefile}\"\n      echo -e \"$group\\t$dir\" >> \"$OUT/package-candidates.tsv\"\
        \n    fi\n  done\n}\ndiscover_group ssdk 'KernelPackage/(qca-)?ssdk|PKG_NAME.*ssdk'\ndiscover_group phy 'KernelPackage/qca-nss-phy|PKG_NAME.*qca-nss-phy'\n\
        discover_group nss_dp 'KernelPackage/.*nss.*dp|PKG_NAME.*nss-dp'\ndiscover_group ppe 'KernelPackage/qca-nss-ppe|PKG_NAME.*nss-ppe'\ndiscover_group\
        \ netfn 'KernelPackage/.*netfn|PKG_NAME.*netfn|flowmgr'\ndiscover_group ecm 'KernelPackage/.*ecm|PKG_NAME.*ecm'\ndiscover_group rtl 'rtl826x-firmware|rtl8261n'\n\
        \n# Add known QSDK native NetFN/ECM directories directly if present.\nfor d in \\\n  package/feeds/stage17_nss_clients/qca-nss-netfn \\\n  package/feeds/stage17_nss_clients/qca-nss-netfn-pkt-steer\
        \ \\\n  package/feeds/stage17_nss_clients/qca-nss-ecm \\\n  package/feeds/ipq_nss_host/qca-nss-netfn \\\n  package/feeds/ipq_nss_host/qca-nss-netfn-pkt-steer\
        \ \\\n  package/feeds/ipq_nss_host/qca-nss-ecm; do\n  [ -d \"$d\" ] || continue\n  case \"$d\" in\n    *qca-nss-ecm) echo -e \"ecm\\t$d\" >> \"\
        $OUT/package-candidates.tsv\" ;;\n    *) echo -e \"netfn\\t$d\" >> \"$OUT/package-candidates.tsv\" ;;\n  esac\ndone\nawk '!seen[$0]++' \"$OUT/package-candidates.tsv\"\
        \ > \"$OUT/package-candidates.unique.tsv\"\nmv \"$OUT/package-candidates.unique.tsv\" \"$OUT/package-candidates.tsv\"\n\noverall=0\nfor group in\
        \ ssdk phy nss_dp ppe rtl; do\n  while IFS=$'\\t' read -r g dir; do\n    [ \"$g\" = \"$group\" ] || continue\n    rel=\"${dir#./}\"\n    log=\"\
        $OUT/build-${group}-$(basename \"$dir\").log\"\n    echo \"===== BUILD $group :: $rel =====\" | tee \"$log\"\n    timeout 3600 make -j\"$(nproc)\"\
        \ \"$rel/compile\" V=s >> \"$log\" 2>&1\n    brc=$?\n    echo -e \"$group\\t$rel\\t$brc\" | tee -a \"$OUT/package-build-status.tsv\"\n    grep -nE\
        \ '(^|[[:space:]])(error:|fatal error:|undefined reference|undefined!|No rule to make target|Error [0-9]+)' \\\n      \"$log\" | tail -n 250 > \"\
        $log.errors\" || true\n    [ \"$brc\" -ne 0 ] && overall=1\n  done < \"$OUT/package-candidates.tsv\"\ndone\n\nfind build_dir -type f -name '*.ko'\
        \ -printf '%p\\t%s bytes\\n' 2>/dev/null | sort > \"$OUT/all-built-kos.txt\" || true\ngrep -Ei 'qca|nss|ppe|ssdk|netfn|ecm|rtl826' \"$OUT/all-built-kos.txt\"\
        \ > \"$OUT/relevant-built-kos.txt\" || true\n# Stage17 acceptance: NetFN and ECM must both be attempted and succeed.\nnetfn_ok=0\necm_ok=0\nawk\
        \ -F'\t' '$1==\"netfn\" && $3==\"0\"{ok=1} END{exit ok?0:1}' \"$OUT/package-build-status.tsv\" && netfn_ok=1\nawk -F'\t' '$1==\"ecm\" && $3==\"\
        0\"{ok=1} END{exit ok?0:1}' \"$OUT/package-build-status.tsv\" && ecm_ok=1\n{\n  echo \"netfn_ok=$netfn_ok\"\n  echo \"ecm_ok=$ecm_ok\"\n} > \"$OUT/netfn-ecm-build-gate.txt\"\
        \n\nif [ \"$netfn_ok\" -ne 1 ] || [ \"$ecm_ok\" -ne 1 ]; then\n  overall=1\nfi\necho \"$overall\" > \"$OUT/package-batch-exit.txt\"\n\n# Collect\
        \ package metadata/dependency warnings specifically for NetFN/ECM.\ngrep -RniE 'kmod-qca-nss-drv|kmod-qca-mcs|kmod-qca-hyfi-bridge|netfn|ecm' \\\
        \n  package/feeds/stage17_nss_clients/qca-nss-netfn \\\n  package/feeds/stage17_nss_clients/qca-nss-ecm 2>/dev/null \\\n  > \"$OUT/netfn-ecm-package-metadata.txt\"\
        \ || true\n\n# V5.1 focused source-tree build for the actual IPQ95xx path.\n# local-development.mk has now been restored, so build in dependency\
        \ order.\nbuild_one() {\n  group=\"$1\"\n  path=\"$2\"\n  log=\"$OUT/stage17-${group}-$(basename \"$path\").log\"\n  err=\"$log.errors\"\n  if [\
        \ ! -d \"$path\" ]; then\n    printf '%s\\t%s\\t%s\\n' \"$group\" \"$path\" \"MISSING\" >> \"$OUT/stage17-focused-status.tsv\"\n    return 1\n \
        \ fi\n  echo \"===== STAGE17 BUILD $group :: $path =====\"\n  timeout 3600 make -j\"$(nproc)\" \"$path/compile\" V=s > \"$log\" 2>&1\n  rc=$?\n\
        \  grep -nE '(^|[[:space:]])(error:|fatal error:|No rule to make target|undefined reference|Error [0-9]+|has both : and :: entries)' \\\n    \"\
        $log\" | tail -n 400 > \"$err\" || true\n  printf '%s\\t%s\\t%s\\n' \"$group\" \"$path\" \"$rc\" >> \"$OUT/stage17-focused-status.tsv\"\n  return\
        \ \"$rc\"\n}\n\n: > \"$OUT/stage17-focused-status.tsv\"\nfocused_overall=0\n\n# qca-nss-ppe-rule is a direct dependency of FlowMgr/ECM.\nbuild_one\
        \ ppe_rule package/feeds/stage17_nss_clients/qca-nss-ppe-rule || focused_overall=1\n\n# FlowMgr is emitted by the qca-nss-netfn wrapper.\nbuild_one\
        \ flowmgr package/feeds/stage17_nss_clients/qca-nss-netfn || focused_overall=1\n\n# Packet steering is a separate package wrapper.\nbuild_one netfn_pkt_steer\
        \ package/feeds/stage17_nss_clients/qca-nss-netfn-pkt-steer || focused_overall=1\n\n# ECM on IPQ95xx pulls in emesh-sp. Build it explicitly first.\n\
        build_one emesh_sp package/feeds/stage17_nss_clients/emesh-sp || focused_overall=1\n\n# ECM Premium is emitted by the qca-nss-ecm wrapper.\nbuild_one\
        \ ecm_premium package/feeds/stage17_nss_clients/qca-nss-ecm || focused_overall=1\n\nppe_rule_ok=0\nflowmgr_ok=0\npkt_ok=0\nemesh_ok=0\necm_ok=0\n\
        awk -F'\\t' '$1==\"ppe_rule\" && $3==\"0\"{ok=1} END{exit ok?0:1}' \"$OUT/stage17-focused-status.tsv\" && ppe_rule_ok=1\nawk -F'\\t' '$1==\"flowmgr\"\
        \ && $3==\"0\"{ok=1} END{exit ok?0:1}' \"$OUT/stage17-focused-status.tsv\" && flowmgr_ok=1\nawk -F'\\t' '$1==\"netfn_pkt_steer\" && $3==\"0\"{ok=1}\
        \ END{exit ok?0:1}' \"$OUT/stage17-focused-status.tsv\" && pkt_ok=1\nawk -F'\\t' '$1==\"emesh_sp\" && $3==\"0\"{ok=1} END{exit ok?0:1}' \"$OUT/stage17-focused-status.tsv\"\
        \ && emesh_ok=1\nawk -F'\\t' '$1==\"ecm_premium\" && $3==\"0\"{ok=1} END{exit ok?0:1}' \"$OUT/stage17-focused-status.tsv\" && ecm_ok=1\n\n{\n  echo\
        \ \"ppe_rule_ok=$ppe_rule_ok\"\n  echo \"flowmgr_ok=$flowmgr_ok\"\n  echo \"netfn_pkt_steer_ok=$pkt_ok\"\n  echo \"emesh_sp_ok=$emesh_ok\"\n  echo\
        \ \"ecm_premium_ok=$ecm_ok\"\n} > \"$OUT/stage17-flowmgr-ecm-gate.txt\"\n\n# Overwrite the batch gate with the focused result so the image stage\
        \ only\n# proceeds when the actual IPQ95xx FlowMgr/NetFN/emesh/ECM path compiled.\nif [ \"$ppe_rule_ok\" -eq 1 ] && [ \"$flowmgr_ok\" -eq 1 ] &&\
        \ [ \"$pkt_ok\" -eq 1 ] && [ \"$emesh_ok\" -eq 1 ] && [ \"$ecm_ok\" -eq 1 ]; then\n  echo 0 > \"$OUT/package-batch-exit.txt\"\nelse\n  echo 1 >\
        \ \"$OUT/package-batch-exit.txt\"\nfi\n\n# Capture relevant final kernel modules for audit.\nfind build_dir -type f \\( \\\n  -name '*flowmgr*.ko'\
        \ -o \\\n  -name '*netfn*.ko' -o \\\n  -name '*ecm*.ko' \\\n\\) -printf '%p\\t%s bytes\\n' 2>/dev/null | sort > \"$OUT/stage17-flowmgr-netfn-ecm-kos.txt\"\
        \ || true\n\n"
    - name: Discover and inspect NetFN / FlowMgr / ECM source trees
      id: discovery
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$GITHUB_WORKSPACE/stage17-work/feed-ipq\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/discovery\"\
        \nSRC=\"$GITHUB_WORKSPACE/stage17-work/qca-discovery\"\nmkdir -p \"$SRC\" \"$OUT\"\n\ngrep -RInEi 'netfn|flowmgr|qca-nss-ecm|(^|[^a-z])ecm([^a-z]|$)'\
        \ \"$F\" \"$O/package/feeds\" 2>/dev/null \\\n  | head -n 8000 > \"$OUT/local-netfn-ecm-hits.txt\" || true\n\n: > \"$OUT/remote-probes.tsv\"\nprobe_clone()\
        \ {\n  name=\"$1\"; url=\"$2\"\n  git ls-remote \"$url\" > \"$OUT/$name.ls-remote.txt\" 2>&1\n  lrc=$?\n  echo -e \"$name\\t$url\\tlsremote=$lrc\"\
        \ >> \"$OUT/remote-probes.tsv\"\n  [ \"$lrc\" -eq 0 ] || return 0\n  rm -rf \"$SRC/$name\"\n  git clone --depth 1 \"$url\" \"$SRC/$name\" > \"$OUT/$name.clone.log\"\
        \ 2>&1\n  crc=$?\n  echo -e \"$name\\t$url\\tclone=$crc\" >> \"$OUT/remote-probes.tsv\"\n  if [ \"$crc\" -eq 0 ]; then\n    { find \"$SRC/$name\"\
        \ -maxdepth 4 -type f -name Makefile -o -type d \\( -iname '*ecm*' -o -iname '*netfn*' -o -iname '*flow*' \\); } \\\n      2>/dev/null | sed \"\
        s#^$SRC/$name/##\" | sort -u > \"$OUT/$name.tree-hits.txt\" || true\n    git -C \"$SRC/$name\" rev-parse HEAD > \"$OUT/$name.commit.txt\" 2>/dev/null\
        \ || true\n  fi\n}\nprobe_clone nss-clients https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git\nprobe_clone nss-netfn https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-netfn.git\n\
        exit 0\n"
    - name: Build V5.1 full-stack engineering firmware images
      id: image
      continue-on-error: true
      shell: bash
      run: "set +e\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nOUT=\"$GITHUB_WORKSPACE/stage17-results/image\"\ncd \"$O\" || { echo 90 > \"$OUT/image-exit.txt\"\
        ; exit 0; }\nexport CCACHE_DIR=\"$GITHUB_WORKSPACE/.ccache\"\n\nsrc_rc=$(cat \"$GITHUB_WORKSPACE/stage17-results/local-sources/source-tree-exit.txt\"\
        \ 2>/dev/null || echo 99)\nif [ \"$src_rc\" != \"0\" ]; then\n  echo \"SKIPPED_LOCAL_SOURCE_TREE_$src_rc\" > \"$OUT/image-exit.txt\"\n  echo \"\
        Image pipeline skipped because Qualcomm local source tree restoration failed.\" > \"$OUT/target-install.log\"\n  : > \"$OUT/image-errors.txt\"\n\
        \  : > \"$OUT/image-tail.txt\"\n  : > \"$OUT/bin-artifacts.txt\"\n  exit 0\nfi\n\ncgrc=$(cat \"$GITHUB_WORKSPACE/stage17-results/config/v5-config-gate-exit.txt\"\
        \ 2>/dev/null || echo 99)\nif [ \"$cgrc\" != \"0\" ]; then\n  echo \"SKIPPED_V5_CONFIG_GATE_$cgrc\" > \"$OUT/image-exit.txt\"\n  echo \"Image pipeline\
        \ skipped until FlowMgr/NetFN/ECM Premium are selected.\" > \"$OUT/target-install.log\"\n  : > \"$OUT/image-errors.txt\"\n  : > \"$OUT/image-tail.txt\"\
        \n  : > \"$OUT/bin-artifacts.txt\"\n  exit 0\nfi\n\nprc=$(cat \"$GITHUB_WORKSPACE/stage17-results/packages/package-batch-exit.txt\" 2>/dev/null\
        \ || echo 99)\nif [ \"$prc\" != \"0\" ]; then\n  echo \"SKIPPED_PACKAGE_BATCH_EXIT_$prc\" > \"$OUT/image-exit.txt\"\n  echo \"Image pipeline skipped\
        \ until NetFN/ECM and package cascade are green.\" > \"$OUT/target-install.log\"\n  : > \"$OUT/image-errors.txt\"\n  : > \"$OUT/image-tail.txt\"\
        \n  : > \"$OUT/bin-artifacts.txt\"\n  exit 0\nfi\n\n# Host opkg is needed by package/install.\nif [ ! -x staging_dir/host/bin/opkg ]; then\n  timeout\
        \ 1800 make -j\"$(nproc)\" package/system/opkg/host/compile V=s > \"$OUT/opkg-host.log\" 2>&1\n  orc=$?\nelse\n  orc=0\n  echo \"reused existing\
        \ staging_dir/host/bin/opkg\" > \"$OUT/opkg-host.log\"\nfi\necho \"$orc\" > \"$OUT/opkg-host-exit.txt\"\necho \"$(test -x staging_dir/host/bin/opkg\
        \ && echo true || echo false)\" > \"$OUT/opkg-host-present.txt\"\n\n# fwtool is required to append valid OpenWrt metadata/certificates to sysupgrade\
        \ images.\nfrc=0\nif [ ! -x staging_dir/host/bin/fwtool ]; then\n  timeout 1800 make -j\"$(nproc)\" package/system/fwtool/host/compile V=s > \"\
        $OUT/fwtool-host.log\" 2>&1\n  frc=$?\n  if [ \"$frc\" -ne 0 ] || [ ! -x staging_dir/host/bin/fwtool ]; then\n    # Fallback for trees where fwtool\
        \ is provided through the normal package compile.\n    timeout 1800 make -j\"$(nproc)\" package/system/fwtool/compile V=s >> \"$OUT/fwtool-host.log\"\
        \ 2>&1\n    frc=$?\n  fi\nelse\n  echo \"reused existing staging_dir/host/bin/fwtool\" > \"$OUT/fwtool-host.log\"\nfi\necho \"$frc\" > \"$OUT/fwtool-host-exit.txt\"\
        \necho \"$(test -x staging_dir/host/bin/fwtool && echo true || echo false)\" > \"$OUT/fwtool-host-present.txt\"\n\nif [ \"$orc\" -ne 0 ] || [ !\
        \ -x staging_dir/host/bin/opkg ] || \\\n   [ \"$frc\" -ne 0 ] || [ ! -x staging_dir/host/bin/fwtool ]; then\n  echo 127 > \"$OUT/image-exit.txt\"\
        \n  {\n    echo \"opkg_present=$(test -x staging_dir/host/bin/opkg && echo true || echo false)\"\n    echo \"fwtool_present=$(test -x staging_dir/host/bin/fwtool\
        \ && echo true || echo false)\"\n  } > \"$OUT/image-host-tools-gate.txt\"\n  cat \"$OUT/opkg-host.log\" \"$OUT/fwtool-host.log\" 2>/dev/null \\\n\
        \    | grep -nE '(^|[[:space:]])(error:|fatal error:|No rule to make target|Error [0-9]+)' \\\n    | tail -n 400 > \"$OUT/image-errors.txt\" ||\
        \ true\n  exit 0\nfi\n\ntimeout 5400 make -j\"$(nproc)\" package/install V=s > \"$OUT/package-install.log\" 2>&1\nirc=$?\necho \"$irc\" > \"$OUT/package-install-exit.txt\"\
        \nif [ \"$irc\" -ne 0 ]; then\n  echo \"$irc\" > \"$OUT/image-exit.txt\"\n  grep -nE '(^|[[:space:]])(error:|fatal error:|Traceback|No rule to make\
        \ target|Error [0-9]+)' \\\n    \"$OUT/package-install.log\" | tail -n 400 > \"$OUT/image-errors.txt\" || true\n  tail -n 500 \"$OUT/package-install.log\"\
        \ > \"$OUT/image-tail.txt\" 2>/dev/null || true\n  exit 0\nfi\n\ntimeout 5400 make -j\"$(nproc)\" target/install V=s > \"$OUT/target-install.log\"\
        \ 2>&1\nrc=$?\necho \"$rc\" > \"$OUT/image-exit.txt\"\ngrep -nE '(^|[[:space:]])(error:|fatal error:|Traceback|No rule to make target|Error [0-9]+|command\
        \ not found)' \\\n  \"$OUT/target-install.log\" | tail -n 500 > \"$OUT/image-errors.txt\" || true\ntail -n 600 \"$OUT/target-install.log\" > \"\
        $OUT/image-tail.txt\" 2>/dev/null || true\n\nfind bin/targets/ipq95xx/generic -maxdepth 2 -type f -printf '%p\\t%s bytes\\n' 2>/dev/null \\\n  |\
        \ sort > \"$OUT/bin-artifacts.txt\" || true\n\nSYSUP=\"$(find bin/targets/ipq95xx/generic -maxdepth 1 -type f -name '*askey_sbe1v1k*sysupgrade.bin'\
        \ | head -n1)\"\nFACTORY=\"$(find bin/targets/ipq95xx/generic -maxdepth 1 -type f -name '*askey_sbe1v1k*factory.bin' | head -n1)\"\n{\n  echo \"\
        sysupgrade=$SYSUP\"\n  echo \"factory=$FACTORY\"\n  [ -n \"$SYSUP\" ] && sha256sum \"$SYSUP\" || true\n  [ -n \"$FACTORY\" ] && sha256sum \"$FACTORY\"\
        \ || true\n} > \"$OUT/image-candidates.txt\"\n\n# If target/install returned success but metadata tool errors leaked into the log, fail the engineering\
        \ gate.\nif grep -qE 'fwtool: command not found|command not found.*fwtool' \"$OUT/target-install.log\"; then\n  echo 126 > \"$OUT/image-exit.txt\"\
        \nfi\nexit 0\n"
    - name: Collect V5.3 firmware candidates and write verdict
      if: always()
      shell: bash
      run: "set +e\nR=\"$GITHUB_WORKSPACE/stage17-results\"\nO=\"$GITHUB_WORKSPACE/stage17-work/openwrt\"\nF=\"$R/firmware\"\nmkdir -p \"$F\"\n\nsrc_rc=\"\
        $(cat \"$R/local-sources/source-tree-exit.txt\" 2>/dev/null || echo 99)\"\ncgrc=\"$(cat \"$R/config/v5-config-gate-exit.txt\" 2>/dev/null || echo\
        \ 99)\"\nerc=\"$(cat \"$R/device/ethernet-v4-exit.txt\" 2>/dev/null || echo 99)\"\nkrc=\"$(cat \"$R/kernel/kernel-exit.txt\" 2>/dev/null || echo\
        \ 99)\"\nprc=\"$(cat \"$R/packages/package-batch-exit.txt\" 2>/dev/null || echo 99)\"\nirc=\"$(cat \"$R/image/image-exit.txt\" 2>/dev/null || echo\
        \ 99)\"\n\n: > \"$F/source-files.txt\"\nif [ -d \"$O/bin/targets/ipq95xx/generic\" ]; then\n  find \"$O/bin/targets/ipq95xx/generic\" -maxdepth\
        \ 1 -type f \\\n    \\( -iname '*sbe1v1k*' -o -name 'sha256sums' -o -name 'profiles.json' \\) \\\n    -print | sort > \"$F/source-files.txt\" ||\
        \ true\n  while IFS= read -r f; do\n    [ -f \"$f\" ] || continue\n    cp -f \"$f\" \"$F/\" || true\n  done < \"$F/source-files.txt\"\nfi\n\nfind\
        \ \"$F\" -maxdepth 1 -type f -printf '%f\\t%s bytes\\n' | sort > \"$F/manifest.txt\" 2>/dev/null || true\n(\n  cd \"$F\" || exit 0\n  sha256sum\
        \ * 2>/dev/null | grep -vE ' (sha256sums|manifest.txt|source-files.txt|V5-VERDICT.txt)$' \\\n    > firmware-sha256.txt || true\n)\n\ninitramfs_count=\"\
        $(find \"$F\" -maxdepth 1 -type f \\( -name '*initramfs*.itb' -o -name '*initramfs*.bin' -o -name '*initramfs*uImage*' \\) | wc -l)\"\nfactory_count=\"\
        $(find \"$F\" -maxdepth 1 -type f -name '*factory*.bin' | wc -l)\"\nsysupgrade_count=\"$(find \"$F\" -maxdepth 1 -type f -name '*sysupgrade*.bin'\
        \ | wc -l)\"\n\n{\n  echo \"source_tree_exit=$src_rc\"\n  echo \"v5_config_gate_exit=$cgrc\"\n  echo \"ethernet_v4_exit=$erc\"\n  echo \"kernel_exit=$krc\"\
        \n  echo \"package_batch_exit=$prc\"\n  echo \"image_exit=$irc\"\n  echo \"initramfs_count=$initramfs_count\"\n  echo \"factory_count=$factory_count\"\
        \n  echo \"sysupgrade_count=$sysupgrade_count\"\n  if [ \"$src_rc\" = 0 ] && [ \"$cgrc\" = 0 ] && [ \"$erc\" = 0 ] && [ \"$krc\" = 0 ] && \\\n \
        \    [ \"$prc\" = 0 ] && [ \"$irc\" = 0 ] && [ \"$initramfs_count\" -gt 0 ]; then\n    echo \"VERDICT=V5_3_RAM_BOOT_CANDIDATE_BUILT\"\n  else\n\
        \    echo \"VERDICT=V5_NOT_READY\"\n  fi\n  echo\n  echo \"SAFETY=DO_NOT_FLASH_EMMC\"\n  echo \"Reason: DEVICE_DTS_CONFIG still uses config-rdp433-mht-phy\
        \ as an engineering placeholder.\"\n} | tee \"$F/V5-VERDICT.txt\"\nexit 0\n"
    - name: Generate V5.3 summary
      if: always()
      shell: bash
      run: 'set +e

        R="$GITHUB_WORKSPACE/stage17-results"

        val() { [ -f "$1" ] && cat "$1" || echo NOT_RUN; }

        IRC="$(val "$R/integration/integration-exit.txt")"

        TRC="$(val "$R/device/transplant-exit.txt")"

        CRC="$(val "$R/config/config-exit.txt")"

        BRC="$(val "$R/bootstrap/bootstrap-exit.txt")"

        KRC="$(val "$R/kernel/kernel-exit.txt")"

        DTC="$(val "$R/kernel/sbe1v1k-dtb-count.txt")"

        PRC="$(val "$R/packages/package-batch-exit.txt")"

        IMRC="$(val "$R/image/image-exit.txt")"

        KOS="$(wc -l < "$R/packages/relevant-built-kos.txt" 2>/dev/null || echo 0)"


        cat > "$R/stage14-summary.txt" <<EOF

        SBE1V1K QSDK 6.6 V5.3 - Release-aligned NetFN / emesh / ECM full-stack firmware

        ====================================================

        openwrt_tag: $OPENWRT_TAG

        feed_ipq_branch: $FEED_IPQ_BRANCH

        kernel_target: IPQ95xx / Linux 6.6.47 / Cortex-A73

        integration_exit: $IRC

        transplant_exit: $TRC

        config_exit: $CRC

        bootstrap_exit: $BRC

        bootstrap_cache_hit: ${{ steps.bootstrap-cache.outputs.cache-hit }}

        bootstrap_cache_imported: $(cat "$R/bootstrap/cache-imported.txt" 2>/dev/null || echo 0)

        kernel_exit: $KRC

        sbe1v1k_dtb_count: $DTC

        qca_package_batch_exit: $PRC

        relevant_ko_count: $KOS

        engineering_image_exit: $IMRC


        Stage 17 gates:

        - Gate A: fast DTB preflight compiles ipq9574-sbe1v1k.dtb before any expensive full-kernel build.

        - Gate B: SSDK -> PHY -> NSS-DP -> PPE remains green after device transplant.

        - Gate C: identify NetFN / FlowMgr / ECM package/source path in the QSDK13 environment.

        - Gate D: exercise target/install only to expose image-pipeline blockers early.


        SAFETY:

        - DEVICE_DTS_CONFIG still reuses config-rdp433-mht-phy as an engineering placeholder.

        - Stage 17 maps PCIe labels, resolves the duplicate tzapp node, and imports native QSDK q6 reserved-memory labels only for compile validation; secure-memory/runtime
        parity is NOT validated.

        - Any V5 factory/sysupgrade image is NOT flashable and MUST NOT be flashed to eMMC.

        - RTL8261N runtime driver/firmware, Wi-Fi/caldata, MAC/partition/recovery and board-config parity still require validation.

        EOF


        echo "===== STAGE 8 SUMMARY ====="

        cat "$R/stage14-summary.txt"

        echo "===== DTB ====="

        cat "$R/kernel/sbe1v1k-dtb.txt" 2>/dev/null || true

        echo "===== PACKAGE STATUS ====="

        cat "$R/packages/package-build-status.tsv" 2>/dev/null || true

        echo "===== IMAGE ERRORS ====="

        cat "$R/image/image-errors.txt" 2>/dev/null || true


        echo "===== V5 FIRMWARE VERDICT ====="

        cat "$R/firmware/V5-VERDICT.txt" 2>/dev/null || true

        echo "===== V5 FIRMWARE MANIFEST ====="

        cat "$R/firmware/manifest.txt" 2>/dev/null || true


        echo "===== V5.3 LOCAL SOURCE TREE ====="

        cat "$R/local-sources/source-tree-summary.txt" 2>/dev/null || true

        cat "$R/local-sources/source-tree-status.tsv" 2>/dev/null || true


        echo "===== V5.3 EXACT NSS-PPE BASE ====="

        cat "$R/local-sources/nss-ppe-base.commit.txt" 2>/dev/null || true

        cat "$R/local-sources/qca-nss-ppe-rule-LOCAL_SRC.txt" 2>/dev/null || true

        cat "$R/local-sources/qca-nss-ppe-rule-destination.txt" 2>/dev/null || true

        '
