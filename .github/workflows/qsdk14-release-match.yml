name: QSDK14 Release Matcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y git python3

          rm -rf qsdk-match results
          mkdir -p qsdk-match results

      - name: Fetch exact QSDK source repositories
        shell: bash
        run: |
          set -euo pipefail

          clone_repo() {
              name="$1"
              url="$2"

              echo
              echo "===== CLONE $name ====="

              git clone \
                --filter=blob:none \
                --no-checkout \
                "$url" \
                "qsdk-match/$name"

              git -C "qsdk-match/$name" \
                fetch --tags --force

              git -C "qsdk-match/$name" \
                remote -v
          }

          clone_repo \
            qca-nss-phy \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-phy.git

          clone_repo \
            qca-ssdk \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git

          clone_repo \
            qca-nss-ppe \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git

          clone_repo \
            qca-nss-dp \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-dp.git

      - name: Verify reference commits exist
        shell: bash
        run: |
          set -euo pipefail

          verify_commit() {
              repo="$1"
              commit="$2"

              echo
              echo "===== $repo : $commit ====="

              git -C "qsdk-match/$repo" \
                cat-file -e "${commit}^{commit}"

              git -C "qsdk-match/$repo" \
                show \
                --no-patch \
                --format='commit=%H%ncommit_date=%cI%nsubject=%s' \
                "$commit"
          }

          verify_commit \
            qca-nss-phy \
            16eec6ac35820cb67af59223e8b4c2dba7179655

          verify_commit \
            qca-ssdk \
            717b74016b0c131575bcd81b9e039d3f7974b02a

          verify_commit \
            qca-nss-ppe \
            87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

          verify_commit \
            qca-nss-dp \
            22555a9

      - name: Match NHSS QSDK 14 tags
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import json

          root = Path("qsdk-match")
          out = Path("results")
          out.mkdir(exist_ok=True)

          repos = {
              "qca-nss-phy":
                  "16eec6ac35820cb67af59223e8b4c2dba7179655",

              "qca-ssdk":
                  "717b74016b0c131575bcd81b9e039d3f7974b02a",

              "qca-nss-ppe":
                  "87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5",

              "qca-nss-dp":
                  "22555a9",
          }

          def run(repo, *args):
              return subprocess.check_output(
                  ["git", "-C", str(root / repo), *args],
                  text=True
              ).strip()

          all_data = {}
          tag_sets = {}

          for repo, commit in repos.items():

              commit = run(repo, "rev-parse", commit)

              refs = run(
                  repo,
                  "for-each-ref",
                  f"--contains={commit}",
                  "--format=%(refname:short)|%(creatordate:iso8601)",
                  "refs/tags"
              )

              rows = []

              for line in refs.splitlines():
                  if not line.strip():
                      continue

                  tag, date = line.split("|", 1)

                  if not tag.startswith("NHSS.QSDK.14"):
                      continue

                  try:
                      head = run(
                          repo,
                          "rev-list",
                          "-n1",
                          tag
                      )

                      distance = int(
                          run(
                              repo,
                              "rev-list",
                              "--count",
                              f"{commit}..{head}"
                          )
                      )

                  except Exception:
                      head = "UNKNOWN"
                      distance = -1

                  rows.append({
                      "tag": tag,
                      "date": date,
                      "head": head,
                      "distance_from_reference_commit": distance,
                  })

              rows.sort(
                  key=lambda x: (
                      x["distance_from_reference_commit"],
                      x["tag"]
                  )
              )

              all_data[repo] = {
                  "reference_commit": commit,
                  "tags": rows,
              }

              tag_sets[repo] = {
                  x["tag"] for x in rows
              }

              with (
                  out / f"{repo}-qSDK14-tags.tsv"
              ).open("w") as f:

                  f.write(
                      "tag\tdate\tdistance\thead\n"
                  )

                  for x in rows:
                      f.write(
                          f'{x["tag"]}\t'
                          f'{x["date"]}\t'
                          f'{x["distance_from_reference_commit"]}\t'
                          f'{x["head"]}\n'
                      )

          common = (
              set.intersection(*tag_sets.values())
              if tag_sets
              else set()
          )

          common_rows = []

          for tag in sorted(common):

              distances = {}

              dates = {}

              for repo in repos:
                  row = next(
                      x for x in all_data[repo]["tags"]
                      if x["tag"] == tag
                  )

                  distances[repo] = (
                      row["distance_from_reference_commit"]
                  )

                  dates[repo] = row["date"]

              common_rows.append({
                  "tag": tag,
                  "distances": distances,
                  "total_distance": sum(
                      x for x in distances.values()
                      if x >= 0
                  ),
                  "dates": dates,
              })

          common_rows.sort(
              key=lambda x: (
                  x["total_distance"],
                  x["tag"]
              )
          )

          (out / "all-results.json").write_text(
              json.dumps(
                  {
                      "repositories": all_data,
                      "common_tags": common_rows,
                  },
                  indent=2
              ) + "\n"
          )

          with (
              out / "COMMON-QSDK14-TAGS.txt"
          ).open("w") as f:

              if not common_rows:
                  f.write(
                      "NO COMMON NHSS.QSDK.14 TAG FOUND\n"
                  )

              for row in common_rows:

                  f.write(
                      f'{row["tag"]} '
                      f'total_distance='
                      f'{row["total_distance"]}\n'
                  )

                  for repo, distance in (
                      row["distances"].items()
                  ):
                      f.write(
                          f'  {repo}: '
                          f'distance={distance}\n'
                      )

          print()
          print("================================")
          print(" COMMON NHSS.QSDK.14 TAGS")
          print("================================")

          if not common_rows:
              print(
                  "No single common QSDK14 tag "
                  "contains all four reference commits."
              )
          else:
              for row in common_rows:
                  print(
                      row["tag"],
                      "total_distance=",
                      row["total_distance"]
                  )

                  for repo, distance in (
                      row["distances"].items()
                  ):
                      print(
                          "  ",
                          repo,
                          "distance=",
                          distance
                      )

          PY

      - name: Scan feed repositories
        shell: bash
        run: |
          set -euo pipefail

          clone_feed() {
              name="$1"
              url="$2"

              echo
              echo "===== FEED $name ====="

              git clone \
                --filter=blob:none \
                --no-checkout \
                "$url" \
                "qsdk-match/feed-$name"

              git -C "qsdk-match/feed-$name" \
                fetch --tags --force

              git -C "qsdk-match/feed-$name" \
                tag -l 'NHSS.QSDK.14*' \
                | sort -V \
                > "results/feed-${name}-qSDK14-tags.txt"
          }

          clone_feed \
            nss-host \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-host.git

          clone_feed \
            ssdk \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ssdk.git

          clone_feed \
            nss-profiles \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-profiles.git

      - name: Generate final report
        if: always()
        shell: bash
        run: |
          {
              echo "===== REFERENCE ====="
              echo "PHY  = 16eec6a"
              echo "SSDK = 717b740"
              echo "PPE  = 87bb9b3"
              echo "DP   = 22555a9"
              echo
              echo "===== COMMON RELEASE TAGS ====="
              cat results/COMMON-QSDK14-TAGS.txt \
                2>/dev/null || true
              echo
              echo "===== NSS-HOST TAGS ====="
              cat results/feed-nss-host-qSDK14-tags.txt \
                2>/dev/null || true
              echo
              echo "===== SSDK FEED TAGS ====="
              cat results/feed-ssdk-qSDK14-tags.txt \
                2>/dev/null || true
              echo
              echo "===== NSS PROFILE TAGS ====="
              cat results/feed-nss-profiles-qSDK14-tags.txt \
                2>/dev/null || true
          } | tee results/FINAL-REPORT.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QSDK14-Release-Matcher
          path: results/
          retention-days: 14
