name: QSDK14 r9-00034 Assembly Map Probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QSDK_TAG: NHSS.QSDK.14.0.r9-00034-O
  OPENWRT_COMMIT: 00d52ae93de98724af4ba89e2b9f19aa4a416f36
  OPENWRT_IPQ_PATCHES_COMMIT: 7536c0abfa4a2e7dbf9fffa6644ff16152bfe3a6
  QSDK_CONFIG_COMMIT: 190a2e4176da8b981e465c9c5b65e7846c0c041a

jobs:
  assembly-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git patch python3 jq

      - name: Clone exact r9-00034 repositories
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail

          rm -rf work results
          mkdir -p work results/{baseline,config,patches,openwrt,discovery}

          clone_tag() {
            local name="$1" url="$2" expect="$3" dst="$4"

            git clone --depth=1 --branch "$QSDK_TAG" "$url" "$dst"

            actual="$(git -C "$dst" rev-parse HEAD)"

            printf '%s\t%s\t%s\t%s\n' \
              "$name" "$expect" "$actual" "$url" \
              >> results/baseline/commits.tsv

            test "$actual" = "$expect"
          }

          printf 'repository\texpected\tactual\turl\n' \
            > results/baseline/commits.tsv

          clone_tag \
            openwrt_repo \
            https://git.codelinaro.org/clo/qsdk/oss/system/openwrt_repo.git \
            "$OPENWRT_COMMIT" \
            work/openwrt

          clone_tag \
            openwrt-ipq-patches \
            https://git.codelinaro.org/clo/qsdk/oss/system/openwrt-ipq-patches.git \
            "$OPENWRT_IPQ_PATCHES_COMMIT" \
            work/openwrt-ipq-patches

          clone_tag \
            qsdk-config \
            https://git.codelinaro.org/clo/qsdk/oss/releases/configs/qsdk.git \
            "$QSDK_CONFIG_COMMIT" \
            work/qsdk-config

      - name: Inventory QSDK release config repository
        shell: bash
        run: |
          set -euxo pipefail

          C="$GITHUB_WORKSPACE/work/qsdk-config"

          find "$C" -type f \
            | sed "s#^$C/##" \
            | sort \
            > results/config/all-files.txt

          find "$C" -maxdepth 4 -type f \
            \( -name '*.xml' -o -name '*.yml' -o -name '*.yaml' \
               -o -name '*.json' -o -name '*.conf' -o -name '*.config' \
               -o -name '*.mk' -o -name Makefile -o -name '*.sh' \
               -o -iname 'README*' -o -iname '*manifest*' \) \
            | sed "s#^$C/##" \
            | sort \
            > results/config/likely-entry-files.txt

          grep -RInEi \
            'ipq95xx|ipq9574|openwrt_repo|openwrt-ipq-patches|linux-ipq-6\.6|target/linux|targets/ipq95|repo init|repo sync|manifest|src-link|feeds|nss-host|nss-profiles' \
            "$C" \
            2>/dev/null \
            > results/config/assembly-hits.txt || true

          while IFS= read -r rel; do
            f="$C/$rel"
            [ -f "$f" ] || continue
            {
              echo
              echo "============================================================"
              echo "$rel"
              echo "============================================================"
              sed -n '1,500p' "$f"
            } >> results/config/entry-files-content.txt
          done < results/config/likely-entry-files.txt

          # Extract every URL-ish token. This often exposes the repo that owns
          # the IPQ target even if its name is not obvious.
          grep -RhoE \
            'https?://[^"'"'"'[:space:]<>]+' \
            "$C" 2>/dev/null \
            | sed 's/[),;]$//' \
            | sort -u \
            > results/config/urls.txt || true

          grep -RhoE \
            'git[^"'"'"'[:space:]<>]*\.git|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git' \
            "$C" 2>/dev/null \
            | sort -u \
            > results/config/git-references.txt || true

      - name: Inventory patch repository control files
        shell: bash
        run: |
          set -euxo pipefail

          P="$GITHUB_WORKSPACE/work/openwrt-ipq-patches"

          find "$P" -maxdepth 3 -type f \
            | sed "s#^$P/##" \
            | sort \
            > results/patches/top-files.txt

          find "$P" -type f \
            \( -name '*.sh' -o -name '*.py' -o -name Makefile \
               -o -name series -o -iname 'README*' -o -name '*.conf' \
               -o -name '*.mk' \) \
            | sed "s#^$P/##" \
            | sort \
            > results/patches/control-files.txt

          while IFS= read -r rel; do
            f="$P/$rel"
            [ -f "$f" ] || continue
            {
              echo
              echo "============================================================"
              echo "$rel"
              echo "============================================================"
              sed -n '1,500p' "$f"
            } >> results/patches/control-files-content.txt
          done < results/patches/control-files.txt

          grep -RInEi \
            'apply.*patch|patch.*apply|git apply|quilt|series|openwrt_repo|target/linux|ipq95xx|qualcommbe|src-link|feeds' \
            "$P" \
            --exclude='*.patch' \
            2>/dev/null \
            > results/patches/orchestration-hits.txt || true

      - name: Test whether first patch is already present
        shell: bash
        run: |
          set -euxo pipefail

          O="$GITHUB_WORKSPACE/work/openwrt"
          P="$GITHUB_WORKSPACE/work/openwrt-ipq-patches"
          FIRST="$P/0001-include-Enable-force-feed-install-during-package-sym.patch"

          test -f "$FIRST"

          set +e
          git -C "$O" apply --check "$FIRST" \
            > results/patches/first-forward.txt 2>&1
          forward_rc=$?

          git -C "$O" apply --reverse --check "$FIRST" \
            > results/patches/first-reverse.txt 2>&1
          reverse_rc=$?
          set -e

          {
            echo "forward_rc=$forward_rc"
            echo "reverse_rc=$reverse_rc"

            if [ "$forward_rc" -eq 0 ]; then
              echo "classification=NOT_APPLIED_AND_APPLICABLE"
            elif [ "$reverse_rc" -eq 0 ]; then
              echo "classification=ALREADY_APPLIED"
            else
              echo "classification=BASE_MISMATCH_OR_DEPENDENT_PATCH"
            fi
          } | tee results/patches/first-classification.txt

          {
            echo "===== PATCH ====="
            sed -n '1,260p' "$FIRST"
            echo
            echo "===== CURRENT include/toplevel.mk around package symbol logic ====="
            grep -n -A80 -B80 \
              -E 'package.*symbol|package/symlinks|feeds|FORCE|force' \
              "$O/include/toplevel.mk" 2>/dev/null | head -n 600 || true
          } > results/patches/first-context.txt

      - name: Probe likely CodeLinaro QSDK target repositories from config
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euxo pipefail

          C="$GITHUB_WORKSPACE/work/qsdk-config"

          : > results/discovery/candidate-urls.txt

          # First take URLs explicitly present in the release config.
          grep -RhoE \
            'https://git\.codelinaro\.org/[^"'"'"'[:space:]<>]+' \
            "$C" 2>/dev/null \
            | sed 's/[),;]$//' \
            | sort -u \
            >> results/discovery/candidate-urls.txt || true

          # Add conservative names suggested by QSDK/OpenWrt layout.
          cat >> results/discovery/candidate-urls.txt <<'EOF'
          https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ipq.git
          https://git.codelinaro.org/clo/qsdk/oss/system/feeds/ipq-targets.git
          https://git.codelinaro.org/clo/qsdk/oss/system/feeds/targets.git
          https://git.codelinaro.org/clo/qsdk/oss/system/openwrt-ipq.git
          https://git.codelinaro.org/clo/qsdk/oss/system/ipq-targets.git
          EOF

          sort -u results/discovery/candidate-urls.txt \
            -o results/discovery/candidate-urls.txt

          printf 'url\treachable\ttag_head\n' \
            > results/discovery/probe.tsv

          while IFS= read -r url; do
            case "$url" in
              *.git) ;;
              *) continue ;;
            esac

            if git ls-remote "$url" HEAD >/dev/null 2>&1; then
              raw="$(
                git ls-remote "$url" \
                  "refs/tags/$QSDK_TAG" \
                  "refs/tags/$QSDK_TAG^{}" \
                  2>/dev/null || true
              )"

              head="$(
                printf '%s\n' "$raw" \
                  | awk '/\^\{\}$/ {print $1}' \
                  | tail -n1
              )"

              if [ -z "$head" ]; then
                head="$(
                  printf '%s\n' "$raw" \
                    | awk 'NR==1{print $1}'
                )"
              fi

              printf '%s\tYES\t%s\n' \
                "$url" "${head:--}" \
                >> results/discovery/probe.tsv
            else
              printf '%s\tNO\t-\n' \
                "$url" \
                >> results/discovery/probe.tsv
            fi
          done < results/discovery/candidate-urls.txt

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "QSDK14 r9-00034 Assembly Map Probe"
            echo "=================================="
            echo
            echo "===== BASELINE ====="
            cat results/baseline/commits.tsv 2>/dev/null || true

            echo
            echo "===== FIRST PATCH CLASSIFICATION ====="
            cat results/patches/first-classification.txt 2>/dev/null || true

            echo
            echo "===== CONFIG ASSEMBLY HITS ====="
            head -n 300 results/config/assembly-hits.txt 2>/dev/null || true

            echo
            echo "===== CANDIDATE REPOSITORIES ====="
            cat results/discovery/probe.tsv 2>/dev/null || true
          } | tee results/ASSEMBLY-MAP-SUMMARY.txt

      - name: Upload assembly map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QSDK14-r9-00034-Assembly-Map
          path: results/
          retention-days: 14
          if-no-files-found: error
