name: SBE1V1K QSDK66 SSDK QSGMII Capability Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned QSDK feed
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zilogic-systems/feed-ipq.git feed-ipq
          git -C feed-ipq checkout 183c0317fad6f23bd450a4d1953324de1931f712
          test "$(git -C feed-ipq rev-parse HEAD)" = "183c0317fad6f23bd450a4d1953324de1931f712"

      - name: Find qca-ssdk package metadata
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/scan"
          mkdir -p "$OUT"
          find feed-ipq -type f \( -name Makefile -o -name '*.mk' \) -print0 |
            xargs -0 grep -IlE 'qca-ssdk|PKG_NAME.?[:?+]?=.*ssdk' |
            sort > "$OUT/ssdk-makefiles.txt" || true
          test -s "$OUT/ssdk-makefiles.txt"
          while IFS= read -r f; do
            echo "===== $f ====="
            grep -nE 'PKG_(NAME|VERSION|RELEASE|SOURCE|SOURCE_URL|SOURCE_VERSION|MIRROR_HASH)|qca-ssdk' "$f" || true
          done < "$OUT/ssdk-makefiles.txt" | tee "$OUT/ssdk-package-metadata.txt"

      - name: Resolve exact SSDK source
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/scan"
          COMMIT="717b74016b0c131575bcd81b9e039d3f7974b02a"
          echo "$COMMIT" > "$OUT/expected-ssdk-commit.txt"

          urls=(
            "https://github.com/openwrt/qca-ssdk.git"
            "https://github.com/qca/qca-ssdk.git"
            "https://github.com/quic/qca-ssdk.git"
          )

          found=0
          for url in "${urls[@]}"; do
            rm -rf qca-ssdk
            if git clone --filter=blob:none --no-checkout "$url" qca-ssdk 2>"$OUT/clone.err"; then
              if git -C qca-ssdk fetch --depth=1 origin "$COMMIT" 2>>"$OUT/clone.err"; then
                git -C qca-ssdk checkout --detach FETCH_HEAD
                if [ "$(git -C qca-ssdk rev-parse HEAD)" = "$COMMIT" ]; then
                  echo "$url" > "$OUT/ssdk-source-url.txt"
                  found=1
                  break
                fi
              fi
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "Exact Stage17 SSDK commit was not reachable from candidate public repositories." | tee "$OUT/RESOLUTION.txt"
            echo "Package metadata above is the authoritative next clue."
            exit 21
          fi
          git -C qca-ssdk log -1 --format=fuller > "$OUT/ssdk-commit.txt"

      - name: Scan QSGMII enums and implementations
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/scan"
          PAT='QSGMII|PSGMII|USXGMII|PORT_WRAPPER_|UNIPHY.*MODE|switch_mac_mode|mac_mode'
          grep -RInE "$PAT" qca-ssdk \
            --exclude-dir=.git > "$OUT/all-mode-hits.txt" || true

          grep -RInE 'QSGMII|PORT_WRAPPER_QSGMII|UNIPHY_QSGMII|SSDK_QSGMII' qca-ssdk \
            --exclude-dir=.git > "$OUT/qsgmii-hits.txt" || true

          grep -RInE 'PORT_WRAPPER_[A-Z0-9_]+' qca-ssdk \
            --exclude-dir=.git > "$OUT/port-wrapper-hits.txt" || true

          grep -RInE 'switch_mac_mode|switch_mac_mode1|switch_mac_mode2' qca-ssdk \
            --exclude-dir=.git > "$OUT/dts-parser-hits.txt" || true

      - name: Extract QSGMII implementation context
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/scan"
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("qca-ssdk")
          out=Path("scan")
          pats=[
              re.compile(r'QSGMII',re.I),
              re.compile(r'PORT_WRAPPER_',re.I),
              re.compile(r'switch_mac_mode',re.I),
          ]
          with (out/"mode-context.txt").open("w") as w:
              for f in root.rglob("*"):
                  if not f.is_file() or ".git" in f.parts:
                      continue
                  try: lines=f.read_text(errors="replace").splitlines()
                  except Exception: continue
                  hits=[i for i,l in enumerate(lines) if any(p.search(l) for p in pats)]
                  if not hits: continue
                  ranges=[]
                  for i in hits:
                      a=max(0,i-12); b=min(len(lines),i+25)
                      if ranges and a<=ranges[-1][1]:
                          ranges[-1][1]=max(ranges[-1][1],b)
                      else: ranges.append([a,b])
                  w.write(f"\n===== {f} =====\n")
                  for a,b in ranges:
                      w.write(f"--- {a+1}-{b} ---\n")
                      for n in range(a,b):
                          w.write(f"{n+1:5d}: {lines[n]}\n")
          PY

      - name: Capability verdict
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/scan"
          qhits="$(grep -Ric 'QSGMII' qca-ssdk --exclude-dir=.git || true)"
          enumhits="$(grep -RIlE 'PORT_WRAPPER_QSGMII|UNIPHY_QSGMII|SSDK_QSGMII' qca-ssdk --exclude-dir=.git | wc -l)"
          implhits="$(grep -RIlE 'qsgmii.*mode.*set|mode.*qsgmii|PORT_WRAPPER_QSGMII' qca-ssdk --exclude-dir=.git | wc -l)"
          {
            echo "QSGMII_TOTAL_HITS=$qhits"
            echo "QSGMII_ENUM_FILES=$enumhits"
            echo "QSGMII_IMPL_FILES=$implhits"
            if [ "$qhits" -eq 0 ]; then
              echo "VERDICT=NO_QSGMII_SYMBOLS_FOUND"
            elif [ "$enumhits" -eq 0 ] || [ "$implhits" -eq 0 ]; then
              echo "VERDICT=QSGMII_REFERENCED_BUT_IMPLEMENTATION_UNPROVEN"
            else
              echo "VERDICT=QSGMII_CODE_PRESENT_REVIEW_CONTEXT"
            fi
          } | tee "$OUT/VERDICT.txt"

      - name: Upload capability scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-SSDK-QSGMII-Capability-Scan
          path: scan/
          if-no-files-found: error
          retention-days: 7
