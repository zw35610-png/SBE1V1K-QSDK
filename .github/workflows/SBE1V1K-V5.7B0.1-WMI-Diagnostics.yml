name: SBE1V1K V5.7B0.1 WMI Diagnostics
on: {workflow_dispatch: {}}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl subversion swig time jq zstd
      - name: Clone exact A1 source
        run: |
          git clone https://github.com/yintaomu/SBE1V1K-OpenWrt.git openwrt
          cd openwrt
          git checkout 6c7c3c6bac78ddbe6c51a88284453d9c724713e1
      - name: Prepare
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp configs/sbe1v1k.config .config
          make defconfig
          make package/kernel/mac80211/download V=s
          make package/kernel/mac80211/prepare V=s
      - name: Patch WMI diagnostics
        run: |
          cd openwrt
          WMI=$(find build_dir -path '*/drivers/net/wireless/ath/ath12k/wmi.c' | head -1)
          HTC=$(find build_dir -path '*/drivers/net/wireless/ath/ath12k/htc.c' | head -1)
          test -n "$WMI" && test -n "$HTC"
          python3 - "$WMI" "$HTC" <<'PY'
          import sys
          from pathlib import Path
          wmi,htc=map(Path,sys.argv[1:3])
          s=wmi.read_text()
          a='''\tstatus = ath12k_htc_connect_service(&ab->htc, &conn_req, &conn_resp);
          \tif (status) {'''
          b='''\tath12k_warn(ab, "B01 begin pdev=%u svc=0x%x ep_count=%u max_radios=%u hw_mode=%d\\n",
          \t\t    pdev_idx, conn_req.service_id, ab->htc.wmi_ep_count,
          \t\t    ab->hw_params->max_radios, ab->wmi_ab.preferred_hw_mode);
          \tstatus = ath12k_htc_connect_service(&ab->htc, &conn_req, &conn_resp);
          \tath12k_warn(ab, "B01 end pdev=%u svc=0x%x ret=%d fw_resp=0x%x eid=%u max_msg=%u\\n",
          \t\t    pdev_idx, conn_req.service_id, status, conn_resp.connect_resp_code,
          \t\t    conn_resp.eid, conn_resp.max_msg_len);
          \tif (status) {'''
          if a not in s: raise SystemExit("WMI anchor 1 not found")
          s=s.replace(a,b,1)
          a='''\tfor (i = 0; i < wmi_ep_count; i++)
          \t\tath12k_connect_pdev_htc_service(ab, i);

          \treturn 0;'''
          b='''\tath12k_warn(ab, "B01 wmi_connect ep_count=%u max_radios=%u hw_mode=%d\\n",
          \t\t    wmi_ep_count, ab->hw_params->max_radios, ab->wmi_ab.preferred_hw_mode);
          \tfor (i = 0; i < wmi_ep_count; i++) {
          \t\tint b01_ret = ath12k_connect_pdev_htc_service(ab, i);
          \t\tath12k_warn(ab, "B01 pdev_result pdev=%u ret=%d\\n", i, b01_ret);
          \t}
          \treturn 0;'''
          if a not in s: raise SystemExit("WMI anchor 2 not found")
          wmi.write_text(s.replace(a,b,1))
          h=htc.read_text()
          a='''\tconn_resp->connect_resp_code = le32_get_bits(resp_msg->flags_len,
          \t\t\t\t\t\t     HTC_SVC_RESP_MSG_STATUS);

          \t/* check response status */'''
          b='''\tconn_resp->connect_resp_code = le32_get_bits(resp_msg->flags_len,
          \t\t\t\t\t\t     HTC_SVC_RESP_MSG_STATUS);
          \tconn_resp->eid = le32_get_bits(resp_msg->flags_len, HTC_SVC_RESP_MSG_ENDPOINTID);
          \tconn_resp->max_msg_len = le32_get_bits(resp_msg->flags_len, HTC_SVC_RESP_MSG_MAXMSGSIZE);
          \tath12k_warn(ab, "B01 htc_resp req_svc=0x%x resp_svc=0x%x msg=0x%x fw=0x%x eid=%u max_msg=%u len=%u\\n",
          \t\t    conn_req->service_id, service_id, message_id, conn_resp->connect_resp_code,
          \t\t    conn_resp->eid, conn_resp->max_msg_len, htc->control_resp_len);

          \t/* check response status */'''
          if a not in h: raise SystemExit("HTC anchor not found")
          htc.write_text(h.replace(a,b,1))
          PY
          grep -R -n 'B01 ' "$(dirname "$WMI")" | tee ../B01-PATCH-CHECK.txt
      - name: Build
        run: |
          cd openwrt
          make -j"$(nproc)" world || make -j1 V=s world
      - name: Collect
        run: |
          set -euo pipefail
          OUT=openwrt/bin/targets/qualcommbe/ipq95xx
          test -s "$OUT/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-squashfs-sysupgrade.bin"
          mkdir -p artifact/VALIDATION
          cp "$OUT"/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-* artifact/
          cp B01-PATCH-CHECK.txt artifact/VALIDATION/
          find artifact -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifact/VALIDATION/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.7B0.1-WMI-Diagnostics
          path: artifact/
          if-no-files-found: error
          retention-days: 7
