name: SBE1V1K NSS 6.18 Stage1 Native V7 qca-nss-phy

on:
  workflow_dispatch:

jobs:
  stage1-native-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget bc bzip2 libelf-dev liblzma-dev libdeflate-tools python3-dev time xxd zstd

      - name: Checkout proven SBE1V1K baseline
        run: |
          set -e
          git clone --filter=blob:none https://github.com/luckkyboy/SBE1V1K.git openwrt
          cd openwrt
          git checkout 02fb9517c9aefac9f3825a15ae46e7998bae7edd
          test "$(git rev-parse HEAD)" = "02fb9517c9aefac9f3825a15ae46e7998bae7edd"

      - name: Add IPQ NSS host feed
        run: |
          set -e
          git clone --depth=1 https://github.com/zilogic-systems/feed-ipq.git feed-ipq
          echo "feed-ipq commit: $(git -C feed-ipq rev-parse HEAD)" > feed-ipq-revision.txt
          test -d feed-ipq/feeds/nss-host/qca-nss-phy
          printf '\nsrc-link ipq_nss_host %s/feed-ipq/feeds/nss-host\n' "$GITHUB_WORKSPACE" >> openwrt/feeds.conf.default

      - name: Configure qca-nss-phy
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p ipq_nss_host qca-nss-phy
          cp configs/sbe1v1k.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-qca-nss-phy=m
          CONFIG_PACKAGE_kmod-qca8084=m
          CONFIG_PACKAGE_kmod-qca81xx=m
          CONFIG_PACKAGE_kmod-qca8xxx-phc=m
          EOF
          make defconfig
          mkdir -p ../results
          cp .config ../results/final.config

      - name: Pin Stage17 proven qca-nss-phy source
        working-directory: openwrt
        run: |
          set -e
          MF=package/feeds/ipq_nss_host/qca-nss-phy/Makefile
          cp "$MF" ../results/qca-nss-phy-package-Makefile.before-pin.txt
          sed -i -E 's/^(PKG_VERSION):=.*/\1:=5a70c334200fe4728be20a0f0aebf9c09519377c/' "$MF"
          sed -i -E 's/^(PKG_SOURCE_VERSION):=.*/\1:=5a70c334200fe4728be20a0f0aebf9c09519377c/' "$MF"
          sed -i -E 's/^(PKG_MIRROR_HASH):=.*/\1:=skip/' "$MF"
          grep -q '^PKG_VERSION:=5a70c334200fe4728be20a0f0aebf9c09519377c$' "$MF"
          grep -q '^PKG_SOURCE_VERSION:=5a70c334200fe4728be20a0f0aebf9c09519377c$' "$MF"
          cp "$MF" ../results/qca-nss-phy-package-Makefile.after-pin.txt

      - name: Prepare only required OpenWrt host tools
        working-directory: openwrt
        run: |
          set -e
          make -j"$(nproc)" tools/install V=s
          test -x staging_dir/host/bin/openssl
          test -x staging_dir/host/bin/libdeflate-gzip
          {
            echo "openssl=$(readlink -f staging_dir/host/bin/openssl)"
            staging_dir/host/bin/openssl version
            echo "libdeflate-gzip=$(readlink -f staging_dir/host/bin/libdeflate-gzip)"
          } | tee ../results/host-tools.txt

      - name: Build OpenWrt configured kernel tree
        working-directory: openwrt
        run: |
          set -e
          mkdir -p ../results

          # Keep huge normal build output out of the Actions web log.
          make -j"$(nproc)" toolchain/install > ../results/toolchain.log 2>&1
          make -j"$(nproc)" target/linux/prepare > ../results/kernel-prepare.log 2>&1
          make -j"$(nproc)" target/linux/compile > ../results/kernel-compile.log 2>&1

          LINUX_DIR="$(find "$PWD/build_dir" -path '*linux-qualcommbe_ipq95xx/linux-6.18*' -type d -print -quit)"
          test -n "$LINUX_DIR"

          {
            echo "LINUX_DIR=$LINUX_DIR"
            for f in .config include/config/auto.conf include/generated/autoconf.h; do
              if test -f "$LINUX_DIR/$f"; then
                echo "PASS $f"
              else
                echo "MISSING $f"
              fi
            done
          } | tee ../results/kernel-config.txt

          # Hard gate before the external NSS module is allowed to compile.
          test -f "$LINUX_DIR/.config"
          test -f "$LINUX_DIR/include/config/auto.conf"
          test -f "$LINUX_DIR/include/generated/autoconf.h"

      - name: Port qca8084 PHY package API to Linux 6.18
        working-directory: openwrt
        run: |
          set -e
          mkdir -p ../results
          make package/feeds/ipq_nss_host/qca-nss-phy/prepare > ../results/nss-prepare.log 2>&1
          SRC="$(find "$PWD/build_dir" -type d -path '*linux-qualcommbe_ipq95xx/qca-nss-phy-5a70c334200fe4728be20a0f0aebf9c09519377c' -print -quit)"
          test -n "$SRC"
          FILE="$SRC/linux_std/qca8084/qca8084.c"
          test -f "$FILE"
          cp "$FILE" ../results/qca8084.c.before
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace("phydev->shared->priv", "phy_package_get_priv(phydev)")
          s=s.replace("phydev->shared->addr", "phy_package_address(phydev, 0)")
          marker="#include <linux/phy.h>"
          compat="""
          /* Linux 6.18: PHY package internals became private to phylib. */
          extern int phy_package_address(struct phy_device *phydev, unsigned int addr_offset);
          extern void *phy_package_get_priv(struct phy_device *phydev);
          extern bool phy_package_init_once(struct phy_device *phydev);
          extern int devm_phy_package_join(struct device *dev, struct phy_device *phydev,
                                           int base_addr, size_t priv_size);
          int qca8084_phy_index_get(struct phy_device *phydev);
          int qca8084_phy_fifo_reset(struct phy_device *phydev, bool enable);
          """
          if marker not in s: raise SystemExit("linux/phy.h include marker not found")
          s=s.replace(marker, marker+"\n"+compat, 1)
          p.write_text(s)
          PY
          cp "$FILE" ../results/qca8084.c.after
          grep -nE 'phy_package_(address|get_priv|init_once)|devm_phy_package_join|qca8084_phy_(index_get|fifo_reset)' "$FILE" > ../results/qca8084-port-lines.txt
      - name: Port qca808x PTP callbacks to Linux 6.18
        working-directory: openwrt
        run: |
          set -e
          SRC="$(find "$PWD/build_dir" -type d -path '*linux-qualcommbe_ipq95xx/qca-nss-phy-5a70c334200fe4728be20a0f0aebf9c09519377c' -print -quit)"
          test -n "$SRC"
          FILE="$SRC/linux_std/ptp/qca808x_phc.c"
          test -f "$FILE"
          cp "$FILE" ../results/qca808x_phc.c.before

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          anchor="static int qca808x_ptp_probe"
          if anchor not in s:
              raise SystemExit("qca808x_ptp_probe anchor not found")
          wrappers='''\n/*
           * Linux 6.18 mii_timestamper compatibility shim.
           * Legacy QSDK hwtstamp uses ifreq; kernel_hwtstamp_config keeps
           * ->ifr specifically for legacy lower-driver compatibility.
           */
          static int qca808x_hwtstamp_kcompat(struct mii_timestamper *mii_ts,
                          struct kernel_hwtstamp_config *kernel_config,
                          struct netlink_ext_ack *extack)
          {
              int ret;
              (void)extack;
              if (!kernel_config->ifr)
                  return -EOPNOTSUPP;
              ret = qca808x_hwtstamp(mii_ts, kernel_config->ifr);
              if (!ret)
                  kernel_config->copied_to_user = true;
              return ret;
          }

          static int qca808x_ts_info_kcompat(struct mii_timestamper *mii_ts,
                          struct kernel_ethtool_ts_info *kinfo)
          {
              struct ethtool_ts_info info = {};
              int ret = qca808x_ts_info(mii_ts, &info);
              if (ret)
                  return ret;
              kinfo->cmd = info.cmd;
              kinfo->so_timestamping = info.so_timestamping;
              kinfo->phc_index = info.phc_index;
              kinfo->tx_types = info.tx_types;
              kinfo->rx_filters = info.rx_filters;
              return 0;
          }

          '''
          s=s.replace(anchor, wrappers+anchor, 1)
          s=s.replace("ptp_info->mii_ts.hwtstamp = qca808x_hwtstamp;",
                      "ptp_info->mii_ts.hwtstamp = qca808x_hwtstamp_kcompat;", 1)
          s=s.replace("ptp_info->mii_ts.ts_info  = qca808x_ts_info;",
                      "ptp_info->mii_ts.ts_info  = qca808x_ts_info_kcompat;", 1)
          p.write_text(s)
          PY

          cp "$FILE" ../results/qca808x_phc.c.after
          grep -nE 'qca808x_(hwtstamp|ts_info)_kcompat|mii_ts\.(hwtstamp|ts_info)' "$FILE" > ../results/qca808x-ptp-port-lines.txt
          grep -RniE -- '->shared->|struct ifreq|struct ethtool_ts_info|mii_ts\.hwtstamp|mii_ts\.ts_info|phy_package_' "$SRC" > ../results/nss-phy-api-inventory.txt || true

      - name: Native qca-nss-phy compile
        working-directory: openwrt
        run: |
          set +e
          echo "=== OpenWrt-native qca-nss-phy compile, V7 ===" | tee ../results/compile.log
          make -j"$(nproc)" package/feeds/ipq_nss_host/qca-nss-phy/compile V=s 2>&1 | tee -a ../results/compile.log
          RC=${PIPESTATUS[0]}
          echo "COMPILE_EXIT_CODE=$RC" | tee -a ../results/compile.log

          find build_dir -type f \( -name 'qca-nss-phy.ko' -o -name 'qca8084-phy.ko' \
            -o -name 'qca81xx-phy.ko' -o -name 'qca8xxx-phc.ko' \) \
            -printf '%p %s bytes\n' | sort | tee ../results/outputs.txt

          grep -nEi '(^|[ :])(error:|fatal error:|undefined reference|implicit declaration|incompatible|too few arguments|too many arguments|no such file)' \
            ../results/compile.log | head -400 > ../results/errors.txt || true
          exit 0

      - name: Verdict
        if: always()
        run: |
          mkdir -p results
          cp feed-ipq-revision.txt results/ 2>/dev/null || true
          {
            echo "Stage1 Native V7: qca-nss-phy"
            echo "Baseline: 02fb9517c9aefac9f3825a15ae46e7998bae7edd"
            echo "Stage17 source pin: 5a70c334200fe4728be20a0f0aebf9c09519377c"
            echo
            if grep -q 'COMPILE_EXIT_CODE=0' results/compile.log 2>/dev/null; then
              echo "VERDICT=PASS"
            elif test -f results/compile.log; then
              echo "VERDICT=COMPILE_FAILED"
              echo "Inspect the earliest relevant line in errors.txt and compile.log."
            else
              echo "VERDICT=INFRA_FAILURE"
              echo "The qca-nss-phy compile step was not reached."
            fi
          } | tee results/README.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-NSS-6.18-Stage1-Native-V7-qca-nss-phy
          path: results/
          if-no-files-found: warn
          retention-days: 14
