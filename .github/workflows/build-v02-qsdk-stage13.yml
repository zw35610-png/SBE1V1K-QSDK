# Stage12 patch SHA256 (LF): 32e4802d04e453f93ad51bd4229dd2c9e39e0960338ee879a71e7946f2ec367e
# Compile probe only. No image creation, deployment or flashing.
name: SBE1V1K V0.2 QSDK Stage13 SSDK to PPE MODPOST
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Initialize diagnostics
      shell: bash
      run: |
        mkdir -p results
    - name: Free disk
      run: |
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /opt/ghc || true
        sudo apt-get clean
        df -h
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib gettext git libncurses-dev \
          libssl-dev python3-setuptools rsync swig \
          unzip zlib1g-dev file wget curl jq bc kmod
    - name: Clone SBE1V1K baseline
      run: |
        git clone \
          https://github.com/luckkyboy/SBE1V1K.git \
          openwrt

        cd openwrt

        git checkout \
          02fb9517c9aefac9f3825a15ae46e7998bae7edd

        cp configs/sbe1v1k.config .config

        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig
    - name: Cache OpenWrt downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: sbe1v1k-stage13-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          sbe1v1k-stage12-${{ runner.os }}-
          sbe1v1k-stage11-${{ runner.os }}-
          sbe1v1k-stage10-${{ runner.os }}-
          sbe1v1k-stage9-${{ runner.os }}-
          sbe1v1k-openwrt-dl-${{ runner.os }}-
    - name: Download sources
      run: |
        cd openwrt
        make download -j$(nproc)
    - name: Build OpenWrt kernel
      shell: bash
      run: |
        set -o pipefail
        cd openwrt

        make tools/install -j$(nproc) \
          2>&1 | tee ../tools.log

        make toolchain/install -j$(nproc) \
          2>&1 | tee ../toolchain.log

        make target/linux/compile -j$(nproc) \
          2>&1 | tee ../kernel-compile.log
    - name: Fetch exact QSDK sources
      shell: bash
      run: |
        set -e

        mkdir -p qsdk-src results

        git clone \
          https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
          qsdk-src/qca-nss-ppe

        git -C qsdk-src/qca-nss-ppe checkout \
          87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

        git clone \
          https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
          qsdk-src/qca-ssdk

        git -C qsdk-src/qca-ssdk checkout \
          717b74016b0c131575bcd81b9e039d3f7974b02a

        {
          echo "PPE=$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)"
          echo "SSDK=$(git -C qsdk-src/qca-ssdk rev-parse HEAD)"
        } | tee results/qsdk-commits.txt

        test "$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)" = 87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5
        test "$(git -C qsdk-src/qca-ssdk rev-parse HEAD)" = 717b74016b0c131575bcd81b9e039d3f7974b02a
    - name: Locate kernel and toolchain
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t kernels < <(find "$GITHUB_WORKSPACE/openwrt/build_dir" -type d -path '*/linux-qualcommbe_ipq95xx/linux-6.18.39')
        test "${#kernels[@]}" = 1
        KERNEL_DIR="${kernels[0]}"
        mapfile -t compilers < <(find -L "$GITHUB_WORKSPACE/openwrt/staging_dir" -path '*/toolchain-aarch64*/bin/aarch64-openwrt-linux-musl-gcc' -type f)
        test "${#compilers[@]}" = 1
        GCC="${compilers[0]}"
        TOOLCHAIN_DIR="$(dirname "$(dirname "$GCC")")"
        CROSS_COMPILE="${GCC%gcc}"
        test -x "$GCC"
        grep -q 'CONFIG_TARGET_qualcommbe_ipq95xx=y' openwrt/.config
        grep -q 'CONFIG_ARM64=y' "$KERNEL_DIR/.config"
        grep -q 'CONFIG_MODULES=y' "$KERNEL_DIR/.config"
        grep -Eq '"6\.18\.39(["-])' "$KERNEL_DIR/include/generated/utsrelease.h"
        {
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          echo "GCC=$GCC"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
        } | tee results/environment.txt
        "$GCC" --version > results/compiler-version.txt
        cat "$KERNEL_DIR/include/generated/utsrelease.h" > results/kernel-version.txt
        git -C openwrt rev-parse HEAD > results/openwrt-commit.txt
    - name: Verify kernel Module.symvers
      shell: bash
      run: |
        set +e

        KERNEL_DIR=$(grep '^KERNEL_DIR=' \
          results/environment.txt | cut -d= -f2-)

        {
          echo "===== KERNEL BUILD CHECK ====="
          echo "Kernel: $KERNEL_DIR"
          echo ""

          if [ -s "$KERNEL_DIR/Module.symvers" ]; then
            echo "Module.symvers: PRESENT"
            echo -n "Lines: "
            wc -l < "$KERNEL_DIR/Module.symvers"
            echo -n "Size: "
            stat -c '%s bytes' "$KERNEL_DIR/Module.symvers"
          else
            echo "Module.symvers: MISSING OR EMPTY"
          fi
        } | tee results/kernel-symvers-check.txt

        test -s "$KERNEL_DIR/Module.symvers"
    - name: Generate QSDK include flags
      shell: bash
      run: |
        set -e

        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        PPE="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe"

        test -f "$SSDK/include/fal/fal_rss_hash.h"
        test -f "$SSDK/include/sal/os/aos_mem.h"
        test -f "$PPE/nss_debug/exports/nss_debug.h"

        find "$SSDK" \
          -type f \
          -name '*.h' \
          -printf '%h\n' \
          | sort -u \
          > results/ssdk-header-dirs.txt

        : > results/qsdk-header-flags.txt

        printf -- '-I%s ' "$SSDK/include" \
          >> results/qsdk-header-flags.txt

        while IFS= read -r DIR
        do
          printf -- '-I%s ' "$DIR" \
            >> results/qsdk-header-flags.txt
        done < results/ssdk-header-dirs.txt

        printf -- '-I%s ' \
          "$PPE/nss_debug/exports" \
          >> results/qsdk-header-flags.txt

        printf -- '%s ' \
          '-Wno-error=ignored-qualifiers' \
          '-Wno-error=missing-prototypes' \
          '-Wno-error=shift-count-overflow' \
          >> results/qsdk-header-flags.txt
