        \ write,\n+static int ppe_drv_sixth_tuple_mode_handler(const struct ctl_table *table, int write,\n \t\t\
        void __user *buffer, size_t *lenp, loff_t *ppos)\n {\n \tint ret, cur_sixth_tuple_mode;\n@@ -2576,7 +2576,7\
        \ @@ fail:\n  * ppe_drv_remove()\n  *\tremove the ppe driver\n  */\n-static int ppe_drv_remove(struct platform_device\
