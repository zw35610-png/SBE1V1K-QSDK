name: SBE1V1K QSDK Probe V5

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates grep
          mkdir -p results work

      - name: Probe QSDK manifest repositories
        shell: bash
        run: |
          set +e

          echo "SBE1V1K QSDK14 R9 Manifest Probe" > results/SUMMARY.txt
          echo "================================" >> results/SUMMARY.txt

          probe_repo () {
            NAME="$1"
            URL="$2"

            echo ""
            echo "========================================"
            echo "PROBE: $NAME"
            echo "URL:   $URL"
            echo "========================================"

            echo "" >> results/SUMMARY.txt
            echo "===== $NAME =====" >> results/SUMMARY.txt
            echo "$URL" >> results/SUMMARY.txt

            git ls-remote "$URL" \
              > "results/${NAME}-refs.txt" 2>&1

            echo "--- matching refs ---" \
              >> results/SUMMARY.txt

            grep -iE \
              'NHSS.QSDK.14|QSDK.14|14.0.r9|r9' \
              "results/${NAME}-refs.txt" \
              >> results/SUMMARY.txt || true

            git clone \
              --filter=blob:none \
              "$URL" \
              "work/$NAME" \
              > "results/${NAME}-clone.txt" 2>&1

            if [ -d "work/$NAME/.git" ]; then

              echo "CLONE OK" >> results/SUMMARY.txt

              cd "work/$NAME"

              git branch -a \
                > "../../results/${NAME}-branches.txt" 2>&1

              git tag -l \
                > "../../results/${NAME}-tags.txt" 2>&1

              find . \
                -type f \
                \( -name '*.xml' \
                -o -name '*.json' \
                -o -name '*.yml' \
                -o -name '*.yaml' \
                -o -name '*.txt' \) \
                > "../../results/${NAME}-files.txt" 2>&1

              grep -RniE \
                'NHSS.QSDK.14|QSDK.14|14.0.r9' \
                . \
                --include='*.xml' \
                --include='*.json' \
                --include='*.yml' \
                --include='*.yaml' \
                --include='*.txt' \
                > "../../results/${NAME}-r9-content.txt" 2>&1 || true

              grep -RniE \
                '22555a9|07fbf1b|b959456|e978478|87bb9b3|717b740' \
                . \
                --include='*.xml' \
                --include='*.json' \
                --include='*.yml' \
                --include='*.yaml' \
                --include='*.txt' \
                > "../../results/${NAME}-hashes.txt" 2>&1 || true

              cd ../..

            else
              echo "CLONE FAILED" >> results/SUMMARY.txt
              tail -10 "results/${NAME}-clone.txt" \
                >> results/SUMMARY.txt
            fi
          }

          probe_repo \
            qsdk-manifest \
            https://git.codelinaro.org/clo/qsdk/oss/system/manifest.git

          probe_repo \
            qsdk-release \
            https://git.codelinaro.org/clo/qsdk/oss/system/release.git

          probe_repo \
            qsdk-build \
            https://git.codelinaro.org/clo/qsdk/oss/system/openwrt.git

          echo "" >> results/SUMMARY.txt
          echo "===== GLOBAL HASH SEARCH =====" \
            >> results/SUMMARY.txt

          grep -RniE \
            '22555a9|07fbf1b|b959456|e978478|87bb9b3|717b740' \
            results/ \
            >> results/SUMMARY.txt || true

          cat results/SUMMARY.txt

      - name: Search manifest XML projects
        shell: bash
        run: |
          set +e

          echo "QSDK MANIFEST PROJECT SEARCH" \
            > results/MANIFEST-PROJECTS.txt

          echo "============================" \
            >> results/MANIFEST-PROJECTS.txt

          grep -RniE \
            'qca-nss-dp|qca-nss-netfn|qca-nss-ae-clients|qca-nss-ecm|qca-nss-ppe|qca-ssdk' \
            work/ \
            --include='*.xml' \
            >> results/MANIFEST-PROJECTS.txt || true

          echo "" >> results/MANIFEST-PROJECTS.txt

          echo "===== qca/src/nss =====" \
            >> results/MANIFEST-PROJECTS.txt

          grep -RniE \
            'qca/src/nss|src/nss' \
            work/ \
            --include='*.xml' \
            >> results/MANIFEST-PROJECTS.txt || true

          cat results/MANIFEST-PROJECTS.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK-Probe-V5
          path: results/
          retention-days: 7
