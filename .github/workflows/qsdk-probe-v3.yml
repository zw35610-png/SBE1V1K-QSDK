name: SBE1V1K QSDK Probe V3

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl ca-certificates
          mkdir -p results work

      - name: Probe QSDK NSS feeds
        shell: bash
        run: |
          set +e

          echo "SBE1V1K QSDK14 R9 Probe V3" > results/SUMMARY.txt
          echo "==========================" >> results/SUMMARY.txt

          probe_repo () {
            NAME="$1"
            URL="$2"

            echo ""
            echo "========================================"
            echo "Probing: $NAME"
            echo "$URL"
            echo "========================================"

            git ls-remote "$URL" \
              > "results/${NAME}-refs.txt" 2>&1

            echo "--- QSDK14/R9 refs ---" \
              > "results/${NAME}-r9.txt"

            grep -iE \
              'NHSS.QSDK.14|QSDK.14|r9' \
              "results/${NAME}-refs.txt" \
              >> "results/${NAME}-r9.txt" || true

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$URL" \
              "work/$NAME" \
              > "results/${NAME}-clone.txt" 2>&1

            if [ -d "work/$NAME/.git" ]; then

              cd "work/$NAME"

              git rev-list --all \
                > "../../results/${NAME}-commits.txt" 2>&1

              for HASH in \
                22555a9 \
                07fbf1b \
                b959456 \
                e978478 \
                87bb9b3 \
                717b740
              do
                echo "===== $HASH =====" \
                  >> "../../results/${NAME}-matches.txt"

                git rev-list --all | \
                  grep -i "^${HASH}" \
                  >> "../../results/${NAME}-matches.txt" || true
              done

              cd ../..
            fi
          }

          probe_repo \
            nss-clients \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git

          probe_repo \
            nss-base \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss.git

          probe_repo \
            networking \
            https://git.codelinaro.org/clo/qsdk/oss/system/feeds/networking.git

          echo "" >> results/SUMMARY.txt
          echo "===== HASH SEARCH =====" >> results/SUMMARY.txt

          grep -RniE \
            '22555a9|07fbf1b|b959456|e978478|87bb9b3|717b740' \
            results/ \
            >> results/SUMMARY.txt || true

          echo "" >> results/SUMMARY.txt
          echo "===== CLONE STATUS =====" >> results/SUMMARY.txt

          for f in results/*-clone.txt; do
            echo "" >> results/SUMMARY.txt
            echo "----- $f -----" >> results/SUMMARY.txt
            tail -20 "$f" >> results/SUMMARY.txt
          done

          cat results/SUMMARY.txt

      - name: Probe CodeLinaro paths
        shell: bash
        run: |
          set +e

          URLS=(
          "https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-nss-dp.git"
          "https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss-clients.git"
          "https://git.codelinaro.org/clo/qsdk/oss/system/feeds/nss.git"
          )

          for URL in "${URLS[@]}"
          do
            echo "================================" \
              >> results/DIRECT-PROBE.txt
            echo "$URL" \
              >> results/DIRECT-PROBE.txt

            git ls-remote "$URL" \
              >> results/DIRECT-PROBE.txt 2>&1

            echo "" \
              >> results/DIRECT-PROBE.txt
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK-Probe-V3
          path: results/
          retention-days: 7
