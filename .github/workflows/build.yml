name: Build SBE1V1K V0.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget python3

      - name: Clone SBE1V1K source
        run: |
          git clone https://github.com/luckkyboy/SBE1V1K.git openwrt
          cd openwrt
          git checkout 02fb9517c9aefac9f3825a15ae46e7998bae7edd
          git log -1 --oneline

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load SBE1V1K config
        working-directory: openwrt
        run: |
          cp configs/sbe1v1k.config .config
          make defconfig
          grep -E 'CONFIG_TARGET|SBE1V1K|sbe1v1k' .config | head -50

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Build SBE1V1K
        working-directory: openwrt
        run: |
          make -j$(nproc) world || make -j1 V=s world

      - name: Show firmware
        if: always()
        run: |
          find openwrt/bin/targets -type f 2>/dev/null | sort || true
          df -h

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.1
          path: |
            openwrt/bin/targets/qualcommbe/ipq95xx/*
          retention-days: 7
