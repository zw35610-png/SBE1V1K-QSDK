          chmod 0755 files/etc/uci-defaults/97-sbe1v1k-fullcone

          {
            echo "Full Cone NAT LuCI page: /admin/network/sbe1v1k_fullcone"
            echo "Runtime capability detection: enabled"
            echo "Safe auto-fallback when unsupported: enabled"
