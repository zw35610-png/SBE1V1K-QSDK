            echo "Default Full Cone NAT: disabled"
          } | tee ../R10-FULLCONE-FEATURES.txt

      - name: Add safe large eMMC overlay migration
        run: |
          set -euo pipefail
          cd openwrt

          mkdir -p files/usr/sbin
          mkdir -p files/etc/init.d
          mkdir -p files/etc/uci-defaults
          mkdir -p files/usr/share/luci/menu.d
          mkdir -p files/usr/share/luci/view/sbe1v1k
          mkdir -p files/usr/share/rpcd/acl.d

          cat > files/usr/sbin/sbe1v1k-large-overlay <<'EOF'
          #!/bin/sh

          STATUS=/tmp/sbe1v1k-large-overlay.status
          MNT=/mnt/sbe1v1k-large-overlay

          find_rootfs_data() {
                  for u in /sys/class/block/mmcblk0p*/uevent; do
                          [ -r "$u" ] || continue
                          grep -q '^PARTNAME=rootfs_data$' "$u" || continue
                          devname="$(sed -n 's/^DEVNAME=//p' "$u" | head -n1)"
                          [ -n "$devname" ] || continue
                          echo "/dev/$devname"
                          return 0
                  done
                  return 1
          }

          dev_kib() {
                  devbase="$(basename "$1")"
                  sectors="$(cat "/sys/class/block/$devbase/size" 2>/dev/null)"
                  case "$sectors" in ''|*[!0-9]*) echo 0 ;; *) echo $((sectors / 2)) ;; esac
          }

          disk_kib() {
                  sectors="$(cat /sys/class/block/mmcblk0/size 2>/dev/null)"
                  case "$sectors" in ''|*[!0-9]*) echo 0 ;; *) echo $((sectors / 2)) ;; esac
          }

          overlay_source() {
                  awk '$2 == "/overlay" {print $1; exit}' /proc/mounts
          }

          block_type() {
                  block info "$1" 2>/dev/null | sed -n 's/.*TYPE="\([^"]*\)".*/\1/p' | head -n1
          }

          block_uuid() {
                  block info "$1" 2>/dev/null | sed -n 's/.*UUID="\([^"]*\)".*/\1/p' | head -n1
          }

          status_json() {
                  dev="$(find_rootfs_data 2>/dev/null)"
                  src="$(overlay_source)"
                  disk="$(disk_kib)"
                  part=0
                  fstype=""
                  uuid=""
                  active=0
                  mounted=0

                  if [ -n "$dev" ]; then
                          part="$(dev_kib "$dev")"
                          fstype="$(block_type "$dev")"
                          uuid="$(block_uuid "$dev")"
                          grep -q "^$dev " /proc/mounts 2>/dev/null && mounted=1
                          [ "$src" = "$dev" ] && active=1
                          grep -q " $dev " /proc/mounts 2>/dev/null || true
                  fi

                  set -- $(df -k /overlay 2>/dev/null | awk 'NR==2 {print $2, $3, $4}')
                  ov_total="${1:-0}"
                  ov_used="${2:-0}"
                  ov_free="${3:-0}"

                  cat > "${STATUS}.tmp" <<JSON
          {
            "device": "${dev:-}",
            "physical_kib": ${disk:-0},
            "partition_kib": ${part:-0},
            "filesystem": "${fstype:-}",
            "uuid": "${uuid:-}",
            "overlay_source": "${src:-}",
            "overlay_total_kib": ${ov_total:-0},
            "overlay_used_kib": ${ov_used:-0},
            "overlay_free_kib": ${ov_free:-0},
            "active": ${active:-0},
            "mounted": ${mounted:-0}
          }
          JSON
                  mv "${STATUS}.tmp" "$STATUS"
                  cat "$STATUS"
          }

          prepare() {
                  dev="$(find_rootfs_data)" || {
                          logger -t sbe1v1k-overlay "rootfs_data partition not found"
                          return 20
                  }

                  size_kib="$(dev_kib "$dev")"
                  # Safety guard: only touch the known large partition (> 5 GiB).
                  [ "$size_kib" -ge 5242880 ] || {
                          logger -t sbe1v1k-overlay "refusing $dev: only ${size_kib} KiB"
                          return 21
                  }

                  src="$(overlay_source)"
                  [ "$src" != "$dev" ] || {
                          logger -t sbe1v1k-overlay "$dev already active as /overlay"
                          return 0
                  }

                  grep -q "^$dev " /proc/mounts 2>/dev/null && {
                          logger -t sbe1v1k-overlay "refusing: $dev is already mounted"
                          return 22
                  }

                  fstype="$(block_type "$dev")"

                  if [ -z "$fstype" ]; then
                          logger -t sbe1v1k-overlay "formatting empty $dev as F2FS (${size_kib} KiB)"
                          if command -v mkfs.f2fs >/dev/null 2>&1; then
                                  mkfs.f2fs -f -l SBE1V1K_OVERLAY "$dev" || return 23
                          elif command -v mkf2fs >/dev/null 2>&1; then
                                  mkf2fs -f -l SBE1V1K_OVERLAY "$dev" || return 23
                          else
                                  logger -t sbe1v1k-overlay "no F2FS formatter found"
                                  return 24
                          fi
                          sleep 1
                          fstype="$(block_type "$dev")"
                  elif [ "$fstype" != "f2fs" ]; then
                          # Never erase an existing unknown filesystem automatically.
                          logger -t sbe1v1k-overlay "refusing existing filesystem TYPE=$fstype on $dev"
                          return 25
                  fi

                  uuid="$(block_uuid "$dev")"
                  [ -n "$uuid" ] || {
                          logger -t sbe1v1k-overlay "cannot read UUID from $dev"
                          return 26
                  }

                  # Configure standard OpenWrt extroot first so that the fstab
                  # entry is included when the current overlay is copied.
                  uci -q delete fstab.extroot
                  uci set fstab.extroot='mount'
                  uci set fstab.extroot.uuid="$uuid"
                  uci set fstab.extroot.target='/overlay'
                  uci set fstab.extroot.enabled='1'
                  uci set fstab.extroot.enabled_fsck='1'
                  uci commit fstab

                  mkdir -p "$MNT"
                  mount -t f2fs -o noatime,lazytime "$dev" "$MNT" || return 27

                  if [ ! -e "$MNT/.sbe1v1k_overlay_seeded" ]; then
                          logger -t sbe1v1k-overlay "copying current overlay to $dev"
                          tar -C /overlay -cf - . | tar -C "$MNT" -xf - || {
                                  umount "$MNT" || true
                                  return 28
                          }
                          touch "$MNT/.sbe1v1k_overlay_seeded"
                  fi

                  sync
                  umount "$MNT" || return 29
                  logger -t sbe1v1k-overlay "large overlay prepared; reboot required"
                  return 10
          }

          case "$1" in
                  status)
                          status_json
                          ;;
                  prepare|"")
                          prepare
                          rc=$?
                          status_json >/dev/null 2>&1 || true
                          exit "$rc"
                          ;;
                  *)
                          echo "Usage: $0 {prepare|status}" >&2
                          exit 1
                          ;;
          esac
          EOF
          chmod 0755 files/usr/sbin/sbe1v1k-large-overlay

          cat > files/etc/uci-defaults/98-sbe1v1k-large-overlay <<'EOF'
          #!/bin/sh

          /usr/sbin/sbe1v1k-large-overlay prepare
          rc=$?

          case "$rc" in
                  0)
                          exit 0
                          ;;
                  10)
                          # First boot only: extroot was prepared successfully.
                          # Reboot once after LuCI/network has had time to come up.
                          logger -t sbe1v1k-overlay "large overlay ready; scheduling one-time reboot"
                          ( sleep 20; sync; reboot ) >/dev/null 2>&1 &
                          exit 0
                          ;;
                  *)
                          logger -t sbe1v1k-overlay "automatic overlay preparation failed rc=$rc; will retry next boot"
                          # Keep this uci-defaults script for a later retry.
                          exit 1
                          ;;
          esac
          EOF
          chmod 0755 files/etc/uci-defaults/98-sbe1v1k-large-overlay

          cat > files/usr/share/luci/menu.d/luci-app-sbe1v1k-storage.json <<'EOF'
          {
            "admin/system/sbe1v1k_storage": {
              "title": "eMMC 存储",
              "order": 90,
              "action": {
                "type": "view",
                "path": "sbe1v1k/storage"
              },
              "depends": {
                "acl": [ "luci-app-sbe1v1k-storage" ]
              }
            }
          }
          EOF

          cat > files/usr/share/rpcd/acl.d/luci-app-sbe1v1k-storage.json <<'EOF'
          {
            "luci-app-sbe1v1k-storage": {
              "description": "SBE1V1K internal eMMC overlay status",
              "read": {
                "ubus": {
                  "file": [ "read", "exec" ]
                }
              }
            }
          }
          EOF

          cat > files/usr/share/luci/view/sbe1v1k/storage.js <<'EOF'
          'use strict';
          'require view';
          'require fs';
          'require poll';
          'require ui';

          function gib(kib) {
                  var n = Number(kib || 0) / 1024 / 1024;
                  return n.toFixed(2) + ' GiB';
          }

          return view.extend({
                  load: function() {
                          return fs.exec('/usr/sbin/sbe1v1k-large-overlay', [ 'status' ])
                                  .then(function(r) { return r.stdout || '{}'; })
                                  .catch(function() { return '{}'; });
                  },

                  render: function(raw) {
                          var st = {};
                          try { st = JSON.parse(raw || '{}'); } catch (e) {}

                          var body = E('div', { 'class': 'cbi-map' }, [
                                  E('h2', {}, _('SBE1V1K eMMC 存储')),
                                  E('div', { 'class': 'cbi-map-descr' },
                                          _('8GB eMMC 的实际二进制容量约为 7.28 GiB。系统保留 rootfs 分区后，大容量 rootfs_data 可提供约 6.2 GiB 的可写 Overlay。')),
                                  E('div', { 'class': 'cbi-section' }, [
                                          E('table', { 'class': 'table' }, [
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('eMMC 物理容量')),
                                                          E('td', { 'class': 'td left' }, gib(st.physical_kib))
                                                  ]),
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('大容量分区')),
                                                          E('td', { 'class': 'td left' }, (st.device || '-') + ' / ' + gib(st.partition_kib))
                                                  ]),
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('文件系统')),
                                                          E('td', { 'class': 'td left' }, st.filesystem || _('尚未格式化'))
                                                  ]),
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('当前 Overlay 来源')),
                                                          E('td', { 'class': 'td left' }, st.overlay_source || '-')
                                                  ]),
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('可写空间')),
                                                          E('td', { 'class': 'td left' },
                                                                  gib(st.overlay_free_kib) + ' / ' + gib(st.overlay_total_kib))
                                                  ]),
                                                  E('tr', { 'class': 'tr' }, [
                                                          E('td', { 'class': 'td left' }, _('大容量 Overlay')),
                                                          E('td', { 'class': 'td left' },
                                                                  st.active ? _('已启用') : _('尚未启用 / 等待重启'))
                                                  ])
                                          ])
                                  ])
                          ]);

                          poll.add(function() {
                                  return fs.exec('/usr/sbin/sbe1v1k-large-overlay', [ 'status' ]).catch(function() {});
                          }, 10);

                          return body;
                  }
          });
          EOF

          {
            echo "Physical eMMC: ~7.28 GiB"
            echo "Large partition: PARTNAME=rootfs_data"
            echo "Expected writable overlay: ~6.1-6.2 GiB after F2FS overhead"
            echo "Method: safe extroot on existing large p30; GPT/rootfs partition untouched"
            echo "Automatic first-boot preparation: enabled"
            echo "One-time reboot after successful migration: enabled"
            echo "LuCI storage status: /admin/system/sbe1v1k_storage"
          } | tee ../R10-STORAGE-FEATURES.txt

      - name: Bootstrap complete build environment
        run: |
          cd openwrt
          make -j"$(nproc)" world || make -j1 V=s world
          test -x staging_dir/host/bin/libdeflate-gzip
          staging_dir/host/bin/libdeflate-gzip --version || true

      - name: Clean and prepare mac80211
        run: |
          set -euo pipefail
          cd openwrt
          make package/kernel/mac80211/clean V=s
          make package/kernel/mac80211/download V=s
          make package/kernel/mac80211/prepare V=s

      - name: Apply permanent B02 B03 ath12k fixes
        run: |
          set -euo pipefail
          cd openwrt
          python3 - <<'PY'
          from pathlib import Path

          wmis = [p for p in Path("build_dir").rglob("wmi.c")
                  if "/mac80211-regular/backports-" in str(p)
                  and str(p).endswith("drivers/net/wireless/ath/ath12k/wmi.c")]
          htcs = [p for p in Path("build_dir").rglob("htc.c")
                  if "/mac80211-regular/backports-" in str(p)
                  and str(p).endswith("drivers/net/wireless/ath/ath12k/htc.c")]

          if len(wmis) != 1 or len(htcs) != 1:
              raise SystemExit(f"Expected one ath12k backports tree, got wmi={len(wmis)} htc={len(htcs)}")

          wmi = wmis[0]
          htc = htcs[0]
          if wmi.parent != htc.parent:
              raise SystemExit(f"WMI/HTC trees differ: {wmi.parent} vs {htc.parent}")

          # B02: QCN9274 hw2.0 firmware exposes one WMI control endpoint
          # while preferred_hw_mode is still MAX/unknown.
          s = htc.read_text()
          old = (
              "\tdefault:\n"
              "\t\thtc->wmi_ep_count = ab->hw_params->max_radios;\n"
              "\t\tbreak;\n"
              "\t}\n\n"
              "\t/* setup our pseudo HTC control endpoint connection */"
          )
          new = (
              "\tdefault:\n"
              "\t\thtc->wmi_ep_count = ab->hw_params->max_radios;\n"
              "\t\tbreak;\n"
              "\t}\n\n"
              "\tif (ab->hw_rev == ATH12K_HW_QCN9274_HW20 &&\n"
              "\t    ab->wmi_ab.preferred_hw_mode == WMI_HOST_HW_MODE_MAX) {\n"
              "\t\tath12k_warn(ab, \"B02 QCN9274 hw2 MAX-mode: force wmi_ep_count %u -> 1\\n\",\n"
              "\t\t\t    htc->wmi_ep_count);\n"
              "\t\thtc->wmi_ep_count = 1;\n"
              "\t}\n\n"
              "\t/* setup our pseudo HTC control endpoint connection */"
          )
          if old not in s:
              raise SystemExit("B02 anchor missing")
          htc.write_text(s.replace(old, new, 1))

          # B03: skip optional direct-buffer capability IDs not understood
          # by this backports snapshot instead of aborting SERVICE_READY_EXT.
          s = wmi.read_text()
          old = (
              "\tdir_buff_caps = ab->db_caps;\n"
              "\tfor (i = 0; i < dma_caps_parse->n_dma_ring_caps; i++) {\n"
              "\t\tif (le32_to_cpu(dma_caps[i].module_id) >= WMI_DIRECT_BUF_MAX) {\n"
              "\t\t\tath12k_warn(ab, \"Invalid module id %d\\n\",\n"
              "\t\t\t\t    le32_to_cpu(dma_caps[i].module_id));\n"
              "\t\t\tret = -EINVAL;\n"
              "\t\t\tgoto free_dir_buff;\n"
              "\t\t}\n\n"
              "\t\tdir_buff_caps[i].id = le32_to_cpu(dma_caps[i].module_id);\n"
              "\t\tdir_buff_caps[i].pdev_id =\n"
              "\t\t\tDP_HW2SW_MACID(le32_to_cpu(dma_caps[i].pdev_id));\n"
              "\t\tdir_buff_caps[i].min_elem = le32_to_cpu(dma_caps[i].min_elem);\n"
              "\t\tdir_buff_caps[i].min_buf_sz = le32_to_cpu(dma_caps[i].min_buf_sz);\n"
              "\t\tdir_buff_caps[i].min_buf_align = le32_to_cpu(dma_caps[i].min_buf_align);\n"
              "\t}\n\n"
              "\treturn 0;\n\n"
              "free_dir_buff:\n"
              "\tath12k_wmi_free_dbring_caps(ab);\n"
              "\treturn ret;"
          )
          new = (
              "\tdir_buff_caps = ab->db_caps;\n"
              "\t{\n"
              "\t\tu32 valid = 0;\n\n"
              "\t\tfor (i = 0; i < dma_caps_parse->n_dma_ring_caps; i++) {\n"
              "\t\t\tu32 module_id = le32_to_cpu(dma_caps[i].module_id);\n\n"
              "\t\t\tif (module_id >= WMI_DIRECT_BUF_MAX) {\n"
              "\t\t\t\tath12k_warn(ab,\n"
              "\t\t\t\t\t    \"B03 skip unsupported dma ring module id %u pdev=%u\\n\",\n"
              "\t\t\t\t\t    module_id, le32_to_cpu(dma_caps[i].pdev_id));\n"
              "\t\t\t\tcontinue;\n"
              "\t\t\t}\n\n"
              "\t\t\tdir_buff_caps[valid].id = module_id;\n"
              "\t\t\tdir_buff_caps[valid].pdev_id =\n"
              "\t\t\t\tDP_HW2SW_MACID(le32_to_cpu(dma_caps[i].pdev_id));\n"
              "\t\t\tdir_buff_caps[valid].min_elem = le32_to_cpu(dma_caps[i].min_elem);\n"
              "\t\t\tdir_buff_caps[valid].min_buf_sz = le32_to_cpu(dma_caps[i].min_buf_sz);\n"
              "\t\t\tdir_buff_caps[valid].min_buf_align = le32_to_cpu(dma_caps[i].min_buf_align);\n"
              "\t\t\tvalid++;\n"
              "\t\t}\n\n"
              "\t\tif (!valid) {\n"
              "\t\t\tath12k_warn(ab, \"B03 no supported dma ring caps remain\\n\");\n"
              "\t\t\tath12k_wmi_free_dbring_caps(ab);\n"
              "\t\t} else {\n"
              "\t\t\tab->num_db_cap = valid;\n"
              "\t\t\tath12k_warn(ab, \"B03 accepted %u/%u dma ring caps\\n\",\n"
              "\t\t\t\t    valid, dma_caps_parse->n_dma_ring_caps);\n"
              "\t\t}\n"
              "\t}\n\n"
              "\treturn 0;"
          )
          if old not in s:
              raise SystemExit("B03 anchor missing")
          wmi.write_text(s.replace(old, new, 1))

          Path("../ATH12K-ACTUAL-PATH.txt").write_text(str(wmi.parent) + "\n")
          print("Patched:", wmi.parent)
          PY

          grep -R -n -E 'B02 |B03 ' "$(cat ../ATH12K-ACTUAL-PATH.txt)" \
            | tee ../R10-ATH12K-SOURCE-CHECK.txt

      - name: Compile patched mac80211
        run: |
          set -euo pipefail
          cd openwrt
          make package/kernel/mac80211/compile V=s

      - name: Verify patched ath12k module
        run: |
          set -euo pipefail
          cd openwrt

          find build_dir staging_dir -type f -name 'ath12k*.ko' -print \
            | tee ../R10-ATH12K-KO-LIST.txt

          found=0
          while IFS= read -r ko; do
            [ -f "$ko" ] || continue
            if strings "$ko" | grep -q 'B02 ' && strings "$ko" | grep -q 'B03 '; then
              echo "PASS B02+B03: $ko" | tee -a ../R10-ATH12K-MODULE-CHECK.txt
              found=1
            fi
          done < ../R10-ATH12K-KO-LIST.txt

          [ "$found" -eq 1 ] || {
            echo "ERROR: compiled ath12k module does not contain B02+B03"
            exit 1
          }

      - name: Build final firmware
        run: |
          cd openwrt
          make -j"$(nproc)" world || make -j1 V=s world

      - name: Validate final firmware features
        run: |
          set -euo pipefail
          cd openwrt

          MANIFEST="bin/targets/qualcommbe/ipq95xx/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k.manifest"
          SYS="bin/targets/qualcommbe/ipq95xx/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-squashfs-sysupgrade.bin"

          test -s "$SYS"
          test -s "$MANIFEST"

          : > ../R10-FINAL-PACKAGE-CHECK.txt
          for p in \
            luci-theme-material luci-i18n-base-zh-cn \
            smartdns luci-app-smartdns luci-app-sqm \
            luci-app-ddns luci-app-upnp luci-app-wol \
            luci-app-ttyd luci-app-filemanager luci-app-nlbwmon \
            luci-app-irqbalance luci-app-commands block-mount; do
              if grep -q "^${p} " "$MANIFEST"; then
                echo "PASS $p" | tee -a ../R10-FINAL-PACKAGE-CHECK.txt
              else
                echo "MISSING $p" | tee -a ../R10-FINAL-PACKAGE-CHECK.txt
                exit 1
              fi
          done

          test -x files/usr/sbin/sbe1v1k-fand
          test -x files/etc/init.d/sbe1v1k-fan
          test -x files/etc/uci-defaults/95-sbe1v1k-r10
          test -x files/usr/sbin/sbe1v1k-hwaccel-status
          test -x files/usr/sbin/sbe1v1k-hwacceld
          test -x files/etc/init.d/sbe1v1k-hwaccel
          test -s files/usr/share/luci/view/sbe1v1k/hwaccel.js
          test -s files/usr/share/luci/menu.d/luci-app-sbe1v1k-hwaccel.json
          test -x files/usr/sbin/sbe1v1k-fullcone
          test -x files/etc/init.d/sbe1v1k-fullcone
          test -s files/usr/share/luci/view/sbe1v1k/fullcone.js
          test -s files/usr/share/luci/menu.d/luci-app-sbe1v1k-fullcone.json
          grep -q \'\"file\": \\[ \"read\", \"exec\" \\]\' files/usr/share/rpcd/acl.d/luci-app-sbe1v1k-fullcone.json
          test -x files/usr/sbin/sbe1v1k-large-overlay
          test -x files/etc/uci-defaults/98-sbe1v1k-large-overlay
          test -s files/usr/share/luci/view/sbe1v1k/storage.js
          test -s files/usr/share/luci/menu.d/luci-app-sbe1v1k-storage.json

          find build_dir staging_dir -type f -name 'ath12k*.ko' -print \
            | tee ../R10-FINAL-ATH12K-KO-LIST.txt

          found=0
          while IFS= read -r ko; do
            [ -f "$ko" ] || continue
            if strings "$ko" | grep -q 'B02 ' && strings "$ko" | grep -q 'B03 '; then
              echo "FINAL PASS B02+B03: $ko" | tee -a ../R10-FINAL-ATH12K-MODULE-CHECK.txt
              found=1
            fi
          done < ../R10-FINAL-ATH12K-KO-LIST.txt

          [ "$found" -eq 1 ] || {
            echo "ERROR: B02+B03 disappeared after final world build"
            exit 1
          }

      - name: Collect firmware and validation
        run: |
          set -euo pipefail

          OUT=openwrt/bin/targets/qualcommbe/ipq95xx
          SYS="$OUT/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-squashfs-sysupgrade.bin"

          mkdir -p artifact/VALIDATION

          cp "$OUT"/openwrt-qualcommbe-ipq95xx-askey_sbe1v1k-* artifact/
          cp "$OUT"/*.manifest "$OUT"/config.buildinfo "$OUT"/profiles.json \
             "$OUT"/version.buildinfo artifact/ 2>/dev/null || true

          cp SOURCE_COMMIT.txt \
             R10-PACKAGE-CHECK.txt R10-FEATURES.txt R10-HWACCEL-FEATURES.txt R10-FULLCONE-FEATURES.txt R10-STORAGE-FEATURES.txt \
             ATH12K-ACTUAL-PATH.txt R10-ATH12K-SOURCE-CHECK.txt \
             R10-ATH12K-KO-LIST.txt R10-ATH12K-MODULE-CHECK.txt \
             R10-FINAL-PACKAGE-CHECK.txt R10-FINAL-ATH12K-KO-LIST.txt \
             R10-FINAL-ATH12K-MODULE-CHECK.txt \
             artifact/VALIDATION/

          sha256sum "$SYS" | tee artifact/VALIDATION/SYSUPGRADE-SHA256.txt
          find artifact -maxdepth 1 -type f -print0 | sort -z \
            | xargs -0 sha256sum > artifact/VALIDATION/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V5.8-R10.3.1-Large-Overlay-ACL-Fix
          path: artifact/
          if-no-files-found: error
          retention-days: 7
