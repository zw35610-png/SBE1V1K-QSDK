name: SBE1V1K V5.8-R10.3.1 Large Overlay ACL Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
            curl subversion swig time jq zstd binutils

      - name: Clone exact stable source
        run: |
          git clone https://github.com/yintaomu/SBE1V1K-OpenWrt.git openwrt
          cd openwrt
          git checkout 6c7c3c6bac78ddbe6c51a88284453d9c724713e1
          git rev-parse HEAD | tee ../SOURCE_COMMIT.txt

      - name: Configure feeds target UI and plugins
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp configs/sbe1v1k.config .config

          cat >> .config <<'EOF'
          # V5.8 R10 UI / Chinese
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-material=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # DNS / SQM
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y

          # Common LuCI tools
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CONFIG_PACKAGE_luci-i18n-filemanager-zh-cn=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_luci-i18n-irqbalance-zh-cn=y
          CONFIG_PACKAGE_luci-app-commands=y
          CONFIG_PACKAGE_luci-i18n-commands-zh-cn=y

          # Large internal eMMC overlay / extroot
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_mkf2fs=y
          CONFIG_PACKAGE_f2fsck=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y

          # Useful network tools
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts-services=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_etherwake=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_bind-dig=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          EOF

          make defconfig

          required_pkgs='
          luci-theme-material
          luci-i18n-base-zh-cn
          smartdns
          luci-app-smartdns
          luci-app-sqm
          luci-app-ddns
          luci-app-upnp
          luci-app-wol
          luci-app-ttyd
          luci-app-filemanager
          luci-app-nlbwmon
          luci-app-irqbalance
          luci-app-commands
          block-mount
          '
          : > ../R10-PACKAGE-CHECK.txt
          for p in $required_pkgs; do
            if grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              echo "PASS $p" | tee -a ../R10-PACKAGE-CHECK.txt
            else
              echo "MISSING $p" | tee -a ../R10-PACKAGE-CHECK.txt
              exit 1
            fi
          done

      - name: Add Chinese defaults and automatic fan control
        run: |
          set -euo pipefail
          cd openwrt

          mkdir -p files/etc/config
          mkdir -p files/etc/init.d
          mkdir -p files/etc/uci-defaults
          mkdir -p files/usr/sbin

          cat > files/etc/config/sbe1v1k-fan <<'EOF'
          config fan 'main'
                  option enabled '1'
                  option interval '5'
                  option start_temp '50'
                  option medium_temp '60'
                  option high_temp '70'
                  option stop_temp '45'
                  option low_pwm '72'
                  option medium_pwm '128'
                  option high_pwm '255'
          EOF

          cat > files/usr/sbin/sbe1v1k-fand <<'EOF'
          #!/bin/sh

          TAG="sbe1v1k-fan"

          cfg_get() {
                  uci -q get "sbe1v1k-fan.main.$1" 2>/dev/null || echo "$2"
          }

          find_pwm_hwmon() {
                  for d in /sys/class/hwmon/hwmon*; do
                          [ -d "$d" ] || continue
                          [ -w "$d/pwm1" ] || continue
                          echo "$d"
                          return 0
                  done
                  return 1
          }

          get_max_temp_mc() {
                  max=0
                  found=0
                  for f in /sys/class/thermal/thermal_zone*/temp; do
                          [ -r "$f" ] || continue
                          v="$(cat "$f" 2>/dev/null)"
                          case "$v" in
                                  ''|*[!0-9-]*) continue ;;
                          esac
                          [ "$v" -ge 10000 ] 2>/dev/null || continue
                          [ "$v" -le 125000 ] 2>/dev/null || continue
                          [ "$v" -gt "$max" ] && max="$v"
                          found=1
                  done
                  [ "$found" -eq 1 ] || return 1
                  echo "$max"
          }

          write_pwm() {
                  val="$1"
                  [ -n "$PWM_DIR" ] || return 1
                  if [ -w "$PWM_DIR/pwm1_enable" ]; then
                          echo 1 > "$PWM_DIR/pwm1_enable" 2>/dev/null || true
                  fi
                  echo "$val" > "$PWM_DIR/pwm1"
          }

          status_write() {
                  rpm="n/a"
                  [ -r "$PWM_DIR/fan1_input" ] && rpm="$(cat "$PWM_DIR/fan1_input" 2>/dev/null)"
                  name="unknown"
                  [ -r "$PWM_DIR/name" ] && name="$(cat "$PWM_DIR/name" 2>/dev/null)"
                  {
                          echo "hwmon=$PWM_DIR"
                          echo "driver=$name"
                          echo "temperature_c=$((TEMP_MC / 1000))"
                          echo "pwm=$TARGET"
                          echo "rpm=$rpm"
                          echo "updated=$(date '+%Y-%m-%d %H:%M:%S')"
                  } > /tmp/sbe1v1k-fan.status
          }

          LAST=-1
          PWM_DIR=""

          while true; do
                  enabled="$(cfg_get enabled 1)"
                  interval="$(cfg_get interval 5)"
                  start_temp="$(cfg_get start_temp 50)"
                  medium_temp="$(cfg_get medium_temp 60)"
                  high_temp="$(cfg_get high_temp 70)"
                  stop_temp="$(cfg_get stop_temp 45)"
                  low_pwm="$(cfg_get low_pwm 72)"
                  medium_pwm="$(cfg_get medium_pwm 128)"
                  high_pwm="$(cfg_get high_pwm 255)"

                  if [ "$enabled" != "1" ]; then
                          sleep "$interval"
                          continue
                  fi

                  if [ -z "$PWM_DIR" ] || [ ! -w "$PWM_DIR/pwm1" ]; then
                          PWM_DIR="$(find_pwm_hwmon 2>/dev/null)"
                          if [ -z "$PWM_DIR" ]; then
                                  logger -t "$TAG" "PWM hwmon not ready; retrying"
                                  sleep 5
                                  continue
                          fi
                          logger -t "$TAG" "using $PWM_DIR"
                  fi

                  TEMP_MC="$(get_max_temp_mc 2>/dev/null)"
                  if [ -z "$TEMP_MC" ]; then
                          TARGET=255
                  else
                          TEMP_C=$((TEMP_MC / 1000))

                          if [ "$TEMP_C" -ge "$high_temp" ]; then
                                  TARGET="$high_pwm"
                          elif [ "$TEMP_C" -ge "$medium_temp" ]; then
                                  TARGET="$medium_pwm"
                          elif [ "$TEMP_C" -ge "$start_temp" ]; then
                                  TARGET="$low_pwm"
                          elif [ "$TEMP_C" -le "$stop_temp" ]; then
                                  TARGET=0
                          else
                                  if [ "$LAST" -ge 0 ]; then
                                          TARGET="$LAST"
                                  else
                                          TARGET=0
                                  fi
                          fi
                  fi

                  if [ "$TARGET" != "$LAST" ]; then
                          # Kick-start the physical fan when changing from stopped to running.
                          if [ "$LAST" -eq 0 ] 2>/dev/null && [ "$TARGET" -gt 0 ] 2>/dev/null; then
                                  write_pwm 128
                                  sleep 1
                          fi
                          write_pwm "$TARGET"
                          logger -t "$TAG" "temp=$((TEMP_MC / 1000))C pwm=$TARGET"
                          LAST="$TARGET"
                  fi

                  status_write
                  sleep "$interval"
          done
          EOF
          chmod 0755 files/usr/sbin/sbe1v1k-fand

          cat > files/etc/init.d/sbe1v1k-fan <<'EOF'
          #!/bin/sh /etc/rc.common

          START=95
          STOP=10
          USE_PROCD=1

          start_service() {
                  procd_open_instance
                  procd_set_param command /usr/sbin/sbe1v1k-fand
                  procd_set_param respawn 3600 5 5
                  procd_set_param stdout 1
                  procd_set_param stderr 1
                  procd_close_instance
          }

          reload_service() {
                  stop
                  start
          }

          service_triggers() {
                  procd_add_reload_trigger "sbe1v1k-fan"
          }
          EOF
          chmod 0755 files/etc/init.d/sbe1v1k-fan

          cat > files/etc/uci-defaults/95-sbe1v1k-r10 <<'EOF'
          #!/bin/sh

          # Simplified Chinese + Material theme
          uci -q set luci.main.lang='zh_cn'
          uci -q set luci.main.mediaurlbase='/luci-static/material'

          # Convenient LuCI command entries for the fan controller
          uci -q delete luci.sbe1v1k_fan_status
          uci set luci.sbe1v1k_fan_status='command'
          uci set luci.sbe1v1k_fan_status.name='SBE1V1K 风扇状态'
          uci set luci.sbe1v1k_fan_status.command='cat /tmp/sbe1v1k-fan.status 2>/dev/null || echo 风扇状态尚未生成'

          uci -q delete luci.sbe1v1k_fan_restart
          uci set luci.sbe1v1k_fan_restart='command'
          uci set luci.sbe1v1k_fan_restart.name='重启 SBE1V1K 风扇控制'
          uci set luci.sbe1v1k_fan_restart.command='/etc/init.d/sbe1v1k-fan restart && sleep 2 && cat /tmp/sbe1v1k-fan.status 2>/dev/null'

          uci commit luci

          /etc/init.d/sbe1v1k-fan enable

          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/95-sbe1v1k-r10

          {
            echo "Chinese LuCI: enabled"
            echo "Theme: luci-theme-material"
            echo "Fan service: /etc/init.d/sbe1v1k-fan"
            echo "Fan daemon: /usr/sbin/sbe1v1k-fand"
            echo "Fan curve: <=45C off, >=50C pwm72, >=60C pwm128, >=70C pwm255"
          } | tee ../R10-FEATURES.txt

      - name: Add visual hardware acceleration page
        run: |
          set -euo pipefail
          cd openwrt

          mkdir -p files/etc/init.d
          mkdir -p files/usr/sbin
          mkdir -p files/usr/share/luci/menu.d
          mkdir -p files/usr/share/luci/view/sbe1v1k
          mkdir -p files/usr/share/rpcd/acl.d
          mkdir -p files/etc/uci-defaults

          cat > files/usr/sbin/sbe1v1k-hwaccel-status <<'EOF'
          #!/bin/sh

          OUT=/tmp/sbe1v1k-hwaccel.status

          uci_get() {
                  uci -q get "firewall.@defaults[0].$1" 2>/dev/null || echo 0
          }

          flow="$(uci_get flow_offloading)"
          hw="$(uci_get flow_offloading_hw)"

          ppe=0
          edma=0
          flowtable=0
          hw_conn=0
          sw_conn=0

          grep -q 'qcom_ppe' /proc/modules 2>/dev/null && ppe=1
          for d in /sys/bus/platform/drivers/*ppe* /sys/bus/platform/drivers/*PPE*; do
                  [ -e "$d" ] && ppe=1
          done
          dmesg 2>/dev/null | grep -q 'qcom_ppe .*EDMA configuration successful' && ppe=1
          dmesg 2>/dev/null | grep -q 'EDMA Hardware Configured' && edma=1

          if command -v nft >/dev/null 2>&1; then
                  nft list ruleset 2>/dev/null | grep -q 'flowtable' && flowtable=1
          fi

          if [ -r /proc/net/nf_conntrack ]; then
                  hw_conn="$(grep -c 'HW_OFFLOAD' /proc/net/nf_conntrack 2>/dev/null || true)"
                  all_offload="$(grep -c 'OFFLOAD' /proc/net/nf_conntrack 2>/dev/null || true)"
                  case "$hw_conn" in ''|*[!0-9]*) hw_conn=0 ;; esac
                  case "$all_offload" in ''|*[!0-9]*) all_offload=0 ;; esac
                  sw_conn=$((all_offload - hw_conn))
                  [ "$sw_conn" -lt 0 ] && sw_conn=0
          fi

          ready=0
          active=0
          [ "$flow" = "1" ] && [ "$hw" = "1" ] && [ "$ppe" = "1" ] && [ "$flowtable" = "1" ] && ready=1
          [ "$ready" = "1" ] && [ "$hw_conn" -gt 0 ] 2>/dev/null && active=1

          tmp="${OUT}.tmp"
          cat > "$tmp" <<JSON
          {
            "ppe": $ppe,
            "edma": $edma,
            "flow_offloading": $flow,
            "flow_offloading_hw": $hw,
            "flowtable": $flowtable,
            "hw_conn": $hw_conn,
            "sw_conn": $sw_conn,
            "ready": $ready,
            "active": $active
          }
          JSON
          mv "$tmp" "$OUT"
          EOF
          chmod 0755 files/usr/sbin/sbe1v1k-hwaccel-status

          cat > files/usr/sbin/sbe1v1k-hwacceld <<'EOF'
          #!/bin/sh
          while true; do
                  /usr/sbin/sbe1v1k-hwaccel-status
                  sleep 5
          done
          EOF
          chmod 0755 files/usr/sbin/sbe1v1k-hwacceld

          cat > files/etc/init.d/sbe1v1k-hwaccel <<'EOF'
          #!/bin/sh /etc/rc.common

          START=96
          STOP=10
          USE_PROCD=1

          start_service() {
                  procd_open_instance
                  procd_set_param command /usr/sbin/sbe1v1k-hwacceld
                  procd_set_param respawn 3600 5 5
                  procd_set_param stdout 1
                  procd_set_param stderr 1
                  procd_close_instance
          }

          reload_service() {
                  /usr/sbin/sbe1v1k-hwaccel-status
          }
          EOF
          chmod 0755 files/etc/init.d/sbe1v1k-hwaccel

          cat > files/usr/share/luci/menu.d/luci-app-sbe1v1k-hwaccel.json <<'EOF'
          {
            "admin/network/sbe1v1k_hwaccel": {
              "title": "硬件加速",
              "order": 75,
              "action": {
                "type": "view",
                "path": "sbe1v1k/hwaccel"
              },
              "depends": {
                "acl": [ "luci-app-sbe1v1k-hwaccel" ]
              }
            }
          }
          EOF

          cat > files/usr/share/rpcd/acl.d/luci-app-sbe1v1k-hwaccel.json <<'EOF'
          {
            "luci-app-sbe1v1k-hwaccel": {
              "description": "SBE1V1K hardware acceleration status and switches",
              "read": {
                "uci": [ "firewall" ],
                "ubus": {
                  "file": [ "read" ]
                }
              },
              "write": {
                "uci": [ "firewall" ]
              }
            }
          }
          EOF

          cat > files/usr/share/luci/view/sbe1v1k/hwaccel.js <<'EOF'
          'use strict';
          'require view';
          'require form';
          'require fs';
          'require poll';

          return view.extend({
                  load: function() {
                          return Promise.all([
                                  fs.read('/tmp/sbe1v1k-hwaccel.status').catch(function() { return '{}'; })
                          ]);
                  },

                  render: function(data) {
                          var status = {};
                          try {
                                  status = JSON.parse(data[0] || '{}');
                          } catch (e) {
                                  status = {};
                          }

                          var yesno = function(v) {
                                  return v ? _('正常') : _('未检测到');
                          };

                          var accelText = _('未开启');
                          if (status.active)
                                  accelText = _('正在进行硬件加速');
                          else if (status.ready)
                                  accelText = _('硬件加速已就绪（当前暂无 HW_OFFLOAD 连接）');
                          else if (status.flow_offloading_hw)
                                  accelText = _('已开启配置，但运行条件尚未全部满足');

                          var m = new form.Map('firewall', _('SBE1V1K 硬件加速'),
                                  _('这里区分“配置已开启”和“实际正在硬件加速”。状态每 5 秒刷新。'));

                          var s = m.section(form.TypedSection, 'defaults', _('实时状态'));
                          s.anonymous = true;
                          s.addremove = false;

                          var o;

                          o = s.option(form.DummyValue, '_ppe', _('Qualcomm PPE'));
                          o.cfgvalue = function() { return yesno(status.ppe); };

                          o = s.option(form.DummyValue, '_edma', _('EDMA'));
                          o.cfgvalue = function() { return yesno(status.edma); };

                          o = s.option(form.DummyValue, '_flowtable', _('nftables Flowtable'));
                          o.cfgvalue = function() { return yesno(status.flowtable); };

                          o = s.option(form.DummyValue, '_state', _('实际硬件加速状态'));
                          o.cfgvalue = function() { return accelText; };

                          o = s.option(form.DummyValue, '_hwconn', _('HW_OFFLOAD 连接数'));
                          o.cfgvalue = function() { return String(status.hw_conn || 0); };

                          o = s.option(form.DummyValue, '_swconn', _('软件 OFFLOAD 连接数'));
                          o.cfgvalue = function() { return String(status.sw_conn || 0); };

                          o = s.option(form.Flag, 'flow_offloading', _('软件流量分载'));
                          o.default = o.disabled;
                          o.rmempty = false;
                          o.description = _('硬件流量分载依赖此项。');

                          o = s.option(form.Flag, 'flow_offloading_hw', _('硬件流量分载'));
                          o.default = o.disabled;
                          o.rmempty = false;
                          o.depends('flow_offloading', '1');
                          o.description = _('开启后由 Qualcomm PPE/硬件 flowtable 尝试接管符合条件的连接。');

                          var warn = m.section(form.TypedSection, 'defaults', _('使用提示'));
                          warn.anonymous = true;
                          warn.addremove = false;

                          o = warn.option(form.DummyValue, '_sqmwarn', _('SQM / QoS'));
                          o.cfgvalue = function() {
                                  return _('普通 Hardware Flow Offload 可能绕过 SQM/QoS。启用 SQM 时建议关闭“硬件流量分载”。');
                          };

                          poll.add(function() {
                                  return fs.read('/tmp/sbe1v1k-hwaccel.status').then(function(txt) {
                                          var st = {};
                                          try { st = JSON.parse(txt || '{}'); } catch (e) {}
                                          var node = document.querySelector('[data-name="_state"] .cbi-value-field');
                                          if (node) {
                                                  var t = _('未开启');
                                                  if (st.active)
                                                          t = _('正在进行硬件加速');
                                                  else if (st.ready)
                                                          t = _('硬件加速已就绪（当前暂无 HW_OFFLOAD 连接）');
                                                  else if (st.flow_offloading_hw)
                                                          t = _('已开启配置，但运行条件尚未全部满足');
                                                  node.textContent = t;
                                          }
                                  }).catch(function() {});
                          }, 5);

                          return m.render();
                  }
          });
          EOF

          cat > files/etc/uci-defaults/96-sbe1v1k-hwaccel <<'EOF'
          #!/bin/sh

          # Default to hardware flow offload enabled on this PPE-capable target.
          uci -q set firewall.@defaults[0].flow_offloading='1'
          uci -q set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall

          /etc/init.d/sbe1v1k-hwaccel enable
          /usr/sbin/sbe1v1k-hwaccel-status >/dev/null 2>&1 || true

          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/96-sbe1v1k-hwaccel

          {
            echo "Hardware acceleration page: /admin/network/sbe1v1k_hwaccel"
            echo "PPE / EDMA / nft flowtable status: enabled"
            echo "HW_OFFLOAD live connection counter: enabled"
            echo "Software flow offload switch: enabled"
            echo "Hardware flow offload switch: enabled"
            echo "Default HFO: enabled"
          } | tee ../R10-HWACCEL-FEATURES.txt

      - name: Add Full Cone NAT status and switch
        run: |
          set -euo pipefail
          cd openwrt

          mkdir -p files/etc/config
          mkdir -p files/etc/init.d
          mkdir -p files/etc/uci-defaults
          mkdir -p files/usr/sbin
          mkdir -p files/usr/share/luci/menu.d
          mkdir -p files/usr/share/luci/view/sbe1v1k
          mkdir -p files/usr/share/rpcd/acl.d
          mkdir -p files/etc/nftables.d

          cat > files/etc/config/sbe1v1k-nat <<'EOF'
          config nat 'main'
                  option fullcone '0'
          EOF

          cat > files/usr/sbin/sbe1v1k-fullcone <<'EOF'
          #!/bin/sh

          CFG="sbe1v1k-nat.main.fullcone"
          NFTFILE="/etc/nftables.d/95-sbe1v1k-fullcone.nft"
          STATUS="/tmp/sbe1v1k-fullcone.status"

          get_wan_dev() {
                  ubus call network.interface.wan status 2>/dev/null \
                    | jsonfilter -e '@.l3_device' 2>/dev/null
          }

          test_support() {
                  modprobe nft_fullcone 2>/dev/null || true
                  nft -c 'add table inet __sbe1v1k_fc_test; add chain inet __sbe1v1k_fc_test dstnat { type nat hook prerouting priority -100; policy accept; fullcone; }; delete table inet __sbe1v1k_fc_test' \
                    >/dev/null 2>&1
          }

          write_status() {
                  supported="$1"
                  enabled="$2"
                  active="$3"
                  wan="$4"
                  cat > "${STATUS}.tmp" <<JSON
          {
            "supported": $supported,
            "enabled": $enabled,
            "active": $active,
            "wan_device": "$wan"
          }
          JSON
                  mv "${STATUS}.tmp" "$STATUS"
          }

          apply_fullcone() {
                  wanted="$(uci -q get "$CFG" 2>/dev/null || echo 0)"
                  wan="$(get_wan_dev)"
                  [ -n "$wan" ] || wan="wan"

                  if ! test_support; then
                          rm -f "$NFTFILE"
                          [ "$wanted" = "1" ] && {
                                  logger -t sbe1v1k-fullcone "kernel/userspace fullcone expression unsupported; disabling"
                                  uci -q set "$CFG=0"
                                  uci commit sbe1v1k-nat
                          }
                          write_status 0 0 0 "$wan"
                          /etc/init.d/firewall reload >/dev/null 2>&1 || true
                          exit 0
                  fi

                  if [ "$wanted" = "1" ]; then
                          cat > "$NFTFILE" <<NFT
          chain sbe1v1k_fullcone_dstnat {
                  type nat hook prerouting priority -101; policy accept;
                  iifname "$wan" fullcone
          }

          chain sbe1v1k_fullcone_srcnat {
                  type nat hook postrouting priority 101; policy accept;
                  oifname "$wan" fullcone
          }
          NFT
                          /etc/init.d/firewall reload >/dev/null 2>&1 || true

                          active=0
                          nft list ruleset 2>/dev/null | grep -q 'sbe1v1k_fullcone_' && active=1
                          write_status 1 1 "$active" "$wan"
                  else
                          rm -f "$NFTFILE"
                          /etc/init.d/firewall reload >/dev/null 2>&1 || true
                          write_status 1 0 0 "$wan"
                  fi
          }

          case "$1" in
                  status)
                          wanted="$(uci -q get "$CFG" 2>/dev/null || echo 0)"
                          wan="$(get_wan_dev)"
                          [ -n "$wan" ] || wan="wan"
                          if test_support; then
                                  active=0
                                  nft list ruleset 2>/dev/null | grep -q 'sbe1v1k_fullcone_' && active=1
                                  write_status 1 "$wanted" "$active" "$wan"
                          else
                                  write_status 0 0 0 "$wan"
                          fi
                          cat "$STATUS"
                          ;;
                  apply|"")
                          apply_fullcone
                          ;;
                  *)
                          echo "Usage: $0 {apply|status}" >&2
                          exit 1
                          ;;
          esac
          EOF
          chmod 0755 files/usr/sbin/sbe1v1k-fullcone

          cat > files/etc/init.d/sbe1v1k-fullcone <<'EOF'
          #!/bin/sh /etc/rc.common

          START=97
          STOP=10
          USE_PROCD=1

          start_service() {
                  /usr/sbin/sbe1v1k-fullcone apply
          }

          reload_service() {
                  /usr/sbin/sbe1v1k-fullcone apply
          }

          service_triggers() {
                  procd_add_reload_trigger "sbe1v1k-nat"
                  procd_add_reload_trigger "network"
          }
          EOF
          chmod 0755 files/etc/init.d/sbe1v1k-fullcone

          cat > files/usr/share/luci/menu.d/luci-app-sbe1v1k-fullcone.json <<'EOF'
          {
            "admin/network/sbe1v1k_fullcone": {
              "title": "全锥形 NAT",
              "order": 76,
              "action": {
                "type": "view",
                "path": "sbe1v1k/fullcone"
              },
              "depends": {
                "acl": [ "luci-app-sbe1v1k-fullcone" ]
              }
            }
          }
          EOF

          cat > files/usr/share/rpcd/acl.d/luci-app-sbe1v1k-fullcone.json <<'EOF'
          {
            "luci-app-sbe1v1k-fullcone": {
              "description": "SBE1V1K Full Cone NAT switch and status",
              "read": {
                "uci": [ "sbe1v1k-nat" ],
                "ubus": {
                  "file": [ "read", "exec" ]
                }
              },
              "write": {
                "uci": [ "sbe1v1k-nat" ]
              }
            }
          }
          EOF

          cat > files/usr/share/luci/view/sbe1v1k/fullcone.js <<'EOF'
          'use strict';
          'require view';
          'require form';
          'require fs';
          'require poll';

          return view.extend({
                  load: function() {
                          return Promise.all([
                                  fs.exec('/usr/sbin/sbe1v1k-fullcone', [ 'status' ]).then(function(r) {
                                          return r.stdout || '{}';
                                  }).catch(function() { return '{}'; })
                          ]);
                  },

                  render: function(data) {
                          var st = {};
                          try { st = JSON.parse(data[0] || '{}'); } catch (e) {}

                          var m = new form.Map('sbe1v1k-nat', _('全锥形 NAT'),
                                  _('用于改善部分游戏、P2P 和点对点连接的 NAT 映射兼容性。真正生效需要内核与 nftables 同时支持 fullcone 表达式。'));

                          var s = m.section(form.NamedSection, 'main', 'nat', _('状态与开关'));
                          s.addremove = false;

                          var o = s.option(form.DummyValue, '_support', _('Full Cone 能力'));
                          o.cfgvalue = function() {
                                  return st.supported ? _('支持') : _('当前内核/用户态不支持');
                          };

                          o = s.option(form.DummyValue, '_active', _('实际运行状态'));
                          o.cfgvalue = function() {
                                  if (!st.supported)
                                          return _('不可用');
                                  return st.active ? _('已生效') : _('未生效');
                          };

                          o = s.option(form.DummyValue, '_wan', _('当前 WAN 设备'));
                          o.cfgvalue = function() {
                                  return st.wan_device || '-';
                          };

                          o = s.option(form.Flag, 'fullcone', _('全锥形 NAT 开关'));
                          o.default = o.disabled;
                          o.rmempty = false;
                          o.description = _('保存并应用后会自动检测 fullcone 能力；若不支持会自动回退为关闭，避免破坏防火墙。');

                          var note = m.section(form.NamedSection, 'main', 'nat', _('说明'));
                          note.addremove = false;
                          o = note.option(form.DummyValue, '_note', _('注意'));
                          o.cfgvalue = function() {
                                  return _('全锥形 NAT 不能突破运营商 CGNAT；若上级网络本身限制入站映射，路由器开启后也不能把公网 NAT 类型强行变成 Full Cone。');
                          };

                          poll.add(function() {
                                  return fs.exec('/usr/sbin/sbe1v1k-fullcone', [ 'status' ]).then(function() {});
