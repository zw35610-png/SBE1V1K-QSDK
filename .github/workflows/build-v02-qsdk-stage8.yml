name: SBE1V1K V0.2 QSDK Stage8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl jq bc

      - name: Clone SBE1V1K baseline
        run: |
          git clone \
            https://github.com/luckkyboy/SBE1V1K.git \
            openwrt

          cd openwrt

          git checkout \
            02fb9517c9aefac9f3825a15ae46e7998bae7edd

          cp configs/sbe1v1k.config .config

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: sbe1v1k-openwrt-dl-${{ runner.os }}-${{ hashFiles('openwrt/.config') }}
          restore-keys: |
            sbe1v1k-openwrt-dl-${{ runner.os }}-

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build OpenWrt tools and toolchain
        shell: bash
        run: |
          set -o pipefail
          cd openwrt

          make tools/install -j$(nproc) \
            2>&1 | tee ../tools.log

          make toolchain/install -j$(nproc) \
            2>&1 | tee ../toolchain.log

          make target/linux/prepare -j$(nproc) \
            2>&1 | tee ../target-linux-prepare.log

      - name: Fetch exact QSDK14 R9 PPE and SSDK
        shell: bash
        run: |
          set -e

          mkdir -p qsdk-src results

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/nss-ppe.git \
            qsdk-src/qca-nss-ppe

          git -C qsdk-src/qca-nss-ppe checkout \
            87bb9b326dfe7ddafb2cc8bc588e74d552a2a9b5

          git clone \
            https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git \
            qsdk-src/qca-ssdk

          git -C qsdk-src/qca-ssdk checkout \
            717b74016b0c131575bcd81b9e039d3f7974b02a

          {
            echo "PPE=$(git -C qsdk-src/qca-nss-ppe rev-parse HEAD)"
            echo "SSDK=$(git -C qsdk-src/qca-ssdk rev-parse HEAD)"
          } | tee results/qsdk-commits.txt

      - name: Locate build environment
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/build_dir" \
            -type d \
            -path '*/linux-*/linux-6.18*' \
            -print -quit)

          TOOLCHAIN_DIR=$(find \
            "$GITHUB_WORKSPACE/openwrt/staging_dir" \
            -maxdepth 1 \
            -type d \
            -name 'toolchain-aarch64*' \
            -print -quit)

          GCC=$(find \
            "$TOOLCHAIN_DIR/bin" \
            -type f \
            -name 'aarch64-openwrt-linux-musl-gcc' \
            -print -quit)

          CROSS_PREFIX="${GCC%gcc}"

          {
            echo "KERNEL_DIR=$KERNEL_DIR"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "GCC=$GCC"
            echo "CROSS_COMPILE=$CROSS_PREFIX"
          } | tee results/environment.txt

          test -d "$KERNEL_DIR"
          test -x "$GCC"

      - name: Fully prepare Linux kernel
        shell: bash
        run: |
          set -e

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            olddefconfig

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            prepare

          make -C "$KERNEL_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            modules_prepare

          {
            test -f "$KERNEL_DIR/include/generated/autoconf.h" \
              && echo "autoconf.h: OK"

            test -f "$KERNEL_DIR/include/config/auto.conf" \
              && echo "auto.conf: OK"

            test -f "$KERNEL_DIR/include/generated/utsrelease.h" \
              && echo "utsrelease.h: OK"
          } | tee results/kernel-check.txt

      - name: Generate complete QSDK header flags
        shell: bash
        run: |
          set -e

          SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
          PPE="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe"
          NSS_DEBUG="$PPE/nss_debug/exports"

          test -f "$SSDK/include/fal/fal_rss_hash.h"
          test -f "$SSDK/include/sal/os/aos_mem.h"
          test -f "$NSS_DEBUG/nss_debug.h"

          find "$SSDK" \
            -type f \
            -name '*.h' \
            -printf '%h\n' \
            | sort -u \
            > results/ssdk-header-dirs.txt

          : > results/qsdk-header-flags.txt

          # Needed for includes such as <fal/fal_rss_hash.h>.
          printf -- '-I%s ' "$SSDK/include" \
            >> results/qsdk-header-flags.txt

          while IFS= read -r DIR
          do
            printf -- '-I%s ' "$DIR" \
              >> results/qsdk-header-flags.txt
          done < results/ssdk-header-dirs.txt

          # Stage7C confirmed nss_debug.h lives here.
          printf -- '-I%s ' "$NSS_DEBUG" \
            >> results/qsdk-header-flags.txt

          # GCC 14 compatibility for old QSDK declarations.
          printf -- '%s ' '-Wno-error=ignored-qualifiers' \
            >> results/qsdk-header-flags.txt

          {
            echo "===== CRITICAL HEADERS ====="
            echo "fal/fal_rss_hash.h: OK"
            echo "aos_mem.h: OK"
            echo "nss_debug.h: OK"
            echo ""
            echo "NSS_DEBUG=$NSS_DEBUG"
          } | tee results/critical-headers.txt

          echo "===== QSDK FLAGS ====="
          cat results/qsdk-header-flags.txt
          echo ""

      - name: Compile QCA NSS Debug
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          PPE="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe"
          DEBUG_DIR="$PPE/nss_debug"

          QSDK_FLAGS=$(cat results/qsdk-header-flags.txt)

          echo "===== NSS DEBUG BUILD =====" \
            | tee results/nss-debug-build-info.txt

          make \
            -C "$KERNEL_DIR" \
            M="$DEBUG_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            KCFLAGS="$QSDK_FLAGS" \
            modules \
            V=1 \
            2>&1 | tee results/nss-debug-compile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            | tee results/nss-debug-exit-code.txt

          exit 0

      - name: Analyze NSS Debug
        if: always()
        shell: bash
        run: |
          {
            echo "===== NSS DEBUG ERRORS ====="

            grep -iE \
              'error:|fatal error:|implicit declaration|undefined|No such file|No rule to make target|MODPOST' \
              results/nss-debug-compile.log \
              | head -2000 || true

          } > results/nss-debug-errors.txt

          {
            echo "===== NSS DEBUG GENERATED ====="

            find qsdk-src/qca-nss-ppe/nss_debug \
              -type f \
              \( \
                -name '*.o' \
                -o -name '*.ko' \
                -o -name '*.mod' \
                -o -name 'Module.symvers' \
              \) \
              | sort || true

          } > results/nss-debug-generated.txt

          cat results/nss-debug-errors.txt

      - name: Compile QSDK14 R9 PPE
        shell: bash
        run: |
          set +e
          set -o pipefail

          KERNEL_DIR=$(grep '^KERNEL_DIR=' \
            results/environment.txt | cut -d= -f2-)

          CROSS_PREFIX=$(grep '^CROSS_COMPILE=' \
            results/environment.txt | cut -d= -f2-)

          PPE_ROOT="$GITHUB_WORKSPACE/qsdk-src/qca-nss-ppe"
          PPE_DIR="$PPE_ROOT/drv/ppe_drv"

          QSDK_FLAGS=$(cat results/qsdk-header-flags.txt)

          echo "===== PPE BUILD =====" \
            | tee results/ppe-build-info.txt

          echo "PPE_DIR=$PPE_DIR" \
            | tee -a results/ppe-build-info.txt

          echo "" \
            | tee -a results/ppe-build-info.txt

          echo "===== FLAGS =====" \
            | tee -a results/ppe-build-info.txt

          echo "$QSDK_FLAGS" \
            | tee -a results/ppe-build-info.txt

          make \
            -C "$KERNEL_DIR" \
            M="$PPE_DIR" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_PREFIX" \
            SoC=ipq95xx \
            CONFIG_NET_DSA=y \
            KCFLAGS="$QSDK_FLAGS" \
            modules \
            V=1 \
            2>&1 | tee results/ppe-compile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            | tee results/ppe-exit-code.txt

          exit 0

      - name: Analyze PPE result
        if: always()
        shell: bash
        run: |
          {
            echo "===== PPE COMPILE DEPTH ====="

            grep -E \
              'CC \[M\]|LD \[M\]|MODPOST|\.ko' \
              results/ppe-compile.log \
              | head -2000 || true

          } > results/ppe-compile-depth.txt

          {
            echo "===== PPE ERRORS ====="

            grep -iE \
              'error:|fatal error:|implicit declaration|undefined|No such file|No rule to make target|MODPOST' \
              results/ppe-compile.log \
              | head -3000 || true

          } > results/ppe-errors.txt

          {
            echo "===== PPE GENERATED ====="

            find qsdk-src/qca-nss-ppe \
              -type f \
              \( \
                -name '*.o' \
                -o -name '*.ko' \
                -o -name '*.mod' \
                -o -name 'Module.symvers' \
              \) \
              | sort || true

          } > results/ppe-generated.txt

          cat results/ppe-errors.txt

      - name: Find all missing headers
        if: always()
        shell: bash
        run: |
          {
            echo "===== MISSING HEADERS ====="

            grep -hE \
              'fatal error: .*: No such file or directory' \
              results/nss-debug-compile.log \
              results/ppe-compile.log \
              2>/dev/null \
              | sed -E \
                's/.*fatal error: ([^:]+): No such file or directory.*/\1/' \
              | sort -u || true

          } | tee results/missing-headers.txt

      - name: Find Linux API compatibility errors
        if: always()
        shell: bash
        run: |
          {
            echo "===== POSSIBLE LINUX API ERRORS ====="

            grep -hiE \
              'implicit declaration|has no member named|too few arguments|too many arguments|incompatible pointer|conflicting types|undeclared|unknown type name' \
              results/nss-debug-compile.log \
              results/ppe-compile.log \
              2>/dev/null \
              | head -3000 || true

          } > results/linux-api-errors.txt

          cat results/linux-api-errors.txt

      - name: Collect module products
        if: always()
        shell: bash
        run: |
          mkdir -p results/modules

          find qsdk-src/qca-nss-ppe \
            -type f \
            \( \
              -name '*.ko' \
              -o -name 'Module.symvers' \
            \) \
            -exec cp -v {} results/modules/ \; \
            2>/dev/null || true

          {
            echo "===== MODULE PRODUCTS ====="
            find results/modules \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          } | tee results/module-products.txt

      - name: Produce Stage8 summary
        if: always()
        shell: bash
        run: |
          {
            echo "===== STAGE8 SUMMARY ====="
            echo ""

            echo -n "NSS Debug exit code: "
            cat results/nss-debug-exit-code.txt 2>/dev/null || echo "UNKNOWN"

            echo -n "PPE exit code: "
            cat results/ppe-exit-code.txt 2>/dev/null || echo "UNKNOWN"

            echo ""

            if find qsdk-src/qca-nss-ppe/nss_debug \
              -type f \
              -name '*.ko' \
              -print -quit \
              | grep -q .
            then
              echo "NSS Debug module: GENERATED"
            else
              echo "NSS Debug module: NOT GENERATED"
            fi

            if find qsdk-src/qca-nss-ppe/drv/ppe_drv \
              -type f \
              -name '*.ko' \
              -print -quit \
              | grep -q .
            then
              echo "PPE module: GENERATED"
            else
              echo "PPE module: NOT GENERATED"
            fi

            echo ""
            echo "Missing headers:"
            tail -n +2 results/missing-headers.txt \
              2>/dev/null || true

          } | tee results/stage8-summary.txt

      - name: Upload Stage8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-V0.2-QSDK-Stage8
          path: results/
          retention-days: 7
