name: SBE1V1K QSDK66 SSDK Source Resolver V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feed-ipq
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zilogic-systems/feed-ipq.git feed-ipq
          git -C feed-ipq checkout 183c0317fad6f23bd450a4d1953324de1931f712
          test "$(git -C feed-ipq rev-parse HEAD)" = "183c0317fad6f23bd450a4d1953324de1931f712"

      - name: Inventory qca-ssdk package definitions
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          mkdir -p "$OUT"
          find feed-ipq -type f -name Makefile -print0 |
            xargs -0 grep -IlE 'PKG_NAME[[:space:]]*:?=[[:space:]]*qca-ssdk|qca-ssdk\.git' |
            sort > "$OUT/ssdk-makefiles.txt" || true
          test -s "$OUT/ssdk-makefiles.txt"
          while IFS= read -r f; do
            echo "===== $f ====="
            sed -n '1,180p' "$f"
          done < "$OUT/ssdk-makefiles.txt" > "$OUT/ssdk-makefiles-full.txt"

          grep -nE 'PKG_(NAME|RELEASE|SOURCE|SOURCE_URL|SOURCE_PROTO|SOURCE_DATE|SOURCE_VERSION|MIRROR_HASH)|qca-ssdk' \
            "$OUT/ssdk-makefiles-full.txt" > "$OUT/ssdk-source-metadata.txt" || true
          cat "$OUT/ssdk-source-metadata.txt"

      - name: Resolve source URL and commit from package metadata
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          txt=Path("resolver/ssdk-makefiles-full.txt").read_text(errors="replace")
          def vals(name):
              return re.findall(r'^\s*'+re.escape(name)+r'\s*:?=\s*(.+?)\s*$',txt,re.M)
          d={k:vals(k) for k in [
              "PKG_SOURCE","PKG_SOURCE_URL","PKG_SOURCE_PROTO","PKG_SOURCE_DATE",
              "PKG_SOURCE_VERSION","PKG_MIRROR_HASH"
          ]}
          Path("resolver/parsed-metadata.json").write_text(json.dumps(d,indent=2)+"\n")
          versions=[x.strip() for x in d["PKG_SOURCE_VERSION"] if "$" not in x]
          urls=[x.strip() for x in d["PKG_SOURCE_URL"] if "$" not in x]
          if not versions or not urls:
              raise SystemExit("Could not resolve literal PKG_SOURCE_VERSION/URL")
          Path("resolver/resolved-version.txt").write_text(versions[0]+"\n")
          Path("resolver/resolved-url.txt").write_text(urls[0]+"\n")
          print("VERSION",versions[0])
          print("URL",urls[0])
          PY

      - name: Fetch exact qca-ssdk source
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          URL="$(cat "$OUT/resolved-url.txt")"
          VER="$(cat "$OUT/resolved-version.txt")"
          rm -rf qca-ssdk

          # First use the package's own Git source exactly as declared.
          git init qca-ssdk
          git -C qca-ssdk remote add origin "$URL"
          if git -C qca-ssdk fetch --depth=1 origin "$VER"; then
            git -C qca-ssdk checkout --detach FETCH_HEAD
          else
            echo "Direct declared URL fetch failed; trying known CodeLinaro CLO URL without changing commit." | tee "$OUT/fetch-fallback.txt"
            git -C qca-ssdk remote set-url origin https://git.codelinaro.org/clo/qsdk/oss/lklm/qca-ssdk.git
            git -C qca-ssdk fetch --depth=1 origin "$VER"
            git -C qca-ssdk checkout --detach FETCH_HEAD
          fi

          ACTUAL="$(git -C qca-ssdk rev-parse HEAD)"
          echo "$ACTUAL" > "$OUT/actual-source-commit.txt"
          case "$ACTUAL" in
            "$VER"*) ;;
            *) echo "Resolved source commit does not match package version: $ACTUAL vs $VER" >&2; exit 31 ;;
          esac
          git -C qca-ssdk log -1 --format=fuller > "$OUT/source-commit.txt"

      - name: Scan mode enums and QSGMII implementation
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          grep -RInE 'QSGMII|PSGMII|USXGMII|PORT_WRAPPER_[A-Z0-9_]+|UNIPHY|switch_mac_mode|fal_port_interface_mode|ssdk_dt_parse_mac_mode' \
            qca-ssdk --exclude-dir=.git > "$OUT/mode-hits.txt" || true

          grep -RInE 'QSGMII|PORT_WRAPPER_QSGMII|UNIPHY_QSGMII|SSDK_QSGMII' \
            qca-ssdk --exclude-dir=.git > "$OUT/qsgmii-hits.txt" || true

          grep -RInE 'PORT_WRAPPER_[A-Z0-9_]+' \
            qca-ssdk --exclude-dir=.git > "$OUT/wrapper-enums.txt" || true

          grep -RInE 'switch_mac_mode|switch_mac_mode1|switch_mac_mode2|ssdk_dt_parse_mac_mode' \
            qca-ssdk --exclude-dir=.git > "$OUT/mac-mode-parser.txt" || true

      - name: Extract decisive source context
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("qca-ssdk"); out=Path("resolver")
          rx=re.compile(r'QSGMII|PORT_WRAPPER_|switch_mac_mode|ssdk_dt_parse_mac_mode|UNIPHY',re.I)
          with (out/"decisive-context.txt").open("w") as w:
              for f in root.rglob("*"):
                  if not f.is_file() or ".git" in f.parts: continue
                  try: lines=f.read_text(errors="replace").splitlines()
                  except Exception: continue
                  hits=[i for i,l in enumerate(lines) if rx.search(l)]
                  if not hits: continue
                  ranges=[]
                  for i in hits:
                      a=max(0,i-15); b=min(len(lines),i+31)
                      if ranges and a<=ranges[-1][1]+2: ranges[-1][1]=max(ranges[-1][1],b)
                      else: ranges.append([a,b])
                  w.write(f"\n===== {f} =====\n")
                  for a,b in ranges:
                      w.write(f"--- lines {a+1}-{b} ---\n")
                      for n in range(a,b): w.write(f"{n+1:5d}: {lines[n]}\n")
          PY

      - name: Produce objective verdict
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/resolver"
          Q="$(grep -RIl 'QSGMII' qca-ssdk --exclude-dir=.git | wc -l)"
          ENUM="$(grep -RIlE 'PORT_WRAPPER_QSGMII|UNIPHY_QSGMII|SSDK_QSGMII' qca-ssdk --exclude-dir=.git | wc -l)"
          IMPL="$(grep -RIlE 'PORT_WRAPPER_QSGMII|QSGMII.*(set|mode|configure)|((set|mode|configure).*)QSGMII' qca-ssdk --exclude-dir=.git | wc -l)"
          {
            echo "SOURCE_URL=$(cat "$OUT/resolved-url.txt")"
            echo "SOURCE_VERSION=$(cat "$OUT/resolved-version.txt")"
            echo "ACTUAL_COMMIT=$(cat "$OUT/actual-source-commit.txt")"
            echo "QSGMII_FILES=$Q"
            echo "QSGMII_ENUM_FILES=$ENUM"
            echo "QSGMII_IMPL_FILES=$IMPL"
            if [ "$Q" -eq 0 ]; then
              echo "VERDICT=NO_QSGMII_CODE"
            elif [ "$ENUM" -eq 0 ] || [ "$IMPL" -eq 0 ]; then
              echo "VERDICT=QSGMII_REFERENCED_IMPLEMENTATION_UNPROVEN"
            else
              echo "VERDICT=QSGMII_CODE_PRESENT_REVIEW_CONTEXT"
            fi
          } | tee "$OUT/VERDICT.txt"

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-SSDK-Source-Resolver-V3
          path: resolver/
          if-no-files-found: error
          retention-days: 7
