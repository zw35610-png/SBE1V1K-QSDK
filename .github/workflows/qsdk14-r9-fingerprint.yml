name: QSDK14 r9 Fingerprint V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          sudo apt-get update
          sudo apt-get install -y git python3

      - name: Match extended fingerprints by remote tags
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          cat > results/reference-components.tsv <<'EOF'
          component	short_commit	candidates
          qca-nss-ecm	e978478	qca-nss-ecm;nss-ecm
          qca-nss-netfn	07fbf1b	qca-nss-netfn;nss-netfn
          qca-nss-ae-clients	b959456	qca-nss-ae-clients;nss-ae-clients
          qca-nss-sfe	d0a7b9c	qca-nss-sfe;nss-sfe
          qca-ovsmgr	6c1fafc	qca-ovsmgr;ovsmgr
          qca-nss-nsm	9f54bac	qca-nss-nsm;qca-nss-fls;nss-nsm
          qca-nss-eip	10a89a9	qca-nss-eip;nss-eip
          qca-nss-dscpstats	4108235	qca-nss-dscpstats;nss-dscpstats
          EOF

          TAGS=(
            NHSS.QSDK.14.0.r9-00032-O
            NHSS.QSDK.14.0.r9-00034-O
            NHSS.QSDK.14.0.r9-00039-O
            NHSS.QSDK.14.0.r9-00040-O
          )

          printf \
          'component\tshort_commit\trepository\ttag\thead\tstate\n' \
          > results/fingerprint.tsv

          tail -n +2 results/reference-components.tsv |
          while IFS=$'\t' read -r component short candidates
          do
            repo_url=""

            IFS=';' read -ra names <<< "$candidates"

            for name in "${names[@]}"
            do
              url="https://git.codelinaro.org/clo/qsdk/oss/lklm/${name}.git"

              echo "Testing $url"

              if git ls-remote "$url" HEAD \
                   >/dev/null 2>&1
              then
                repo_url="$url"
                break
              fi
            done

            if [ -z "$repo_url" ]
            then
              for tag in "${TAGS[@]}"
              do
                printf \
                '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$component" "$short" \
                "NOT_FOUND" "$tag" "-" \
                "REPOSITORY_NOT_FOUND" \
                >> results/fingerprint.tsv
              done

              continue
            fi

            echo "$component -> $repo_url"

            for tag in "${TAGS[@]}"
            do
              ref="refs/tags/$tag"

              raw="$(
                git ls-remote \
                  "$repo_url" \
                  "$ref" \
                  "${ref}^{}" \
                  2>/dev/null || true
              )"

              if [ -z "$raw" ]
              then
                printf \
                '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$component" "$short" \
                "$repo_url" "$tag" "-" \
                "TAG_NOT_FOUND" \
                >> results/fingerprint.tsv

                continue
              fi

              # Annotated tag: prefer peeled ^{} commit.
              head="$(
                printf '%s\n' "$raw" |
                awk '
                  /\^\{\}$/ { print $1; found=1 }
                  END {
                    if (!found) {
                      # handled below
                    }
                  }
                ' |
                tail -n1
              )"

              if [ -z "$head" ]
              then
                head="$(
                  printf '%s\n' "$raw" |
                  awk 'NR==1 {print $1}'
                )"
              fi

              if [[ "$head" == "$short"* ]]
              then
                state="EXACT"
              else
                state="DIFFERENT"
              fi

              printf \
              '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$component" "$short" \
              "$repo_url" "$tag" "$head" \
              "$state" \
              >> results/fingerprint.tsv
            done
          done

      - name: Score releases
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import csv
          import json
          from pathlib import Path

          rows = list(csv.DictReader(
              open("results/fingerprint.tsv"),
              delimiter="\t"
          ))

          tags = [
              "NHSS.QSDK.14.0.r9-00032-O",
              "NHSS.QSDK.14.0.r9-00034-O",
              "NHSS.QSDK.14.0.r9-00039-O",
              "NHSS.QSDK.14.0.r9-00040-O",
          ]

          report = []

          for tag in tags:
              r = [x for x in rows if x["tag"] == tag]

              exact = sum(
                  x["state"] == "EXACT"
                  for x in r
              )

              different = sum(
                  x["state"] == "DIFFERENT"
                  for x in r
              )

              missing = len(r) - exact - different

              report.append({
                  "tag": tag,
                  "exact": exact,
                  "different": different,
                  "missing": missing,
                  "components": {
                      x["component"]: {
                          "state": x["state"],
                          "head": x["head"],
                      }
                      for x in r
                  }
              })

          report.sort(
              key=lambda x: (
                  x["missing"],
                  x["different"],
                  -x["exact"],
                  x["tag"]
              )
          )

          Path("results/score.json").write_text(
              json.dumps(report, indent=2) + "\n"
          )

          lines = []

          for x in report:
              lines.append(
                  f'{x["tag"]}: '
                  f'exact={x["exact"]} '
                  f'different={x["different"]} '
                  f'missing={x["missing"]}'
              )

              for c, y in x["components"].items():
                  lines.append(
                      f'  {c}: '
                      f'{y["state"]} '
                      f'{y["head"]}'
                  )

          Path("results/SCORE.txt").write_text(
              "\n".join(lines) + "\n"
          )

          print("\n".join(lines))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QSDK14-r9-Fingerprint-V2
          path: results/
          retention-days: 14
