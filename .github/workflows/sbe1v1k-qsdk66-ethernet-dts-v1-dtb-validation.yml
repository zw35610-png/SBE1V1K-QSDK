name: SBE1V1K QSDK66 Ethernet DTS V1 - DTB Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_TAG: v24.10.2
  FEED_IPQ_BRANCH: ath.13.0
  DEVICE_BASE_COMMIT: 02fb9517c9aefac9f3825a15ae46e7998bae7edd

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl xsltproc libxml-parser-perl python3-dev time jq patch quilt ccache zstd \
            libelf-dev bc device-tree-compiler

      - name: Fetch exact Stage17 baselines
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git openwrt
          git clone --depth=1 --branch "$FEED_IPQ_BRANCH" https://github.com/quic/qca-feed-ipq.git feed-ipq || \
            git clone --depth=1 --branch "$FEED_IPQ_BRANCH" https://github.com/zilogic-systems/feed-ipq.git feed-ipq
          git clone https://github.com/luckkyboy/SBE1V1K.git sbe1v1k
          git -C sbe1v1k checkout "$DEVICE_BASE_COMMIT"
          mkdir -p results
          git -C openwrt rev-parse HEAD > results/openwrt-commit.txt
          git -C feed-ipq rev-parse HEAD > results/feed-ipq-commit.txt
          git -C sbe1v1k rev-parse HEAD > results/sbe1v1k-commit.txt

      - name: Integrate feed-ipq using Stage17 layout
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/openwrt"
          F="$GITHUB_WORKSPACE/feed-ipq"
          cd "$O"
          # Record the feed tree before modifying anything.
          find "$F" -maxdepth 3 -type f -name Makefile | sort > "$GITHUB_WORKSPACE/results/feed-makefiles.txt"
          # QSDK feed repositories commonly carry package/target trees or feeds/* subtrees.
          if [ -d "$F/feeds" ]; then
            for d in "$F"/feeds/*; do
              [ -d "$d" ] || continue
              n="$(basename "$d")"
              rm -rf "package/feeds/$n"
              mkdir -p package/feeds
              ln -s "$d" "package/feeds/$n"
            done
          fi
          # Import target/linux/ipq95xx from the feed when present.
          if [ -d "$F/target/linux/ipq95xx" ]; then
            rm -rf target/linux/ipq95xx
            cp -a "$F/target/linux/ipq95xx" target/linux/
          fi
          test -d target/linux/ipq95xx

      - name: Transplant SBE1V1K DTS and add Ethernet topology
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/openwrt"
          OUT="$GITHUB_WORKSPACE/results"
          cd "$O"

          SRC="$(find "$GITHUB_WORKSPACE/sbe1v1k" -type f -name 'ipq9570-sbe1v1k.dts' -o -name 'ipq9574-sbe1v1k.dts' | head -1)"
          test -n "$SRC"
          DST="target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts"
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"

          cat >> "$DST" <<'DTS'

          /*
           * SBE1V1K QSDK 6.6 Ethernet topology validation V1
           * IPQ9574 physical topology:
           *   UNIPHY0/PCS0 -> ports 1..4; board uses ports 3/4 -> QCA8075 QSGMII PHY18/19
           *   UNIPHY1/PCS1 -> port 5 -> QCA8081 PHY28 USXGMII
           *   UNIPHY2/PCS2 -> port 6 -> RTL8261BE PHY0 USXGMII
           * qca-ssdk 12aaab...: PORT_WRAPPER_QSGMII=0x0b, PORT_WRAPPER_USXGMII=0x0d.
           */
          &ess_switch {
                  switch_mac_mode = <0x0b>;
                  switch_mac_mode1 = <0x0d>;
                  switch_mac_mode2 = <0x0d>;

                  qcom,port_phyinfo {
                          port@2 {
                                  port_id = <3>;
                                  phy_address = <18>;
                          };
                          port@3 {
                                  port_id = <4>;
                                  phy_address = <19>;
                          };
                          port@4 {
                                  port_id = <5>;
                                  phy_address = <28>;
                                  ethernet-phy-ieee802.3-c45;
                          };
                          port@5 {
                                  port_id = <6>;
                                  phy_address = <0>;
                                  ethernet-phy-ieee802.3-c45;
                          };
                  };
          };

          &dp3 {
                  status = "okay";
                  qcom,id = <3>;
                  qcom,phy-mdio-addr = <18>;
                  phy-mode = "qsgmii";
          };

          &dp4 {
                  status = "okay";
                  qcom,id = <4>;
                  qcom,phy-mdio-addr = <19>;
                  phy-mode = "qsgmii";
          };

          &dp5 {
                  status = "okay";
                  qcom,id = <5>;
                  qcom,phy-mdio-addr = <28>;
                  phy-mode = "usxgmii";
          };

          &dp6 {
                  status = "okay";
                  qcom,id = <6>;
                  qcom,phy-mdio-addr = <0>;
                  phy-mode = "usxgmii";
          };
          DTS

          cp "$DST" "$OUT/ipq9574-sbe1v1k-v1.dts"
          grep -nE 'switch_mac_mode|port_id|phy_address|&dp[3456]|qcom,phy-mdio-addr|phy-mode' "$DST" \
            > "$OUT/ethernet-v1-lines.txt"

      - name: Resolve labels and run static DTS preflight
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/openwrt"
          OUT="$GITHUB_WORKSPACE/results"
          cd "$O"
          DTS="target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom/ipq9574-sbe1v1k.dts"
          for label in ess_switch dp3 dp4 dp5 dp6; do
            if ! grep -RqsE "^[[:space:]]*${label}:" target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom; then
              echo "MISSING_LABEL=$label" | tee -a "$OUT/missing-labels.txt"
            fi
          done
          test ! -s "$OUT/missing-labels.txt"
          grep -RInE 'ess_switch:|dp3:|dp4:|dp5:|dp6:' target/linux/ipq95xx/files-6.6/arch/arm64/boot/dts/qcom \
            > "$OUT/resolved-labels.txt"

      - name: Configure IPQ95xx target
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          cat > .config <<'EOF'
          CONFIG_TARGET_ipq95xx=y
          CONFIG_TARGET_ipq95xx_generic=y
          CONFIG_TARGET_ipq95xx_generic_DEVICE_askey_sbe1v1k=y
          EOF
          make defconfig
          cp .config "$GITHUB_WORKSPACE/results/final.config"

      - name: Download and compile DTB target
        run: |
          set -o pipefail
          cd openwrt
          make download -j8 2>&1 | tee "$GITHUB_WORKSPACE/results/download.log"
          set +e
          make -j"$(nproc)" V=s target/linux/compile 2>&1 | tee "$GITHUB_WORKSPACE/results/kernel.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$GITHUB_WORKSPACE/results/kernel-exit.txt"
          if [ "$rc" -ne 0 ]; then
            make -j1 V=s target/linux/compile 2>&1 | tee "$GITHUB_WORKSPACE/results/kernel-j1.log"
            rc=${PIPESTATUS[0]}
            echo "$rc" > "$GITHUB_WORKSPACE/results/kernel-j1-exit.txt"
          fi
          exit "$rc"

      - name: Audit compiled DTB
        if: always()
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/results"
          find openwrt -type f -name '*sbe1v1k*.dtb' -print > "$OUT/dtb-files.txt" || true
          DTB="$(head -1 "$OUT/dtb-files.txt" 2>/dev/null || true)"
          if [ -n "$DTB" ] && [ -f "$DTB" ]; then
            dtc -I dtb -O dts "$DTB" > "$OUT/built-sbe1v1k.dts" 2>"$OUT/dtc-decompile.err" || true
            grep -nE 'switch_mac_mode|port_phyinfo|port_id|phy_address|qcom,nss-dp|qcom,phy-mdio-addr|phy-mode' \
              "$OUT/built-sbe1v1k.dts" > "$OUT/built-ethernet-audit.txt" || true
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SBE1V1K-QSDK66-Ethernet-DTS-V1-DTB-Validation
          path: results/
          if-no-files-found: error
          retention-days: 7
