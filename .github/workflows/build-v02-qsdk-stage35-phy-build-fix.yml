        cp "$PHY/linux_std/qcom_phy_lib.c" "$BRIDGE/qcom_phy_lib_stage35.c"

        python3 - <<'PY'
        from pathlib import Path
        import os, re, difflib, json
        kernel = Path(os.environ["KERNEL_DIR"])
        src = Path("stage35-qcom-phy-lib/qcom_phy_lib_stage35.c")
        out = Path("results/stage35-phy-symbols")
        (out/"qcom_phy_lib_stage35.c.before").write_text(src.read_text())
        ksrc = kernel / "drivers/net/phy/phy_package.c"
        if not ksrc.is_file():
            raise SystemExit("Linux phy_package.c not found")
        ktext = ksrc.read_text()
        start = ktext.find("struct phy_package_shared {")
        if start < 0:
            raise SystemExit("phy_package_shared definition not found in kernel")
        brace = ktext.find("{", start)
        depth = 0
        end = None
        for i in range(brace, len(ktext)):
            if ktext[i] == "{":
                depth += 1
            elif ktext[i] == "}":
                depth -= 1
                if depth == 0:
                    semi = ktext.find(";", i)
                    if semi < 0:
                        raise SystemExit("phy_package_shared semicolon not found")
                    end = semi + 1
                    break
        if end is None:
            raise SystemExit("Could not extract private phy_package_shared")
        struct_def = ktext[start:end]

        before = src.read_text()
        text = before
        if "struct phy_package_shared {" in text:
            raise SystemExit("Vendor source unexpectedly already defines phy_package_shared")

        # Adapt the vendor member name only if the exact kernel-private layout says so.
        member_mode = "unchanged"
        if "\n\tint base_addr;" in struct_def or "\n\tunsigned int base_addr;" in struct_def:
            count = text.count("phydev->shared->addr")
            if count:
                text = text.replace("phydev->shared->addr", "phydev->shared->base_addr")
                member_mode = f"addr->base_addr ({count})"
        elif re.search(r"\baddr\s*;", struct_def):
            member_mode = "kernel still uses addr"
        else:
            raise SystemExit("Could not identify package address member in exact kernel struct")

        # Ensure module/init declarations are visible for the engineering wrapper.
        includes = []
        if "#include <linux/module.h>" not in text:
            includes.append("#include <linux/module.h>\n")
        if "#include <linux/init.h>" not in text:
            includes.append("#include <linux/init.h>\n")

        matches = list(re.finditer(r"(?m)^#include[^\n]*\n", text))
        if not matches:
            raise SystemExit("No include block found in qcom_phy_lib.c")
        insert = matches[-1].end()
        compat = "".join(includes) + (
            "\n/* Stage35 engineering bridge: exact private structure extracted from\n"
            " * this build's Linux 6.18.39 drivers/net/phy/phy_package.c. */\n"
            + struct_def + "\n\n"
        )
        text = text[:insert] + compat + text[insert:]

        if "MODULE_LICENSE(" in text or "module_init(" in text:
            raise SystemExit("Unexpected module metadata in qcom_phy_lib.c")
        text += (
            "\nstatic int __init stage35_qcom_phy_lib_init(void)\n"
            "{\n"
            "\treturn 0;\n"
            "}\n\n"
            "static void __exit stage35_qcom_phy_lib_exit(void)\n"
            "{\n"
            "}\n\n"
            "module_init(stage35_qcom_phy_lib_init);\n"
            "module_exit(stage35_qcom_phy_lib_exit);\n"
            "MODULE_LICENSE(\"Dual BSD/GPL\");\n"
            "MODULE_DESCRIPTION(\"Stage35 engineering bridge for pinned QSDK qcom_phy_lib\");\n"
        )
        src.write_text(text)
        out = Path("results/stage35-phy-symbols")
        (out/"qcom_phy_lib_stage35.c.before").write_text(before)
        (out/"qcom_phy_lib_stage35.c.after").write_text(text)
        (out/"qcom-phy-lib-stage35.patch").write_text("".join(difflib.unified_diff(
            before.splitlines(True), text.splitlines(True),
            fromfile="a/linux_std/qcom_phy_lib.c",
            tofile="b/stage35-qcom-phy-lib/qcom_phy_lib_stage35.c")))
        (out/"phy-package-struct-from-kernel.txt").write_text(struct_def + "\n")
        (out/"bridge-patch-status.json").write_text(json.dumps({
            "member_mode": member_mode,
            "kernel_struct_source": str(ksrc),
            "engineering_bridge_only": True,
        }, indent=2) + "\n")
        PY

        cat > "$BRIDGE/Makefile" <<'EOF'
        obj-m += qcom-phy-lib-stage35.o
        qcom-phy-lib-stage35-y := qcom_phy_lib_stage35.o
        EOF

        extra_args=()
        if [ "$(cat "$OUT/clock-exit-code.txt" 2>/dev/null)" = 0 ] && [ -s "$OUT/qca8k-cc.ko" ] && [ -s "$CLOCK_SYMVERS" ]; then
          extra_args+=("KBUILD_EXTRA_SYMBOLS=$CLOCK_SYMVERS")
        fi

        set +e
        make -C "$KERNEL_DIR" M="$BRIDGE" -j"$(nproc)" \
          ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" V=1 \
          "KCFLAGS=$common_kc" "${extra_args[@]}" \
          modules 2>&1 | tee "$OUT/qcom-lib.log"
        bridge_rc=${PIPESTATUS[0]}
        set -e
        echo "$bridge_rc" > "$OUT/qcom-lib-exit-code.txt"

        BRIDGE_SYMVERS="$BRIDGE/Module.symvers"
        BRIDGE_KO="$BRIDGE/qcom-phy-lib-stage35.ko"
        [ -s "$BRIDGE_SYMVERS" ] && cp "$BRIDGE_SYMVERS" "$OUT/qcom-lib-Module.symvers" || true
        [ -s "$BRIDGE_KO" ] && cp "$BRIDGE_KO" "$OUT/qcom-phy-lib-stage35.ko" || true


        test "$bridge_rc" -eq 0
        test -s "$BRIDGE_SYMVERS"
        test -s "$BRIDGE_KO"
    - id: phy_inventory
      name: Always aggregate completed PHY providers and diagnostics
      if: ${{ !cancelled() && (steps.phy_build.outcome == 'success' || steps.phy_build.outcome == 'failure') }}
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/phy_inventory"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        OUT="$GITHUB_WORKSPACE/results/stage35-phy-symbols"
        mkdir -p "$OUT"
        # C) Aggregate only genuine Kbuild Module.symvers rows.
        python3 - <<'PY'
        from pathlib import Path
        import json, re
        out = Path("results/stage35-phy-symbols")
        required = ['qca8k_clk_parent_set', 'qca8k_clk_enable', 'qca8k_port_clk_reset', 'qca8k_clk_is_asserted', 'qca8k_clk_disable', 'qca8k_gcc_port_clk_parent_set', 'qca8k_port_clk_en_set', 'qca8k_clk_rate_set', 'qca8k_clk_reset', 'qcom_phy_pcs_interface_set']
        (out/"required-symbols.txt").write_text("\n".join(required) + "\n")
        tables = [
            Path("qsdk-src/qca-nss-phy/linux_std/clock/Module.symvers"),
            Path("stage35-qcom-phy-lib/Module.symvers"),
        ]
        rows, sources = [], []
        provider_checks = [
            ("clock-exit-code.txt", "qca8k-cc.ko"),
            ("qcom-lib-exit-code.txt", "qcom-phy-lib-stage35.ko"),
        ]
        for p, (rc_name, ko_name) in zip(tables, provider_checks):
            rc_path = out / rc_name
            if not rc_path.is_file() or rc_path.read_text().strip() != "0" or not (out / ko_name).is_file():
                continue
            if not p.is_file() or p.stat().st_size == 0:
                continue
            sources.append(str(p))
            for line in p.read_text(errors="replace").splitlines():
                cols = line.split()
                if len(cols) >= 2:
                    rows.append((cols[1], line))
        exports = {s for s, _ in rows}
        found = sorted(set(required) & exports)
        missing = sorted(set(required) - exports)
        seen, aggregate = set(), []
        for _, line in rows:
            if line not in seen:
                seen.add(line)
                aggregate.append(line)
        agg = Path("results/phy-aggregate-Module.symvers")
        if aggregate:
            agg.write_text("\n".join(aggregate) + "\n")
        elif agg.exists():
            agg.unlink()
        (out/"required-found.txt").write_text("\n".join(found) + ("\n" if found else ""))
        (out/"required-missing.txt").write_text("\n".join(missing) + ("\n" if missing else ""))
        def read_rc(name):
            p = out / name
            return p.read_text().strip() if p.exists() else "NOT_RUN"
        inventory = {
            "tables": sources,
            "required_count": len(required),
            "found_count": len(found),
            "missing_count": len(missing),
            "found": found,
            "missing": missing,
            "aggregate": str(agg) if agg.exists() else None,
            "aggregate_bytes": agg.stat().st_size if agg.exists() else 0,
            "clock_exit": read_rc("clock-exit-code.txt"),
            "bridge_exit": read_rc("qcom-lib-exit-code.txt"),
            "clock_ko": (out/"qca8k-cc.ko").is_file(),
            "bridge_ko": (out/"qcom-phy-lib-stage35.ko").is_file(),
            "engineering_bridge_only": True,
            "state": "COMPLETE",
        }
        (out/"symvers-inventory.json").write_text(json.dumps(inventory, indent=2) + "\n")
        print(f"PHY exports found: {len(found)}/{len(required)}")
        for s in missing:
            print("MISSING:", s)
        for name in ("clock", "qcom-lib"):
            p = out / f"{name}.log"
            lines = p.read_text(errors="replace").splitlines() if p.exists() else []
            errs = [l for l in lines if re.search(
                r"fatal error:|\berror:|undefined!|No rule to make target|make(?:\[\d+\])?: \*\*\*",
                l, re.I)]
            (out/f"{name}-errors.txt").write_text("\n".join(errs) + ("\n" if errs else ""))
        PY

        cat > "$OUT/semantic-note.txt" <<'EOF'
        Stage35 is a compile/link engineering bridge, not a flash-release PHY stack.

        qca8k-cc is built from the exact pinned qca-nss-phy source. Its Stage33
        strlcpy blocker is changed to strscpy only after verifying the return value
        is ignored at all three verified call sites.

        qcom_phy_lib.c is also the exact pinned vendor source. Linux 6.18 makes
        struct phy_package_shared private, so Stage35 extracts the exact private
        layout from this build's Linux 6.18.39 kernel source and adapts the vendor
        address member only when the kernel layout requires it. It then builds a
        small module to provide genuine vendor EXPORT_SYMBOL rows to MODPOST.

        This private-layout bridge MUST be replaced/reviewed before any flashable
        release. Its purpose is to unblock and map the real SSDK/PPE link chain.
        EOF

        exit 0
