        assert paths[names[0]] == paths[names[1]] == {'src/ref/ref_mib.c'}, paths
        assert paths[names[2]] == {'src/ref/ref_mib.c', 'src/init/ssdk_init.c'}, paths
        c = before['src/ref/ref_mib.c']
