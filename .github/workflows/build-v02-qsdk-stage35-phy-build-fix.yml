        # Original step body follows.
        set -euo pipefail
        source results/environment.txt
        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        SRC="$SSDK/src/init/ssdk_init.c"
        PHYLINK_H="$KERNEL_DIR/include/linux/phylink.h"
        OUT="$GITHUB_WORKSPACE/results/stage35-phylink-compat"
        mkdir -p "$OUT"
        test -f "$SRC"
        test -f "$PHYLINK_H"

        cp "$SRC" "$OUT/ssdk_init.c.before"
        grep -n -C 10 -E 'ssdk_pcs_get_state|pcs_get_state|neg_mode' "$SRC" \
          > "$OUT/qca-phylink-before.txt" || true
        grep -n -C 8 -E 'pcs_get_state|struct phylink_pcs' "$PHYLINK_H" \
          > "$OUT/linux618-phylink-api.txt" || true

        # Refuse to patch unless the running OpenWrt kernel tree proves the
        # Linux 6.18 callback shape that Stage23's compiler reported.
        python3 - <<'PY'
        from pathlib import Path
        h = Path("openwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommbe_ipq95xx/linux-6.18.39/include/linux/phylink.h")
        # Fall back to the KERNEL_DIR discovered by the workflow if the
        # canonical build_dir path changes; shell validation below is primary.
        if h.exists():
            text = h.read_text(errors="ignore")
            if "pcs_get_state" not in text:
                raise SystemExit("pcs_get_state not found in phylink.h")
        PY

        # The Stage23 compiler established:
        # pcs_get_state(struct phylink_pcs *, unsigned int,
        #               struct phylink_link_state *)
        # Linux 6.18 passes negotiation mode into the callback; the old
        # persistent phylink_pcs.neg_mode member no longer exists.
        python3 - <<'PY'
        from pathlib import Path
        p = Path("qsdk-src/qca-ssdk/src/init/ssdk_init.c")
        t = p.read_text()

        old_sig = "static void ssdk_pcs_get_state(struct phylink_pcs *pcs, struct phylink_link_state *state)"
        new_sig = "static void ssdk_pcs_get_state(struct phylink_pcs *pcs, unsigned int neg_mode, struct phylink_link_state *state)"
        if t.count(old_sig) != 1:
            raise SystemExit(f"Expected exactly one old pcs_get_state signature, got {t.count(old_sig)}")
        t = t.replace(old_sig, new_sig, 1)

        # This callback only reads current hardware/link state; it did not use
        # the old pcs->neg_mode value. Mark the new argument intentionally unused.
        anchor = new_sig + "\n{"
        if t.count(anchor) != 1:
            raise SystemExit("Unable to locate patched pcs_get_state body")
        t = t.replace(anchor, anchor + "\n\t(void)neg_mode;", 1)

        old_member = "\tport_priv->phylink_pcs.neg_mode = true;\n"
        if t.count(old_member) != 1:
            raise SystemExit(f"Expected exactly one removed phylink_pcs.neg_mode assignment, got {t.count(old_member)}")
        t = t.replace(old_member, "", 1)

        p.write_text(t)
        PY

        cp "$SRC" "$OUT/ssdk_init.c.after"
        git -C "$SSDK" diff -- src/init/ssdk_init.c > "$OUT/ssdk-init-stage35.patch"
        grep -n -C 10 -E 'ssdk_pcs_get_state|pcs_get_state|neg_mode' "$SRC" \
          > "$OUT/qca-phylink-after.txt" || true

        cat > "$OUT/semantic-note.txt" <<'EOF'
        Linux 6.18 changed phylink PCS get_state to receive neg_mode as a
        callback argument and removed phylink_pcs.neg_mode storage.
        QSDK's get_state implementation does not depend on negotiation mode,
        so Stage35 accepts and intentionally ignores the new argument, and
        removes only the obsolete member assignment. No link-state logic is
        disabled or hard-coded.
        EOF
      id: phylink_compat
    - name: Apply Linux 6.18 DSA compatibility - robust line transform
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/dsa_compat"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        source results/environment.txt
        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        SRC="$SSDK/src/init/ssdk_init.c"
        DSAH="$KERNEL_DIR/include/net/dsa.h"
        OUT="$GITHUB_WORKSPACE/results/stage35-dsa-compat"
        mkdir -p "$OUT"
        test -f "$SRC"
        test -f "$DSAH"
        cp "$SRC" "$OUT/ssdk_init.c.before"

        grep -q 'dsa_user_dev_check' "$DSAH"
        grep -q 'dsa_port_to_conduit' "$DSAH"

        python3 - <<'PY'
        from pathlib import Path

        p = Path("qsdk-src/qca-ssdk/src/init/ssdk_init.c")
        lines = p.read_text().splitlines()

        # 1) Simple public-API renames.
        text = chr(10).join(lines) + chr(10)
        if text.count("dsa_slave_dev_check") != 2:
            raise SystemExit("Expected exactly two dsa_slave_dev_check uses")
        text = text.replace("dsa_slave_dev_check", "dsa_user_dev_check")
        if text.count("dp->cpu_dp->master") != 1:
            raise SystemExit("Expected exactly one dp->cpu_dp->master use")
        text = text.replace("dp->cpu_dp->master", "dsa_port_to_conduit(dp)", 1)
        lines = text.splitlines()

        # 2) Remove obsolete DSA notifier callback + notifier object.
        a = next(i for i,x in enumerate(lines) if x.startswith("static int ssdk_dsa_event_nb("))
        b = next(i for i in range(a, len(lines)) if lines[i] == "};" and
                 i > 0 and "notifier_call = ssdk_dsa_event_nb" in lines[i-1])
        # Include the callback, blank separator, notifier object; preserve the
        # surrounding #if/#endif because other DSA helpers share that guard.
        del lines[a:b+1]

        # 3) Remove complete obsolete register/unregister blocks by finding
        # the call and expanding to its surrounding CONFIG_NET_DSA guard.
        for needle in (
            "register_dsa_blocking_notifier(&ssdk_dsa_notifier_nb);",
            "unregister_dsa_blocking_notifier(&ssdk_dsa_notifier_nb);",
        ):
            hit = next(i for i,x in enumerate(lines) if needle in x)
            lo = hit
            while lo >= 0 and lines[lo] != "#if IS_ENABLED(CONFIG_NET_DSA)":
                lo -= 1
            hi = hit
            while hi < len(lines) and lines[hi] != "#endif":
                hi += 1
            if lo < 0 or hi >= len(lines):
                raise SystemExit("Could not bound obsolete DSA notifier block: " + needle)
            del lines[lo:hi+1]

        # 4) Insert Linux 6.18 link-change handling in existing netdev notifier.
        fn = next(i for i,x in enumerate(lines) if x.startswith("static int ssdk_dev_event("))
        sw = next(i for i in range(fn, len(lines)) if lines[i].strip() == "switch (event) {")
        compat = [
            "#if IS_ENABLED(CONFIG_NET_DSA)",
            "        case NETDEV_CHANGE:",
            "            if (dsa_user_dev_check(dev))",
            "                return ssdk_dsa_event_link_change(dev, netif_carrier_ok(dev));",
            "            break;",
            "#endif",
        ]
        lines[sw+1:sw+1] = compat

        out = chr(10).join(lines) + chr(10)

        # Hard pre-build invariants.
        forbidden = [
            "dsa_slave_dev_check",
            "DSA_NOTIFIER_PORT_LINK",
            "struct dsa_notifier_link",
            "register_dsa_blocking_notifier",
            "unregister_dsa_blocking_notifier",
            "ssdk_dsa_event_nb",
            "ssdk_dsa_notifier_nb",
        ]
        remain = [x for x in forbidden if x in out]
        if remain:
            raise SystemExit("Obsolete DSA API remains: " + ", ".join(remain))
        if out.count("case NETDEV_CHANGE:") != 1:
            raise SystemExit("Expected exactly one NETDEV_CHANGE compatibility case")
        if "dsa_port_to_conduit(dp)" not in out:
            raise SystemExit("dsa_port_to_conduit mapping missing")
        if "dsa_user_dev_check" not in out:
            raise SystemExit("dsa_user_dev_check mapping missing")

        p.write_text(out)
        PY

        cp "$SRC" "$OUT/ssdk_init.c.after"
        git -C "$SSDK" diff -- src/init/ssdk_init.c > "$OUT/ssdk-init-stage35.patch"

        # Syntax-shape evidence saved into artifact.
        grep -n -C 8 -E 'NETDEV_CHANGE|dsa_user_dev_check|dsa_port_to_conduit' "$SRC" \
          > "$OUT/dsa-after-sites.txt"
        ! grep -Eq 'DSA_NOTIFIER_PORT_LINK|dsa_notifier_link|register_dsa_blocking_notifier|unregister_dsa_blocking_notifier' "$SRC"

        cat > "$OUT/semantic-note.txt" <<'EOF'
        Stage35 uses a line-oriented transform rather than YAML/Bash/Python
        escaped multiline C strings. It maps slave->user terminology, uses
        dsa_port_to_conduit(), removes the obsolete QSDK blocking DSA link
        notifier, and routes DSA user NETDEV_CHANGE through the existing SSDK
        link-change handler using netif_carrier_ok(). Runtime validation is
        still required before any firmware release.
        EOF
      id: dsa_compat
