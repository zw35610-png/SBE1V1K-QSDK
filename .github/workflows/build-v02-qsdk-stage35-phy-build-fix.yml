          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        source results/environment.txt
        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        DTS="$SSDK/src/init/ssdk_dts.c"
        MHT="$SSDK/src/init/ssdk_mht_pinctrl.c"
        OUT="$GITHUB_WORKSPACE/results/stage35-linux618-includes"
        mkdir -p "$OUT"
        test -f "$DTS"
        test -f "$MHT"

        cp "$DTS" "$OUT/ssdk_dts.c.before"
        cp "$MHT" "$OUT/ssdk_mht_pinctrl.c.before"

        # Save the exact kernel API evidence used by this compatibility step.
        grep -n -A20 -B5 'struct platform_device' \
          "$KERNEL_DIR/include/linux/platform_device.h" \
          > "$OUT/linux618-platform-device.txt" || true
        grep -n -A35 -B5 'PIN_CONFIG_OUTPUT' \
          "$KERNEL_DIR/include/linux/pinctrl/pinconf-generic.h" \
          > "$OUT/linux618-pinconf-generic.txt" || true

        python3 - <<'PY'
        from pathlib import Path
        import difflib

        out = Path("results/stage35-linux618-includes")

        def add_include(path_s, header):
            p = Path(path_s)
            before = p.read_text()
            inc = f"#include <{header}>"
            if inc in before:
                after = before
            else:
                lines = before.splitlines(True)
                first = next((i for i, line in enumerate(lines)
                              if line.lstrip().startswith("#include")), None)
                if first is None:
                    raise SystemExit(f"No include block found in {p}")
                lines.insert(first, inc + "\n")
                after = "".join(lines)
                p.write_text(after)
            return before, after

        dts_before, dts_after = add_include(
            "qsdk-src/qca-ssdk/src/init/ssdk_dts.c",
            "linux/platform_device.h"
        )
        mht_before, mht_after = add_include(
            "qsdk-src/qca-ssdk/src/init/ssdk_mht_pinctrl.c",
            "linux/pinctrl/pinconf-generic.h"
        )

        (out / "ssdk_dts.c.after").write_text(dts_after)
        (out / "ssdk_mht_pinctrl.c.after").write_text(mht_after)

        patch = []
        patch += difflib.unified_diff(
            dts_before.splitlines(True), dts_after.splitlines(True),
            fromfile="a/src/init/ssdk_dts.c",
            tofile="b/src/init/ssdk_dts.c"
        )
        patch += difflib.unified_diff(
            mht_before.splitlines(True), mht_after.splitlines(True),
            fromfile="a/src/init/ssdk_mht_pinctrl.c",
            tofile="b/src/init/ssdk_mht_pinctrl.c"
        )
        (out / "stage35-linux618-includes.patch").write_text("".join(patch))

        if "#include <linux/platform_device.h>" not in dts_after:
            raise SystemExit("platform_device compatibility include missing")
        if "#include <linux/pinctrl/pinconf-generic.h>" not in mht_after:
            raise SystemExit("pinconf-generic compatibility include missing")
        PY

        grep -n -m1 'linux/platform_device.h' "$DTS"
        grep -n -m1 'linux/pinctrl/pinconf-generic.h' "$MHT"

        cat > "$OUT/semantic-note.txt" <<'EOF'
        Stage35 compile compatibility:
        - ssdk_dts.c dereferences struct platform_device, so Linux 6.18 requires
          linux/platform_device.h for the complete structure definition.
        - ssdk_mht_pinctrl.c uses PIN_CONFIG_OUTPUT, which is provided by
          linux/pinctrl/pinconf-generic.h.
        These are header/API visibility fixes, not runtime behavior substitutions.
        EOF
      id: linux618_headers
    - name: Apply Linux 6.18 PIN_CONFIG_OUTPUT to PIN_CONFIG_LEVEL rename
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/pinconf_level_compat"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        source results/environment.txt

        SSDK="$GITHUB_WORKSPACE/qsdk-src/qca-ssdk"
        PHY="$GITHUB_WORKSPACE/qsdk-src/qca-nss-phy"
        KPIN="$KERNEL_DIR/include/linux/pinctrl/pinconf-generic.h"
        OUT="$GITHUB_WORKSPACE/results/stage35-pinconf-level-compat"
        mkdir -p "$OUT"

        test -d "$SSDK"
        test -d "$PHY"
        test -f "$KPIN"

        # Kernel 6.18 must expose the replacement and must no longer expose the old enum.
        grep -q '\bPIN_CONFIG_LEVEL\b' "$KPIN"
        if grep -Eq '^[[:space:]]*PIN_CONFIG_OUTPUT[[:space:]]*,' "$KPIN"; then
          echo "Unexpected Linux 6.18 header still contains PIN_CONFIG_OUTPUT" >&2
          exit 1
        fi

        grep -n -A20 -B20 'PIN_CONFIG_LEVEL' "$KPIN" \
          > "$OUT/linux618-pin-config-level.txt" || true

        python3 - <<'PY'
        from pathlib import Path
        import re, difflib, json

        roots = [
            Path("qsdk-src/qca-ssdk"),
            Path("qsdk-src/qca-nss-phy"),
        ]
        out = Path("results/stage35-pinconf-level-compat")
        out.mkdir(parents=True, exist_ok=True)

        token = re.compile(r"\bPIN_CONFIG_OUTPUT\b")
        records = []
        combined_patch = []

        for root in roots:
            for p in sorted(root.rglob("*")):
                if not p.is_file() or p.suffix not in {".c", ".h"}:
                    continue
                try:
                    before = p.read_text()
                except UnicodeDecodeError:
                    continue
                count = len(token.findall(before))
                if not count:
                    continue

                after = token.sub("PIN_CONFIG_LEVEL", before)
                p.write_text(after)

                rel = str(p)
                records.append({"file": rel, "replacements": count})
                combined_patch.extend(difflib.unified_diff(
                    before.splitlines(True),
                    after.splitlines(True),
                    fromfile="a/" + rel,
                    tofile="b/" + rel,
                ))

        if not records:
            raise SystemExit("No PIN_CONFIG_OUTPUT token found in pinned QSDK sources")

        # We know Stage31's hard blocker must be included.
        target = "qsdk-src/qca-ssdk/src/init/ssdk_mht_pinctrl.c"
        if not any(r["file"] == target for r in records):
            raise SystemExit("Stage31 blocker ssdk_mht_pinctrl.c was not patched")

        # Do not accidentally alter the independent OUTPUT_ENABLE API.
        for root in roots:
            for p in root.rglob("*"):
                if p.is_file() and p.suffix in {".c", ".h"}:
                    try:
                        text = p.read_text()
                    except UnicodeDecodeError:
                        continue
                    if "PIN_CONFIG_LEVEL_ENABLE" in text:
                        raise SystemExit("Bad token replacement touched PIN_CONFIG_OUTPUT_ENABLE")

        (out / "replacement-records.json").write_text(
            json.dumps(records, indent=2) + "\n"
        )
        (out / "stage35-pinconf-output-to-level.patch").write_text(
            "".join(combined_patch)
        )

        # Exact old token must now be gone from C/H source under these two components.
        remaining = []
        for root in roots:
            for p in root.rglob("*"):
                if p.is_file() and p.suffix in {".c", ".h"}:
                    try:
                        text = p.read_text()
                    except UnicodeDecodeError:
                        continue
                    if token.search(text):
                        remaining.append(str(p))
        if remaining:
            raise SystemExit("Old PIN_CONFIG_OUTPUT remains: " + ", ".join(remaining[:20]))
        PY

        grep -R -n --include='*.c' --include='*.h' '\bPIN_CONFIG_LEVEL\b' \
          "$SSDK/src/init/ssdk_mht_pinctrl.c" "$PHY" \
          > "$OUT/after-sites.txt" || true

        cat > "$OUT/semantic-note.txt" <<'EOF'
        Linux 6.18 pinctrl compatibility:
        PIN_CONFIG_OUTPUT was renamed upstream to PIN_CONFIG_LEVEL. This Stage35
        patch performs the exact token rename in the pinned SSDK and qca-nss-phy
        C/H sources. PIN_CONFIG_OUTPUT_ENABLE is intentionally unchanged.

        This is an upstream API rename, not a compile-only behavioral stub.
        EOF
      id: pinconf_level_compat
