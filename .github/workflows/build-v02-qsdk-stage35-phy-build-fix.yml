        assert h.count(anchor) == 1
        decls = ('/* Stage35: common declarations, also required with SWCONFIG disabled. */\n'
                 'struct qca_phy_priv;\n'
                 'int _qca_ar8327_sw_capture_port_tx_counter(a_uint32_t dev_id, int port);\n'
                 'int _qca_ar8327_sw_capture_port_rx_counter(a_uint32_t dev_id, int port);\n'
                 'void qca_ar8327_sw_mib_task(struct qca_phy_priv *priv);\n\n')
        h = h.replace('#define _REF_MIB_H_\n', '#define _REF_MIB_H_\n\n#include "sw.h"\n')
        h = h.replace(anchor, decls + anchor)
        assert c.count('#include "ref_vlan.h"') == 1
        c = c.replace('#include "ref_vlan.h"', '#include "ref_vlan.h"\n#include "ref_mib.h"')
        init = init.replace(extern, '')
        # Validate exact declaration placement as well as definitions before writing.
        status['phase'] = 'patch_postconditions'
        assert h.count('#define _REF_MIB_H_') == 1
        assert h.count('#include "sw.h"') == 1
        for declaration in decls.splitlines()[2:5]:
            assert h.count(declaration) == 1, declaration
            assert h.index(declaration) < h.index(anchor), declaration
        assert c.count('#include "ref_mib.h"') == 1
        assert c.index('#include "ref_mib.h"') < c.index(names[0])
        assert c.replace('\n#include "ref_mib.h"', '', 1) == before['src/ref/ref_mib.c']
        assert init == before['src/init/ssdk_init.c'].replace(extern, '', 1)
        after = {'src/ref/ref_mib.c': c, 'include/ref/ref_mib.h': h, 'src/init/ssdk_init.c': init}
        patch = ''
        for rel, text in after.items():
            (root/rel).write_text(text, newline='\n')
            (out/Path(rel).name).write_text(text)
            patch += ''.join(difflib.unified_diff(before[rel].splitlines(True), text.splitlines(True), fromfile='a/'+rel, tofile='b/'+rel))
        (out/'ssdk-stage35-prototypes.patch').write_text(patch)
        status.update(state='PASS', phase='complete', verified=True, source_sha256=expected, declarations=list(names))
        (out/'status.json').write_text(json.dumps(status, indent=2) + '\n')
        print('Three shared prototypes verified; no function body or linkage changes.')
        PY
      id: prototypes
