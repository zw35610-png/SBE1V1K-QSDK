    - name: Repeat verified Stage12 DSA and vmalloc compile probe
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/api_probe"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        source results/environment.txt
        export STAGING_DIR="$GITHUB_WORKSPACE/openwrt/staging_dir"
        mkdir -p results/stage12-api-probe
        cat > results/stage12-api-probe/stage12_api.c <<'PROBE_C'
        #include <linux/module.h>
        #include <linux/vmalloc.h>
        #include <net/dsa.h>
        static __used struct net_device *stage12_dsa(const struct dsa_port *dp)
        {
            return dsa_port_to_conduit(dp);
        }
        static __used void stage12_vmalloc(void)
        {
            void *p = vzalloc(64);
            vfree(p);
        }
        MODULE_LICENSE("GPL");
        PROBE_C
        echo 'obj-m += stage12_api.o' > results/stage12-api-probe/Makefile
        set +e
        make -C "$KERNEL_DIR" M="$GITHUB_WORKSPACE/results/stage12-api-probe" \
          ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" stage12_api.o V=1 \
          2>&1 | tee results/stage12-api-probe.log
        rc=${PIPESTATUS[0]}
        echo "$rc" > results/stage12-api-probe-exit-code.txt
        exit "$rc"
      id: api_probe
