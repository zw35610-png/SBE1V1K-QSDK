        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        set -euo pipefail
        source results/environment.txt
        export KERNEL_DIR TOOLCHAIN_DIR CROSS_COMPILE GCC
        export STAGING_DIR="$GITHUB_WORKSPACE/openwrt/staging_dir"
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"

        PHY="$GITHUB_WORKSPACE/qsdk-src/qca-nss-phy"
        CLOCK="$PHY/linux_std/clock"
        BRIDGE="$GITHUB_WORKSPACE/stage35-qcom-phy-lib"
        OUT="$GITHUB_WORKSPACE/results/stage35-phy-symbols"
        mkdir -p "$OUT" "$BRIDGE"

        test -d "$PHY"
        test -d "$CLOCK"
        test -s "$KERNEL_DIR/Module.symvers"
        test "$(git -C "$PHY" rev-parse HEAD)" = 16eec6ac35820cb67af59223e8b4c2dba7179655

        required=(
          qca8k_clk_parent_set
          qca8k_clk_enable
          qca8k_port_clk_reset
          qca8k_clk_is_asserted
          qca8k_clk_disable
          qca8k_gcc_port_clk_parent_set
          qca8k_port_clk_en_set
          qca8k_clk_rate_set
          qca8k_clk_reset
