    - name: Collect all products and audit unresolved symbols
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/collect"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        python3 <<'PY'
        from pathlib import Path
        import json
        import os
        import re
        import shutil
        import subprocess

        root = Path.cwd()
        out = root / 'results'
        out.mkdir(exist_ok=True)
        env = {}
        envfile = out / 'environment.txt'
        if envfile.exists():
            env = dict(line.split('=', 1) for line in envfile.read_text().splitlines() if '=' in line)
        ssdk = root / 'qsdk-src/qca-ssdk'
        ppe = root / 'qsdk-src/qca-nss-ppe/drv/ppe_drv'
        debug = root / 'qsdk-src/qca-nss-ppe/nss_debug'

        def write(name, lines):
            (out / name).write_text('\n'.join(lines) + ('\n' if lines else ''))

        def rc(name):
            p = out / (name + '-exit-code.txt')
            return p.read_text().strip() if p.exists() else 'NOT_RUN'

        def symbols(path):
            if not path.is_file():
                return set()
            return {row.split()[1] for row in path.read_text().splitlines() if len(row.split()) >= 4}

        products = []
        for base in (ssdk, root / 'qsdk-src/qca-nss-ppe', root / 'qsdk-src/qca-nss-phy/linux_std/clock', root / 'stage35-qcom-phy-lib'):
            if not base.exists():
                continue
            for p in sorted(base.rglob('*')):
                if p.is_file() and (p.suffix in ('.ko', '.o', '.mod') or p.name in ('Module.symvers', 'modules.order')):
                    rel = p.relative_to(root)
                    dest = out / 'modules' / rel
                    dest.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copy2(p, dest)
                    products.append(f'{rel.as_posix()}\t{p.stat().st_size}')
        write('module-products.txt', products)

        ssdk_tables = []
        for p in sorted(ssdk.rglob('Module.symvers')) if ssdk.exists() else []:
            names = symbols(p)
            ssdk_tables.append(f'{p.relative_to(root)}\tbytes={p.stat().st_size}\texports={len(names)}\tfal={sum(x.startswith("fal_") for x in names)}')
        write('ssdk-symvers-inventory.txt', ssdk_tables)
        exports = symbols(ssdk / 'Module.symvers')
        fal_exports = sorted(x for x in exports if x.startswith('fal_'))
        write('ssdk-fal-exports.txt', fal_exports)
        write('ssdk-all-exports.txt', sorted(exports))

        for name in ('ssdk', 'nss-debug', 'ppe'):
            log = out / (name + '-compile.log')
            lines = log.read_text(errors='replace').splitlines() if log.exists() else []
            write(name + '-errors.txt', [l for l in lines if re.search(r'error:|fatal error:|undefined!|implicit declaration|No rule to make target|No such file|has no member|incompatible pointer|conflicting types|too few arguments|too many arguments', l, re.I)])
            if name == 'ppe':
                write('ppe-modpost-unresolved.txt', [l for l in lines if 'undefined!' in l or 'suppressed' in l and 'unresolved' in l])
                write('ppe-compile-depth.txt', [l for l in lines if re.search(r'CC \[M\]|LD \[M\]|MODPOST|\.ko', l)])

        # Runs inside the inherited all-products diagnostic Python block.
        ssdk_log = out / 'ssdk-compile.log'
        ssdk_lines = ssdk_log.read_text(errors='replace').splitlines() if ssdk_log.exists() else []
        compiler_error = re.compile(r'\.(?:c|h):\d+(?::\d+)?:\s+(?:fatal\s+)?error:')
        compiler_command = re.compile(r'aarch64[^\s]*-(?:gcc|cc)\b.*(?:\s-c\s).*\.c(?:\s|$)')
        first_index = next((i for i, line in enumerate(ssdk_lines) if compiler_error.search(line)), None)
        compile_commands = [line for line in ssdk_lines if compiler_command.search(line)]
        write('ssdk-compiler-commands.txt', compile_commands)
        write('ssdk-compile-depth.txt', [line for line in ssdk_lines if re.search(r'CC\s+\[M\]|LD\s+\[M\]|MODPOST|\.ko', line)])
        if first_index is not None:
            write('ssdk-first-compiler-error.txt', [f'log_line={first_index + 1}', ssdk_lines[first_index]])
            write('ssdk-first-compiler-error-context.txt', ssdk_lines[max(0, first_index-20):first_index+41])
            match = re.search(r'([^\s:]+\.(?:c|h)):(\d+)', ssdk_lines[first_index])
            if match:
                name, line_no = match.group(1), int(match.group(2))
                for candidate in (Path(name), ssdk / 'mk' / name, ssdk / name):
                    candidate = candidate.resolve()
                    if candidate.is_file() and candidate.is_relative_to(ssdk.resolve()):
                        source = candidate.read_text(errors='replace').splitlines()
                        write('ssdk-first-error-source.txt', [str(candidate)] + [f'{i+1}: {source[i]}' for i in range(max(0,line_no-21), min(len(source),line_no+20))])
                        break
        else:
            write('ssdk-first-compiler-error.txt', ['No source-positioned compiler error found; inspect ssdk-errors.txt and ssdk-compile.log.'])
        objects = sorted(p.relative_to(ssdk).as_posix() for p in ssdk.rglob('*.o')) if ssdk.exists() else []
        write('ssdk-object-inventory.txt', objects)
        ssdk_started = bool(compile_commands or objects or first_index is not None)
        write('ssdk-stage35-status.txt', [f'compiler_started={ssdk_started}', f'object_count={len(objects)}', f'first_compiler_error_line={first_index + 1 if first_index is not None else "NONE"}', f'make_exit={rc("ssdk")}'])

        # An exhaustive strong-undefined-symbol comparison independent of MODPOST's
        # first-ten-errors display limit. This does not replace MODPOST's CRC,
        # namespace and license validation.
        kernel_table = Path(env['KERNEL_DIR']) / 'Module.symvers' if 'KERNEL_DIR' in env else None
        available = symbols(kernel_table) if kernel_table else set()
        extra_file = out / 'kbuild-extra-symbols.txt'
        extra_paths = extra_file.read_text().splitlines() if extra_file.exists() else []
        for path in extra_paths:
            available.update(symbols(Path(path)))
        nm_status = 'NOT_AVAILABLE'
        needed, missing = set(), set()
        obj = ppe / 'qca-nss-ppe.o'
        if obj.is_file() and 'CROSS_COMPILE' in env:
            try:
                proc = subprocess.run([env['CROSS_COMPILE'] + 'nm', '-u', str(obj)], capture_output=True, text=True)
                (out / 'ppe-nm-undefined.raw.txt').write_text(proc.stdout + proc.stderr)
                nm_status = str(proc.returncode)
                if proc.returncode == 0:
                    needed = {parts[-1] for line in proc.stdout.splitlines() if len(parts := line.split()) >= 2 and parts[-2] == 'U'}
                    missing = needed - available
            except OSError as exc:
                nm_status = str(exc)
        write('ppe-required-symbols.txt', sorted(needed))
        write('ppe-unresolved-all.txt', sorted(missing))
        write('ppe-fal-resolution.tsv', ['symbol\tSSDK_exported\tavailable_to_MODPOST'] + [f'{s}\t{int(s in exports)}\t{int(s in available)}' for s in sorted(needed) if s.startswith('fal_')])

        for name in ('tools.log', 'toolchain.log', 'kernel-compile.log'):
            if (root / name).is_file():
                shutil.copy2(root / name, out / name)
        if (root / 'openwrt/.config').is_file():
            shutil.copy2(root / 'openwrt/.config', out / 'openwrt.config')
        if kernel_table and kernel_table.is_file():
            shutil.copy2(kernel_table, out / 'kernel-Module.symvers')
            config = kernel_table.parent / '.config'
            if config.is_file():
                shutil.copy2(config, out / 'kernel.config')

        ssdk_modules = sorted(str(p.relative_to(root)) for p in ssdk.rglob('qca-ssdk.ko')) if ssdk.exists() else []
        phy_status_file = out / 'phy-header-status.json'
        phy_status = json.loads(phy_status_file.read_text()) if phy_status_file.exists() else {}
        phy_flag_seen = any('-I' + str(root / 'qsdk-include') in line for line in compile_commands)
        bridge_status_path = out / 'bridge-api/status.json'
        bridge_status = json.loads(bridge_status_path.read_text()) if bridge_status_path.exists() else {}
        prototype_status_file = out / 'stage35-prototypes/status.json'
        prototype_status = json.loads(prototype_status_file.read_text()) if prototype_status_file.exists() else {}
        fallback_file = out / 'ssdk-warning-fallback.txt'
        fallback = fallback_file.read_text().strip() if fallback_file.exists() else 'NOT_RUN'
        missing_warnings = [line for line in ssdk_lines if 'warning:' in line and ('[-Wmissing-prototypes]' in line or '[-Wmissing-declarations]' in line)]
        write('ssdk-missing-prototypes-warnings.txt', missing_warnings)
        # Also capture non-source failures such as assembler, linker, MODPOST and make.
        real_error = next((line for line in ssdk_lines
                           if re.search(r'\berror:|fatal error:|undefined!|No rule to make target|make(?:\[\d+\])?: \*\*\*', line, re.I)
                           and 'missing-prototypes' not in line
                           and 'missing-declarations' not in line), None)
        if real_error is None:
            real_error = next((line for line in ssdk_lines if re.search(r'\berror:|fatal error:|undefined!|No rule to make target|make(?:\[\d+\])?: \*\*\*', line, re.I)), None)
        write('ssdk-first-real-error.txt', [real_error] if real_error else ['No error found; see exit code and full log.'])
        modpost_undefined = []
        for line in ssdk_lines:
            m = re.search(r'ERROR:\s+modpost:\s+"([^"]+)"\s+\[qca-ssdk\.ko\]\s+undefined!', line)
            if m:
                modpost_undefined.append(m.group(1))
        modpost_undefined = sorted(set(modpost_undefined))
        write('ssdk-modpost-undefined.txt', modpost_undefined)

        phy_inv_file = out / 'stage35-phy-symbols/symvers-inventory.json'
        phy_inv = json.loads(phy_inv_file.read_text()) if phy_inv_file.exists() else {
            'state': 'NOT_RUN_OR_INCOMPLETE', 'required_count': 10,
            'found_count': 0, 'missing_count': 10, 'aggregate_bytes': 0,
            'clock_exit': 'NOT_RUN', 'bridge_exit': 'NOT_RUN',
            'clock_ko': False, 'bridge_ko': False,
        }
        for key, filename in [('clock_exit', 'clock-exit-code.txt'), ('bridge_exit', 'qcom-lib-exit-code.txt')]:
            p = out / 'stage35-phy-symbols' / filename
            if p.exists():
                phy_inv[key] = p.read_text().strip()

        # Preserve skipped/unstarted states rather than inventing failed verifications.
        step_outcomes = json.loads(os.environ.get('STAGE35_STEPS_JSON', '{}'))
        (out / 'github-step-outcomes.json').write_text(json.dumps(step_outcomes, indent=2) + '\n')
        manifest_file = out / 'step-manifest.json'
        manifest = json.loads(manifest_file.read_text()) if manifest_file.is_file() else [{'id': 'checkout', 'name': 'Checkout'}, {'id': 'initialize', 'name': 'Initialize diagnostics'}, {'id': 'free_disk', 'name': 'Free disk'}, {'id': 'dependencies', 'name': 'Install dependencies'}, {'id': 'baseline', 'name': 'Clone SBE1V1K baseline'}, {'id': 'downloads_cache', 'name': 'Cache OpenWrt downloads'}, {'id': 'qsdk_sources', 'name': 'Fetch exact QSDK sources'}, {'id': 'ssdk_source_inspection', 'name': 'Inspect pinned SSDK source and package build evidence'}, {'id': 'phy_headers', 'name': 'Export pinned PHY headers and verify include parent'}, {'id': 'source_download', 'name': 'Download sources'}, {'id': 'kernel_build', 'name': 'Build OpenWrt kernel'}, {'id': 'kernel_toolchain', 'name': 'Locate kernel and toolchain'}, {'id': 'kernel_symvers', 'name': 'Verify kernel Module.symvers'}, {'id': 'include_flags', 'name': 'Generate QSDK include flags'}, {'id': 'ppe_compat', 'name': 'Apply exact successful Stage12 PPE patch'}, {'id': 'api_probe', 'name': 'Repeat verified Stage12 DSA and vmalloc compile probe'}, {'id': 'nss_debug', 'name': 'Compile QCA NSS Debug'}, {'id': 'bridge_audit', 'name': 'Audit Linux 6.18.39 bridge semantics and patch SSDK'}, {'id': 'bridge_probe', 'name': 'Compile and MODPOST exact Stage16 bridge helper'}, {'id': 'prototypes', 'name': 'Audit pinned declarations and add exact SSDK MIB prototypes'}, {'id': 'ssdk_build', 'name': 'Build exact SSDK through verified mk entry'}, {'id': 'ppe_build', 'name': 'Build PPE with SSDK and NSS Debug exports'}]
        step_records = []
        for item in manifest:
            sid = item['id']
            context = step_outcomes.get(sid, {})
            record = dict(item, **context)
            status_dir = out / 'steps' / sid
            exit_file = status_dir / 'exit-code.txt'
            if exit_file.is_file():
                record['shell_exit'] = exit_file.read_text().strip()
            failure = status_dir / 'failure.txt'
            if failure.is_file():
                record['shell_failure'] = failure.read_text()
            if sid == 'downloads_cache' and context.get('outcome') == 'failure':
                record['state'] = 'WARN'
            elif context.get('outcome') == 'failure' or record.get('shell_exit', '0') != '0':
                record['state'] = 'FAIL'
            elif context.get('outcome') == 'success':
                record['state'] = 'PASS'
            elif context.get('outcome') == 'cancelled':
                record['state'] = 'CANCELLED'
            elif (status_dir / 'state.txt').is_file():
                record['state'] = (status_dir / 'state.txt').read_text().strip()
            else:
                record['state'] = 'NOT_RUN'
            step_records.append(record)
        (out / 'step-results.json').write_text(json.dumps(step_records, indent=2) + '\n')
        first_failed_step = next((s for s in step_records if s['state'] == 'FAIL' and s['id'] != 'downloads_cache'), None)
        incomplete_steps = [s for s in step_records if s['state'] in ('RUNNING', 'CANCELLED')]
        prototype_state = prototype_status.get('state', 'NOT_RUN')
        if not prototype_status and (out / 'steps/prototypes/state.txt').exists():
            prototype_state = 'STARTED_WITHOUT_STATUS'
        (out / 'first-failed-step.json').write_text(json.dumps(first_failed_step, indent=2) + '\n')
        stats = {
            'prototype_audit_state': prototype_state,
            'prototype_audit_verified': prototype_status.get('verified'),
            'prototype_audit_detail': prototype_status,
            'first_failed_step': first_failed_step,
            'incomplete_steps': incomplete_steps,
            'ssdk_strict_exit': rc('ssdk-strict'),
            'ssdk_warning_fallback': fallback,
            'ssdk_missing_prototypes_warning_count': len(missing_warnings),
            'ssdk_first_real_error': real_error,
            'ssdk_modpost_undefined_count': len(modpost_undefined),
            'ssdk_modpost_undefined': modpost_undefined,
            'phy_inventory_state': phy_inv.get('state'),
            'phy_required_export_count': phy_inv.get('required_count'),
            'phy_required_export_found_count': phy_inv.get('found_count'),
            'phy_required_export_missing_count': phy_inv.get('missing_count'),
            'phy_aggregate_symvers_bytes': phy_inv.get('aggregate_bytes', 0),
            'phy_clock_exit': phy_inv.get('clock_exit'),
            'phy_bridge_exit': phy_inv.get('bridge_exit'),
            'phy_clock_ko': phy_inv.get('clock_ko'),
            'phy_bridge_ko': phy_inv.get('bridge_ko'),
            'phy_engineering_bridge_only': phy_inv.get('engineering_bridge_only'),
            'stage': 35,
            'bridge_api_state': 'PASS' if bridge_status.get('verified') else ('FAIL' if bridge_status else 'NOT_RUN'),
            'bridge_api_verified': bridge_status.get('verified'),
            'bridge_probe_exit': rc('stage16-bridge-probe'),
            'bridge_probe_ko': (out / 'stage16-bridge-probe/stage16_bridge_probe.ko').is_file(),
            'phy_commit_required': '16eec6ac35820cb67af59223e8b4c2dba7179655',
            'phy_header_status': phy_status,
            'phy_include_in_ssdk_gcc': phy_flag_seen,
            'purpose': 'Compile probe only; no flashing; inherited MAP-T/DSA compatibility is not runtime validation',
            'ssdk_commit_required': '717b74016b0c131575bcd81b9e039d3f7974b02a',
            'kernel_required': '6.18.39',
            'target': 'IPQ9574/ipq95xx/APPE/arm64',
            'ssdk_exit': rc('ssdk'), 'nss_debug_exit': rc('nss-debug'), 'ppe_exit': rc('ppe'),
            'ssdk_modules': ssdk_modules,
            'ssdk_compiler_started': ssdk_started,
            'ssdk_object_count': len(objects),
            'ssdk_source_object_count': sum(p.startswith('src/') and not p.endswith('.mod.o') for p in objects),
            'ssdk_first_compiler_error': ssdk_lines[first_index] if first_index is not None else None,
            'ssdk_symvers_bytes': (ssdk / 'Module.symvers').stat().st_size if (ssdk / 'Module.symvers').exists() else 0,
            'ssdk_export_count': len(exports), 'ssdk_fal_export_count': len(fal_exports),
            'nss_debug_ko': (debug / 'qca-nss-debug.ko').is_file(),
            'ppe_ko': (ppe / 'qca-nss-ppe.ko').is_file(),
            'ppe_linked_object': obj.is_file(),
            'ppe_source_object_count': sum(1 for p in ppe.glob('*.o') if p.name != 'qca-nss-ppe.o' and not p.name.endswith('.mod.o')),
            'ppe_all_object_count': len(list(ppe.glob('*.o'))),
            'extra_symvers': extra_paths, 'symbol_audit_exit': nm_status,
            'ppe_unresolved_count': len(missing) if nm_status == '0' else None,
            'ppe_unresolved_fal_count': sum(s.startswith('fal_') for s in missing) if nm_status == '0' else None,
        }
        stats['success'] = bool(phy_inv.get('missing_count') == 0 and phy_inv.get('clock_exit') == '0' and phy_inv.get('bridge_exit') == '0' and phy_inv.get('clock_ko') and phy_inv.get('bridge_ko') and first_failed_step is None and not incomplete_steps and stats['prototype_audit_verified'] and stats['bridge_api_verified'] and stats['bridge_probe_exit'] == '0' and stats['bridge_probe_ko'] and phy_status.get('verified') and phy_flag_seen and all(rc(n) == '0' for n in ('ssdk', 'nss-debug', 'ppe')) and ssdk_started and ssdk_modules and fal_exports and stats['ppe_ko'] and stats['nss_debug_ko'] and nm_status == '0' and not missing and str(ssdk / 'Module.symvers') in extra_paths)
        (out / 'stage35-summary.json').write_text(json.dumps(stats, indent=2) + '\n')
        summary = ['STAGE 35: ' + ('PASS' if stats['success'] else 'FAIL / INCOMPLETE')]
        summary += [f'{k}: {v}' for k, v in stats.items()]
        write('stage35-summary.txt', summary)
        print('\n'.join(summary))
        if os.environ.get('GITHUB_STEP_SUMMARY'):
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                f.write('```text\n' + '\n'.join(summary) + '\n```\n')
        PY
      if: always()
      env:
        STAGE35_STEPS_JSON: ${{ toJSON(steps) }}
      id: collect
    - name: Upload Stage35 diagnostics and modules
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SBE1V1K-V0.2-QSDK-Stage35
        path: results/
        retention-days: 14
        if-no-files-found: error
      id: upload
    - name: Require real SSDK and PPE module success
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/require_success"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
          printf '%s\n' "$stage35_rc" > "$STAGE35_STEP_DIR/exit-code.txt"
          if [ "$stage35_rc" -eq 0 ]; then
            printf '%s\n' PASS > "$STAGE35_STEP_DIR/state.txt"
          else
            printf '%s\n' FAIL > "$STAGE35_STEP_DIR/state.txt"
            printf 'line=%s\ncommand=%s\n' "$stage35_line" "$stage35_command" > "$STAGE35_STEP_DIR/failure.txt"
          fi
          exit "$stage35_rc"
        }
        trap 'stage35_finish "$?" "$LINENO" "$BASH_COMMAND"' EXIT
        # Original step body follows.
        python3 <<'PY'
        import json
        from pathlib import Path
        p = Path('results/stage35-summary.json')
        assert p.is_file(), 'Missing Stage35 diagnostics'
        s = json.loads(p.read_text())
        assert s['success'], 'Stage35 compile incomplete; download the uploaded diagnostics'
        PY
      if: always()
      id: require_success
