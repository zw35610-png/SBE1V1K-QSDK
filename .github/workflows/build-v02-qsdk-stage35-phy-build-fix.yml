        grep -n -C 8 -E 'i2c_adapter \*bus_priv|i2c_transfer\(bus_priv|phy_drivers_register|phy_drivers_unregister' \
          "$SRC" > "$OUT/qca-after-use-sites.txt"

        cat > "$OUT/semantic-note.txt" <<'EOF'
        No qcom_mdio_i2c_data layout was invented.
        Linux 6.18 mdio-i2c uses struct i2c_adapter * directly as mii_bus->priv.
        QSDK SFP EEPROM I2C access is adapted to that verified contract.
        The single PHY driver uses exported plural registration APIs with n=1.
        Compile validation only; SFP/Combo-port runtime testing is still required.
        EOF
