            end = None
            for i in range(brace, len(src)):
                if src[i] == "{": depth += 1
                elif src[i] == "}":
                    depth -= 1
                    if depth == 0:
                        end = i + 1
                        break
            if end is None:
                raise SystemExit("Unbalanced function: " + name)
            sig = src[start:brace]
            body = "{\n\t/* Linux 6.18 has no QSDK mdiobb_ctrl sw_read/sw_write hooks. */\n"
            for arg in unused:
                body += f"\t(void){arg};\n"
            body += "\treturn SW_NOT_FOUND;\n}"
            return src[:start] + sig + body + src[end:]

        # Compile-probe compatibility only. Keep symbols but disable the removed
        # Qualcomm raw GPIO hooks. Runtime semantics must be reviewed before flashing.
        text = stub_function(text, "qca_bitbang_mii_raw_read_try", ["bus","reg","val"])
        text = stub_function(text, "qca_bitbang_mii_raw_write_try", ["bus","reg","val"])
        text = stub_function(text, "qca_bitbang_mii_raw_update_try", ["bus","reg","clear","set"])

        callbacks = [
            "ssdk_packet_counter_bin_read",
            "ssdk_packet_counter_bin_write",
            "ssdk_byte_counter_bin_read",
            "ssdk_byte_counter_bin_write",
        ]
        for name in callbacks:
            pos = text.find(name + "(")
            if pos < 0: raise SystemExit("Missing callback: " + name)
            brace = text.find("{", pos)
            head = text[pos:brace]
            if "struct bin_attribute *" not in head:
                raise SystemExit("Expected old bin_attribute signature: " + name)
            text = text[:pos] + head.replace("struct bin_attribute *",
                                            "const struct bin_attribute *", 1) + text[brace:]

        if "gpio_priv->sw_read" in text or "gpio_priv->sw_write" in text:
            raise SystemExit("obsolete mdiobb_ctrl hook remains")
        for name in callbacks:
            pos = text.find(name + "("); brace = text.find("{", pos)
            if "const struct bin_attribute *" not in text[pos:brace]:
                raise SystemExit("const conversion missing: " + name)

        p.write_text(text)
        out = Path("results/stage35-ssdk-plat-compat")
        (out/"ssdk_plat.c.after").write_text(text)
        (out/"ssdk-plat-stage35.patch").write_text("".join(difflib.unified_diff(
            before.splitlines(True), text.splitlines(True),
            fromfile="a/src/init/ssdk_plat.c", tofile="b/src/init/ssdk_plat.c")))
        PY

        grep -n -C 8 -E 'qca_bitbang_mii_raw_(read|write|update)_try|ssdk_(packet|byte)_counter_bin_(read|write)' \
          "$SRC" > "$OUT/after-sites.txt"
        ! grep -Eq 'gpio_priv->sw_read|gpio_priv->sw_write' "$SRC"
        cat > "$OUT/semantic-note.txt" <<'EOF'
        Stage35 compile-probe compatibility:
        1. Linux 6.18 upstream mdiobb_ctrl lacks the QSDK sw_read/sw_write extension.
           The three raw GPIO helper symbols are retained but return SW_NOT_FOUND.
           Runtime behavior MUST be reviewed before a flashable release.
        2. Linux 6.18 bin_attribute read/write callbacks use
           const struct bin_attribute *; four SSDK counter callbacks are updated.
        EOF
      id: ssdk_plat_compat
    - name: Apply Linux 6.18 platform-device and pinconf compatibility
      shell: bash
      run: |
        # Stage35 diagnostics: absolute paths survive cd; no ERR trap modifies PIPESTATUS.
        STAGE35_STEP_DIR="$GITHUB_WORKSPACE/results/steps/linux618_headers"
        mkdir -p "$STAGE35_STEP_DIR"
        printf '%s\n' RUNNING > "$STAGE35_STEP_DIR/state.txt"
        cp "${BASH_SOURCE[0]}" "$STAGE35_STEP_DIR/script.sh"
        exec > >(tee "$STAGE35_STEP_DIR/console.log") 2>&1
        stage35_finish() {
          local stage35_rc="$1" stage35_line="$2" stage35_command="$3"
          trap - EXIT
