        # Original step body follows.
        set -euo pipefail
        mkdir -p results/stage35-prototypes
        python3 <<'PY' 2>&1 | tee results/stage35-prototypes/audit.log
        from pathlib import Path
        import hashlib, json, re, difflib, sys, traceback, os, subprocess
        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        root = workspace / 'qsdk-src/qca-ssdk'
        out = workspace / 'results/stage35-prototypes'
